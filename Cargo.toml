[workspace]
# Resolver 3 is the MSRV-aware resolver: `cargo update` / `cargo add` prefer
# dependency versions whose own `rust-version` fits the declared MSRV instead of
# leaving a failed build as the only guard. The root package's edition (2024)
# already selects it; the key keeps the choice explicit.
resolver = "3"
# Grouped by `[package.metadata.flui] tier` (the `tiers` list below), in each
# crate's `order`; the facade is the root package.
members = [
    # V: values
    "crates/flui-macros",     # View, diagnostics and animation derives
    "crates/flui-foundation", # IDs, keys, diagnostics, the f64 geometry values (ADR-0098)

    # C: contracts
    "crates/flui-platform", # Platform capability traits, window and input vocabulary (ADR-0082)
    "crates/flui-protocol", # Semantics roles and actions, agent-protocol vocabulary (ADR-0095)

    # S: substrate
    "crates/flui-log",         # Tracing backend; only composition roots link it
    "crates/flui-scheduler",   # Frame phases
    "crates/flui-painting",    # Paint, styling and typography values; DisplayList recording
    "crates/flui-interaction", # Event routing and gestures
    "crates/flui-semantics",   # Accessibility tree
    "crates/flui-animation",   # Animation system
    "crates/flui-assets",      # Asset loading and caching

    # R: render machine
    "crates/flui-layer",     # Retained compositing layers
    "crates/flui-rendering", # RenderBox / RenderSliver protocols
    "crates/flui-objects",   # Concrete render-object catalog
    "crates/flui-engine",    # Layers to wgpu

    # K: spine and runtime
    "crates/flui-view",    # View/Element, BuildContext/LifecycleContext, reconciliation, signals
    "crates/flui-widgets", # Widget catalog
    "crates/flui-runtime", # Frame runtime a UI runtime drives (ADR-0083)
    "crates/flui-sdk",     # Package-author surface (ADR-0088)
    "crates/flui-testing", # Headless UI runtime host, widget harness, substrate driver

    # H: hosts
    "crates/flui-native", # The core host: native and headless hosts
    "crates/flui-app",    # Per-window UiRuntimes and the run loop
    "crates/flui-cli",    # `flui` CLI: create, run, build, doctor, devices

    # pkg: official packages, built on flui-sdk alone (ADR-0088)
    "packages/flui-material",   # Material Design theming and the M3 widget catalog
    "packages/flui-cupertino",  # Cupertino theming and widget family
    "packages/flui-devtools",   # Profiler, timeline and inspector counters
    "packages/flui-hot-reload", # Hot reload: the dlopen reload hooks (ADR-0311)
    "crates/flui-system",       # Capability crate: launcher and file dialogs (ADR-0154)

    # Examples and tools (tier-kind = "tool")
    "examples/desktop_scene",                # Hot-reloadable scene plugin, loaded by HotReloadDriver
    "examples/hot_reload_counter/types",
    "examples/hot_reload_counter/logic",
    "examples/hot_reload_counter/host",
    "examples/hot_reload_lifecycle_fixture", # app_plugin! fixture flui-hot-reload's reload-lifecycle test loads
    "examples/web_demo",                     # wasm32 cdylibs; build steps in examples/README.md
    "examples/painting_demo",
    "tools/desktop-mcp",                     # MCP server that drives desktop apps
    "tools/xtask",                           # `cargo xtask`: gates, change scoping, release and weekly tooling
]

# No `default-members`: a bare `cargo build` at the root builds the `flui`
# facade alone; `--workspace` builds everything. cargo-hack drives each package
# through `--manifest-path`, and for the root manifest that selects the default
# members, so a list here would lint every listed crate under each facade
# feature.

[workspace.metadata.flui]
# Crate tiers, bottom to top (ADR-0081). Each crate under crates/ or packages/
# and the facade set `[package.metadata.flui] tier`, `tier-kind` and `order`
# (unique within the tier); examples and tools set only `tier-kind = "tool"`. A normal or build
# dependency points to a lower tier, or to a smaller `order` in the same tier,
# unless the dependent lists it in `edge-exceptions` with the ADR that removes
# it; nothing with a tier depends on a `tool`. Dev-dependencies are free,
# except that only applications and official packages name an official package
# in any kind, and an official package's normal and build dependencies are
# flui-sdk and the contract crates (ADR-0081 §3, ADR-0088 §2).
tiers = [
    "V",   # values: macros, foundation
    "C",   # contracts: flui-platform, flui-protocol
    "S",   # substrate: log, scheduler, painting, interaction, semantics, animation, assets
    "R",   # render machine: layer, rendering, objects, engine
    "K",   # spine and runtime: view, testing, widgets, runtime, sdk
    "H",   # hosts: platform backends, app runners, the CLI, the facade
    "pkg", # official packages: material, cupertino, devtools, hot reload
]

# The words printed beside each tier letter in docs/crates.md's tier table;
# every tier above has one.
tier-names = { V = "values", C = "contracts", S = "substrate", R = "render machine", K = "spine and runtime", H = "hosts", pkg = "official packages and capability crates" }

# What no crate of a tier may reach in any root build, over normal and build
# edges on every target (ADR-0081 §2), checked by `cargo xtask reach`. A tier's
# set is its `extends` set plus `forbid`; H has no table and
# forbids nothing. A pattern is a package name or a `*` glob over the whole
# name. A crate adds names with `reach-forbid` and is excused only by its own
# `reach-exceptions` entry, which covers the paths that run through it.
[workspace.metadata.flui.reach]
# Generic FFI crates name no windowing backend, so no pattern matches them.
# They arrive through flui-native's Android and Apple backends, ureq ->
# rustls-platform-verifier (flui-native/http) and through common crates.
generic-ffi = [
    { name = "jni", reason = "flui-native's Android bridge" },
    { name = "jni-sys", reason = "jni's bindings" },
    { name = "windows-sys", reason = "raw Win32 bindings used by std-level crates (parking_lot, tokio, ...)" },
    { name = "windows-link", reason = "windows-sys's link shim" },
    { name = "windows-targets", reason = "windows-sys's import-library selector" },
    { name = "windows_*", reason = "the per-target import libraries windows-targets selects" },
    { name = "core-foundation", reason = "flui-native's Apple bindings" },
    { name = "core-foundation-sys", reason = "core-foundation's bindings" },
    { name = "objc2", reason = "the bare Objective-C runtime, no AppKit or UIKit" },
    { name = "objc2-encode", reason = "objc2's type encodings" },
]

[workspace.metadata.flui.reach.tier.K]
forbid = [
    "flui-native",
    "winit",
    "android-activity",
    "ndk",
    "windows",
    "objc2-app-kit",
    "objc2-ui-kit",
    "wgpu",
    "flui-engine",
    "flui-app",
]

[workspace.metadata.flui.reach.tier.S]
extends = "K"

[workspace.metadata.flui.reach.tier.C]
extends = "S"

[workspace.metadata.flui.reach.tier.V]
extends = "S"
forbid = ["tokio"]

[workspace.metadata.flui.reach.tier.R]
# wgpu stays forbidden here: flui-engine alone reaches it, through its grant
extends = "K"

[workspace.metadata.flui.reach.tier.pkg]
extends = "K"
# "any other OS crate"; the generic FFI crates above still pass
forbid = [
    "windows-*",
    "objc2-*",
    "core-foundation*",
    "core-graphics*",
    "jni-*",
    "ndk-*",
    "android-*",
    "android_*",
]

# A capability crate sits in tier pkg and carries its own OS code, so this set
# replaces pkg's for it: OS crates pass, the hosts, the window and GPU stacks
# and tokio do not (ADR-0154 §1).
[workspace.metadata.flui.reach.kind.capability]
forbid = ["flui-native", "flui-app", "flui-engine", "winit", "wgpu", "tokio"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Flui Contributors"]
repository = "https://github.com/vanyastaff/flui"

[workspace.dependencies]
# ASYNC RUNTIME — tokio 1.43 = LTS floor (lock resolves latest 1.x)
tokio = { version = "1.43" }
# D-Bus on its own runtime, not tokio: the features unify, and a capability
# crate must not reach tokio (ADR-0154 §1). zbus still awaits fine on tokio.
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
# Structured cancellation for the runtime-owned execution services
# (`CancellationToken`; adopted with the unified execution services,
# ADR-0047, issue #557). `default-features = false` and no
# optional features requested: `CancellationToken` lives in the
# always-compiled `sync` module, and the explicit opt-out keeps a future
# tokio-util default from arriving silently. In particular no `rt`
# (`TaskTracker`) until the task/service lifecycle work (#558) needs it.
tokio-util = { version = "0.7", default-features = false }
# wasm32 `spawn_local` on the browser's microtask queue: the web runner's frame
# loop and the execution services' sequential IO lane.
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "=0.3.77"
js-sys = "0.3"
keyboard-types = "0.8"

# SYNCHRONIZATION - Used by multiple crates
parking_lot = "0.12"
# No `once_cell`: std's `OnceLock`/`LazyLock` replace it, and deny.toml's
# `[bans.std-replacements]` rejects a manifest that declares it.
# Bounded typed mailboxes (private render-invalidation channel, UiRuntime
# owner inbox — bounded queues with typed backpressure only)
crossbeam-channel = "0.5"
# Local sockets (a named pipe on Windows, a Unix domain socket elsewhere),
# synchronous: `flui-app`'s driver agent endpoint (ADR-0239). No default
# features, so no tokio integration.
interprocess = { version = "2.4", default-features = false }
# OS random bytes: `flui run --agent`'s launch token (flui-cli). Already in the
# graph through the networking and hashing crates, so no new copy.
getrandom = "0.4"
# The SDDL string of the driver agent's user-only pipe security descriptor
# (Windows); `interprocess` already builds it.
widestring = "1"

# TIME - std::time re-export on native; performance.now()-backed Instant on
# wasm32 (std Instant::now() panics there). Single source so every crate's
# Instant is the same type per target.
web-time = "1.1"

# ACCESSIBILITY - the cross-platform a11y tree model. Data model only here;
# the per-OS `accesskit_*` platform adapters are flui-native's target-specific
# dependencies, and the `PlatformAccessibility` trait they implement is flui-semantics'.
# One required dependency of its own (uuid), MIT OR Apache-2.0.
accesskit = "0.25.1"
# The tree model every AccessKit adapter reads through: flui-semantics' agent
# read projects the published tree with the adapters' own predicates.
accesskit_consumer = "0.39.1"

# Win32 bindings: the Windows platform backend and hot-reload's library loader.
# Each member names the API families it uses.
windows = "0.62"
# The COM runtime under `windows`, named directly because `#[implement]`
# expands to `::windows_core` paths (the Win32 text services implement
# `ITextStoreACP`). The same 0.62 line, so no second copy.
windows-core = "0.62"

# COLLECTIONS - Used by multiple crates
smallvec = { version = "1.13", features = ["union", "const_generics", "const_new"] }
slab = "0.4.12"

# SERIALIZATION - Core functionality
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# JSON schemas for the agent-protocol vocabulary (flui-protocol's `schemars`
# feature) and the desktop agent server's tool parameters.
schemars = "1.0"
cargo_metadata = "0.23.1"
# Core wasm import inspection in xtask. No validator, component model or serde.
wasmparser = { version = "0.262", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
# Parity-inventory manifest parsing (flui-widgets dev-dep) + flui-cli config.
toml = "1.1"

# APPLE BINDINGS - the versions wgpu-hal already pins; flui-native's macOS
# backend and the facade's lifecycle probe both take them from here, with
# their own feature lists, so the pin cannot drift between the two.
objc2 = { version = "0.6.4", features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
# Core Haptics, the iOS backend's second haptic tier (ADR-0210 §7); the
# same objc2 0.3 generation as the bindings above.
objc2-core-haptics = { version = "0.3.2", default-features = false }
dispatch2 = "0.3.1"
block2 = "0.6.2"
# ANDROID - the NativeActivity glue flui-native and flui-app share.
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22.4"
# Android's dynamic loader: the NDK functions newer than minSdk are looked up by name.
libc = "0.2"
# Quartz window identities, including windows omitted from capture lists.
core-foundation = "0.10"
core-graphics = "0.25"

# DX TOOLING - flui-cli / flui-devtools
tempfile = "3" # scratch dirs/files (build staging and tests)
which = "8"    # locate toolchain executables (build/cli)

# PERSISTENCE — the per-user data directories `flui-native`'s `storage`
# feature writes documents under (roaming and machine-local roots, which follow
# a redirected AppData or OneDrive folder).
dirs = "6"

# The semantics and agent-protocol vocabulary (ADR-0095).
flui-protocol = { path = "crates/flui-protocol", version = "=0.2.0-dev" }

# WORKSPACE PROC-MACROS
flui-macros = { path = "crates/flui-macros", version = "=0.2.0-dev" }

# RENDER CONTRACTS — shared by concrete objects and dev-only render consumers
flui-rendering = { path = "crates/flui-rendering", version = "=0.2.0-dev" }

# OBJECT CATALOG — sits above flui-rendering (depends on it), below flui-view/app
flui-objects = { path = "crates/flui-objects", version = "=0.2.0-dev" }

# The deterministic headless test driver; a dev-dependency only.
flui-testing = { path = "crates/flui-testing", version = "=0.2.0-dev" }

# The package-author surface (ADR-0088 §4); Evolving, its own `0.N` version.
flui-sdk = { path = "crates/flui-sdk", version = "=0.1.0-dev" }

# The capability traits with no OS backend (ADR-0082).
flui-platform = { path = "crates/flui-platform", version = "=0.2.0-dev" }

# ERROR HANDLING - Used everywhere
thiserror = "2.0"
# Seeded random numbers for particle effects (`flui-widgets` `motion::particles`):
# reproducible frames from a seed, no global generator.
fastrand = { version = "2.3", default-features = false }
anyhow = "1.0"

# TRACING — the emission facade is used everywhere; the *backends* below are
# composition-only. `flui-log` is the single crate that assembles them into a
# subscriber, and only composition roots (flui-app, flui-cli, the facade)
# depend on it. Framework libraries depend on `tracing` and nothing more.
tracing = "0.1"
# `tracing-log` is listed although it is already in tracing-subscriber's default
# set: it is what makes the `fmt` layer show a bridged record's real target
# instead of the literal `"log"`. Left implicit, a future `default-features =
# false` would silently relabel every `wgpu`/`naga` line in desktop output.
# `env-filter` stays off: it links a regex engine into every application for
# directives FLUI does not use; `flui-log` filters with `filter::Targets`.
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi", "tracing-log"] }
tracing-log = "0.2"
tracing-forest = { version = "0.3", features = ["smallvec"] }
# Native log sinks. Each is target-gated in the crates that use them.
android_log-sys = "0.3"
tracing-oslog = "0.3"
tracing-wasm = "0.2"

# COMPOSITION-ONLY LOGGING BACKEND — sits at the substrate layer with no
# in-workspace dependencies. Its manifest's `allowed-dependents` (checked by
# `cargo xtask workspace`) keeps framework crates off it.
flui-log = { path = "crates/flui-log", version = "=0.2.0-dev" }

# The remaining in-workspace crates, each declared once here and pulled by
# `workspace = true` from every dependent (ADR-0081). One kind of edge stays out
# of this table: a dev-dependency a crate keeps path-only, with no `version`
# (`flui-testing` from the crates it tests, `flui-objects` from
# `flui-rendering`, `flui-runtime` from `flui-widgets`, `flui-platform` from
# `flui-assets`, `flui-hot-reload` and `flui-log` from `flui-cli`). Cargo drops a
# versionless dev edge from the published manifest, and that is what breaks the
# publication cycle those crates would otherwise form; `workspace = true` would
# add this table's `version` to it. Each such line carries its own comment.
flui-foundation = { path = "crates/flui-foundation", version = "=0.2.0-dev" }
flui-scheduler = { path = "crates/flui-scheduler", version = "=0.2.0-dev" }
flui-painting = { path = "crates/flui-painting", version = "=0.2.0-dev" }
flui-interaction = { path = "crates/flui-interaction", version = "=0.2.0-dev" }
flui-semantics = { path = "crates/flui-semantics", version = "=0.2.0-dev" }
flui-animation = { path = "crates/flui-animation", version = "=0.2.0-dev" }
flui-assets = { path = "crates/flui-assets", version = "=0.2.0-dev" }
flui-layer = { path = "crates/flui-layer", version = "=0.2.0-dev" }
flui-engine = { path = "crates/flui-engine", version = "=0.2.0-dev" }
flui-view = { path = "crates/flui-view", version = "=0.2.0-dev" }
flui-widgets = { path = "crates/flui-widgets", version = "=0.2.0-dev" }
flui-runtime = { path = "crates/flui-runtime", version = "=0.2.0-dev" }
flui-native = { path = "crates/flui-native", version = "=0.2.0-dev" }
flui-app = { path = "crates/flui-app", version = "=0.2.0-dev" }
flui-hot-reload = { path = "packages/flui-hot-reload", version = "=0.2.0-dev" }
flui-system = { path = "crates/flui-system", version = "=0.2.0-dev" }
flui-material = { path = "packages/flui-material", version = "=0.2.0-dev" }
flui-cupertino = { path = "packages/flui-cupertino", version = "=0.2.0-dev" }
flui-devtools = { path = "packages/flui-devtools", version = "=0.2.0-dev" }

# === Shared GPU/Window dependencies ===
# Used by flui-engine, flui-app, and root examples
# GPU RENDERING (WGPU BACKEND) - Track latest stable (30.x).
# Update policy: bump within the same minor on security/bug fixes; bump major after
# verifying API migration on a dedicated branch (see docs/adr/ADR-0027-owner-affine-ui-realms.md).
wgpu = { version = "30.0", default-features = false, features = ["wgsl", "naga-ir"] }
# GPU profiling — optional, reused by flui-engine behind the `gpu-profiler` feature.
# Pins wgpu ^30.0, consistent with the workspace pin above. Excluded from wasm32.
wgpu-profiler = { version = "0.28", default-features = false }
# Linux display source (flui-native `wayland` / `x11` features): the output
# list and refresh rate from the compositor, on a connection of its own. `x11rb`
# runs on its pure-Rust connection (no libxcb) and needs RandR only;
# `wayland-protocols` carries `zxdg_output_v1`, `xdg-decoration` and
# `xdg-foreign` under `unstable`, and
# `wp_fractional_scale_v1` and `wp_color_management_v1` under `staging`.
x11rb = { version = "0.13", default-features = false, features = ["randr"] }
# COMPOUND_TEXT, the encoding X Input Method servers send text in, for the
# native X11 host's text input where no input method answers on D-Bus. The XIM
# wire format itself is flui-native's own (`text::linux::x11::xim::wire`).
xim-ctext = { version = "0.5", default-features = false, features = ["std"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
# The native Wayland host's connection runs on libwayland-client, loaded at run
# time (`dlopen`): a wgpu surface needs the `wl_display` and `wl_surface`
# pointers, which only the system library has, and the GPU driver reads events
# on the same display from its own thread.
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
# Safe `poll` and `eventfd` for the display thread's connection and stop descriptors.
rustix = { version = "1", default-features = false, features = ["std", "event"] }
raw-window-handle = "0.6"
pollster = "1.0"
# Trait-only `Stream`. NOT `futures`/`futures-util`: no executor, no
# combinators, no proc macros — just the trait `StreamBuilder` polls by hand.
futures-core = { version = "0.3", default-features = false, features = ["std"] }
# Used by flui-widgets' image decode cache to coalesce concurrent async image
# loads: `FutureExt::shared()` lets N `Image` widgets mounted with the same
# provider key await ONE underlying load instead of starting N. `alloc` only
# (no `std`/`io`/`channel`/proc-macro features). The Linux preference source
# also needs StreamExt to await portal notifications on its existing executor.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Recency order for each asset registry's byte-budgeted decoded-image cache
# (`flui_assets::registry::images`), the one a frame probes synchronously
# before starting a bridged image load. No time-based eviction. flui-assets'
# Moka cache stores typed loaded results with configurable expiration; bridged
# image loads use this cache instead.
lru = "0.19.0"


# IMAGE PROCESSING - Used by flui-assets and flui-engine
# TODO: Re-enable "webp" feature when image-rs/image-webp#102 is fixed upstream
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# === Engine/geometry shared math dependencies ===
# glam: SIMD GPU math used by flui-engine (serde+bytemuck features) and
# flui-foundation (geometry: `Matrix4` over `DMat4`). The workspace entry carries the common
# floating-point types with std math; each crate adds its own integrations.
glam = { version = "0.34", default-features = false, features = ["std", "f64"] }
# kurbo: the curve model behind flui-painting's `Path` (ADR-0098 §7): arcs and ovals as
# curves, exact winding and tight bounds. Crate-internal; no kurbo type is public.
kurbo = "0.13"
# XML for `cargo xtask icon-import` (SVG and Android AnimatedVectorDrawable files).
roxmltree = "0.20"
# Private sRGB/Oklab conversions; FLUI owns admission and interpolation policy.
color = "0.3.3"
# bytemuck: zero-copy Pod/Zeroable derives used by flui-engine.
bytemuck = { version = "1.24", features = ["derive"] }

# cfg_aliases: flui-native's build.rs names its compound `cfg` conditions once.
# The version wgpu already pulls into the lock.
cfg_aliases = "0.2"

# === Engine build-script dependencies ===
# wgsl_bindgen: WGSL → Rust binding codegen, used in flui-engine's build.rs only.
# Pins naga ^30 (same as wgpu 30) and brings naga_oil ^0.23 for its own import
# resolution, which flui-engine no longer uses: it hands wgsl_bindgen shaders
# already composed by `wesl`. The build-script context is separate from the
# compiled output, so neither reaches the binary.
wgsl_bindgen = { version = "0.23", default-features = false }
# wesl: the WESL compiler (the community WGSL extension with modules and
# imports), used in flui-engine's build.rs to resolve shader imports into plain
# WGSL. It emits text and does not depend on naga, so a wgpu bump never waits
# on it.
wesl = { version = "0.6", default-features = false }
# regex: required by wgsl_bindgen's OverrideTextureFilterability / OverrideSamplerType
# constructors in build.rs; not compiled into the crate binary.
regex = "1"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }

# SOURCE ANALYSIS - flui-macros' derives and xtask's source gates. Each member
# names the features it needs (`full`, `visit`, `span-locations`).
proc-macro2 = "1"
syn = "3"
# Markdown events for `cargo xtask markers`: prose apart from code spans and blocks.
pulldown-cmark = { version = "0.13", default-features = false }

# ZIP archives: `flui-cli`'s Android package.
zip = { version = "9.0.4", default-features = false }

# === Engine-specific dependencies (NOT in workspace) ===
# These are ONLY used in flui-engine:
# - etagere (glyph atlas packing)
# - lyon (tessellation)
# - guillotiere (texture atlas)

# CACHING - Used by flui-assets
moka = { version = "0.12.16", features = ["future"] }

# NETWORKING - the built-in HTTP client (ADR-0280)
# The blocking HTTP stack of the native hosts without a system one (Linux and
# the BSDs, flui-native's `http` feature). The TLS backend is rustls with the
# provider flui-native names and the platform's verifier, so the system's
# trust store decides; no gzip, which would hide a body's declared length.
ureq = { version = "3.5", default-features = false, features = [
    "rustls-no-provider",
    "platform-verifier",
] }
# The TLS stack ureq runs, to recognise its handshake errors; the crate that
# hands it to ureq names the provider.
rustls = { version = "0.23", default-features = false }

# UI EVENTS - Cross-platform input event abstraction (W3C compliant)
ui-events = "0.3"
cursor-icon = "1.2"

# UTILITIES - Used by multiple crates
bitflags = "2.10"
# Percent-encoding of route path segments (`flui_widgets::RoutePath`): the
# servo/rust-url implementation of the URL path-segment set. Already in the
# graph through `url`.
percent-encoding = "2"
# The Parley path's glyph rasterizer (ADR-0092 §5). `render` carries
# `scale::Render`, which draws a glyph's outline or bitmap into an image.
swash = { version = "0.2.10", default-features = false, features = ["std", "scale", "render"] }
# Host font discovery (ADR-0092 §7): one scan of the platform's font
# directories, and fontconfig's configuration through a pure-Rust parser.
fontdb = { version = "0.24", default-features = false, features = [
    "std",
    "fs",
    "memmap",
    "fontconfig",
] }
# The host's locale, which picks the Han fallback list (ADR-0092 §7).
sys-locale = "0.3"
# Full BCP 47 language identity and syntactic admission at the platform boundary.
language-tags = "0.3.2"
# A character's Unicode script, for the painting test harness's
# fallback-coverage query. The copy Parley already builds.
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Web logical-key admission uses the same ICU4X data cohort for NFC and combining classes.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Parley shaping and measurement (ADR-0092 §10).
# No `system`: fontique's host scan reaches `windows`, which tier S forbids.
parley = { version = "0.11.1", default-features = false, features = ["std"] }
# ICU4X grapheme and word segmentation for hit-testing and word boundaries on
# the Parley layout (ADR-0092 §10 step 5): the copy Parley already builds and
# marks its clusters with, so no second one, and no dictionary or LSTM data.
icu_segmenter = { version = "2.1.2", default-features = false, features = ["compiled_data"] }
dyn-clone = "1.0"
downcast-rs = "2.0.2"
static_assertions = "1.1"
# Compile-fail suites (flui-painting, flui-view, flui-engine, flui-rendering):
# each drives `tests/<dir>/*.rs` fixtures and pins the diagnostic text a
# wrong program receives, not merely that it fails.
trybuild = "1.0"
# Main-thread native test processes with the standard Cargo/nextest protocol.
libtest-mimic = "0.8"

# FAST HASHING - Used by flui-rendering (FxHashSet for layout cycle guard;
# deterministic + faster than std SipHash for small keys like RenderId)
rustc-hash = "2.1"


# PERFORMANCE & PROFILING
criterion = { version = "0.8", default-features = false, features = [
    "plotters",
    "cargo_bench_support",
] }

# SNAPSHOT TESTING - render-harness paint-phase (sub-project A) and any crate
# that needs deterministic output assertions. Test-only; not compiled in release.
insta = "1"

# PROPERTY-BASED TESTING - invariant/roundtrip/idempotence properties over
# generated inputs. Test-only; not compiled in release.
proptest = "1"

# Workspace-wide lints inherited by every member
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
missing_debug_implementations = "warn"
# Lint groups need lower priority so the individual lints below can override
# them (same reason the clippy table drops `all`/`pedantic` to -1).
rust_2018_idioms = { level = "warn", priority = -1 }
# The three below are already clean workspace-wide (measured: zero sites), so
# `deny` costs nothing today and is purely a regression bar. They are
# warn-by-default, which on this workspace means "invisible outside CI" — the
# point of pinning them here is that a crate cannot silently reopen them.
#
# unexpected_cfgs: a typo in one of the many `cfg(target_arch = ...)` /
# `cfg(feature = ...)` gates would otherwise compile to a silently-dead branch —
# exactly the failure mode that kept the web backend from ever being exercised.
unexpected_cfgs = "deny"
# unsafe_op_in_unsafe_fn: edition 2024 already warns; denying states that an
# `unsafe fn` body is not itself an unsafe block, so each operation inside it
# still needs its own justified `unsafe { }`.
unsafe_op_in_unsafe_fn = "deny"
# unused_must_use: a dropped `Result` from a layout/paint/commit call is silent
# by construction — there is no log, no panic, just a skipped effect.
unused_must_use = "deny"
# Rust 1.99: create raw pointers directly, without an intermediate reference
# whose aliasing and validity requirements the FFI call does not need.
raw_borrows_via_references = "warn"

[workspace.lints.clippy]
# Lint groups need lower priority to allow individual lint overrides
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panic policy (docs/PANIC-POLICY.md): production paths return Result or
# assert invariants via `expect("BUG: ...")`; bare unwrap() is banned. Test
# code is exempt via clippy.toml (allow-unwrap-in-tests). Crates predating
# the policy carry a tracked `#![allow(clippy::unwrap_used)]` burned down in
# ship-quality waves. `expect_used` stays off — expect() with the BUG:
# message convention IS the sanctioned invariant idiom.
unwrap_used = "warn"
# `disallowed-types` in clippy.toml (std SipHash tables) is opt-in per crate root while
# docs/gaps.md lists crates still on SipHash; the default stays off for the rest.
disallowed_types = "allow"
# Every `unsafe` block and `unsafe impl` carries a `// SAFETY:` comment that
# names the invariant it relies on, directly above its statement (below any
# multi-line attribute) or as the first line inside the block. Write it
# because the invariant was checked, not because the lint failed. The one
# exemption is `flui-engine`'s `wgsl_bindgen` output, included from OUT_DIR
# through modules that carry an `#[expect]` with the reason.
undocumented_unsafe_blocks = "warn"
# `dbg_macro`/`todo`/`unimplemented`: restriction lints, off by default even
# under `all`/`pedantic`. A `dbg!()` left in is a debug-session leftover, not
# a review comment. `todo!()`/`unimplemented!()` are placeholders; the
# codebase's real ones (platform-init stubs on linux/ios/android, per
# AGENTS.md's stated exception) carry a per-site
# `#[expect(clippy::unimplemented, reason = "...")]` instead of a blanket
# allow, so a *new* one anywhere else still fails CI.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A lock guard in an `if let`/`match` scrutinee lives through the whole arm,
# so a value dropped or a callback run inside the arm executes under the lock;
# a destructor that re-enters the same lock deadlocks. Bind the value with
# `let` first, then branch on it.
significant_drop_in_scrutinee = "warn"
# Selected nursery checks: avoid redundant ownership copies and temporary
# collections, and catch a collection populated but never consumed.
# Enable individual checks rather than the entire evolving nursery group.
redundant_clone = "warn"
needless_collect = "warn"
collection_is_never_read = "warn"
# Keep stack-heavy async work visible even if the pedantic group changes.
large_futures = "warn"
# Preserve small differences and representable lengths in floating-point math.
imprecise_flops = "warn"
# A mutating debug assertion changes behavior between debug and release builds.
debug_assert_with_mut_call = "warn"
# A forgotten value never runs its destructor. A caught panic's payload goes to
# `flui_foundation::panic::discard_payload` (ADR-0281); a deliberate leak (an OS
# that still owns the memory, a destructor that would recurse) names its reason
# with `#[expect(clippy::mem_forget, reason = "…")]` at the call.
mem_forget = "warn"
# Already on through `pedantic` (the first three) and `all` (`unnecessary_unwrap`),
# so CI holds them at zero sites on every target; pinned so a group change cannot
# drop them. `is_some()` then `unwrap()` is a pattern match; `use x::*` hides which
# name a rename breaks (`use super::*` in a test module stays allowed).
match_wildcard_for_single_variants = "warn"
wildcard_imports = "warn"
needless_for_each = "warn"
unnecessary_unwrap = "warn"
# `missing_assert_message` — measured, kept off. It skips `#[test]` functions
# only, not test helpers, table rows or `#[cfg(test)]` modules, and clippy has no
# `allow-...-in-tests` option for it: 8,337 sites across Windows, macOS, Android
# and wasm32, 158 of them in Windows lib/bin code (49 in flui-engine's
# build.rs-generated pipeline bindings).
# `wildcard_enum_match_arm` — measured, kept off workspace-wide. A `_` arm that
# swallows a variant added later is the "accepted work dropped" defect, but the
# measured count is 729 sites (Windows all-targets/all-features 701, of which
# 407 in lib/bin code; macOS, Android and wasm32 add 28), mostly over our own
# enums (`PointerEvent` 114, `DrawOp` 45, `Layer` 40), with a few over syn,
# winit, serde_json and lyon. Too many for one change, so it is on per crate
# instead (`#![warn(clippy::wildcard_enum_match_arm)]` in flui-platform and
# flui-app, 21 sites fixed), widened crate by crate. The lint inspects only an
# arm whose whole pattern is `_` or a binding: a `_` inside an or-pattern
# (`A | B | _`) is invisible to it, and `wildcard_in_or_patterns` skips
# `#[non_exhaustive]` enums, so that shape hides the next variant from both.
# Over a workspace enum that is `#[non_exhaustive]` in another crate, name every
# known variant in arms of their own and put `_` in a separate last arm: the lint
# fires when a variant is added. When the `_` arm's body equals a named arm's,
# pedantic `match_same_arms` objects, so put
# `#[expect(clippy::match_same_arms, reason = "...")]` on the `_` arm. An enum
# its consumer turns into a decision can be closed instead (as
# `PresentDisposition` and the raster seam's outcome enums are, for ADR-0068
# §2's reason), so its match needs no `_`. A foreign enum's site takes
# `#[expect(..., reason = "...")]`.
# A public enum is `#[non_exhaustive]` unless its closure is a decision, which
# `#[expect(clippy::exhaustive_enums, reason = "...")]` on it states (ADR-0329).
# A crate whose enums are not decided yet carries the `expect` at its root, and
# `docs/gaps.md` lists those crates.
exhaustive_enums = "warn"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
# Graphics/layout idiom, workspace-wide: pixel math converts between float
# and integer spaces constantly (px ↔ DevicePixels ↔ buffer indices), and
# layout values are exact-by-construction so strict float comparison in
# code and tests is deliberate (Flutter's own layout tests compare doubles
# exactly). Same rationale as `cast_precision_loss` above.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
# Pedantic style relaxations that fight this codebase's idiom: math-adjacent
# names (`x0`/`x1`, `min_w`/`max_w`) and helper items declared next to the
# test statements that use them.
similar_names = "allow"
items_after_statements = "allow"
# Declarative-UI API idiom: widget builders and `run_app` consume their
# configuration by value (the View IS the argument — 100+ sites in
# flui-widgets alone); small Copy geometry types are passed by ref for API
# symmetry with their non-Copy siblings; UI config structs (WindowOptions,
# gesture settings) are naturally bool-heavy.
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
struct_excessive_bools = "allow"
# An `async fn` implementing an `async fn` trait method keeps the trait's own
# signature even when that particular impl has nothing to await — the lint's fix
# (`fn … -> impl Future<Output = …>` plus `future::ready`) desugars one impl of a
# trait whose other impls stay `async fn`, so the family stops reading alike for
# no runtime difference. Keep the trait implementation family consistent;
# this also applies to custom Asset implementations with immediately ready data.
unused_async_trait_impl = "allow"

[package]
publish = ["crates-io"]
name = "flui"
# What the published archive carries. Without this list `cargo package`
# archived the whole checkout root — docs/, tooling, CI, editor and
# research directories, 666 files — none of which a consumer compiles.
# Nested packages under examples/ are excluded by Cargo on their own.
# Patterns are gitignore-style, so each is anchored with a leading `/`: an
# unanchored `README.md` would also match every README under the ignored
# `.flutter/` reference mirror, which `include` otherwise overrides.
include = [
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-APACHE",
    "/NOTICE",
    "/llms.txt",
    "/src/**",
    "/examples/**",
    "/tests/**",
]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Flutter-inspired declarative UI framework with wgpu rendering"
keywords = ["gui", "ui", "wgpu", "flutter", "reactive"]
categories = ["gui", "rendering::engine"]

[package.metadata.flui]
tier = "H"
tier-kind = "stable"
order = 4
# The facade names official packages until they build on the SDK.
edge-exceptions = [
    { to = "flui-cupertino", exit = "ADR-0088", reason = "the optional `cupertino` catalog re-export" },
    { to = "flui-devtools", exit = "ADR-0088", reason = "the optional `devtools` re-export" },
    { to = "flui-material", exit = "ADR-0088", reason = "the optional `material` catalog re-export" },
]

# cargo-shear reports these as unlinked: `tests/thread_boundary_ui.rs` hands the
# trybuild inputs to rustc by glob.
[package.metadata.cargo-shear]
ignored-paths = [
    "tests/ui/thread_boundary/*.rs",
    "tests/ui/thread_boundary/material/*.rs",
    "tests/ui/thread_boundary/cupertino/*.rs",
    "tests/ui/unstable_input/*.rs",
    "tests/ui/unstable_windows/*.rs",
    "tests/ui/native/*.rs",
]

[lints]
workspace = true

# The facade surface (src/lib.rs): what an application author consumes.
# Custom painting, rendering, and gestures have curated authoring modules.
# Engine/platform internals stay dev-deps for framework integration examples.
#
# The catalogs (flui-material/flui-cupertino) are *optional* normal
# dependencies, not dev-deps: `src/lib.rs` re-exports them as
# `flui::material` / `flui::cupertino`, and a `[dev-dependencies]` crate
# is unavailable to the lib target itself. Optional means an author who wants
# neither catalog pays for neither — see `[features]` below. The facade sits
# above the packages and the spine, so these edges point down
# (ADR-0028, `cargo xtask workspace`).
[dependencies]
flui-platform = { workspace = true }
flui-foundation = { workspace = true }
flui-view = { workspace = true }
flui-widgets = { workspace = true }
flui-animation = { workspace = true }
flui-app = { workspace = true }
flui-devtools = { workspace = true, optional = true }
flui-painting = { workspace = true }
flui-rendering = { workspace = true }
flui-objects = { workspace = true }
flui-interaction = { workspace = true }
flui-testing = { workspace = true, optional = true }
flui-material = { workspace = true, optional = true }
flui-cupertino = { workspace = true, optional = true }
# Capability crates (ADR-0154 §8): the facade alone names them, each behind
# the feature of its name under `flui::services`.
flui-system = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
# `tests/facade_consumer.rs` reads `cargo metadata`'s `target_directory` so its
# nested consumer builds follow a relocated `CARGO_TARGET_DIR`.
cargo_metadata.workspace = true
# === Core ===
flui-layer = { workspace = true }
# === Rendering ("testing" for the readback test's render-tree inspection) ===
flui-rendering = { workspace = true, features = ["testing"] }
flui-interaction = { workspace = true }

# === Platform (for examples) ===
flui-native = { workspace = true }

# === Test support (the widget harness `flui_testing::widgets` that
# tests/agent_workflow.rs drives) ===
flui-testing = { workspace = true }
# tests/facade_serde.rs round-trips a value from each crate `flui/serde` reaches.
serde = { workspace = true }
serde_json = { workspace = true }
# tests/thread_boundary_ui.rs: the compile-fail suite for UI runtime-bound handles.
trybuild = { workspace = true }

# NOTE: flui-material / flui-cupertino moved to [dependencies] above — the
# facade's own src/lib.rs re-exports them as `flui::material`/`flui::cupertino`.

# === Engine (for GPU examples and the readback test) ===
flui-engine = { workspace = true, features = ["dx12"] }
pollster = { workspace = true }

# === Logging ===
tracing.workspace = true

[features]
testing = ["dep:flui-testing", "flui-rendering/testing"]
animation-diagnostics = ["flui-animation/diagnostics"]
# No catalog, tool or capability is on by default: an application names what it
# uses (ADR-0088 §6). The base widget surface (`flui::widgets`, `flui::prelude`
# minus the Material glob, `flui::run_app`) needs no feature at all;
# `cargo xtask facade-combos` builds every combination.
default = []

# === Catalogs and localization ===
# Each gates both the Cargo edge and the matching `flui::<module>` re-export.
# There is deliberately no empty placeholder module when a feature is off:
# absent means absent, so a missing feature is a name-resolution error at the
# import site rather than a mystery empty namespace.
material = ["dep:flui-material"]
cupertino = ["dep:flui-cupertino"]

# === Capability crates (ADR-0154 §8) ===
# Off by default like every capability (ADR-0088 §6): `system` gives
# `flui::services::system`, the providers of the launcher and the file dialogs.
system = ["dep:flui-system"]
# `HttpCapability`'s built-in provider: each host's own HTTP stack, `ureq`
# over rustls on Linux and the BSDs, which have none (ADR-0280). Off, a widget
# acquiring `HttpCapability` is refused as not registered and the application
# links no HTTP client or TLS stack.
http = ["flui-app/http"]

# === Unstable input surface ===
# Additive. Re-exports the handle-less input capabilities
# (`flui::platform::input_capabilities`: `InputCapabilities`, `Availability`,
# `PointerKindSet`) and the second haptic tier (`flui::platform::haptics`,
# `flui::interaction::HapticsHandle`), until every backend passes its
# conformance rows (ADR-0213 §5, ADR-0210 §9); `flui-sdk` has the matching
# feature for packages. The platform crates build the types regardless.
unstable-input = []

# === The escape hatch ===
# Additive and Evolving (ADR-0089 §5, ADR-0254 §8). Publishes `flui::native`:
# `HostWindow`, `with_window` (the window a presentation is drawn in) and, on
# Windows and macOS, `flui::native::windows` and `flui::native::macos`, what one
# operating system's windows offer beyond the window contract. It turns on
# `flui-app`'s `native`, which keeps the list of host windows `with_window`
# reads; the core host builds the extensions regardless.
native = ["flui-app/native"]

# === Windows beyond the first ===
# Additive and unstable. Publishes `flui::open_window`, `flui::open_secondary_window`
# and `flui::WindowPolicy` (and their `flui::app` paths) until ADR-0091 §3–§5 are
# built: a `Shared` window is refused and an open answers only that it was
# admitted (`docs/gaps.md`). Without it an application has one window.
unstable-windows = ["flui-app/unstable-windows"]

# The profiler, timeline and inspector counters: re-exports flui-devtools as
# `flui::devtools`. Without it the normal application graph excludes
# flui-devtools.
devtools = ["dep:flui-devtools"]

# The driver agent (ADR-0239) in an optimized build: every debug build already
# serves its windows to a driver when launched with an endpoint
# (`flui_protocol::launch`), with no code in the application. Optimized CI and
# device runs turn this on; without it a release build carries none of it.
driver = ["flui-app/driver"]

# === Core Features ===
# Serialization of the value types, in every crate that owns some: geometry
# (foundation, through painting), paint and style (painting), locale and
# brightness (platform-api), velocity and gesture details (interaction), the
# layout enums (rendering, and objects through widgets), curves (animation) and
# stored document revisions (view).
serde = [
    "flui-painting/serde",
    "flui-platform/serde",
    "flui-interaction/serde",
    "flui-rendering/serde",
    "flui-animation/serde",
    "flui-widgets/serde",
    "flui-view/serde",
]

# The facade declares no other features. Earlier revisions carried commented
# blocks for parallel / profiling / tracy / devtools / memory-profiler /
# full — all referencing crates or features that do not exist (`flui_core`,
# `flui-engine/devtools`). A capability that does not exist gets no feature
# stub here; add the feature in the same change that implements it.

# ═══════════════════════════════════════════════════════════════════════════════
# Feature-gated targets
# ═══════════════════════════════════════════════════════════════════════════════
#
# Tests are otherwise auto-discovered; these entries exist only to attach
# `required-features`. Without them a `--no-default-features` build would still
# try to compile the test and fail — the exact false signal the isolated feature
# builds exist to catch.

[[test]]
name = "facade_serde"
path = "tests/facade_serde.rs"
required-features = ["serde"]

# The "Agent workflow" acceptance test: mounts the counter
# template's tree through `flui::testing`, so it needs both the `testing`
# feature (for `flui::testing` to exist at all) and `material` (the tree
# includes an `ElevatedButton`). Without this entry a `--no-default-features
# --features testing` build would still try to compile it and fail.
[[test]]
name = "agent_workflow"
path = "tests/agent_workflow.rs"
required-features = ["testing", "material"]

# Feature-gated facade surfaces: the native escape hatch and capability crates.
[[test]]
name = "surface"
path = "tests/surface.rs"

# UI-runtime-bound handles refuse `std::thread::spawn` (compile-fail fixtures under
# `tests/ui/thread_boundary/`), and the facade hides the unstable input vocabulary
# without `unstable-input` (`tests/ui/unstable_input/`) and a second window without
# `unstable-windows` (`tests/ui/unstable_windows/`). Its own binary, a member of nextest's
# `trybuild` group, so the slow rustc runs never hold the ordinary suite.
[[test]]
name = "thread_boundary_ui"
path = "tests/thread_boundary_ui.rs"

# An application on wasm32 capturing `Rc` in owner-local callbacks; `cargo xtask wasm-check`
# compiles it for wasm32.
[[test]]
name = "wasm_consumer"
path = "tests/wasm_consumer.rs"

# The acceptance application in a window, for native runs through flui-driver.
# Its tree is `tests/fixtures/acceptance_app/app.rs`, which uses the Material
# catalog; `tests/facade_consumer.rs` runs its headless rows.
[[example]]
name = "acceptance_app"
path = "examples/acceptance_app.rs"
required-features = ["material", "serde"]

# The same application with the fault its argument names (ADR-0258 §4), for
# the native runs that check what a panic leaves behind.
[[example]]
name = "acceptance_app_faults"
path = "examples/acceptance_app_faults.rs"
required-features = ["material", "serde"]

# ═══════════════════════════════════════════════════════════════════════════════
# Build Profiles
# ═══════════════════════════════════════════════════════════════════════════════

[profile.dev]
opt-level = 1 # Some optimization for faster runtime
# Incremental compilation is ON for local development. Measured on an M1 (8 cores,
# jobs=6, warm target) after a one-line edit in `flui-widgets`: `cargo check
# --workspace` 4.3 s -> 1.5 s, `cargo nextest run -p flui-widgets --no-run`
# 48 s -> 10 s, `cargo nextest run --workspace --no-run` 158 s -> 45 s. The
# price is disk: `target/debug/incremental` reached 8.1 GB after one workspace
# test build — deleting that directory drops it without touching anything else.
#
# CI builds with it OFF: every workflow sets `CARGO_INCREMENTAL=0` in its
# environment, and that variable overrides this key (it reaches Cargo's own
# profile resolution, unlike the `[env]` table in `.cargo/config.toml`, which
# only feeds the processes Cargo executes). Set the same variable locally when
# building through an `sccache` wrapper: it cannot cache per-CGU incremental
# artifacts and hard-errors ("incremental compilation is prohibited") instead
# of silently degrading, and on Windows the sccache + incremental combination
# crashed rustc (STATUS_ACCESS_VIOLATION) on the heavier test binaries.
incremental = true
# `line-tables-only` keeps file:line in panic backtraces and profiler stacks
# but drops ALL variable/scope/type DWARF — on this 28-crate wgpu/parley/
# lyon/naga workspace that debuginfo was the bulk of `target/debug/deps`
# (measured: a full debug tree ran to ~20 GB and repeatedly filled agent
# containers; CI hit the same ceiling in PRs #236/#242 and has built with
# line-tables-only ever since). This makes the local default match CI. For a
# step-debugger session with variables and types, opt into `--profile dbg`
# (below); it inherits dev and restores `debug = "full"`.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are compiled once and rebuilt only when Cargo.lock moves, so
# their optimization is paid rarely and repaid on every run: wgpu/naga shader
# translation, Parley shaping and lyon tessellation dominate debug-build
# frame time and test wall-clock. Workspace crates stay at opt-level 1 for
# fast rebuilds.
opt-level = 3
# No debuginfo at all for dependencies — they inherited `line-tables-only` from
# `dev`, and wgpu/naga/parley/lyon are the bulk of the dependency graph.
# Stepping into a dep is rare enough to raise this for one package when needed.
#
# Caveat that applies to every `debug =` key in this file: a global `-C debuginfo=`
# rustflag (via `RUSTFLAGS` or a user-level `config.toml`) overrides it silently and
# without error — rustflags append after Cargo's profile flags and the last one wins.
# If dependency debuginfo reappears, look there before suspecting this setting.
debug = false

# Opt-in full-debuginfo profile. Inherits `dev` but restores `debug = 2` so a
# step-debugger (RustRover / lldb / gdb) sees complete type info. Use sparingly —
# it re-inflates `target/`: `cargo build --profile dbg`, `cargo test --profile dbg`.
[profile.dbg]
inherits = "dev"
debug = "full"

[profile.release]
opt-level = 3
lto = "thin"      # Link-time optimization (good balance)
codegen-units = 1 # Better optimization, slower compile
# `debuginfo`, not `symbols`: stripping the symbol table too leaves release
# builds unprofilable and crash reports unsymbolicated — `perf`, flamegraph,
# samply, Tracy and minidumps all resolve frames through it. Since Rust 1.97
# the default mangling is v0, so retained symbols carry real generic
# parameters instead of an opaque hash. DWARF is still dropped, which is the
# bulk of the size.
strip = "debuginfo"
