[workspace]
# Resolver 3 (stable since 1.84) is the MSRV-aware resolver: `cargo update` /
# `cargo add` prefer dependency versions whose own `rust-version` fits the
# declared MSRV instead of leaving a failed build as the only guard. Edition
# 2024 makes it the default for packages, but a virtual workspace must say so.
resolver = "3"
members = [
    # === Phase 1: Foundation Layer ===
    "crates/flui-geometry",     # Geometry primitives (split from flui-types)
    "crates/flui-types",        # Base types with Unit system (ACTIVE)
    "crates/flui-foundation",   # Foundation types and utilities (ACTIVE)
    "crates/flui-macros",       # Proc-macros (view, diagnostics, and animation derives)
    "crates/flui-log",          # Composition-only cross-platform tracing backend (ACTIVE)
    "crates/flui-tree",         # Tree abstractions (ACTIVE)
    "crates/flui-platform-api", # Platform contracts: capability traits, window/input vocabulary
    "crates/flui-platform",     # Platform abstraction (ACTIVE)

    # === Phase 2: Core Framework ===
    "crates/flui-painting",    # Painting primitives (ACTIVE)
    "crates/flui-semantics",   # Accessibility (ACTIVE)
    "crates/flui-scheduler",   # Frame scheduling (ACTIVE)
    "crates/flui-layer",       # Layer composition (ACTIVE)
    "crates/flui-interaction", # Gesture recognition (ACTIVE)
    "crates/flui-engine",      # GPU rendering engine (ACTIVE)
    "crates/flui-hot-reload",  # Hot-reload scene plugins via dlopen (ACTIVE)

    # === Phase 3: Framework Layer ===
    "crates/flui-rendering",     # Render tree / engine (ACTIVE)
    "crates/flui-objects",       # Concrete RenderBox/RenderSliver catalog (ACTIVE)
    "crates/flui-view",          # View/Element tree (ACTIVE)
    "crates/flui-widgets",       # User-facing widget catalog (ACTIVE — Core.1 slice)
    "crates/flui-localizations", # Global (multi-language) localized resources (ACTIVE — Catalog.1 slice)
    "crates/flui-testing",       # Test-support: headless deterministic frame driver (pump_frame) (ACTIVE)
    "crates/flui-material",      # Material Design theming foundation — ColorScheme/TextTheme/ThemeData/Theme (ACTIVE — Catalog.1 slice)
    "crates/flui-cupertino",     # iOS-style theming foundation — CupertinoDynamicColor/CupertinoTextTheme/CupertinoTheme/CupertinoButton (ACTIVE — Catalog.1 slice)

    # === Phase 4: Application Layer ===
    "crates/flui-app",    # Application framework (ACTIVE - Migration)
    "crates/flui-assets", # Asset loading/caching (ACTIVE — wired into Image per Cross.A)

    # === Examples (platform-specific) ===
    # NOTE: Android examples are excluded from workspace.members because they
    # require Android NDK toolchain. Build them with:
    #   cargo ndk -t arm64-v8a build -p flui-android-demo
    # "examples/android_demo",      # Android GPU demo (cdylib)
    # "examples/android_scene",     # Hot-reloadable scene plugin (cdylib)
    # "examples/android_app",       # Widget-based hot-reloadable plugin (cdylib)
    "examples/desktop_scene",                # Hot-reloadable scene plugin for desktop — loaded via HotReloadDriver
    "examples/hot_reload_counter/types",
    "examples/hot_reload_counter/logic",
    "examples/hot_reload_counter/host",
    "examples/hot_reload_lifecycle_fixture", # Dev-only app_plugin! fixture, dlopen'd by flui-hot-reload's own reload-lifecycle test

    # NOTE: Web examples are excluded from default workspace members because they
    # require wasm32 target. Build with:
    #   cd examples/web_demo && wasm-pack build --target web --out-dir pkg
    "examples/web_demo",      # Web/WASM platform demo (cdylib)
    "examples/painting_demo", # Web/WASM painting + engine demo (cdylib)
    "examples/web_counter",   # The counter template through `flui::run_app` on the web (cdylib)

    # === Tools ===
    "tools/web-server",  # Built-in web dev server (wasm-pack + HTTP serve)
    "tools/live-smoke",  # Live E2E harness: real window, real X11 input, real teardown
    "tools/desktop-mcp", # MCP server that drives desktop apps: windows, screenshots, accessibility tree, input
    "tools/xtask",       # `cargo xtask`: CI gates, change scoping, release and weekly tooling

    # === Animation Layer ===
    "crates/flui-animation", # Animation system (ACTIVE)

    # === DX tooling ===
    "crates/flui-devtools", # Profiler / timeline / inspector counters
    "crates/flui-cli",      # `flui` CLI (create / run / build / doctor / devices); owns the build pipeline and the source watcher
    # NOTE: there is deliberately NO signals crate. flui-reactivity (a signals/
    # hooks experiment) was removed 2026-07-28: it had zero consumers, could not
    # build even standalone (inherited workspace deps that were never declared),
    # and contract C1 locks the catalog to the setState/Inherited model. Its
    # process-global runtime also predated the UiRealm model — any future
    # signals story is a new realm-scoped design, not a revival. History: git.
]

# No `default-members`: a bare `cargo build` at the root builds the `flui`
# facade alone; `--workspace` builds everything. cargo-hack drives each package
# through `--manifest-path`, and for the root manifest that selects the default
# members, so a list here would lint every listed crate under each facade
# feature.

[workspace.metadata.flui]
# Crate tiers, bottom to top (ADR-0081). Each crate under crates/ and the facade
# set `[package.metadata.flui] tier`, `tier-kind` and `order` (unique within the
# tier); examples and tools set only `tier-kind = "tool"`. A normal or build
# dependency points to a lower tier, or to a smaller `order` in the same tier,
# unless the dependent lists it in `edge-exceptions` with the ADR that removes
# it; nothing with a tier depends on a `tool`. Dev-dependencies are free.
tiers = [
    "V",   # values: geometry, types, macros, foundation; tree until it is deleted
    "C",   # contracts: the platform API and protocol crates, when they exist
    "S",   # substrate: log, scheduler, painting, interaction, semantics, animation, assets
    "R",   # render machine: layer, rendering, objects, engine
    "K",   # spine and runtime: view, testing, widgets; localizations until it is deleted
    "H",   # hosts: platform backends, app runners, the CLI, the facade
    "pkg", # official packages: material, cupertino, devtools, hot reload
]
# Crate layers, bottom (0) to top, checked beside the tiers until the `layer`
# key is removed. Each crate under crates/ and the facade set
# `[package.metadata.flui] layer`; a normal or build dependency may point to the
# same layer or lower, never higher, and never at an example or tool. Cargo
# itself rejects cycles. Checked by `cargo xtask workspace` (ADR-0041).
layers = [
    "Foundation (value types)",        # 0
    "Framework primitives",            # 1
    "Substrate",                       # 2
    "Compositing / a11y / animation",  # 3
    "Render machine + render catalog", # 4
    "Framework spine",                 # 5
    "Widget catalog + DX tooling",     # 6
    "Design systems",                  # 7
    "Global localizations",            # 8
    "Application / tooling",           # 9
    "Facade",                          # 10
]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Flui Contributors"]
repository = "https://github.com/vanyastaff/flui"

[workspace.dependencies]
# ASYNC RUNTIME — tokio 1.43 = LTS floor (lock resolves latest 1.x)
tokio = { version = "1.43" }
# Structured cancellation for the runtime-owned execution services
# (`CancellationToken`; adoption sanctioned by
# docs/research/2026-08-01-runtime-dependency-adoption-guide.md with the
# unified-executor work, issue #557). `default-features = false` and no
# optional features requested: `CancellationToken` lives in the
# always-compiled `sync` module, and the explicit opt-out keeps a future
# tokio-util default from arriving silently. In particular no `rt`
# (`TaskTracker`) until the task/service lifecycle work (#558) needs it.
tokio-util = { version = "0.7", default-features = false }

# SYNCHRONIZATION - Used by multiple crates
parking_lot = "0.12"
# No `once_cell`: std's `OnceLock`/`LazyLock` replace it, and deny.toml's
# `[bans.std-replacements]` rejects a manifest that declares it.
dashmap = "6.1"
# Bounded typed mailboxes (private render-invalidation channel, UiRealm
# owner inbox — bounded queues with typed backpressure only)
crossbeam-channel = "0.5"

# TIME - std::time re-export on native; performance.now()-backed Instant on
# wasm32 (std Instant::now() panics there). Single source so every crate's
# Instant is the same type per target.
web-time = "1.1"

# ACCESSIBILITY - the cross-platform a11y tree model. Data model only here;
# the per-OS `accesskit_*` platform adapters are a separate, later concern that
# belongs in flui-platform, which cannot depend on flui-semantics (layer 2 vs 3).
# One required dependency of its own (uuid), MIT OR Apache-2.0.
accesskit = "0.25"
# The tree model every AccessKit adapter reads through; tests use it to see
# a node the way UI Automation, AT-SPI and NSAccessibility are handed it.
accesskit_consumer = "0.39"

# Win32 bindings: the Windows platform backend, hot-reload's library loader,
# and xtask's UI Automation client. Each member names the API families it uses.
windows = "0.62"

# COLLECTIONS - Used by multiple crates
smallvec = { version = "1.13", features = ["serde", "union", "const_generics"] }

# SERIALIZATION - Core functionality
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
cargo_metadata = "0.23.1"
# Parity-inventory manifest parsing (flui-widgets dev-dep) + flui-cli config.
toml = "1.1"

# BUILDER UTILITIES - Used by widgets
bon = "3.8"

# APPLE BINDINGS - the versions wgpu-hal already pins; flui-platform's macOS
# backend and the facade's lifecycle probe both take them from here, with
# their own feature lists, so the pin cannot drift between the two.
objc2 = { version = "0.6.4", features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
dispatch2 = "0.3.1"
# Quartz window identities, including windows omitted from capture lists.
core-foundation = "0.10"
core-graphics = "0.25"

# DX TOOLING - flui-cli / flui-devtools
tempfile = "3" # scratch dirs/files (build staging and tests)
which = "8"    # locate toolchain executables (build/cli)

# WORKSPACE PROC-MACROS
flui-macros = { path = "crates/flui-macros", version = "=0.2.0-dev" }

# OBJECT CATALOG — sits above flui-rendering (depends on it), below flui-view/app
flui-objects = { path = "crates/flui-objects", version = "=0.2.0-dev" }

# TEST SUPPORT — the deterministic headless frame driver (`pump_frame(dt)` over
# the gesture arena + virtual clock) and the home for future test harness APIs.
# Sits above flui-widgets, below flui-app, and is only ever a *dev*-dependency of
# a shipped library: a normal edge would link the test driver into production.
flui-testing = { path = "crates/flui-testing", version = "=0.2.0-dev" }

# PLATFORM CONTRACTS — the capability traits and the window/input vocabulary,
# with no OS backend (ADR-0082). Framework crates that name a platform
# contract depend on this; only composition roots depend on flui-platform.
flui-platform-api = { path = "crates/flui-platform-api", version = "=0.2.0-dev" }

# ERROR HANDLING - Used everywhere
thiserror = "2.0"
anyhow = "1.0"

# TRACING — the emission facade is used everywhere; the *backends* below are
# composition-only. `flui-log` is the single crate that assembles them into a
# subscriber, and only composition roots (flui-app, flui-cli, the facade)
# depend on it. Framework libraries depend on `tracing` and nothing more.
tracing = "0.1"
# `tracing-log` is listed although it is already in tracing-subscriber's default
# set: it is what makes the `fmt` layer show a bridged record's real target
# instead of the literal `"log"`. Left implicit, a future `default-features =
# false` would silently relabel every `wgpu`/`naga` line in desktop output.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "tracing-log"] }
tracing-log = "0.2"
tracing-forest = { version = "0.3", features = ["smallvec"] }
# Native log sinks. Each is target-gated in the crates that use them.
android_log-sys = "0.3"
tracing-oslog = "0.3"
tracing-wasm = "0.2"

# COMPOSITION-ONLY LOGGING BACKEND — sits at the substrate layer with no
# in-workspace dependencies. Its manifest's `allowed-dependents` (checked by
# `cargo xtask workspace`) keeps framework crates off it.
flui-log = { path = "crates/flui-log", version = "=0.2.0-dev" }

# === Shared GPU/Window dependencies ===
# Used by flui-engine, flui-app, and root examples
# GPU RENDERING (WGPU BACKEND) - Track latest stable (30.x).
# Update policy: bump within the same minor on security/bug fixes; bump major after
# verifying API migration on a dedicated branch (see docs/adr/ADR-0027-owner-affine-ui-realms.md).
wgpu = { version = "30.0", default-features = false, features = ["wgsl", "naga-ir"] }
# GPU profiling — optional, reused by flui-engine behind the `gpu-profiler` feature.
# Pins wgpu ^30.0, consistent with the workspace pin above. Excluded from wasm32.
wgpu-profiler = { version = "0.28", default-features = false }
# Shader module composition — resolves #import directives in WGSL at build-time or
# pipeline-init time.  Pins naga ^30, consistent with wgpu 30's naga dep.
# Used by flui-engine to compose blend_helpers.wgsl into mode.wgsl / advanced_blend.wgsl.
naga_oil = { version = "0.23", default-features = false }
winit = "0.30.12"
raw-window-handle = "0.6"
pollster = "1.0"
# Trait-only `Stream`. NOT `futures`/`futures-util`: no executor, no
# combinators, no proc macros — just the trait `StreamBuilder` polls by hand.
futures-core = { version = "0.3", default-features = false, features = ["std"] }
# Used by flui-widgets' image decode cache to coalesce concurrent async image
# loads: `FutureExt::shared()` lets N `Image` widgets mounted with the same
# provider key await ONE underlying load instead of starting N. `alloc` only
# (no `std`/`io`/`channel`/proc-macro features) — this is the one place the
# `futures-core`-only policy above is deliberately NOT enough, because
# coalescing genuinely needs the `Shared` combinator, not just the `Future`
# trait.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Count-bounded LRU — flui-widgets' decoded-image cache
# (`flui_widgets::image`'s sync probe before spawning an async load). No
# time-based eviction, unlike flui-assets' moka byte-loader cache (TTL
# 5min/TTI 1min) — see that module's doc for why the two caches serve
# different roles and neither substitutes for the other.
lru = "0.18"

# CLIPBOARD - Cross-platform clipboard access
arboard = "3.4"

# IMAGE PROCESSING - Used by flui-assets and flui-engine
# TODO: Re-enable "webp" feature when image-rs/image-webp#102 is fixed upstream
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# === Engine/geometry shared math dependencies ===
# glam: SIMD GPU math used by flui-engine (serde+bytemuck features) and
# flui-geometry (bytemuck+mint features). The workspace entry carries the common
# base features; each crate adds its own extras via per-crate `features = [...]`.
glam = { version = "0.33", features = ["bytemuck"] }
# bytemuck: zero-copy Pod/Zeroable derives shared by flui-engine and flui-geometry.
bytemuck = { version = "1.24", features = ["derive"] }

# === Engine build-script dependencies ===
# wgsl_bindgen: WGSL → Rust binding codegen, used in flui-engine's build.rs only.
# Pins naga ^30 (same as wgpu 30) and naga_oil ^0.23 (same as workspace); the
# build-script context is separate from the compiled output, so the duplicate naga
# dep does not affect the binary.
wgsl_bindgen = { version = "0.23", default-features = false }
# regex: required by wgsl_bindgen's OverrideTextureFilterability / OverrideSamplerType
# constructors in build.rs; not compiled into the crate binary.
regex = "1"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }

# SOURCE ANALYSIS - flui-macros' derives and xtask's source gates. Each member
# names the features it needs (`full`, `visit`, `span-locations`).
proc-macro2 = "1"
syn = "3"

# === Engine-specific dependencies (NOT in workspace) ===
# These are ONLY used in flui-engine:
# - etagere (glyph atlas packing)
# - lyon (tessellation)
# - guillotiere (texture atlas)

# CACHING - Used by flui-assets
moka = { version = "0.12", features = ["future"] }

# NETWORKING - Used by flui-assets
# `default-features = false` + an explicit `rustls`: reqwest 0.13 made rustls
# its default backend, but `default-tls` still resolves to native-tls (and
# therefore openssl, which deny.toml bans) whenever a sibling feature turns it
# on, so the opt-out plus the explicit backend is what actually keeps this
# workspace rustls-only rather than merely rustls-by-default. The feature is
# spelled `rustls` here, not `rustls-tls` — 0.13 renamed it. Dropping the
# defaults also drops `charset`/`http2`/`system-proxy`, unchanged from 0.12.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

# UI EVENTS - Cross-platform input event abstraction (W3C compliant)
ui-events = "0.3"
cursor-icon = "1.2"

# UTILITIES - Used by multiple crates
bitflags = "2.10"
# Extended grapheme cluster segmentation (UAX #29) for text editing: caret
# movement and deletion step by user-perceived character, as Flutter's
# `characters` package does. Already in the graph through cosmic-text.
unicode-segmentation = "1.12"
dyn-clone = "1.0"
downcast-rs = "2.0.2"
static_assertions = "1.1"
# Compile-fail suites (flui-types, flui-view, flui-engine, flui-rendering):
# each drives `tests/<dir>/*.rs` fixtures and pins the diagnostic text a
# wrong program receives, not merely that it fails.
trybuild = "1.0"

# FAST HASHING - Used by flui-rendering (FxHashSet for layout cycle guard;
# deterministic + faster than std SipHash for small keys like RenderId)
rustc-hash = "2.1"

# STRING INTERNING - Used by flui-assets
lasso = { version = "0.7", features = ["multi-threaded"] }

# PERFORMANCE & PROFILING
criterion = { version = "0.8", default-features = false, features = [
    "plotters",
    "cargo_bench_support",
] }

# SNAPSHOT TESTING - render-harness paint-phase (sub-project A) and any crate
# that needs deterministic output assertions. Test-only; not compiled in release.
insta = "1"

# PROPERTY-BASED TESTING - invariant/roundtrip/idempotence properties over
# generated inputs (test-minimization effort). Test-only; not compiled in release.
proptest = "1"

# PARAMETERIZED TESTING - #[case] tables replacing near-identical example
# tests that vary only in input literals (test-minimization effort).
# Test-only; not compiled in release.
rstest = "0.27"

# Workspace-wide lints for consistent code quality (Rust 1.74+)
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
missing_debug_implementations = "warn"
# Lint groups need lower priority so the individual lints below can override
# them (same reason the clippy table drops `all`/`pedantic` to -1).
rust_2018_idioms = { level = "warn", priority = -1 }
# The three below are already clean workspace-wide (measured: zero sites), so
# `deny` costs nothing today and is purely a regression bar. They are
# warn-by-default, which on this workspace means "invisible outside CI" — the
# point of pinning them here is that a crate cannot silently reopen them.
#
# unexpected_cfgs: a typo in one of the many `cfg(target_arch = ...)` /
# `cfg(feature = ...)` gates would otherwise compile to a silently-dead branch —
# exactly the failure mode that kept the web backend from ever being exercised.
unexpected_cfgs = "deny"
# unsafe_op_in_unsafe_fn: edition 2024 already warns; denying states that an
# `unsafe fn` body is not itself an unsafe block, so each operation inside it
# still needs its own justified `unsafe { }`.
unsafe_op_in_unsafe_fn = "deny"
# unused_must_use: a dropped `Result` from a layout/paint/commit call is silent
# by construction — there is no log, no panic, just a skipped effect.
unused_must_use = "deny"

[workspace.lints.clippy]
# Lint groups need lower priority to allow individual lint overrides
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panic policy (docs/PANIC-POLICY.md): production paths return Result or
# assert invariants via `expect("BUG: ...")`; bare unwrap() is banned. Test
# code is exempt via clippy.toml (allow-unwrap-in-tests). Crates predating
# the policy carry a tracked `#![allow(clippy::unwrap_used)]` burned down in
# ship-quality waves. `expect_used` stays off — expect() with the BUG:
# message convention IS the sanctioned invariant idiom.
unwrap_used = "warn"
# `undocumented_unsafe_blocks` — re-evaluated (W0-5), measured, reverted.
# This workspace runs every clippy-capable job under `-D warnings`, so
# `warn` here means "CI enforces it immediately", and the actual CI run
# (not a local guess) came back red on every compiling job: clippy,
# cross-typecheck, wasm-check, all three feature-matrix groups, and
# cli-macos. Confirmed real, annotatable sites (each job aborts on its
# first error, so this is a floor, not the true total — appkit/android
# were never even reached before windows/ios aborted the job that would
# have checked them): flui-platform/src/window.rs:328,332;
# platforms/{windows/{accessibility.rs:96, platform.rs:382,1998,
# owner_control.rs:109, window.rs:117}, web/{clipboard.rs:26,
# display.rs:13-14, executor.rs:15, platform.rs:49, window.rs:40},
# ios/platform.rs:996}; flui-hot-reload/src/worker.rs:61;
# flui-log/tests/a_rejected_env_override_still_installs.rs:37 — sixteen
# sites, plus twelve more that CANNOT be annotated at all: paired
# `unsafe impl` sites in six OUT_DIR-generated files under
# flui-engine's build.rs (advanced_blend/blur/color_matrix/gamma/mode/
# morphology_generated.rs), where a `// SAFETY:` comment would have to
# live in codegen'd output, not source. Per this comment's own stated
# rule: too many for `-D warnings`, revert to `allow`, keep the real
# count instead of forcing green with prose. `dbg_macro`/`todo`/
# `unimplemented` below are unaffected — zero hits across the same CI
# matrix, confirmed via the same run's logs. The original point stands
# for future unsafe code either way: write a SAFETY comment because the
# invariant was checked, not because a lint failed — several stale ones
# in flui-hot-reload came from writing the comment first.
undocumented_unsafe_blocks = "allow"
# `dbg_macro`/`todo`/`unimplemented`: restriction lints, off by default even
# under `all`/`pedantic`. A `dbg!()` left in is a debug-session leftover, not
# a review comment. `todo!()`/`unimplemented!()` are placeholders; the
# codebase's real ones (platform-init stubs on linux/ios/android, per
# AGENTS.md's stated exception) carry a per-site
# `#[expect(clippy::unimplemented, reason = "...")]` instead of a blanket
# allow, so a *new* one anywhere else still fails CI.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A lock guard in an `if let`/`match` scrutinee lives through the whole arm,
# so a value dropped or a callback run inside the arm executes under the lock;
# a destructor that re-enters the same lock deadlocks. Bind the value with
# `let` first, then branch on it.
significant_drop_in_scrutinee = "warn"
# Allow reasonable exceptions
cast_precision_loss = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
# Graphics/layout idiom, workspace-wide: pixel math converts between float
# and integer spaces constantly (px ↔ DevicePixels ↔ buffer indices), and
# layout values are exact-by-construction so strict float comparison in
# code and tests is deliberate (Flutter's own layout tests compare doubles
# exactly). Same rationale as `cast_precision_loss` above.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
# Pedantic style relaxations that fight this codebase's idiom: math-adjacent
# names (`x0`/`x1`, `min_w`/`max_w`) and helper items declared next to the
# test statements that use them.
similar_names = "allow"
items_after_statements = "allow"
# Declarative-UI API idiom: widget builders and `run_app` consume their
# configuration by value (the View IS the argument — 100+ sites in
# flui-widgets alone); small Copy geometry types are passed by ref for API
# symmetry with their non-Copy siblings; UI config structs (WindowOptions,
# gesture settings) are naturally bool-heavy.
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
struct_excessive_bools = "allow"
# An `async fn` implementing an `async fn` trait method keeps the trait's own
# signature even when that particular impl has nothing to await — the lint's fix
# (`fn … -> impl Future<Output = …>` plus `future::ready`) desugars one impl of a
# trait whose other impls stay `async fn`, so the family stops reading alike for
# no runtime difference. It also has no answer for the feature-gated stub pairs
# (`flui-assets`'s `network`-off `load_url`/`load_text`), where the `async` is
# what keeps the two configurations' signatures identical. Fires on `flui-assets`
# and `flui-cli`'s build pipeline today; new in Rust 1.98's pedantic set.
unused_async_trait_impl = "allow"

[package]
publish = ["crates-io"]
name = "flui"
# What the published archive carries. Without this list `cargo package`
# archived the whole checkout root — docs/, tooling, CI, editor and
# research directories, 666 files — none of which a consumer compiles.
# Nested packages under examples/ are excluded by Cargo on their own.
# Patterns are gitignore-style, so each is anchored with a leading `/`: an
# unanchored `README.md` would also match every README under the ignored
# `.flutter/` reference mirror, which `include` otherwise overrides.
include = [
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-APACHE",
    "/NOTICE",
    "/llms.txt",
    "/src/**",
    "/examples/**",
    "/tests/**",
]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Flutter-inspired declarative UI framework with wgpu rendering"
keywords = ["gui", "ui", "wgpu", "flutter", "reactive"]
categories = ["gui", "rendering::engine"]

[package.metadata.flui]
layer = 10
tier = "H"
tier-kind = "stable"
order = 4
# The facade names official packages until they build on the SDK.
edge-exceptions = [
    { to = "flui-cupertino", exit = "ADR-0088", reason = "the optional `cupertino` catalog re-export" },
    { to = "flui-hot-reload", exit = "ADR-0094", reason = "the optional `hot-reload` feature" },
    { to = "flui-material", exit = "ADR-0088", reason = "the optional `material` catalog re-export" },
]

# cargo-shear reports these as unlinked; tools/device-checks' iOS safe-area and
# resident-reopen checks copy them into a scratch project as its `src/main.rs`.
[package.metadata.cargo-shear]
ignored-paths = ["tests/fixtures/ios_safe_area.rs", "tests/fixtures/resident_app.rs"]

[lints]
workspace = true

# The facade surface (src/lib.rs): the layers an application author consumes.
# Custom painting, rendering, and gestures have curated authoring modules.
# Engine/platform internals stay dev-deps for framework integration examples.
#
# The catalogs (flui-material/flui-cupertino) and the global localization
# implementation (flui-localizations) are *optional* normal dependencies, not
# dev-deps: `src/lib.rs` re-exports them as `flui::material` /
# `flui::cupertino` / `flui::localizations`, and a `[dev-dependencies]` crate
# is unavailable to the lib target itself. Optional means an author who wants
# neither catalog pays for neither — see `[features]` below. The facade's
# layer (10) is above the design systems (7), so these edges point down
# (ADR-0028, `cargo xtask workspace`).
[dependencies]
flui-macros = { path = "crates/flui-macros", version = "=0.2.0-dev" }
flui-types = { path = "crates/flui-types", version = "=0.2.0-dev" }
flui-geometry = { path = "crates/flui-geometry", version = "=0.2.0-dev" }
flui-foundation = { path = "crates/flui-foundation", version = "=0.2.0-dev" }
flui-view = { path = "crates/flui-view", version = "=0.2.0-dev" }
flui-widgets = { path = "crates/flui-widgets", version = "=0.2.0-dev" }
flui-animation = { path = "crates/flui-animation", version = "=0.2.0-dev" }
flui-app = { path = "crates/flui-app", version = "=0.2.0-dev" }
flui-hot-reload = { path = "crates/flui-hot-reload", version = "=0.2.0-dev", optional = true }
flui-tree = { path = "crates/flui-tree", version = "=0.2.0-dev" }
flui-painting = { path = "crates/flui-painting", version = "=0.2.0-dev" }
flui-rendering = { path = "crates/flui-rendering", version = "=0.2.0-dev" }
flui-interaction = { path = "crates/flui-interaction", version = "=0.2.0-dev" }
flui-testing = { workspace = true, optional = true }
flui-material = { path = "crates/flui-material", version = "=0.2.0-dev", optional = true }
flui-cupertino = { path = "crates/flui-cupertino", version = "=0.2.0-dev", optional = true }
flui-localizations = { path = "crates/flui-localizations", version = "=0.2.0-dev", optional = true }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
# `tests/facade_consumer.rs` reads `cargo metadata`'s `target_directory` so its
# nested consumer builds follow a relocated `CARGO_TARGET_DIR`.
cargo_metadata.workspace = true
# === Foundation Layer ===
# flui-tree = { path = "crates/flui-tree" }

# === Core Layer ===
flui-layer = { path = "crates/flui-layer", version = "=0.2.0-dev" }
# === Rendering Layer (colored_box_app / animated_box_app examples; "testing"
# for the vertical_slice_demo acceptance test's render-tree inspection) ===
flui-rendering = { path = "crates/flui-rendering", version = "=0.2.0-dev", features = ["testing"] }
flui-objects = { path = "crates/flui-objects", version = "=0.2.0-dev" }
# === Interaction Layer ("testing" for the vertical_slice_demo acceptance
# test's synthetic pointer events) ===
flui-interaction = { path = "crates/flui-interaction", version = "=0.2.0-dev", features = [
    "testing",
] }

# === Platform Layer (for examples) ===
flui-platform = { path = "crates/flui-platform", version = "=0.2.0-dev" }

# === Hot-Reload (for examples) ===
flui-hot-reload = { path = "crates/flui-hot-reload", version = "=0.2.0-dev" }

# === Test support (for the vertical_slice_demo acceptance test) ===
flui-testing = { workspace = true }
# Snapshot assertions + `cargo insta review` for tests/demo_layer_snapshots.rs.
insta = { workspace = true }
parking_lot.workspace = true

# NOTE: flui-material / flui-cupertino moved to [dependencies] above — the
# facade's own src/lib.rs re-exports them as `flui::material`/`flui::cupertino`.

# === Engine Layer (for GPU examples) ===
flui-engine = { path = "crates/flui-engine", version = "=0.2.0-dev", features = ["dx12"] }
pollster = { workspace = true }
wgpu = { workspace = true }

# === Error Handling (for examples) ===
anyhow.workspace = true

# === Image decoding (image_demo example) ===
image.workspace = true

# === Logging ===
tracing.workspace = true
tracing-subscriber.workspace = true

# === macOS lifecycle probe (examples/lifecycle_probe.rs drives AppKit's
# miniaturize/hide/setFrame against the running application; the versions
# are the ones crates/flui-platform already pins) ===
[target.'cfg(target_os = "macos")'.dev-dependencies]
# examples/lifecycle_probe.rs drives AppKit's miniaturize/hide/setFrame
# against the running application; pins come from [workspace.dependencies].
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSObject", "NSArray", "NSGeometry"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSWindow"] }
dispatch2.workspace = true

[features]
testing = ["dep:flui-testing", "flui-widgets/testing", "flui-rendering/testing"]
# Material-first by default: `cargo add flui` keeps working exactly as the
# README and the crate-level docs teach it. An author who wants a different
# catalog — or none — turns the default off and selects explicitly. The base
# widget surface (`flui::widgets`, `flui::prelude` minus the Material glob,
# `flui::run_app`) needs no feature at all.
default = ["material"]

# === Catalogs and localization ===
# Each gates both the Cargo edge and the matching `flui::<module>` re-export.
# There is deliberately no empty placeholder module when a feature is off:
# absent means absent, so a missing feature is a name-resolution error at the
# import site rather than a mystery empty namespace.
material = ["dep:flui-material"]
cupertino = ["dep:flui-cupertino"]
# `flui::localizations` — the global (multi-language) implementations of the
# catalogs' localization contracts. The catalogs own the contracts and never
# depend back on this package (it sits a layer above them, and
# `cargo xtask workspace` rejects an upward edge);
# the facade re-exporting it does not change that direction. Future Material
# and Cupertino implementations inside flui-localizations must use independent
# optional features, so enabling one catalog's translations never compiles the
# other catalog accidentally.
localizations = ["dep:flui-localizations"]

# === GPU readback tests ===
# Opt-in, and OFF by default on purpose. `tests/composited_layer_update_readback.rs`
# needs a real wgpu adapter; the workspace `test` job has none — only `live-smoke`
# installs a Vulkan driver, and `gpu-test` runs WARP on Windows. Ungated, that test
# fails there with `AdapterRequest(NotFound { active_backends: Backends(0x0) })`, an
# ENVIRONMENT failure that looks nothing like the pixel mismatch it appears to be.
# It is not skipped when no adapter is found: a test that quietly passes on a machine
# that cannot run it inflates the count and proves nothing. CI runs it in `gpu-test`.
gpu-readback-tests = []

# Development-only reload machinery, off in an ordinary production graph. This
# activates the facade's reload API and the application's reload driver.
# Without it the normal application graph excludes flui-hot-reload.
hot-reload = ["dep:flui-hot-reload", "flui-hot-reload/app-plugin", "flui-app/hot-reload"]

# Native accessibility: the per-OS AccessKit adapters that hand the semantics
# tree to VoiceOver / Narrator / Orca. Off by default (the Linux adapter
# carries a D-Bus stack); `cargo xtask device macos-a11y` is the executable check.
a11y = ["flui-app/a11y"]

# === Core Features ===
# Serialization support (flui-types only today; other crates' serde features
# are opted into per-crate, not through the facade)
serde = ["flui-types/serde"]

# ADR-0074 realm-scoped signals (`Signal<T>` and its reader registry on the view layer,
# the widget harness's `reactive()`, `UiCommand::SignalWrite`). Not in `default` yet: it
# stays an opt-in until the #1090 field-mask registry lands on the same seam.
signals = ["flui-view/signals", "flui-widgets/signals", "flui-app/signals", "flui-testing?/signals"]

# The facade declares no other features. Earlier revisions carried commented
# blocks for parallel / profiling / tracy / devtools / memory-profiler /
# full — all referencing crates or features that do not exist (`flui_core`,
# `flui-engine/devtools`). A capability that does not exist gets no feature
# stub here; add the feature in the same change that implements it.

# ═══════════════════════════════════════════════════════════════════════════════
# Feature-gated targets
# ═══════════════════════════════════════════════════════════════════════════════
#
# Examples and tests are otherwise auto-discovered; these entries exist only to
# attach `required-features`. Without them a `--no-default-features` build would
# still try to compile the Material demo and fail — the exact false signal the
# isolated feature builds exist to catch.

[[example]]
name = "material_demo"
path = "examples/material_demo/main.rs"
required-features = ["material"]

# `default = ["material"]` does not make this redundant: `cargo xtask facade-combos`
# builds every isolated feature combination with `--no-default-features`, and
# `counter.rs` uses `Theme`/`ThemeData`/`ElevatedButton` from the Material
# catalog, so an isolated non-material build fails with E0433 without this.
[[example]]
name = "counter"
path = "examples/counter.rs"
required-features = ["material"]

# Same reason as `counter.rs` above: `todo.rs` uses `Checkbox`/`ElevatedButton`/
# `IconButton`/`TextField`/`Theme`/`ThemeData` from the Material catalog, so
# an isolated non-material `cargo xtask facade-combos` build fails without this.
[[example]]
name = "todo"
path = "examples/todo.rs"
required-features = ["material"]

[[example]]
name = "cupertino_demo"
path = "examples/cupertino_demo/main.rs"
required-features = ["cupertino"]

# The iOS simulator demo: the same Material tree as `material_demo`, run on the
# native UIKit backend. Only meaningful on the `aarch64-apple-ios-sim` target —
# every other target compiles a no-op `main` — but it is declared unconditionally
# so `cargo xtask device ios-sim` can build it by name.
[[example]]
name = "ios_demo"
path = "examples/ios_demo.rs"
required-features = ["material"]

# Renders any demo tree offscreen to a PNG; it `#[path]`-includes both catalog
# demos, so it needs both.
[[example]]
name = "sliver_demo"
path = "examples/sliver_demo.rs"
required-features = ["material"]

[[example]]
name = "screenshot"
path = "examples/screenshot.rs"
required-features = ["material", "cupertino"]

# Secondary window opened from a Material button; see the example's own doc.
[[example]]
name = "multi_window_demo"
path = "examples/multi_window_demo.rs"
required-features = ["material"]

# Self-driving representative-workload probe for docs/BETA.md's "Performance
# and resilience" row (`cargo xtask device macos-workload`); see the example's own doc.
[[example]]
name = "workload_probe"
path = "examples/workload_probe.rs"
required-features = ["material"]

# The generated counter run for an assistive technology (`cargo xtask device macos-a11y`
# reads its NSAccessibility tree and presses the button through AXPress);
# see the example's own doc.
[[example]]
name = "a11y_probe"
path = "examples/a11y_probe.rs"
required-features = ["material", "a11y"]

# Self-driving window-lifecycle probe for docs/BETA.md's lifecycle rows
# (`cargo xtask device macos-lifecycle`): minimize/restore, hide/unhide, resize, with the
# frame production observed through each transition. macOS only; see the
# example's own doc.
[[example]]
name = "lifecycle_probe"
path = "examples/lifecycle_probe.rs"
required-features = ["material"]

[[test]]
name = "material_demo"
path = "tests/material_demo.rs"
required-features = ["material"]

[[test]]
name = "cupertino_demo"
path = "tests/cupertino_demo.rs"
required-features = ["cupertino"]

# Structural snapshots of the demo trees' painted layer trees. Needs both
# catalogs because it snapshots the Material and Cupertino demos; both are
# named directly rather than through an alias feature, so the target's
# requirements are readable at the target. CI's "facade non-default catalogs"
# step (`--features cupertino,localizations`, Material being default) runs it.
[[test]]
name = "composited_layer_update_readback"
path = "tests/composited_layer_update_readback.rs"
required-features = ["gpu-readback-tests"]

[[test]]
name = "demo_layer_snapshots"
path = "tests/demo_layer_snapshots.rs"
required-features = ["material", "cupertino"]

# The "Agent workflow" acceptance test (docs/BETA.md): mounts the counter
# template's tree through `flui::testing`, so it needs both the `testing`
# feature (for `flui::testing` to exist at all) and `material` (the tree
# includes an `ElevatedButton`). Without this entry a `--no-default-features
# --features testing` build would still try to compile it and fail.
[[test]]
name = "agent_workflow"
path = "tests/agent_workflow.rs"
required-features = ["testing", "material"]

# ═══════════════════════════════════════════════════════════════════════════════
# Build Profiles
# ═══════════════════════════════════════════════════════════════════════════════

[profile.dev]
opt-level = 1 # Some optimization for faster runtime
# Incremental compilation is ON for local development. Measured on an M1 (8 cores,
# jobs=6, warm target) after a one-line edit in `flui-widgets`: `cargo check
# --workspace` 4.3 s -> 1.5 s, `cargo nextest run -p flui-widgets --no-run`
# 48 s -> 10 s, `cargo nextest run --workspace --no-run` 158 s -> 45 s. The
# price is disk: `target/debug/incremental` reached 8.1 GB after one workspace
# test build — deleting that directory drops it without touching anything else.
#
# CI builds with it OFF: every workflow sets `CARGO_INCREMENTAL=0` in its
# environment, and that variable overrides this key (it reaches Cargo's own
# profile resolution, unlike the `[env]` table in `.cargo/config.toml`, which
# only feeds the processes Cargo executes). Set the same variable locally when
# building through an `sccache` wrapper: it cannot cache per-CGU incremental
# artifacts and hard-errors ("incremental compilation is prohibited") instead
# of silently degrading, and on Windows the sccache + incremental combination
# crashed rustc (STATUS_ACCESS_VIOLATION) on the heavier test binaries.
incremental = true
# `line-tables-only` keeps file:line in panic backtraces and profiler stacks
# but drops ALL variable/scope/type DWARF — on this 28-crate wgpu/cosmic-text/
# lyon/naga workspace that debuginfo was the bulk of `target/debug/deps`
# (measured: a full debug tree ran to ~20 GB and repeatedly filled agent
# containers; CI hit the same ceiling in PRs #236/#242 and has built with
# line-tables-only ever since). This makes the local default match CI. For a
# step-debugger session with variables and types, opt into `--profile dbg`
# (below); it inherits dev and restores `debug = "full"`.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are compiled once and rebuilt only when Cargo.lock moves, so
# their optimization is paid rarely and repaid on every run: wgpu/naga shader
# translation, cosmic-text shaping and lyon tessellation dominate debug-build
# frame time and test wall-clock. Workspace crates stay at opt-level 1 for
# fast rebuilds.
opt-level = 3
# No debuginfo at all for dependencies — they inherited `line-tables-only` from
# `dev`, and wgpu/naga/cosmic-text/lyon are the bulk of the dependency graph.
# Stepping into a dep is rare enough to raise this for one package when needed.
#
# Caveat that applies to every `debug =` key in this file: a global `-C debuginfo=`
# rustflag (via `RUSTFLAGS` or a user-level `config.toml`) overrides it silently and
# without error — rustflags append after Cargo's profile flags and the last one wins.
# If dependency debuginfo reappears, look there before suspecting this setting.
debug = false

# Opt-in full-debuginfo profile. Inherits `dev` but restores `debug = 2` so a
# step-debugger (RustRover / lldb / gdb) sees complete type info. Use sparingly —
# it re-inflates `target/`: `cargo build --profile dbg`, `cargo test --profile dbg`.
[profile.dbg]
inherits = "dev"
debug = "full"

[profile.release]
opt-level = 3
lto = "thin"      # Link-time optimization (good balance)
codegen-units = 1 # Better optimization, slower compile
# `debuginfo`, not `symbols`: stripping the symbol table too leaves release
# builds unprofilable and crash reports unsymbolicated — `perf`, flamegraph,
# samply, Tracy and minidumps all resolve frames through it. Since Rust 1.97
# the default mangling is v0, so retained symbols carry real generic
# parameters instead of an opaque hash. DWARF is still dropped, which is the
# bulk of the size.
strip = "debuginfo"
