# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check
# Or:  cargo deny check advisories
#      cargo deny check bans
#      cargo deny check licenses
#      cargo deny check sources
#
# Schema: cargo-deny 0.19 (updated from 0.16):
#   - bans.deny entries now use `crate` key, not `name`.
#   - [advisories] no longer accepts `vulnerability` / severity keys: in
#     cargo-deny 0.19 all vulnerability advisories are ALWAYS hard errors
#     (not configurable). The gate did NOT weaken — vulnerabilities are
#     strictly enforced by the tool itself.
#   - `unmaintained` and `unsound` take a scope value ("all" | "workspace"
#     | "external") rather than a severity string.

# ═══════════════════════════════════════════════════════════════════════════════
# Graph - how the dependency graph is built for every check
# ═══════════════════════════════════════════════════════════════════════════════
[graph]
# Audit the union of ALL feature-gated dependency trees, not just defaults —
# without this, optional features (e.g. flui-assets/network → reqwest) are
# invisible to the merge-blocking gate. NB: the CLI --all-features flag does
# NOT reach workspace members' features in this layout; this config key is the
# working switch (verified by ban-probe: a temporary `deny` on reqwest fails
# the bans check only once this key is set).
all-features = true

# ═══════════════════════════════════════════════════════════════════════════════
# Advisories - Security vulnerability database checks
# ═══════════════════════════════════════════════════════════════════════════════
[advisories]
# Warn on yanked crates (scope: all published versions)
yanked = "warn"
# Flag unmaintained crates across the full dependency graph
unmaintained = "all"
# Flag crates with known unsound APIs
unsound = "all"
# Ignore specific advisories
ignore = [
    # RUSTSEC-2025-0057: fxhash is unmaintained (repo stale, owner inactive).
    # Source: fxhash v0.2.1 ← wgsl_bindgen v0.23.3 (BUILD-DEP ONLY — never
    # compiled into the binary or public API).  Arrived with the wgsl-bindgen
    # adoption; no upgrade is available upstream.  The only risk is build-time
    # hash non-determinism, which does not affect the compiled artefact.
    { id = "RUSTSEC-2025-0057" },

    # RUSTSEC-2026-0192: ttf-parser is unmaintained (author archived the
    # repo).  Source: ttf-parser ← fontdb/swash ← cosmic-text (the text stack
    # pins it; no maintained alternative exposes the same face-parsing surface
    # yet).  Parsing happens on locally installed fonts, not remote input.
    # Revisit when cosmic-text migrates (skrifa is the ecosystem successor).
    { id = "RUSTSEC-2026-0192" },

    # RUSTSEC-2026-0253: lru <0.18.2 `LruCache::pop()` is not panic-safe — a
    # panicking key `Drop` skips `detach()`, leaving a dangling node in the
    # linked list for a later eviction to write through (UAF / double-free).
    # Source: lru v0.16.4 ← glyphon v0.12 ← flui-engine.
    #
    # Not reachable here, on two independent grounds, both re-checked against
    # glyphon 0.12.0's own source rather than carried over from the 0.11 entry:
    #   1. The advisory needs a key whose `Drop` can panic. `GlyphonCacheKey`
    #      derives `Copy` (text_render.rs:376), and Rust forbids `Copy + Drop`,
    #      so the precondition is structurally impossible rather than unlikely.
    #   2. glyphon never calls the vulnerable function — zero `.pop(` sites
    #      across its source, and its cache is built with
    #      `LruCache::unbounded_with_hasher` (text_atlas.rs:57), so no eviction
    #      path runs at all.
    # Unfixable locally: 0.12.0 still caps lru at ^0.16.2 (its Cargo.toml), so
    # the workspace bump to glyphon 0.12 / wgpu 30 did not clear this. Drop the
    # ignore when glyphon releases against lru >=0.18.2 — note flui-widgets'
    # own direct `lru` dep is already on 0.18 and unaffected.
    { id = "RUSTSEC-2026-0253" },
]

# ═══════════════════════════════════════════════════════════════════════════════
# Licenses - Allowed open source licenses
# ═══════════════════════════════════════════════════════════════════════════════
[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.8
# List of allowed licenses (SPDX identifiers)
allow = [
    # Permissive licenses
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",                        # Boost
    "ISC",
    "Zlib",
    "0BSD",

    # Public domain
    "Unlicense",
    "CC0-1.0",

    # Copyleft (weak) - OK for libraries
    "MPL-2.0",

    # Unicode/Font licenses
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",          # Open Font License
]
# Copyleft licenses that require source disclosure are not in the allow list
# above, so they are implicitly denied (cargo-deny 0.19 removed the `deny` key;
# unlisted licenses are rejected by default when `allow` is set).

# Clarifications for crates with non-standard license files
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
crate = "encoding_rs"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [{ path = "COPYRIGHT", hash = 0x39f8ad31 }]

[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ═══════════════════════════════════════════════════════════════════════════════
# Bans - Crate restrictions and duplicate detection
# ═══════════════════════════════════════════════════════════════════════════════
[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
# Allow wildcard dependencies (common in workspace)
wildcards = "allow"
# Highlight all duplicates in output
highlight = "all"
# Workspace crate handling
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates (unmaintained, insecure, or problematic)
deny = [
    # Unmaintained crates with better alternatives
    { crate = "atty" }, # Use is-terminal

    # Security concerns
    { crate = "openssl" },    # Prefer rustls
    { crate = "native-tls" }, # Prefer rustls
]

# Skip duplicate checks for specific crates (if unavoidable)
skip = []

# Tree-skip: skip checking duplicates in specific dependency trees
skip-tree = []

# ═══════════════════════════════════════════════════════════════════════════════
# Sources - Allowed crate registries and git sources
# ═══════════════════════════════════════════════════════════════════════════════
[sources]
# Deny crates from unknown registries
unknown-registry = "deny"
# Warn on git dependencies (prefer published crates)
unknown-git = "warn"
# Allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allowed git sources (add trusted repos here if needed)
allow-git = []

# Organization-level git allowances
[sources.allow-org]
# github = ["anthropics", "ArroyoSystems"]
