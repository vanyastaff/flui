# cargo-deny configuration (schema: cargo-deny 0.20)
# https://embarkstudios.github.io/cargo-deny/
#
# Run it through `cargo xtask deps`, which passes `--workspace`: the root
# manifest is the `flui` package, not a virtual manifest, so a bare
# `cargo deny check` roots the graph at the facade alone and never sees
# flui-cli, the examples, the tools or flui-assets' `network` feature.
#
# Vulnerability advisories are always errors; cargo-deny has no key to relax
# them. `unmaintained` and `unsound` take a scope ("all" | "workspace" |
# "external"), not a severity.

# ═══════════════════════════════════════════════════════════════════════════════
# Graph - how the dependency graph is built for every check
# ═══════════════════════════════════════════════════════════════════════════════
[graph]
# Audit the union of ALL feature-gated dependency trees, not just defaults:
# flui-assets' off-by-default `network` feature is what brings in reqwest and
# rustls. This key and `--workspace` are both needed; with either alone a
# temporary `deny` entry for reqwest passes.
all-features = true

# ═══════════════════════════════════════════════════════════════════════════════
# Advisories - Security vulnerability database checks
# ═══════════════════════════════════════════════════════════════════════════════
[advisories]
# Warn on yanked crates (scope: all published versions)
yanked = "warn"
# Flag unmaintained crates anywhere in the graph. "workspace" would silence
# both ignores below (their crates are transitive), and with them every
# future abandoned crate deep in the text or GPU stack; each of those is ours
# to route around, so each gets an ignore with its reason instead.
unmaintained = "all"
# Flag crates with known unsound APIs
unsound = "all"
# Ignore specific advisories
ignore = [
    # RUSTSEC-2025-0057: fxhash is unmaintained (repo stale, owner inactive).
    # Source: fxhash v0.2.1 ← wgsl_bindgen v0.23.3 (BUILD-DEP ONLY — never
    # compiled into the binary or public API).  Arrived with the wgsl-bindgen
    # adoption; no upgrade is available upstream.  The only risk is build-time
    # hash non-determinism, which does not affect the compiled artefact.
    { id = "RUSTSEC-2025-0057" },

    # RUSTSEC-2026-0192: ttf-parser is unmaintained (author archived the
    # repo).  Source: ttf-parser ← fontdb/swash ← cosmic-text (the text stack
    # pins it; no maintained alternative exposes the same face-parsing surface
    # yet).  Parsing happens on locally installed fonts, not remote input.
    # Revisit when cosmic-text migrates (skrifa is the ecosystem successor).
    { id = "RUSTSEC-2026-0192" },
]

# ═══════════════════════════════════════════════════════════════════════════════
# Licenses - Allowed open source licenses
# ═══════════════════════════════════════════════════════════════════════════════
[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.8
# List of allowed licenses (SPDX identifiers). An entry no crate uses is
# reported as `license-not-encountered`, so the list stays what the graph needs.
allow = [
    # Permissive licenses
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",                        # Boost
    "ISC",
    "Zlib",
    "0BSD",

    # Public domain
    "Unlicense",
    "CC0-1.0",

    # Copyleft (weak) - OK for libraries
    "MPL-2.0",

    # Unicode data
    "Unicode-3.0",
]
# Copyleft licenses that require source disclosure are not in the allow list
# above, so they are implicitly denied (unlisted licenses are rejected when
# `allow` is set; cargo-deny has no `deny` list).

# Allowed for one crate only, not added to `allow`:
# - webpki-root-certs is Mozilla's root certificate store as data, under
#   CDLA-Permissive-2.0, a permissive license written for data rather than
#   code. It comes in through flui-assets' `network` feature (reqwest →
#   rustls-platform-verifier).
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

# ═══════════════════════════════════════════════════════════════════════════════
# Bans - Crate restrictions and duplicate detection
# ═══════════════════════════════════════════════════════════════════════════════
[bans]
# Duplicate versions are not a gate: almost all are one upstream pinning an
# older windows-sys, objc2 or syn than another, fixable only upstream, and a
# warning per duplicate buried the run's result under thousands of lines of
# inclusion graphs. The weekly nightly-canary job prints
# `cargo tree --duplicates` as a metric instead.
multiple-versions = "allow"
# Allow wildcard dependencies (common in workspace)
wildcards = "allow"
# Workspace crate handling
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates (unmaintained, insecure, or problematic)
deny = [
    # Unmaintained crates with better alternatives
    { crate = "atty" }, # Use is-terminal

    # Security concerns
    { crate = "openssl" },    # Prefer rustls
    { crate = "native-tls" }, # Prefer rustls
]

# Crates whose job std or core now does (once_cell → OnceLock/LazyLock,
# cfg-if → cfg_select!, memoffset → offset_of!, ...), judged against the
# workspace's rust-version. "workspace": only what the workspace's own
# manifests declare; a crate that arrives transitively is its dependent's to
# drop. The list is fetched when the check runs: a new entry can fail a
# commit that passed (ci.yml's `deps` job says why that still blocks), and a
# failed fetch skips the check rather than failing it.
[bans.std-replacements]
scope = "workspace"

# ═══════════════════════════════════════════════════════════════════════════════
# Sources - Allowed crate registries and git sources
# ═══════════════════════════════════════════════════════════════════════════════
[sources]
# Deny crates from unknown registries
unknown-registry = "deny"
# Warn on git dependencies (prefer published crates)
unknown-git = "warn"
# Allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allowed git sources (add trusted repos here if needed)
allow-git = []

# Organization-level git allowances
[sources.allow-org]
# github = ["anthropics", "ArroyoSystems"]
