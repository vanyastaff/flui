capability = "HDR, wide gamut and colour management (surface colour space, SDR/HDR headroom, display profile changes)"
note = "Every display carries its colour profile (`DisplayInfo::color`: colour space and headroom, or why there is none), and the engine sets a surface up for the colour of its window's display (ADR-0256). Windows read an SDR monitor correctly; no HDR or P3 display has run anywhere, and sources stay sRGB. X11 reads no colour (`NotYetOnThisHost`); the Web reports capability and no headroom."
