[[section.row]]
id = "event-loop-startup-and-wake-ups"
capability = "Event loop, startup and wake-ups"
note = "Runs: a manual Windows run, the macOS live check, an application of `flui-app` on the native Wayland host under Weston and the native X11 host under Xvfb (`native_linux`, in CI), the iOS Simulator, the Android emulator, the Web counter. Owed: idle checks on hidden and occluded windows, which may get no frame callbacks on Wayland."
status = { windows = "yes", macos = "yes", wayland = "yes", x11 = "yes", ios = "yes", android = "yes", web = "yes", headless = "yes" }

[[section.row]]
id = "version-floor-declared-packaged-refus"
capability = "Version floor: declared, packaged, refused below it"
note = "[ADR-0244](adr/ADR-0244-os-version-floors-and-gates.md) sets a floor per environment, and `flui build` packages it (raised by `[platforms.<environment>] min` in `flui.toml`) everywhere but the Windows manifest. Windows, macOS, iOS and Android refuse a release below it at start, and Linux a compositor without `xdg_wm_base` or an X server without RandR 1.5, as `LaunchError::UnsupportedSystem`; the GPU falls back to GLES 3.0, WebGL2 or WARP and reports `NoSupportedGpu` with a reason per backend when none answers (run on llvmpipe GL only), and none has run on its floor."
status = { windows = "missing", macos = "missing", wayland = "missing", x11 = "missing", ios = "missing", android = "missing", web = "missing", headless = "na" }

