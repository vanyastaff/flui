[[section.row]]
id = "frameless-windows-custom-title-bar"
capability = "Frameless windows, custom title bar"
note = "`WindowFrame::AppTitleBar` is in the contract, taken by the headless host, Win32, macOS and the native X11 and Wayland hosts, as are the chrome input regions (move, resize, caption buttons, ADR-0286) that answer the system's hit test and the `flui-widgets` parts that mark them (`WindowTitleBar`, `WindowCaptionButton`, `WindowResizeArea`). Win32 drops the caption and answers `WM_NCHITTEST` from the regions, `HTMAXBUTTON` included for the snap layouts, type-checked and not run; macOS keeps a transparent system title bar under full-size content, moves the window from a move region and answers a double-click as System Settings says, its traffic lights hidden or moved, type-checked and not run; the native X11 host does the same through `_NET_WM_MOVERESIZE` where the window manager lists it, run under openbox on Xvfb; the native Wayland host asks for no frame, keeps the margins of its own and moves and maximizes the window from them, run on Weston 13."
status = { windows = "missing", macos = "missing", wayland = "missing", x11 = "missing", ios = "na", android = "na", web = "na", headless = "missing" }

[[section.row]]
id = "backdrop-material-transparency-corners"
capability = "Backdrop material, transparency, corners"
note = "The contract's material (`WindowCommand::SetMaterial`, `WindowMaterial::{Opaque, System}`, `WindowCapabilities::material`): a Win32 window opens on Mica (`System`) and changes it from build 22621 on, and below that build the capability is unavailable on this device and admission answers `NotOnThisDevice`; ran in a Win32 window on Windows 11 (build 26300), the desktop window manager's attribute read back after each change. macOS draws `System` as `NSVisualEffectView`'s window-background material, type-checked only. Linux and Web report the material `Unavailable`; no window draws transparent content. On Windows the corners and title-bar theme are creation options (`Win32WindowOptions`), and `flui::native::windows` sets the backdrop, corners and theme or answers why not; ran in a Win32 window. macOS draws an `NSVisualEffectView` material or Liquid Glass (`NSGlassEffectView`, macOS 26, found by name) behind the content through `flui::native::macos` (`AppKitWindow::set_backdrop`, ADR-0254 §3), which ran on macOS 27 (M1, 2026-10-27); the contract's material on macOS is type-checked only, and the cell stays 🟡 for it and for transparency"
status = { windows = "partial", macos = "partial", wayland = "missing", x11 = "missing", ios = "na", android = "na", web = "na", headless = "missing" }

