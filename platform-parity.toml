[[section.row]]
id = "hdr-and-sdr-white-change-events"
capability = "HDR and SDR-white change events"
note = "A profile change is a new display snapshot revision. Windows re-reads on `WM_DISPLAYCHANGE` (the SDR white level moving raises none), macOS on the screen-parameters notification, Wayland on `image_description_changed`, the Web on the colour queries' `change`; none ran with a real change. iOS and Android re-read only on their other display events. The window receives the change as a new `WindowDisplay`, and its renderer configures the surface again before the next frame (ADR-0256 §6, amended)."
status = { windows = "partial", macos = "partial", wayland = "partial", x11 = "missing", ios = "missing", android = "missing", web = "partial", headless = "yes" }

[[section.row]]
id = "presentation-feedback-when-each-frame-r"
capability = "Presentation feedback: when each frame reached the screen"
note = "A frame request carries when the window's newest earlier frame was shown (`FrameRequest::presented`, on the event timeline input is stamped on); the frame clock keeps it and bounds idle work by the next refresh. Windows reads the DXGI frame statistics of the renderer's swap chain; headless reports what a test injects. Wayland reads `wp_presentation_time`, run on Weston 13. The Web (a `requestAnimationFrame` stamp is a frame's start) and X11 (a present completes on the GPU driver's connection) have none, and their windows say so; macOS reads a presented handler on each drawable of the view's own `CAMetalLayer`; iOS and Android do not report yet."
status = { windows = "yes", macos = "yes", wayland = "yes", x11 = "na", ios = "missing", android = "missing", web = "na", headless = "yes" }

