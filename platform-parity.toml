[[section.row]]
id = "activation-obeys-the-os-focus-rules-way"
capability = "Activation obeys the OS focus rules (Wayland `xdg-activation` token, Windows foreground rights handed to the activated process)"
note = "Windows: an activation never takes the foreground from another application and comes forward once that application hands the right over, run with two processes; opening a link or file hands the right to the handler process the shell started; no second launch hands it yet (single instance, in the activation spec). The Wayland token's whole path runs only on sway, by hand: CI's Weston has no `xdg_activation_v1`. A Wayland token names the seat and serial of the user input behind the activation. macOS cooperative activation (`NSApplication.yieldActivation(to:)`, macOS 14) is not audited."
