# Held by CI on Linux x86_64. `crates_<target>`: the distinct packages of the
# facade's default graph on that target, which the `deps` job fails on when
# they differ. `*_bytes`: the release sizes of a `flui create` counter (host and
# wasm32) and of a `flui create --hot-reload` host, and `counter_element_bytes`
# the host counter's element code (ADR-0405), which the `size` job fails
# on past 2% over and warns on past 2% under. Each line is edited by hand from
# that job's log, with the reason in the pull request.

[size]
counter_element_bytes = 202258
counter_release_bytes = 20572784
counter_wasm_bytes = 12803927
crates_android = 222
crates_linux = 273
crates_macos = 205
crates_wasm32 = 173
crates_windows = 204
hot_reload_host_release_bytes = 20743272
