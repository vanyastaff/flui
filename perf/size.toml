# Held by CI on Linux x86_64. `crates_<target>`: the distinct packages of the
# facade's default graph on that target, which the `deps` job fails on when
# they differ. `*_bytes`: the release sizes of a `flui create` counter (host and
# wasm32) and of a `flui create --hot-reload` host, which the `size` job fails
# on past 2% over and warns on past 2% under. Each line is edited by hand from
# that job's log, with the reason in the pull request.

[size]
counter_release_bytes = 21985504
counter_wasm_bytes = 13900111
crates_android = 223
crates_linux = 274
crates_macos = 206
crates_wasm32 = 179
crates_windows = 205
hot_reload_host_release_bytes = 22136544
