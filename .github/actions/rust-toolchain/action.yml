name: Pinned Rust toolchain
description: Install the repository toolchain without hashing unrelated runner toolchains
inputs:
  components:
    description: Extra rustup components
    default: ""
  targets:
    description: Extra rustup targets
    default: ""
runs:
  using: composite
  steps:
    - name: Read the repository pin
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        : "${RUSTUP_HOME:?CI must isolate the rustup home}"
        channel=$(sed -n 's/^channel = "\([0-9]*\.[0-9]*\.[0-9]*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)
        [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - name: Install pinned Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - name: Report compiler and installed toolchains
      shell: bash
      run: |
        set -euo pipefail
        rustc -vV
        rustup toolchain list
        # Fail setup if a rolling compiler leaks back into this cache domain.
        [[ $(rustup toolchain list --quiet | wc -l) -eq 1 ]]
        [[ $(rustc --version | cut -d ' ' -f 2) == "$EXPECTED_CHANNEL" ]]
      env:
        EXPECTED_CHANNEL: ${{ steps.pin.outputs.channel }}
