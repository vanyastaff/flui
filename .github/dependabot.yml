version: 2
updates:
  # Cargo workspace dependencies.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait 7 days after a release before bumping to it — supply-chain
    # incidents are usually discovered and yanked within that window
    # (zizmor dependabot-cooldown audit).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "cargo"]
    groups:
      # accesskit ships as a COHORT and must move as one. The adapters pin an
      # exact `accesskit` minor — accesskit_unix 0.23 requires accesskit
      # ^0.25.0 — so bumping any single member puts TWO accesskit versions in
      # the graph, and our handler types then implement the wrong one's traits.
      #
      # Not hypothetical: #978-#981 arrived as four separate PRs and every one
      # was red by construction ("the trait bound `Activation:
      # accesskit::ActivationHandler` is not satisfied"), while the coordinated
      # bump of all four needed NO code change at all. They escaped the group
      # below because these are 0.x crates, where 0.24 -> 0.25 is breaking and
      # dependabot classifies it as `major`. Listed first so it wins the match.
      accesskit-cohort:
        patterns: ["accesskit", "accesskit_*"]
        update-types: ["major", "minor", "patch"]
      # Group patch + minor bumps into one PR per cycle — reduces noise; major
      # bumps still surface as individual PRs for review.
      patch-and-minor:
        update-types: ["minor", "patch"]
    ignore: []

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
