version: 2
updates:
  # Cargo workspace dependencies.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait 7 days after a release before bumping to it — supply-chain
    # incidents are usually discovered and yanked within that window
    # (zizmor dependabot-cooldown audit).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "cargo"]
    groups:
      # Group patch + minor bumps into one PR per cycle — reduces noise; major
      # bumps still surface as individual PRs for review.
      patch-and-minor:
        update-types: ["minor", "patch"]
    ignore: []

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
