name: CI

# Two lanes, chosen by `plan` (see its comment):
#   fast lane  an ordinary pull_request: `checks`, `deny`, and `fast-lane`
#              (clippy + nextest over the changed crates and their workspace
#              dependents). Target: a typical PR in under 7 minutes.
#   heavy lane push to main, merge_group, the nightly schedule,
#              workflow_dispatch, or a PR labelled `full-ci`: every job below.
#              A red heavy run on main or nightly opens a tracking issue
#              (`notify-main-red`).
#
# Job graph:
#   checks         — fmt + taplo + typos + inventory + runtime-conformance + toolchain-consistency + panic-policy + port-check + actionlint + zizmor (seconds, no compile)
#   plan           — heavy or fast lane; on a PR, which packages changed (scripts/affected-crates.sh)
#   fast-lane      — fast lane only: clippy + nextest over the affected packages
#   clippy         — workspace lint with -D warnings
#   feature-matrix — cargo-hack per-feature clippy (--each-feature --optional-deps, two passes: libs/bins then tests/benches/examples), xilem-style, as a 4-slice matrix: three balanced package groups + the combination checks
#                    plus a bounded backend-feature-pair powerset for flui-engine, plus every
#                    supported `flui` facade feature combination compiled in isolation
#   wasm-check     — cargo check for the wasm-capable crates + real cdylib link of the two web
#                    demos + import-surface check against scripts/wasm-import-allowlist.txt
#   cross-typecheck — cargo clippy (no link, no tests) of flui-platform's windows + macos + android backends
#   cli-macos      — nextest of flui-cli on macos-latest (simctl, Xcode probes, .app staging, termios hot-keys) + clippy of the flui-app iOS runner (needs xcrun)
#   test           — build + nextest (lib + integration), ubuntu, plus a
#                    dedicated flui-platform (Linux-runnable subset) step
#   gpu-test       — full testing readback suite on windows/WARP (merge-blocking)
#   bench-compile  — criterion benches compile + link
#   doc            — rustdoc with RUSTDOCFLAGS=-D warnings
#   deny           — advisories/bans/licenses/sources
#   doc-test       — rustdoc examples executed as tests
#   msrv           — cargo check on the declared 1.98 MSRV
#   miri           — UB check on flui-rendering's pipeline owner and
#                    flui-view's GlobalKey plane (advisory)
#   ci             — aggregator: designed to be the one status check branch
#                    protection would name, if a ruleset required one — as of
#                    this writing `main` has no required-status-checks rule
#                    (verified: GET /branches/main/protection -> 404), so
#                    nothing here actually blocks a merge yet; that's a repo-
#                    settings decision for the maintainer, not this file
# Patterns borrowed from linebender/xilem (gated `checks` job, cargo-hack
# feature matrix, Swatinem cache + taiki-e/install-action for pinned tool
# versions) and tokio (aggregator `ci` job; nextest as primary runner).

on:
  pull_request:
    # `labeled`: adding the `full-ci` label re-runs the PR with the heavy jobs.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
  # Nightly: the heavy jobs against main even on a quiet day (new toolchain,
  # new advisories, a flaky test that only shows up sometimes).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: no job in this workflow writes to the repo,
# issues, or PRs. Artifact upload uses the separate Actions runtime token and
# is unaffected. zizmor (run in `checks`) audits this file.
permissions:
  contents: read

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # feature-matrix package groups. Balanced by cargo-hack command count
  # (`--each-feature --optional-deps` = features + optional deps + the
  # no-default/all-features pair, per package): 50 / 49 / 58 of 157 as of
  # 2026-09-03. Every workspace member MUST appear in exactly one group —
  # each matrix entry asserts the union against `cargo metadata` and fails
  # on a crate that is missing or duplicated, so adding a crate without
  # placing it here is loud, not silent. Rebalance with:
  #   cargo hack clippy --workspace --each-feature --optional-deps --print-command-list \
  #     | grep -oE -- '--manifest-path [^ ]+' | sort | uniq -c | sort -rn
  FM_GROUP_1: flui-engine flui-app flui-platform flui-widgets flui-devtools
  FM_GROUP_2: flui flui-types flui-geometry flui-rendering flui-assets flui-view flui-objects flui-log
  FM_GROUP_3: flui-interaction flui-hot-reload flui-tree flui-semantics flui-scheduler flui-painting flui-layer flui-foundation flui-cli flui-animation flui-macros flui-testing flui-material flui-localizations flui-cupertino flui-desktop-scene flui-live-smoke flui-web-demo flui-web-server flui-painting-demo flui-hot-reload-lifecycle-fixture hot-reload-counter-host hot-reload-counter-logic hot-reload-counter-types flui-web-counter
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Strict workspace-wide; matches the local `just ci` gate.
  #
  # `build.warnings` (Cargo 1.97+) rather than `RUSTFLAGS: -D warnings`:
  # RUSTFLAGS is part of the rustc fingerprint, so every job that needs a
  # different value (miri, below) gets a disjoint target/ cache and has to
  # blank the flag wholesale — losing every other check with it. The Cargo
  # config knob is applied after compilation and does not enter the
  # fingerprint (measured: toggling it recompiles nothing).
  CARGO_BUILD_WARNINGS: deny
  RUSTDOCFLAGS: -D warnings
  # CI builds are clean every run; no incremental artifacts to preserve.
  CARGO_INCREMENTAL: 0
  # Debuginfo trimmed to line tables in EVERY job, for two reasons that
  # must hold together. Disk: DWARF is the largest part of a debug target
  # (see the `test` job). Cache sharing: rust-cache hashes CARGO_* env
  # into its key, and the artifacts themselves carry the profile, so
  # every job's cache key and contents depend on it. Set per job it had
  # drifted (clippy had none, live-smoke half of it); set once here, it
  # cannot, and a change to it is visibly a change to every key at once.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # checks — fast source gate. fmt + inventory + runtime-conformance +
  # toolchain-consistency + panic-policy + port-check + typos + Taplo +
  # nextest-partition + the
  # workflow linters (actionlint semantics, zizmor security audit). No
  # compile. Every
  # downstream job (clippy, test, doc, bench-compile) depends on this, so a
  # malformed PR fails in seconds before any workspace build starts.
  # Ubuntu only — pure source analysis. clippy lives in its own parallel job.
  # ─────────────────────────────────────────────────────────────────────────
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Single source of truth for the cache key below and the download URL
      # in "Install actionlint" — a literal duplicated in both let the cache
      # key silently outlive a version bump made only in the other spot.
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install CI tools (typos, taplo, ripgrep, zizmor)
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          # Pin versions — unpinned tools surface unrelated breakage on
          # release day. Bump deliberately. `ripgrep` is required by
          # scripts/port-check.sh (the 24 refusal triggers + FR-033 all
          # run through `rg`).
          #
          # actionlint is NOT here: install-action has no recipe for it and
          # falls back to cargo-binstall, which cannot resolve a Go tool that
          # is not on crates.io ("actionlint is not found", exit 76). It is
          # fetched from its own release below.
          tool: typos-cli@1.48,taplo-cli@0.10,ripgrep@15,zizmor@1

      # actionlint is a Go release binary, not a crates.io package: it has no
      # taiki-e/install-action recipe (falls back to cargo-binstall, which
      # cannot resolve it — "actionlint is not found", exit 76) and no
      # cargo-install source to swap for a prebuilt fetch. What IS avoidable
      # is re-downloading and re-extracting the same binary on every run —
      # cached by version, so only the first run (or a version bump) pays for
      # the curl + tar.
      - name: Cache actionlint
        id: actionlint-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint ~/.local/bin/actionlint
          rm -f actionlint actionlint.tar.gz

      - name: Put actionlint on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Exact match on the first line (`actionlint --version` prints the bare
      # version, e.g. "1.7.12", then build metadata on following lines), not
      # just "did --version print something": a cache hit serving a binary
      # from a previous ACTIONLINT_VERSION (key mismatch notwithstanding)
      # should fail loudly here instead of silently linting with the wrong
      # actionlint.
      - name: Verify actionlint
        run: actionlint --version | head -1 | grep -qx "${ACTIONLINT_VERSION}"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: taplo fmt --check
        run: taplo fmt --check

      - name: typos
        run: typos

      - name: workspace inventory + layer topology drift check
        run: bash scripts/check-workspace-inventory.sh

      - name: Runtime contract registry check
        run: bash scripts/check-runtime-conformance.sh

      - name: Toolchain consistency check (MSRV agrees with rust-toolchain.toml everywhere it's declared)
        run: bash scripts/check-toolchain-consistency.sh

      - name: 'panic-policy expect-message convention gate'
        run: bash scripts/check-panic-policy.sh

      - name: scripts/port-check.sh (24 refusal triggers + FR-033)
        run: bash scripts/port-check.sh -v

      # Browsers' WGSL uniformity analysis rejects a derivative taken inside a
      # branch; native naga does not, so nothing else in CI can see the class.
      - name: scripts/check-wgsl-uniformity.py (derivatives in uniform control flow)
        run: |
          python3 -B scripts/check-wgsl-uniformity.py --self-test
          python3 -B scripts/check-wgsl-uniformity.py

      # Keeps the docs-only allowlist (scripts/lib/change_scope.py, which
      # `plan` uses) honest: fails if any file it treats as skippable is
      # actually include_str!()'d into compiled/tested content.
      - name: scripts/check-paths-filter-allowlist.py (docs-only allowlist vs. real include_str! targets)
        run: python3 -B scripts/check-paths-filter-allowlist.py

      # `just test-ci` runs the suite as two nextest profiles whose default
      # filters must be exact complements, and the nested-cargo timeout
      # override must name the same tests; nextest cannot share one filter
      # string, so .config/nextest.toml spells it three times. This fails when
      # the copies drift (a drifted test loses its budget or silently drops
      # out of `just test-ci`). Local mirror: `just text-check`.
      - name: scripts/check-nextest-partition.py (nested-cargo filter copies agree)
        run: python3 -B scripts/check-nextest-partition.py

      - name: actionlint (workflow semantics)
        run: actionlint

      - name: zizmor (workflow security audit)
        run: zizmor .

  # ─────────────────────────────────────────────────────────────────────────
  # plan — what this run has to build. Two independent answers:
  #
  #   heavy  "true" on push to main, merge_group, schedule, workflow_dispatch,
  #          and on a pull_request carrying the `full-ci` label: every job
  #          below runs. Otherwise (an ordinary pull_request) only the fast
  #          lane does, and the heavy jobs skip -- expected, see `ci`.
  #   mode   on a pull_request, from scripts/affected-crates.sh (the same
  #          script `just check-changed` runs, so CI and local agree):
  #            docs      only documentation changed: nothing compiles
  #            none      only repo tooling changed: `checks` covers it
  #            packages  the changed crates + every workspace crate that
  #                      depends on them (normal/dev/build, transitively)
  #            full      a workspace-wide input (Cargo.lock, root
  #                      Cargo.toml, .cargo/, the toolchain, a workflow) or
  #                      an unattributable file changed: the whole workspace
  #          Always "full" when `heavy` is.
  # The docs-only allowlist and the full triggers live in
  # scripts/lib/change_scope.py, once; check-paths-filter-allowlist.py (in
  # `checks`) proves no compiled include_str!() target falls inside it.
  #
  # Skipping is done with job-level `if:` on `plan`'s outputs, NOT with
  # `on.pull_request.paths-ignore`: that would make GitHub never create the
  # skipped jobs' check runs, leaving any required-status-check rule waiting
  # forever. Job-level `if:` keeps every job in the run as `skipped`, and the
  # `ci` aggregator checks that exactly the planned jobs skipped.
  # ─────────────────────────────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
      mode: ${{ steps.scope.outputs.mode }}
      reason: ${{ steps.scope.outputs.reason }}
      packages: ${{ steps.scope.outputs.packages }}
      pkg_args: ${{ steps.scope.outputs.pkg_args }}
      test_args: ${{ steps.scope.outputs.test_args }}
      features: ${{ steps.scope.outputs.features }}
      platform: ${{ steps.scope.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base with the PR's base branch has to be in the clone.
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - id: scope
        name: Decide heavy vs fast lane, and the affected packages
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || [ "$FULL_CI_LABEL" = true ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            bash scripts/affected-crates.sh --full --format github >> "$GITHUB_OUTPUT"
            echo "heavy lane: event=$EVENT full-ci-label=$FULL_CI_LABEL"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            bash scripts/affected-crates.sh --base "$BASE_SHA" --format github | tee -a "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # fast-lane — an ordinary pull_request's whole compile gate: clippy and
  # nextest over the affected packages (`plan`'s `packages` mode: the changed
  # crates plus their workspace dependents; `full` mode: the workspace), and
  # flui-platform's headless suite when it is in scope. Target: a typical PR
  # under 7 minutes. The heavy jobs below cover the rest on main, nightly,
  # on demand and under the `full-ci` label. Local mirror: `just check-changed`
  # (same script, same arguments).
  # ─────────────────────────────────────────────────────────────────────────
  fast-lane:
    name: fast-lane
    needs: [checks, plan]
    if: needs.plan.outputs.heavy != 'true' && (needs.plan.outputs.mode == 'packages' || needs.plan.outputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SCOPE_REASON: ${{ needs.plan.outputs.reason }}
      PACKAGES: ${{ needs.plan.outputs.packages }}
      PKG_ARGS: ${{ needs.plan.outputs.pkg_args }}
      TEST_ARGS: ${{ needs.plan.outputs.test_args }}
      FEATURES: ${{ needs.plan.outputs.features }}
      PLATFORM: ${{ needs.plan.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # Restores the cache the heavy `test` job saves on main (same
          # shared-key): this job never runs on main, so a job-keyed cache
          # would always be cold.
          shared-key: workspace-tests
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9

      - name: Scope
        run: |
          echo "scope: $SCOPE_REASON"
          echo "packages: ${PACKAGES:-<whole workspace>}"

      # Word splitting of the *_ARGS variables is intended: they are cargo
      # argument lists computed by scripts/affected-crates.sh.
      - name: cargo clippy (affected packages)
        run: |
          # shellcheck disable=SC2086
          cargo clippy $PKG_ARGS --all-targets --locked -- -D warnings
          case " $PACKAGES " in
            *" flui-engine "*|"  ") cargo clippy -p flui-engine --all-targets --locked --features testing -- -D warnings ;;
          esac

      - name: cargo nextest run (affected packages)
        if: needs.plan.outputs.test_args != ''
        run: |
          # shellcheck disable=SC2086
          cargo nextest run $TEST_ARGS --locked --no-fail-fast --lib --bins --tests $FEATURES

      - name: Ensure Xvfb + xkbcommon are available (flui-platform)
        if: needs.plan.outputs.platform == 'true'
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 libxkbcommon0

      - name: cargo nextest run (flui-platform, headless)
        if: needs.plan.outputs.platform == 'true'
        env:
          FLUI_HEADLESS: "1"
        run: xvfb-run -a cargo nextest run -p flui-platform --all-features --locked --no-fail-fast

      - name: Upload insta snapshot candidates on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-snap-new-fast-lane
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # clippy — workspace lint with -D warnings. Split out of `checks` so it runs
  # in PARALLEL with test/doc/bench-compile instead of gating them: clippy
  # compiles the whole workspace (minutes); the rest of `checks` is seconds.
  # Gated on `checks` so a malformed PR fails cheap before this build starts.
  # ─────────────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Per-job key, saved only from main (#822). A shared key across
          # clippy / test / test-features / live-smoke / doc-test was tried
          # (#819, #823) and measured on a warm re-run of main: it LOST time
          # on every run. GitHub keeps one immutable entry per key, so only
          # one job can write it; with `test` as the writer, clippy restored
          # build-mode artifacts that cannot serve check-mode and re-checked
          # 428 crates (3.3 min vs 1.2 with its own cache), and test-features
          # could never save its non-default-feature dependencies (10.5 min
          # vs 4.9). The cap pressure that motivated sharing came from
          # per-PR saves, which #822 already removed; five main-only per-job
          # entries are ~4 GB and fit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Lint the feature-gated GPU suites too: `testing` gates a body of code
      # (the readback suites, the deterministic-replay tests, the bench
      # scaffolding) that the workspace pass never compiles, so a break there
      # is invisible until the gpu-test job. Clippy only type-checks; the
      # suites execute in gpu-test.
      - name: cargo clippy flui-engine --features testing
        run: cargo clippy -p flui-engine --all-targets --locked --features testing -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  # test — workspace build + nextest. Matrix: Linux only today (see the
  # Windows note on `os:` below for why it was dropped; macOS was never
  # added here). All 28 crates are active — nothing is workspace-disabled.
  # `cross-typecheck` is the only job touching the AppKit/Win32/Android
  # backends, and it only type-checks them (no link, no tests) — see
  # AGENTS.md's CI Pipeline notes for what that gate does and does not prove.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows temporarily dropped from the matrix: day-to-day development
        # happens on Windows locally, so Windows regressions surface there
        # first — paying the wgpu/PDB build cost in CI is redundant for now.
        # Re-add `windows-latest` here (and in `bench-compile`) once the
        # workspace stabilizes and cross-platform CI coverage is worth the time.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Shrinks the build itself, which is what keeps this job inside the
    # runner's disk. DWARF is the single largest contributor to debug-target size; the
    # full workspace (~28 crates + the wgpu/cosmic-text/lyon/naga stack + dev-deps)
    # built with full debuginfo is what crept toward the runner's disk ceiling
    # (PRs #236/#242). `line-tables-only` drops the bulk of DWARF while keeping
    # file:line in panic backtraces, so CI failures stay diagnosable. Scoped to
    # the workflow env so local `cargo test` debuginfo is unaffected.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # Shared with `fast-lane`, which restores what this job saves on main.
          shared-key: workspace-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Per tokio: binary caching breaks on macOS — guard for when macOS
          # joins the matrix.
          cache-bin: ${{ matrix.os != 'macos-latest' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets --locked

      # Confirm the heavy compile (disk peak) left headroom. This is now the
      # ONLY disk guard on this job: the pre-build reclaim it used to
      # complement was removed once the runner image outgrew the constraint
      # that justified it (measured 2026-09-03: 86 GB free before the reclaim,
      # ~14 GB consumed by the build, so ~72 GB would remain without it — it
      # was spending 81 s on the critical path to defend headroom that is no
      # longer scarce). If this trends toward 0, restore the reclaim.
      - name: Disk usage after build (ubuntu)
        if: runner.os == 'Linux'
        run: df -h /

      # Runs BOTH unit (--lib) and integration (tests/) targets — the
      # integration dirs carry the Core.0/Core.2 exit-gate suites
      # (flui-rendering 39 files, flui-widgets 63, flui-view 27 as of
      # 2026-08-04 — recount if this drifts) and were previously never
      # executed in CI (the invocation was `--lib` only).
      # Runs fully parallel: nextest gives each test its own process. The
      # old process-global singletons (`AppBinding`, singleton `Scheduler`)
      # this used to guard are fully retired — there is no more shared
      # binding/scheduler state to race on, and the locks that once
      # serialized it (`SINGLETON_WINDOW_TEST_LOCK`, `SCHEDULER_PHASE_TEST_LOCK`,
      # `SEMANTICS_TEST_LOCK`) are deleted along with it; each is a
      # forbidden-pattern ratchet in docs/runtime-contract.toml now, so a
      # PR cannot reintroduce the pattern by reintroducing the name. Any
      # genuinely process-global resource that remains (see AGENTS.md's
      # Testing Quirks) needs its own explicit test-local lock instead.
      # flui-platform is still excluded from this workspace-wide invocation,
      # but NOT because of the Windows STATUS_HEAP_CORRUPTION crash tracked
      # at ROADMAP-TRACKER item H9 — that crash is Windows-only and this
      # runner is ubuntu-latest, so it can't reproduce here regardless. Two
      # things this default-feature workspace run cannot give flui-platform:
      # `--all-features` (the winit backend, its actual Linux-runnable
      # implementation, only compiles under `winit-backend` — invisible to
      # `default = ["desktop"]`) and a
      # real X11 connection for the handful of tests that construct
      # `WinitPlatform` directly. The dedicated step below supplies both and
      # runs flui-platform's Linux-runnable suite green; see that step's
      # comment for what remains excluded and why.
      - name: cargo nextest run (lib + integration)
        run: >
          cargo nextest run
          --workspace
          --exclude flui-platform
          --locked
          --no-fail-fast

      # Re-enters flui-platform's suite: the crate carries 70% of the
      # workspace's unsafe code and previously had zero executing tests
      # in CI. Ground truth on ubuntu-latest (verified
      # locally, 5x stable): `--all-features` is required just to compile
      # the winit backend; of the 171 tests that then run, 11 fail without
      # help (three integration-test files call `Platform::open_window`
      # directly instead of inside `Platform::run`'s `on_ready` callback —
      # a real ordering requirement of the winit event-loop model, not a
      # display-server issue) and a further 8 winit-internals unit tests
      # construct `WinitPlatform::new()` directly and need a working X11
      # clipboard connection. `FLUI_HEADLESS=1` routes `current_platform()`
      # to the `HeadlessPlatform` mock and fixes the first 11; Xvfb supplies
      # the real (if virtual) X11 connection the remaining 8 need. Combined,
      # all 171 pass, 8 more are legitimately `#[ignore]`d (manual-run
      # perf benchmarks and unimplemented placeholders) — 5x-verified
      # stable, no filter needed. The Linux guard keeps these steps off any
      # Windows/macOS runner that later rejoins the matrix (H9 stays
      # honored: the Windows crash means no platform tests there).
      - name: Ensure Xvfb + xkbcommon are available (flui-platform winit-backend X11 tests)
        if: runner.os == 'Linux'
        # Unconditional install: a preinstalled xvfb-run must not short-circuit
        # the library install — winit's keyboard layer dlopens
        # libxkbcommon-x11, which the hosted runners do not ship.
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 libxkbcommon0

      - name: cargo nextest run (flui-platform, headless)
        if: runner.os == 'Linux'
        env:
          FLUI_HEADLESS: "1"
        run: xvfb-run -a cargo nextest run -p flui-platform --all-features --locked --no-fail-fast

      # Live E2E smoke: a REAL windowed demo binary driven by REAL X11 input
      # (XTEST fake pointer), asserting on captured pixels and the process's
      # exit code. This is the only place the band ABOVE synthetic event
      # dispatch is executed at all: the winit translation layer, the
      # event-loop wake chain, and window-close teardown each shipped broken
      # while every synthetic gesture test stayed green. Checks: the window
      # opens; the screen tracks a held drag mid-gesture (a parked-loop
      # regression freezes exactly this); the drag scrolled; a WM_DELETE
      # close exits 0 within a timeout (catches teardown hangs and
      # post-quit crashes); wheel ticks scroll. X11 input/pixels only — the
      # Wayland-specific teardown ordering is the next step's job.
      - name: Upload insta snapshot candidates on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-snap-new
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # gpu-test (PILOT) — actually RUN the `testing` readback/oracle
  # suite, which the `clippy` job above only TYPE-CHECKS. Without this, a
  # WGSL/blend-state/color-pipeline regression merges silently green — the #1
  # risk in two independent engine audits (the oracle infra exists and is
  # non-vacuous, but is operationally inert in CI today).
  #
  # windows-latest → WARP (Microsoft's software DX12 rasterizer). The readback
  # harness is authored and executed locally on DX12, so WARP is the SAME
  # backend (no Vulkan/lavapipe feature-gap or precision divergence). GitHub
  # windows runners expose no hardware GPU, so `request_adapter`
  # (force_fallback_adapter:false) returns WARP with no harness change.
  #
  # The pilot (a 5-test representative subset) PROVED the approach on CI: WARP is
  # selected on the hardware-GPU-less windows runner with no harness change, the
  # ±LSB oracle tolerances HOLD under software rasterization (blur_oracle ±3 LSB
  # passed), and the run is fast (nextest ~16 s; the ~8 min is the wgpu-stack
  # build). So this now runs the FULL `testing` suite (~440 tests).
  #
  # MERGE-BLOCKING as of 2026-07: the full suite showed 3 consecutive green
  # runs on main (CI #583/#586/#595 — job wall-time 5m/7m/15m, nextest step
  # 4m/5m/13m) against the 60-minute budget, satisfying the promotion
  # criterion recorded here during the pilot. Verified only by THIS
  # workflow's run — the dev machine is hardware DX12, so the WARP software
  # path cannot be exercised locally.
  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────
  # test-features — the feature-gated test runs, split out of `test` so they
  # stop extending the critical path. They are the runs that compile crates
  # under NON-default features, so cargo rebuilds those crates and their
  # dependents regardless of what `test` already built; sharing a runner with
  # it bought nothing but serialisation (measured 2026-09-03: 203 s of the
  # `test` job's 17 min). Same coverage, now concurrent.
  # ─────────────────────────────────────────────────────────────────────────
  test-features:
    name: test-features
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9

      # flui-assets and flui-widgets both default to `default = []`, so the
      # workspace-default run above never compiles their `images`/`network`
      # decode-and-cache paths or the Image widget's own file-decode test —
      # exactly the gap that let the Business.1 flui-assets↔Image
      # verification tests go CI-dead once. Explicit feature-gated run, same
      # precedent as `cargo clippy -p flui-engine --features
      # testing` above.
      #
      # `asset-images`/`network-images` extend the same gap to the
      # flui-assets↔Image ASYNC bridge (`AssetImage`/`NetworkImage`,
      # `image::decode_cache`): those tests only compile under their own
      # feature, so they need their own explicit run too, or they are as
      # CI-dead as the sync path was before this block existed.
      - name: cargo nextest run (flui-assets full, flui-widgets images)
        run: |
          cargo nextest run -p flui-assets --locked --features full
          cargo nextest run -p flui-widgets --locked --features images --test image
          cargo nextest run -p flui-widgets --locked --features asset-images --lib
          cargo nextest run -p flui-widgets --locked --features asset-images --test image_async
          cargo nextest run -p flui-widgets --locked --features network-images --test image_network

      # The facade is Material-first by default, so the workspace run above
      # never compiles `tests/cupertino_demo.rs` (gated by
      # `required-features = ["cupertino"]`) or the facade smoke test's
      # localizations assertions. Same precedent as the block above: a test
      # behind a non-default feature needs its own explicit run, or it is
      # CI-dead.
      - name: cargo nextest run (facade non-default catalogs)
        run: cargo nextest run -p flui --locked --features cupertino,localizations --no-fail-fast

      # ADR-0074 realm-scoped signals live behind the non-default `signals`
      # feature on flui-view/flui-testing/flui-widgets/flui-app; the workspace
      # run above never compiles their tests. Same rule as the two blocks
      # above: a test behind a non-default feature needs its own run.
      - name: cargo nextest run (realm-scoped signals feature)
        run: >
          cargo nextest run
          -p flui-view -p flui-testing -p flui-widgets -p flui-app
          --features flui-view/signals,flui-testing/signals,flui-widgets/signals,flui-app/signals
          --locked --no-fail-fast

      # The facade run above drives the insta demo-snapshot suite, so this job
      # needs the same candidate upload `test` has — otherwise a snapshot diff
      # here is only readable as a log tail.
      - name: Upload insta snapshot candidates on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-snap-new-features
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 7

      # insta writes `<name>.snap.new` next to the snapshot on mismatch.
      # Upload them so a CI-only snapshot failure is debuggable without a
      # local repro (same pattern as egui/xilem snapshot artifacts).

  # ─────────────────────────────────────────────────────────────────────────
  # live-smoke — the real-window smoke suites, split out of `test` for the
  # same reason: they need only the demo example and the harness binary, not
  # the workspace's test targets, so they were serialising ~100 s behind a
  # build they do not use. Both variants stay in ONE job because the Wayland
  # run reuses the binaries the X11 run builds.
  # ─────────────────────────────────────────────────────────────────────────
  live-smoke:
    name: live-smoke
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # xvfb for the virtual display; libxkbcommon-x11 because winit's X11
      # backend dlopens it at startup (`xkbcommon-dl` panics without it, so
      # the demo dies before a window exists — the first run of this split
      # job proved it). Same pair the `test` job installs for flui-platform.
      - name: Ensure Xvfb + xkbcommon are available
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 libxkbcommon0

      - name: live-smoke (real window, real input, real teardown)
        if: runner.os == 'Linux'
        run: |
          # The hosted runner has no GPU: mesa-vulkan-drivers provides the
          # lavapipe software Vulkan adapter the demo's wgpu init needs
          # (without it the app panics before a window ever exists).
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          cargo build -p flui --features material --example sliver_demo --locked
          cargo build -p flui-live-smoke --locked
          xvfb-run -a -s "-screen 0 1200x800x24" target/debug/flui-live-smoke target/debug/examples/sliver_demo

      # Wayland variant of the live smoke: the ONLY executing coverage of
      # the Wayland close-path teardown ordering, which segfaulted post-quit
      # (a wgpu swapchain destroyed after its wl_surface — issue #713) while
      # the X11 close check above stayed green, because Xlib tolerates the
      # same out-of-order teardown that is a use-after-free on Wayland's
      # client-side proxies. Runs the demo under a headless weston
      # compositor; the app closes itself via the platform's harness
      # self-close hook (FLUI_SELF_CLOSE_AFTER_MS): five cycles on the
      # compositor route (the exact CloseRequested arm a compositor close
      # takes) and two on the programmatic PlatformWindow::close route
      # (FLUI_SELF_CLOSE_ROUTE=programmatic, issue #919); each must exit 0
      # AND log the route it took.
      # Weston is installed explicitly so the harness's weston-absent SKIP
      # path can never silently fire here. Reuses the demo/harness binaries
      # built by the X11 step above.
      - name: live-smoke-wayland (teardown ordering under headless weston)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends weston
          target/debug/flui-live-smoke target/debug/examples/sliver_demo wayland

  gpu-test:
    name: gpu-test
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: windows-latest
    # Generous headroom: ~440 readback tests on a software rasterizer, each
    # creating its own wgpu::Device, plus the cold wgpu-stack build. The first
    # full run measures the real figure; tighten or shard (nextest partition)
    # afterward if needed.
    timeout-minutes: 60
    env:
      # Surface the wgpu adapter selection in the log so the run confirms WARP
      # was enumerated (not a silently-missing-adapter skip).
      RUST_LOG: wgpu_hal=info,wgpu_core=info
      # A readback test that finds no adapter returns early and is reported
      # PASSED. This job exists to run those tests on WARP, so an unavailable
      # GPU here is a failure, not a skip (`test_support::resolve_unavailable_gpu`).
      FLUI_REQUIRE_GPU: "1"
      # Readback oracle mismatches dump the actual frame as PNG into this dir
      # (flui-engine readback test support, env-gated). Uploaded on failure
      # below — the WARP software path cannot be exercised on the dev
      # machine, so the dump is the only way to SEE a CI-only mismatch.
      FLUI_READBACK_DUMP_DIR: readback-dumps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9

      # Full testing suite. `--test-threads 1`: each test builds its own
      # wgpu::Device; WARP serializes command submission through one software
      # driver, so parallel submission can saturate it. The job-level
      # `timeout-minutes` is the hung-test backstop.
      - name: cargo nextest run (flui-engine GPU readback suite, WARP)
        run: >
          cargo nextest run
          -p flui-engine
          --features testing
          --lib
          --locked
          --no-fail-fast
          --test-threads 1

      # The composited-layer update path's PIXEL oracle (issue #536). It lives
      # in the facade, not flui-engine, because it needs BOTH the render
      # pipeline (to produce the two layer trees) and
      # `flui_engine::wgpu::HeadlessRenderer` (to rasterize them) — siblings in
      # layer 4 that only the facade already depends on. The step above runs
      # `-p flui-engine --lib`, so it cannot reach a facade integration test
      # however correct that test is; this is the second invocation that does.
      #
      # `--no-default-features` keeps Material out: the test uses the render and
      # engine crates directly and needs no catalog, so the Windows build stays
      # as small as the assertion allows.
      - name: cargo nextest run (composited-layer update readback, WARP)
        run: >
          cargo nextest run
          -p flui
          --no-default-features
          --features gpu-readback-tests
          --test composited_layer_update_readback
          --locked
          --no-fail-fast
          --test-threads 1

      # On oracle mismatch the harness writes `<test>.png` to
      # $FLUI_READBACK_DUMP_DIR — upload it for post-mortem inspection.
      - name: Upload readback PNG dumps on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readback-dumps
          path: readback-dumps/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # bench-compile — ensures benchmarks compile and link on both platforms.
  # `--no-run` compiles + links the bench binaries without executing them so
  # CI stays fast. Gated on `checks`. Same OS matrix as `test` so Windows
  # regressions surface here too.
  # ─────────────────────────────────────────────────────────────────────────
  bench-compile:
    name: bench-compile (${{ matrix.os }})
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows temporarily dropped — see the note in the `test` job.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: ${{ matrix.os != 'macos-latest' }}

      - name: cargo bench --no-run
        run: cargo bench -p flui-rendering --no-run --locked

  # ─────────────────────────────────────────────────────────────────────────
  # doc — RUSTDOCFLAGS=-D warnings enforces zero new doc warnings. Gated on
  # `checks`. Ubuntu only — docs are platform-agnostic.
  #
  # Hard-gate as of the workspace rustdoc cleanup sweep (feat/rustdoc-cleanup):
  # all 108 pre-existing rustdoc errors across 11 crates were resolved
  # (intra-doc-link qualifications, HTML-tag escaping of bare generics,
  # private-leak rewrites, bare-URL autolink conversions). A regression
  # here MUST block merge — the cleanup is the bar to keep.
  # ─────────────────────────────────────────────────────────────────────────
  doc:
    name: doc
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo doc --no-deps (every `testing` feature on)
        run: bash scripts/doc-strict.sh

  # ─────────────────────────────────────────────────────────────────────────
  # deny — cargo-deny over advisories/bans/licenses/sources. deny.toml has
  # been maintained in-repo since the 0.19 schema migration but was never
  # executed in CI; the first wired run surfaced 4 real advisories (anyhow
  # unsound downcast_mut, crossbeam-epoch deref, quick-xml DoS pair) — three
  # fixed by lockfile bumps, the transitive rest carry documented ignores.
  # Merge-blocking: it was green at wiring time and every ignore is argued.
  # ─────────────────────────────────────────────────────────────────────────
  deny:
    name: deny
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true' || needs.plan.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The workflow default is `contents: read` only. The wgpu-bump probe below
    # reads this PR's changed files, and GitHub documents `pull-requests: read`
    # for that endpoint — without it both `gh api` calls 403 and the probe
    # silently reports "nothing changed" on exactly the PRs it exists for.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-deny@0.19

      # `cargo deny` has no `--locked` flag (it reads the committed lockfile by
      # design); passing it exits 2 with "unexpected argument".
      - name: cargo deny check
        run: cargo deny check

      # ADR-0045 decision 1 pins macOS to the inline raster lane on an UPSTREAM
      # fact: wgpu-hal's Metal `acquire_texture` messages AppKit UI objects from
      # the calling thread. Issue #653 asks for that reopen condition to be
      # re-read "on each wgpu bump rather than on a schedule -- a dependabot PR
      # touching wgpu/wgpu-hal is the natural trigger". weekly.yml runs the same
      # probe on a schedule, which cannot see the bump PR itself; this is the
      # per-bump trigger, and it lives here because a lockfile move is a
      # dependency event and this is the dependency job.
      #
      # ADVISORY, and it must stay that way. Every direction it can be wrong is
      # safe: a stale "still there" leaves macOS on the inline lane, which is
      # slower than necessary and not unsound. Blocking would hand dependabot a
      # red check it cannot act on -- the probe's own header says the same, and
      # the second half of the reopen condition (an upstream statement that the
      # off-thread access is safe) is prose no source predicate can see.
      #
      # It runs only when this PR's Cargo.lock actually moves wgpu, so an
      # ordinary PR pays nothing. When the API cannot show the patch (GitHub
      # omits it for very large diffs) it RUNS rather than skips: a false run
      # costs a minute, a false skip is the trigger silently not firing on the
      # one PR it exists for.
      - name: wgpu bump — re-read ADR-0045's macOS reopen condition (advisory)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Ask once, and keep the API's own success/failure separate from the
          # answer. Conflating them is how the previous shape turned a 403 into
          # a confident "nothing changed" and skipped the very PRs this exists
          # for -- the failure it was written to avoid.
          if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "Could not list this PR's files (see the error above) -- probing anyway"
            echo "rather than reporting a skip we cannot justify."
          elif ! grep -qx 'Cargo.lock' <<<"$files"; then
            echo "Cargo.lock untouched by this PR; nothing for the macOS reopen probe to re-read."
            exit 0
          elif patch=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
                         --jq '.[] | select(.filename=="Cargo.lock") | .patch'); then
            if [ -z "$patch" ]; then
              echo "Cargo.lock changed but GitHub returned no patch (diff too large) -- probing anyway."
            elif ! grep -qi 'wgpu' <<<"$patch"; then
              echo "Cargo.lock moved but no wgpu entry changed; skipping the macOS reopen probe."
              exit 0
            fi
          else
            echo "Could not read the Cargo.lock patch -- probing anyway."
          fi

          # Run with the summary suppressed, then surface only news. A run that
          # reports the status quo on every wgpu bump would train readers to
          # ignore the one that does not.
          out=$(env -u GITHUB_STEP_SUMMARY bash scripts/probe-metal-acquire-main-thread.sh 2>&1) || true
          printf '%s\n' "$out"
          if grep -qE 'CHANGED|INCONCLUSIVE|Out of this probe.s reach|Could not reach crates.io' <<<"$out"; then
            {
              echo "### wgpu moved — ADR-0045's macOS reopen condition needs a human read"
              echo
              printf '%s\n' "$out"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Reopen condition still NOT met on every resolved wgpu-hal; nothing to surface."
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # doc-test — run every rustdoc example as a test. nextest does NOT execute
  # doctests (cargo-nextest#16), so the `test` job above never covers them;
  # without this job the 700+ doc code fences in the workspace are unverified
  # prose. Unlike the `test` job, flui-platform is NOT excluded here: its
  # doctests need neither `--all-features` nor a display server (verified
  # locally with and without DISPLAY set — identical 12 passed/0 failed
  # either way), so there is no green-by-construction reason to carve it out.
  # ─────────────────────────────────────────────────────────────────────────
  doc-test:
    name: doc-test
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test --doc
        run: cargo test --workspace --locked --doc

  # ─────────────────────────────────────────────────────────────────────────
  # msrv — verify the declared MSRV actually compiles the workspace. Every
  # other job installs `dtolnay/rust-toolchain@stable`, which OVERRIDES the
  # committed rust-toolchain.toml pin — so without this job the floor in
  # `[workspace.package].rust-version` would never be exercised in CI. `check`
  # (not `test`): MSRV promises "compiles on the floor", behavior is the stable
  # jobs' concern. Bump procedure lives in rust-toolchain.toml's header.
  # ─────────────────────────────────────────────────────────────────────────
  msrv:
    name: msrv
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98 (declared MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.98"

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check --workspace (MSRV)
        run: cargo check --workspace --all-targets --locked

  # ─────────────────────────────────────────────────────────────────────────
  # miri — undefined-behavior check for the workspace's densest unsafe hot
  # spot: flui-rendering's subtree arena (raw-pointer arena with ~49 unsafe
  # sites). flui-rendering has no wgpu dependency, so miri can execute it;
  # the test filter keeps runtime sane (workspace-wide miri is not realistic
  # on this stack). ADVISORY (continue-on-error) until a few runs establish
  # it is stable and in-budget — then drop the line, same playbook as
  # gpu-test.
  #
  # SCOPE widened: `pipeline::owner::subtree_arena` -> `pipeline::owner`,
  # picking up `cell.rs`'s PipelineCell checkout tests and two new
  # real-NodePtr walks (an owner-local full run_frame, and a
  # reentrant-layout mid-layout child-request) alongside the original
  # subtree_arena suite -- see the `miri` recipe's doc-comment in the
  # justfile for the full breakdown. Measured 55 tests / ~21s wall, in
  # budget.
  #
  # SCOPE widened again (ADR-0050): a second invocation runs flui-view's
  # `owner::global_key` surface -- the identity registry, the cross-owner
  # claim table, and the per-frame reservation ledger, including the
  # tree-driving verification and repair tests. See that step's own comment.
  # ─────────────────────────────────────────────────────────────────────────
  miri:
    name: miri
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      # Relax the workflow-level warnings gate: nightly deprecates APIs and
      # adds lints ahead of stable, and those warnings would fail this job
      # spuriously. Lint enforcement is the stable jobs' business; this job
      # exists solely to catch undefined behavior. (The weekly nightly canary
      # is where an upcoming deprecation is meant to surface, with its date.)
      # Unlike the old `RUSTFLAGS: ""` override this keeps the target/ cache
      # shared with every other job.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: miri

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `+nightly` is required: the committed rust-toolchain.toml pin overrides
      # the job's installed default toolchain, and the pinned stable has no
      # miri component (first run failed exactly there).
      - name: cargo miri test (pipeline::owner)
        run: cargo +nightly miri test -p flui-rendering --lib --locked pipeline::owner

      # The GlobalKey plane (ADR-0050): the identity registry, the cross-owner
      # claim table, and the per-frame reservation ledger, plus the tree-driving
      # verification and repair tests that run a real `ElementTree` through
      # `BuildOwner::finalize_tree`. No `unsafe` of its own — the point is the
      # slab-backed element arena and the reborrow chains it drives underneath.
      # Measured 28 tests / ~7s wall, in budget.
      - name: cargo miri test (owner::global_key)
        run: cargo +nightly miri test -p flui-view --lib --locked owner::global_key

      # The surface-ownership protocol (ADR-0063, issue #1043): the whole
      # wgpu-free `SurfaceLease` protocol, which is where the two test-only
      # `borrow_raw` calls and the load-bearing surface-before-target drop
      # order live. `SurfaceLease` is generic over its surface type precisely
      # so this needs no GPU — the lib target links wgpu, but Miri never
      # enters it. Measured 6 tests / ~3.3s warm, in budget.
      - name: cargo miri test (wgpu::surface_lease)
        run: cargo +nightly miri test -p flui-engine --lib --locked wgpu::surface_lease

      # The cancellation oracle for `Renderer::new` (issue #1149): drives the
      # production `probe_then_build` seam with a builder that suspends
      # forever, then drops the future and asserts the target's strong count
      # returned to its pre-call value. GPU-free by construction — the
      # synthetic builder is what keeps wgpu out of the path, since a first
      # poll of the production builder enters `wgpu::Instance::new`.
      # Measured 1 test / ~1.7s warm.
      - name: cargo miri test (cancelling_renderer_new)
        run: cargo +nightly miri test -p flui-engine --lib --locked cancelling_renderer_new

  # ─────────────────────────────────────────────────────────────────────────
  # feature-matrix — xilem-style per-feature clippy via cargo-hack. The plain
  # `clippy` job compiles the whole workspace under feature unification with
  # default features, which can mask a crate that fails to declare a feature
  # dependency (a sibling crate enables it transitively). cargo-hack checks
  # each package separately, once per feature plus once per optional dep, so
  # per-crate feature wiring is actually exercised. Two runs per xilem:
  # default targets (libs/bins, as downstream users compile them) and
  # auxiliary targets (tests/benches/examples) — `--all-targets` would compile
  # libs with dev-dependencies enabled and mask missing feature requirements.
  # ─────────────────────────────────────────────────────────────────────────
  feature-matrix:
    name: feature-matrix (${{ matrix.slice }})
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Three balanced per-feature clippy slices plus the two short
        # combination checks. Formerly ONE job running the whole workspace
        # in two passes (libs/bins, then tests/benches/examples): 640 s of
        # cargo-hack serialised on one runner, 15-16 min wall, the critical
        # path of the entire workflow once `test` was split. Same commands,
        # same features, same `-D warnings`, same TWO passes per package —
        # the passes are not a redundancy to fold away. Under resolver v2,
        # dev-dependency features unify with normal dependencies only while
        # dev targets are being built; a single `--all-targets` pass builds
        # them, so a per-feature LIBRARY configuration could pass on a
        # feature that a dev-dep (e.g. flui-testing enabling
        # `flui-rendering/testing`) dragged in, while a downstream consumer
        # of that library alone would fail. The targetless pass is the one
        # that sees the library exactly as consumers do. What the split buys
        # is three runners instead of one, not fewer passes.
        #
        # cargo-hack's own `--partition M/N` was measured and rejected:
        # `--print-command-list --partition 1/2` on flui-engine printed the
        # FULL 15-command list and 2/2 printed 7, so it is not a clean
        # partition and could silently double or drop work. Explicit groups
        # + the completeness guard below are transparent and checkable.
        slice: [group-1, group-2, group-3, combinations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      # Each slice compiles a disjoint set of packages under many feature
      # sets, so every slice gets its OWN cache, fully namespaced by
      # `prefix-key` — nothing is shared between slices, not even the
      # registry. A shared key would be overwritten by whichever slice
      # finished last, discarding the other three's artifacts.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-feature-matrix-${{ matrix.slice }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # `just` carries the facade combination list, so CI and `just
      # feature-matrix` cannot drift into testing different sets.
      - name: Install cargo-hack + just
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-hack@0.6,just@1

      # The one guard that makes explicit groups safe: the union of the three
      # groups must equal the workspace, with no package in two groups. Runs
      # in every slice so a stale group list fails the whole matrix, not one
      # corner of it.
      - name: Assert the package groups cover the workspace exactly once
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys
          members = {p["name"] for p in json.loads(subprocess.check_output(
              ["cargo", "metadata", "--format-version", "1", "--no-deps", "--locked"]))["packages"]}
          groups = {k: os.environ[k].split() for k in ("FM_GROUP_1", "FM_GROUP_2", "FM_GROUP_3")}
          listed = [p for g in groups.values() for p in g]
          dup = sorted({p for p in listed if listed.count(p) > 1})
          missing = sorted(members - set(listed))
          unknown = sorted(set(listed) - members)
          for label, bad in (("in two groups", dup), ("not in any group", missing), ("not a workspace member", unknown)):
              if bad:
                  print(f"::error::feature-matrix groups: {label}: {bad}")
          if dup or missing or unknown:
              sys.exit(1)
          print(f"ok: {len(members)} members, each in exactly one group")
          EOF

      - name: Resolve this slice's package list
        if: matrix.slice != 'combinations'
        run: |
          case "${{ matrix.slice }}" in
            group-1) pkgs="$FM_GROUP_1" ;;
            group-2) pkgs="$FM_GROUP_2" ;;
            group-3) pkgs="$FM_GROUP_3" ;;
          esac
          args=""; for p in $pkgs; do args="$args -p $p"; done
          echo "PKG_ARGS=$args" >> "$GITHUB_ENV"

      # Pass 1 — libs/bins, NO dev targets: the library as its consumers see
      # it, per feature. This is the pass that catches a feature edge missing
      # from a normal dependency; see the resolver-v2 note above.
      - name: cargo hack clippy (libs/bins, per feature)
        if: matrix.slice != 'combinations'
        run: |
          read -ra slice_pkgs <<< "$PKG_ARGS"
          cargo hack clippy "${slice_pkgs[@]}" --locked --each-feature --optional-deps --keep-going -- -D warnings

      # Pass 2 — tests/benches/examples, per feature: lints the dev targets
      # themselves (a missing `required-features` on an example, a test that
      # only compiles under one feature).
      - name: cargo hack clippy (tests/benches/examples, per feature)
        if: matrix.slice != 'combinations'
        run: |
          read -ra slice_pkgs <<< "$PKG_ARGS"
          cargo hack clippy "${slice_pkgs[@]}" --locked --each-feature --optional-deps --keep-going --tests --benches --examples -- -D warnings

      # --each-feature can never see a defect that only appears when two
      # features combine. flui-engine is the one crate where combinations
      # matter (its backend features are ADDITIVE by design — enabling two
      # compiles both wgpu backends), so pairwise coverage there is bounded
      # and meaningful: depth 2 over the six backend-adjacent features is ~22
      # configurations, minutes not hours. The full workspace powerset stays
      # deliberately out (2^N explosion for no known failure mode).
      - name: cargo hack check flui-engine (backend-feature pairs)
        if: matrix.slice == 'combinations'
        run: cargo hack check -p flui-engine --locked --feature-powerset --include-features vulkan,metal,dx12,webgpu,gles --depth 2

      # The facade's catalog/localization/hot-reload features are the public
      # package surface, so each supported combination is compiled ON ITS OWN,
      # against the `flui` package alone. A `--workspace` build is not evidence
      # here: workspace feature unification would enable `material` from a
      # sibling and turn a broken combination green. `--all-targets` is
      # deliberate — a missing `required-features` on an example or test is
      # exactly what these builds exist to catch. The `cargo tree` assertions at
      # the end prove hot reload is *absent* from an ordinary production graph,
      # not merely unused by it.
      - name: facade feature combinations (isolated) + hot-reload absence
        if: matrix.slice == 'combinations'
        run: just facade-combos

  # ─────────────────────────────────────────────────────────────────────────
  # wasm-check — the web platform claim, machine-checked. web_demo /
  # painting_demo are workspace members but were only ever compiled for the
  # host target; this checks the wasm-capable set under the real
  # wasm32-unknown-unknown target. The set was verified crate-by-crate before
  # wiring (29 of 36 packages green, as of 2026-08-04 — `cargo metadata
  # --no-deps` counts packages, recount if this drifts); the excluded seven
  # genuinely cannot target wasm today — see NO_WASM_PKGS. A crate that
  # gains wasm support is REMOVED from the exclude list, never worked around.
  #
  # `cargo clippy` as well as `cargo check`: the web backend of flui-platform
  # is `cfg(target_arch = "wasm32")`-only, so the host clippy job never sees
  # it — it carried 15 deny-level violations (two bare `unwrap()`s among them)
  # for as long as this job was check-only. Lib/bin targets only: the crates'
  # test targets pull native-only dev-deps (tokio) that do not build here.
  # ─────────────────────────────────────────────────────────────────────────
  wasm-check:
    name: wasm-check
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # flui-assets / flui-cli / flui-web-server: mio + uuid
      # (tokio-net / CLI stack) have no wasm32-unknown-unknown support.
      # hot-reload-counter-*: dlopen-based hot-reload, host-only by design.
      NO_WASM_PKGS: >-
        --exclude flui-assets
        --exclude flui-cli
        --exclude flui-web-server
        --exclude hot-reload-counter-host
        --exclude hot-reload-counter-logic
        --exclude hot-reload-counter-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `dtolnay/rust-toolchain@stable` installs the target for the toolchain
      # named `stable`, but the committed `rust-toolchain.toml` makes `1.98.1`
      # the ACTIVE toolchain — a separate rustup install even at the same
      # version — so the target has to be added again against the pin. Without
      # this the build fails with E0463 "can't find crate for `core`".
      - name: Add wasm32 target to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: cargo check (wasm32)
        run: cargo check --workspace --locked --target wasm32-unknown-unknown ${{ env.NO_WASM_PKGS }}

      - name: cargo clippy (wasm32, lib + bin targets)
        run: cargo clippy --workspace --lib --bins --locked --target wasm32-unknown-unknown ${{ env.NO_WASM_PKGS }} -- -D warnings

      # No dlopen-based runner exists on web, but the public feature must still
      # be cfg-complete: enabling it cannot expose desktop-only imports.
      - name: cargo check facade hot-reload feature (wasm32)
        run: cargo check -p flui --locked --target wasm32-unknown-unknown --no-default-features --features hot-reload

      # `cargo check` does not link. rust-lld resolves a wasm cdylib for
      # real — and on wasm32 an undefined symbol does not even fail the link
      # (it becomes an import), so linking alone is still not the full claim.
      - name: cargo build (wasm cdylibs — real link)
        run: cargo build --locked --target wasm32-unknown-unknown -p flui-web-demo -p flui-painting-demo

      - name: Install wasm-tools
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: wasm-tools@1

      # ...which is why the import surface is a committed, reviewed artifact:
      # any module outside scripts/wasm-import-allowlist.txt (most notably
      # `env`, the catch-all for accidental native externs) fails here.
      - name: Check wasm import surface against the allowlist
        run: >-
          bash scripts/check-wasm-imports.sh
          target/wasm32-unknown-unknown/debug/flui_web_demo.wasm
          target/wasm32-unknown-unknown/debug/flui_painting_demo.wasm

      # Everything above this line COMPILES for wasm32; none of it runs. That
      # gap is not academic: swap `web_time::Instant` for `std::time::Instant`
      # in flui-foundation's clock and every step above stays green while the
      # code panics "time not implemented on this platform" the moment it
      # executes. These last steps close it (issue #985).
      #
      # The runner's version must equal the LOCKED wasm-bindgen exactly or it
      # refuses to start, so read it from Cargo.lock instead of hardcoding a
      # version here that a dependabot bump would silently invalidate.
      - name: Resolve the locked wasm-bindgen version
        id: wasm_bindgen_version
        run: |
          set -euo pipefail
          version="$(bash scripts/locked-version.sh wasm-bindgen)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "locked wasm-bindgen: $version"

      - name: Install wasm-bindgen-cli (matching the lockfile)
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm_bindgen_version.outputs.version }}

      # Hosted on node (already on the runner) via the runner configured in
      # .cargo/config.toml. A runner that finds no tests still exits 0 and
      # prints "0 passed", which is indistinguishable from a passing suite, so
      # the count is asserted rather than trusted.
      - name: Execute the wasm32 tests
        env:
          # Relax the workflow-level deny for THIS STEP ONLY, following the
          # precedent the miri job sets below.
          #
          # Building flui-app's lib-test target for wasm32 is a configuration
          # nothing ships, and in it ~17 production items have no caller —
          # `install_*`, `close_*`, `uninstall_platform_realm`, the
          # `*_for_test` helpers — because their only callers are the test
          # modules that are `cfg(not(wasm32))` for good reasons (tokio,
          # desktop teardown, the service lifecycle). That is the expected
          # shape of a mostly-native crate in a test configuration, not a
          # defect, and denying it would buy ~17 `expect(dead_code)`
          # attributes whose only job is to silence a build nobody runs.
          #
          # What this does NOT relax: the SHIPPING wasm configuration. The
          # `cargo clippy (wasm32, lib + bin targets)` step above still runs
          # under the workflow's deny plus `-D warnings`, and it is green —
          # verified, not assumed. A genuinely dead item in the code that
          # ships still fails there.
          CARGO_BUILD_WARNINGS: warn
        run: |
          set -euo pipefail
          # DISCOVER the participating crates rather than list them: naming
          # them here means the next crate to add wasm tests is silently never
          # run, which is the defect these steps exist to fix, one level up.
          # The opt-in signal is the crate's own wasm32 dev-dependency on
          # wasm-bindgen-test -- greppable, and where intent is already declared.
          #
          # Both target kinds run, because which is possible depends on
          # visibility: an integration test sees only the public API, while a
          # `pub(crate)` seam (flui-app's `Backend::Sequential`) is reachable
          # ONLY from a lib test.
          #
          # Branch on each command rather than assigning its output directly:
          # under `set -e` a failing `cargo test` exits AT THE ASSIGNMENT and
          # the panic never reaches the log.
          total=0
          crates=0
          # Parsed, not grepped: a substring search also matches a comment, a
          # normal dependency, or a non-wasm32 target table, so the check would
          # not match the contract it documents -- silently.
          for name in $(python3 scripts/wasm-test-crates.py); do
            dir="crates/$name"
            crates=$((crates + 1))
            crate_total=0
            modes=(lib)
            [ -f "$dir/tests/wasm32.rs" ] && modes+=(integration)
            for mode in "${modes[@]}"; do
              if [ "$mode" = "lib" ]; then
                args=(--lib)
              else
                args=(--test wasm32)
              fi
              if ! out="$(cargo test -p "$name" --locked --target wasm32-unknown-unknown "${args[@]}" 2>&1)"; then
                echo "$out"
                echo "::error::wasm32 test run failed for $name ($mode)" >&2
                exit 1
              fi
              echo "$out"
              passed="$(echo "$out" | sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed.*/\1/p' | tail -1)"
              crate_total=$((crate_total + ${passed:-0}))
            done
            # Per crate, not only in aggregate: a newly opted-in crate with no
            # executing test contributes 0 while a healthy sibling keeps the
            # total non-zero, so exactly the crate someone just added is the one
            # that can be silently inert. Not per target -- a crate legitimately
            # has only one kind, and a zero there is expected.
            if [ "$crate_total" -eq 0 ]; then
              echo "::error::$name opted in but executed no wasm32 assertions -- inert" >&2
              exit 1
            fi
            total=$((total + crate_total))
          done
          # A `for` over a glob matching nothing never runs its body and exits 0,
          # which looks exactly like success.
          if [ "$crates" -eq 0 ]; then
            echo "::error::no crate declares a wasm32 wasm-bindgen-test dev-dependency" >&2
            exit 1
          fi
          echo "$total wasm32 assertions executed across $crates crate(s)"

  # ─────────────────────────────────────────────────────────────────────────
  # cross-typecheck — flui-platform's per-OS backends, LINTED from Linux.
  # `cargo clippy` does not link, so the Win32, AppKit, and Android backends
  # compile from any host. Before this job they were only ever built by
  # whoever happened to develop on that OS: the Windows backend had a hard
  # `missing_docs` error (`pub mod win32`) and both backends had missing
  # Debug impls that the Linux and wasm gates structurally could not see.
  # Android joined this matrix later, for the identical reason: it had never
  # been built, type-checked, or linted anywhere in CI, so that whole module
  # could have stopped compiling with no gate to notice. On arrival it had 24
  # violations under `-D warnings`, one of them a derived `Debug` that printed
  # the user's clipboard.
  #
  # clippy, not plain check, on purpose: `cfg(windows)`/`cfg(macos)`/
  # `cfg(target_os = "android")` code is invisible to every other lint gate,
  # and running only `cargo check` here let ~80 deny-level lint violations
  # accumulate unseen on Windows/macOS (found the day this switched) and a
  # further ~24 on Android (found when it joined this matrix). It still does
  # NOT link and runs NO tests — Android's own build needs the NDK's
  # cross-linker, which this runner does not have; `cargo clippy` never
  # reaches that step. The `test` job's dedicated flui-platform step only
  # runs the Linux-buildable backends (headless + winit-on-X11); the
  # Windows, macOS, and Android backends this job lints are never linked or
  # executed by anything, so this remains the only gate touching that
  # source at all. Green here means "compiles clean under the workspace
  # lints", nothing more. Triples are the shipped desktop ones — MSVC (what
  # `gpu-test` uses) and aarch64 macOS — plus aarch64 Android, with
  # `--all-targets` so per-OS test targets compile too.
  # ─────────────────────────────────────────────────────────────────────────
  # cli-macos — the CLI's own suite on macOS. `test` runs it on Linux, which
  # never executes the macOS arms: simulator selection through `simctl`,
  # Xcode probes in `flui doctor`, browser versions read from `Info.plist`,
  # the `.app` staging of `flui build macos`, and the termios hot-keys of
  # `flui run`. The CLI has no FLUI crate in its normal graph, so this is a
  # small build (~75 crates) and the only per-OS coverage it gets before a
  # release; the shim test drives `cargo-flui` as well.
  # ─────────────────────────────────────────────────────────────────────────
  cli-macos:
    name: cli-macos
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable (+ iOS target for the runner lint below)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-ios

      # Same pitfall as `cross-typecheck`: the action adds the target to the
      # `stable` toolchain, but the committed rust-toolchain.toml makes the
      # pinned patch release the active one, and that install needs the
      # target too (E0463 "can't find crate for `std`" otherwise).
      - name: Add the iOS target to the pinned toolchain
        run: rustup target add aarch64-apple-ios

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Per tokio: binary caching breaks on macOS.
          cache-bin: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9

      - name: cargo nextest run -p flui-cli
        run: cargo nextest run -p flui-cli --locked

      # The iOS RUNNER in flui-app (`app/runner/ios.rs`) is behind
      # `cfg(target_os = "ios")`; its Android twin is linted in
      # `cross-typecheck`, but this one needs a macOS host: `psm` (via
      # `stacker`, via flui-rendering) compiles its shim through `cc`, which
      # finds the Apple SDK with `xcrun`. The `flui` facade rides along
      # because it is what a consumer builds against on this target.
      # Library targets only: the tests are host-run elsewhere and
      # `--all-targets` would pull dev-dependencies that cannot build for
      # the mobile triple.
      - name: cargo clippy (ios runner)
        run: cargo clippy -p flui-app -p flui --locked --target aarch64-apple-ios -- -D warnings

  cross-typecheck:
    name: cross-typecheck
    needs: [checks, plan]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable + windows/macos/android targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,aarch64-linux-android,aarch64-apple-ios

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `dtolnay/rust-toolchain@stable` installs the target for the toolchain
      # named `stable`, but the committed `rust-toolchain.toml` makes `1.98.1`
      # the ACTIVE toolchain — a separate rustup install even at the same
      # version — so the target has to be added again against the pin. Without
      # this the build fails with E0463 "can't find crate for `core`".
      - name: Add cross targets to the pinned toolchain
        run: rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin aarch64-linux-android aarch64-apple-ios

      # `--features a11y` on every line: the UIA/NSAccessibility bridges are
      # feature-gated and this job is the ONLY gate that compiles them at all
      # (the a11y-off configuration is a strict subset — no cfg(not(a11y))
      # code exists — so checking with the feature supersedes checking
      # without; on Android the feature enables nothing target-gated).
      - name: cargo clippy (windows backend)
        run: cargo clippy -p flui-platform --locked --all-targets --features a11y --target x86_64-pc-windows-msvc -- -D warnings

      - name: cargo clippy (macos backend)
        run: cargo clippy -p flui-platform --locked --all-targets --features a11y --target aarch64-apple-darwin -- -D warnings

      - name: cargo clippy (android backend)
        run: cargo clippy -p flui-platform --locked --all-targets --features a11y --target aarch64-linux-android -- -D warnings

      # The native UIKit backend had no lint gate at all before this step.
      # `just ios-sim` (the `live-smoke`-adjacent job below) is the only
      # EXECUTING coverage; this line is the type-check half, matching how the
      # other three native backends are gated.
      - name: cargo clippy (ios backend)
        run: cargo clippy -p flui-platform --locked --all-targets --features a11y --target aarch64-apple-ios -- -D warnings

      # The mobile RUNNERS live in flui-app (`app/runner/{android,ios}.rs`),
      # behind `cfg(target_os = ...)`, so the four platform lines above never
      # compile them: until these two steps, a broken Android or iOS runner
      # was invisible to every gate (found the day they were added — an
      # unused import and a `map_or_else` finding on the Android runner, and
      # a facade re-export of an item flui-app gates out on iOS). The `flui`
      # facade rides along for that last class: it is what a consumer builds
      # against on these targets. Library targets only: the tests are
      # host-run by the `test` job, and `--all-targets` would pull
      # dev-dependencies this runner cannot build for the mobile triples.
      # The iOS half of this pair lives in the `cli-macos` job: `psm` (via
      # `stacker`, via flui-rendering) compiles its shim through `cc`, which
      # resolves the Apple SDK with `xcrun`, and this Linux runner has no
      # xcrun and no iOS SDK to point it at.

      # `stacker` (via flui-rendering) builds `psm`'s C shim through the `cc`
      # crate, which needs a C compiler for the target. The NDK is not on
      # this runner's path, and it is not needed for a compile-only lint:
      # the host `clang` cross-compiles that one file when told the target
      # triple. Nothing is linked.
      - name: cargo clippy (android runner)
        env:
          CC_aarch64_linux_android: clang
          CFLAGS_aarch64_linux_android: --target=aarch64-linux-android21
          AR_aarch64_linux_android: ar
        run: cargo clippy -p flui-app -p flui --locked --target aarch64-linux-android -- -D warnings

      # The CLI ships on Windows but the `test` matrix is Linux-only and no
      # Windows job exists, so a Windows-only compile break in `flui-cli`
      # was invisible (found the day this step was added: tokio's `signal`
      # feature does not expose `enable_io` on Windows). `--all-targets`
      # so the integration suite's Windows arms type-check too.
      - name: cargo clippy (cli, windows)
        run: cargo clippy -p flui-cli --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  # ci — aggregator over every job above (tokio pattern), designed so that a
  # required-status-checks rule would only need to name this ONE check
  # instead of enumerating the graph — no such rule is configured today (see
  # the header comment above). Adding or renaming a job never silently drops
  # a gate from THIS aggregator either way. `if: always()` so it still
  # runs when a dependency failed; miri is advisory (continue-on-error turns
  # its result into `success`).
  # ─────────────────────────────────────────────────────────────────────────
  ci:
    name: ci
    if: always()
    needs: [checks, plan, fast-lane, clippy, feature-matrix, wasm-check, cross-typecheck, cli-macos, test, test-features, live-smoke, gpu-test, bench-compile, doc, deny, doc-test, msrv, miri]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The aggregator reads its own workflow file so it can prove the
      # `needs` list above is complete. Sparse, credential-free checkout:
      # only this file is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      # Two rules:
      #
      # 1. COMPLETENESS -- every job in this workflow except `ci` itself (and
      #    `notify-main-red`, which runs after it) must appear in `needs`.
      #    Without this, a job ADDED without editing the list above ran,
      #    passed or failed, and gated nothing.
      #
      # 2. EXACTLY THE EXPECTED SKIPS -- which jobs may skip is decided by
      #    `plan` alone, and the aggregator recomputes it from `plan`'s
      #    outputs instead of trusting each job's `if:`:
      #      heavy lane (main, merge queue, nightly, dispatch, `full-ci`):
      #        only fast-lane skips; every heavy job must succeed
      #      ordinary PR, mode packages/full: every heavy job skips,
      #        fast-lane and deny must succeed
      #      ordinary PR, mode none (repo tooling only): heavy + fast-lane skip
      #      ordinary PR, mode docs: heavy + fast-lane + deny skip
      #    Any other skip (a drifted `if:`, a cancellation) or a job that ran
      #    where it should have skipped fails the aggregator.
      # A real YAML parse, not a regex over `key:` lines: a job declared as
      # `"quoted-key":` or `key: # comment` is valid YAML that a line regex
      # misses. The runner image ships Python but not PyYAML.
      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check "pyyaml>=6,<7"

      - name: Verify every job is gated and exactly the expected jobs skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY_JOBS: >-
            clippy feature-matrix wasm-check cross-typecheck cli-macos test
            test-features live-smoke gpu-test bench-compile doc doc-test msrv
            miri
          HEAVY: ${{ needs.plan.outputs.heavy }}
          MODE: ${{ needs.plan.outputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, yaml
          needs = json.loads(os.environ["NEEDS"])
          heavy_jobs = set(os.environ["HEAVY_JOBS"].split())
          heavy = os.environ["HEAVY"] == "true"
          mode = os.environ["MODE"]
          event = os.environ["EVENT"]
          with open(".github/workflows/ci.yml", encoding="utf-8") as f:
              workflow = yaml.safe_load(f)
          declared = set(workflow["jobs"]) - {"ci", "notify-main-red"}
          for job, data in sorted(needs.items()):
              print(f"{job}: {data['result']}")
          missing = sorted(declared - set(needs))
          if missing:
              print(f"::error::jobs declared in ci.yml but absent from the ci aggregator's needs: {missing}")
          if needs.get("plan", {}).get("result") != "success":
              expected = None  # without a plan there is no expectation to check against
          elif heavy:
              expected = {"fast-lane"}
          elif mode in ("packages", "full"):
              expected = set(heavy_jobs)
          elif mode == "none":
              expected = heavy_jobs | {"fast-lane"}
          elif mode == "docs":
              expected = heavy_jobs | {"fast-lane", "deny"}
          else:
              expected = None
          skipped = {j for j, d in needs.items() if d["result"] == "skipped"}
          bad = {j: d["result"] for j, d in needs.items() if d["result"] not in ("success", "skipped")}
          if expected is None:
              bad["_plan"] = f"no usable plan (result={needs.get('plan', {}).get('result')}, mode={mode!r})"
          else:
              for j in sorted(skipped - expected):
                  bad[j] = "skipped, but this plan (heavy=%s mode=%s) requires it to run" % (heavy, mode)
              for j in sorted(expected - skipped):
                  if j in needs:
                      bad[j] = "ran (%s), but this plan skips it: its if: disagrees with plan" % needs[j]["result"]
          if bad:
              print(f"::error::jobs not as planned: {bad}")
          if missing or bad:
              sys.exit(1)
          print(f"ok: {len(declared)} jobs, all gated, {len(skipped)} skipped as planned (event={event} heavy={heavy} mode={mode})")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # notify-main-red -- a red `ci` on main or on the nightly run opens (or
  # comments on) one tracking issue, so a broken main is never silent. It
  # runs only there: on a PR the red check on the PR is the notification.
  # The team rule for a red main (AGENTS.md): fix forward within the hour or
  # revert.
  # ─────────────────────────────────────────────────────────────────────────
  notify-main-red:
    name: notify-main-red
    needs: [ci]
    if: always() && needs.ci.result == 'failure' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the "main is red" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="CI is red on main"
          body="\`ci\` failed on \`${SHA:0:10}\` ($EVENT): $RUN_URL
          Rule (AGENTS.md): fix forward within the hour or revert. Close this issue once main is green again."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "commented on #$number"
          else
            gh issue create --title "$title" --body "$body"
          fi
