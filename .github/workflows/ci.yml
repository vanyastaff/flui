name: CI

# Runtime CI runs on Linux. A pull request that compiles anything runs the
# Linux gate (clippy, test); main, the merge queue and a manual run add every
# other check: the nested, feature-gated and compile-fail suites, rustdoc,
# wasm32, the platform typechecks, the sizes, perf, miri (ADR-0375). This
# workflow compiles no other target for a pull request: what a change breaks there
# shows on main, and nightly-platforms.yml runs each host's suites.
# There is no scheduled run: advisories.yml checks the RustSec database daily,
# and nothing else changes without a commit.
# No label enables native application Windows/macOS or GPU jobs. Platform typechecking
# uses Linux cross tools and macOS SDK legs; OS runtime checks are local commands.
# Native host-tool tests live separately in xtask-native.yml.
# test-nested and test-trybuild run independently, each with its own cache.
# All jobs except the notification are gated by the `ci` job.

on:
  pull_request:
    # Labels do not trigger or widen CI.
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: no job in this workflow writes to the repo,
# issues, or PRs. Artifact upload uses the separate Actions runtime token and
# is unaffected. zizmor (run in `checks`) audits this file.
permissions:
  contents: read

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # rust-cache hashes every toolchain rustup has installed into its key, not
  # only the one that compiles. A fresh rustup home, outside the checkout,
  # holds only the rust-toolchain.toml pin that .github/actions/rust-toolchain
  # installs, so a new stable release or runner image no longer turns every
  # Rust cache cold while the workspace still builds with the same compiler.
  RUSTUP_HOME: ${{ github.workspace }}/../flui-rustup
  # Strict workspace-wide; matches the local `cargo xtask ci`.
  #
  # `build.warnings` (Cargo 1.97+) rather than `RUSTFLAGS: -D warnings`:
  # RUSTFLAGS is part of the rustc fingerprint, so every job that needs a
  # different value (miri, below) gets a disjoint target/ cache and has to
  # blank the flag wholesale — losing every other check with it. The Cargo
  # config knob is applied after compilation and does not enter the
  # fingerprint (measured: toggling it recompiles nothing).
  CARGO_BUILD_WARNINGS: deny
  RUSTDOCFLAGS: -D warnings
  # CI builds are clean every run; no incremental artifacts to preserve.
  CARGO_INCREMENTAL: 0
  # Debuginfo trimmed to line tables in EVERY job, for two reasons that
  # must hold together. Disk: DWARF is the largest part of a debug target
  # (see the `test` job). Cache sharing: rust-cache hashes CARGO_* env
  # into its key, and the artifacts themselves carry the profile, so
  # every job's cache key and contents depend on it. Set per job it had
  # drifted (clippy had none); set once here, it
  # cannot, and a change to it is visibly a change to every key at once.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # checks — fast source gate: `cargo xtask checks --strict` (fmt, typos,
  # Taplo, markdown links, toolchain, unmounted test files, ADR numbers,
  # changelog
  # fragments, the generated files against their sources),
  # xtask's own tests (which include each self-test), and the workflow
  # linters. It builds only
  # xtask, never the workspace, so a malformed PR fails before any workspace
  # build starts. It has no `if:`: a docs-only PR, which skips every compile
  # job, still runs it, and the link check is what such a PR most needs.
  # Ubuntu only; clippy lives in its own parallel job.
  # ─────────────────────────────────────────────────────────────────────────
  checks:
    name: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Single source of truth for the cache key below and the download URL
      # in "Install actionlint" — a literal duplicated in both let the cache
      # key silently outlive a version bump made only in the other spot.
      ACTIONLINT_VERSION: 1.7.12
      # The same for lychee, plus the SHA-256 of that version's
      # x86_64-unknown-linux-gnu tarball. 0.24.2 is also lychee-action
      # v2.9.0's default, which docs.yml runs over the rendered book: bump the
      # two together. `cargo test -p xtask` pins this line to the version
      # `cargo xtask doctor` tells a contributor to install.
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + rustfmt
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Install CI tools (typos, taplo, zizmor)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # Pin versions — unpinned tools surface unrelated breakage on
          # release day. Bump deliberately.
          #
          # actionlint is NOT here: install-action has no recipe for it and
          # falls back to cargo-binstall, which cannot resolve a Go tool that
          # is not on crates.io ("actionlint is not found", exit 76). It is
          # fetched from its own release below.
          tool: typos-cli@1.50,taplo-cli@0.10,zizmor@1.30.1

      # actionlint is a Go release binary, not a crates.io package: it has no
      # taiki-e/install-action recipe (falls back to cargo-binstall, which
      # cannot resolve it — "actionlint is not found", exit 76) and no
      # cargo-install source to swap for a prebuilt fetch. What IS avoidable
      # is re-downloading and re-extracting the same binary on every run —
      # cached by version, so only the first run (or a version bump) pays for
      # the curl + tar. Saved in "Save actionlint", on main only.
      - name: Restore actionlint
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint ~/.local/bin/actionlint
          rm -f actionlint actionlint.tar.gz

      # lychee (the link check in `cargo xtask checks`) comes the same way:
      # install-action has no manifest for it, and its cargo-binstall fallback
      # would fetch a binary that no checksum covers. The release tarball is
      # checked against LYCHEE_SHA256 instead, and cached by version like
      # actionlint.
      - name: Restore lychee
        id: lychee-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/lychee
          key: lychee-${{ runner.os }}-${{ env.LYCHEE_VERSION }}

      - name: Install lychee
        if: steps.lychee-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          install -m 0755 lychee ~/.local/bin/lychee
          rm -f lychee lychee.tar.gz

      - name: Put actionlint and lychee on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Exact match on the first line (`actionlint --version` prints the bare
      # version, e.g. "1.7.12", then build metadata on following lines), not
      # just "did --version print something": a cache hit serving a binary
      # from a previous ACTIONLINT_VERSION (key mismatch notwithstanding)
      # should fail loudly here instead of silently linting with the wrong
      # actionlint.
      - name: Verify actionlint
        run: actionlint --version | head -1 | grep -qx "${ACTIONLINT_VERSION}"

      - name: Verify lychee
        run: lychee --version | grep -qx "lychee ${LYCHEE_VERSION}"

      # Saved on main only, so a pull request cannot seed the cache main
      # restores, and only once the binary passed its version check above.
      - name: Save actionlint
        if: github.ref == 'refs/heads/main' && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}

      - name: Save lychee
        if: github.ref == 'refs/heads/main' && steps.lychee-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/lychee
          key: ${{ steps.lychee-cache.outputs.cache-primary-key }}

      - name: Rust cache (xtask)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `--strict`: a missing typos, taplo or lychee is a failure here, not a skip.
      - name: cargo xtask checks
        run: cargo xtask checks --strict

      - name: cargo test -p xtask
        run: cargo test -p xtask --locked

      - name: actionlint (workflow semantics)
        run: actionlint

      - name: zizmor (workflow security audit)
        run: zizmor .

  # ─────────────────────────────────────────────────────────────────────────
  # plan — what this run has to build: one `lane` output.
  #   push, merge_group, workflow_dispatch   full
  #   pull_request                           docs when every changed file is
  #                                          documentation, otherwise wide
  # Documentation is a root `*.md` or licence text, anything under docs/ or
  # changelog.d/, a crate's ARCHITECTURE.md (or docs/ARCHITECTURE.md), CHANGELOG.md
  # or licence text (LICENSE, LICENSE-APACHE, LICENSE-MIT, NOTICE),
  # and the issue templates and CODEOWNERS. docs/gaps.md and
  # docs/platform-parity.md are not: flui-native's tests read them. Neither is
  # book/: the facade's unit tests check its chapters (src/book.rs; its doctests
  # run on main, in doc-test). Renames count
  # both paths, so a file moved into docs/ still runs the gate. A file another
  # crate's code includes with include_str! later is not caught here, and
  # main's run finds what the skipped jobs would have (ADR-0376).
  #
  # Skipping is done with job-level `if:` on `plan`'s output, NOT with
  # `on.pull_request.paths-ignore`: that would make GitHub never create the
  # skipped jobs' check runs, leaving the required `ci` check waiting
  # forever. Job-level `if:` keeps every job in the run as `skipped`.
  # ─────────────────────────────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base of a pull request has to be in the clone.
          fetch-depth: 0

      - id: scope
        name: Decide the lane
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          lane=full
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the PR merged into its base branch's current
            # tip, its first parent: the diff against it is the PR's own.
            # `base.sha` stays where the base was at the PR's last push.
            base=$BASE_SHA
            if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
              base=$(git rev-parse HEAD^1)
            fi
            # Listed first, so a failure stops the step instead of leaving
            # the most permissive lane.
            files=$(git diff --no-renames --name-only "$base" HEAD)
            lane=docs
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                docs/gaps.md | docs/platform-parity.md) lane=wide ;;
                docs/* | changelog.d/* | .github/ISSUE_TEMPLATE/* | .github/CODEOWNERS) ;;
                crates/*/* | packages/*/*)
                  # a crate's own architecture notes, changelog and licence texts
                  case "${file#*/*/}" in
                    ARCHITECTURE.md | docs/ARCHITECTURE.md | CHANGELOG.md) ;;
                    LICENSE | LICENSE-APACHE | LICENSE-MIT | NOTICE) ;;
                    *) lane=wide ;;
                  esac
                  ;;
                */*) lane=wide ;;
                *.md | LICENSE | LICENSE-APACHE | LICENSE-MIT | NOTICE) ;;
                *) lane=wide ;;
              esac
            done <<< "$files"
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT lane=$lane"

  # clippy — workspace lint with -D warnings. Split out of `checks` so it runs
  # in PARALLEL with test/doc instead of gating them: clippy
  # compiles the whole workspace (minutes); the rest of `checks` is seconds.
  # The pull-request gate (clippy, test) waits for `plan` alone,
  # beside `checks`: a pull request `checks` fails is pushed again, which
  # cancels the run, and `ci` is red for it either way.
  # ─────────────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    needs: [plan]
    if: contains(fromJSON('["wide","full"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + clippy
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy


      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Lint the feature-gated GPU suites too: `testing` gates a body of code
      # (the readback suites, the deterministic-replay tests, the bench
      # scaffolding) that the workspace pass never compiles, so a break there
      # requires local GPU readbacks. CI clippy only type-checks that suite.
      - name: cargo clippy flui-engine --features testing
        run: cargo clippy -p flui-engine --all-targets --locked --features testing -- -D warnings

      # Each flui-native backend alone: the workspace pass above builds it with
      # `desktop` (Wayland and X11 together), which hides a `cfg` gap in any
      # one backend. Main only, like the rest of `feature-matrix`: it adds
      # 5 minutes to a pull request's slowest jobs, and a gap shows as a red
      # main. Locally: `cargo xtask native-features`.
      - name: cargo xtask native-features
        if: needs.plan.outputs.lane == 'full'
        run: cargo xtask native-features

  # ─────────────────────────────────────────────────────────────────────────
  # test — the workspace suite on Linux (`cargo xtask test --fast`: nextest
  # over TEST_SCOPE, then flui-native under Xvfb, then its Wayland tests
  # against a headless Weston), then, on main, the build that
  # links the examples and benches with the same packages and features, so it compiles
  # nothing twice (a target whose `required-features` the test scope leaves
  # off is compiled per feature by `feature-matrix`, not linked). A pull
  # request leaves that link to main.
  # The nested-cargo group runs on main in `test-nested`.
  # No job of this workflow touches the AppKit/Win32/Android backends on a pull request:
  # `cross-typecheck` type-checks them on main.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: test
    needs: [plan]
    if: contains(fromJSON('["wide","full"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    # A cold cache and a busy runner pool can push this job past 40 min with
    # every test passed; a warm run takes about 16 min. 60 min leaves room
    # without hiding a hang, which nextest's per-test timeouts
    # (.config/nextest.toml) catch first.
    timeout-minutes: 60
    # Workspace crates unoptimized; dependencies keep the opt-level 3 of
    # `[profile.dev.package."*"]`. rust-cache never caches workspace crates,
    # so this job compiles them on every run: on 4 cores the test scope's
    # workspace crates took 534 s at the dev profile's opt-level 1 and 117 s
    # at 0. The tests themselves run slower at 0, and the slowest one sets
    # the floor (.config/nextest.toml). Locally the dev profile stays at
    # opt-level 1, which incremental builds amortize.
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The full-workspace build, examples and benches included, outgrew the
      # ubuntu-26.04 runner's free disk (a link failed with "No space left on
      # device"). The same reclaim as weekly.yml, started here and left
      # running beside the build: the disk peak is the job's last build,
      # minutes after the reclaim ends. A pull request skips that build and
      # the reclaim with it: its suite ends with most of the runner's disk
      # free, and the deletion competes with its build for the disk.
      # "Disk usage after build" prints what the reclaim freed.
      - name: Free disk space (ubuntu), in the background
        if: needs.plan.outputs.lane == 'full'
        run: |
          df -h /
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost; \
            docker image prune --all --force' > "$RUNNER_TEMP/free-disk.log" 2>&1 &

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          # The nested jobs keep their own entries: this one is saved from
          # `test --fast`, which never builds their nested target dirs.
          shared-key: workspace-tests-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9

      # flui-native's suite runs under Xvfb (see `cargo xtask test`):
      # `FLUI_HEADLESS=1` routes `current_platform()` to the headless mock, and
      # the native X11 host's suites that open windows on the run's X server
      # need a real (if virtual) one. Unconditional install: a preinstalled
      # xvfb-run must not short-circuit the library install — both Linux hosts
      # dlopen libxkbcommon and libxkbcommon-x11, which the hosted runners do
      # not ship. The native X11 host's window conformance (`tests/x11_window.rs`)
      # starts an Xvfb and an openbox of its own, and its host loads libxcb at
      # run time.
      # The AT-SPI suite (`tests/linux_atspi.rs`) starts a session bus and the
      # accessibility bus of its own (`dbus-daemon`, at-spi2-core), and
      # `FLUI_REQUIRE_ATSPI` turns a missing one into a failure.
      #
      # Mesa's lavapipe (Vulkan) and llvmpipe (GL, through EGL) are the GPU the
      # readback suites render on: without an adapter they skip, and the
      # gpu-test steps below run them on each backend with a missing adapter
      # as a failure (ADR-0244 §1).
      #
      # Weston, sway and libwayland are the Wayland host's, started in the next step.
      - name: Ensure Xvfb, openbox, libxcb + xkbcommon, at-spi2-core, lavapipe, llvmpipe and Weston are available (flui-native X11, Wayland and AT-SPI tests, GPU readbacks)
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            xvfb openbox libxcb1 libxkbcommon-x11-0 libxkbcommon0 dbus at-spi2-core
            mesa-vulkan-drivers libegl-mesa0 libgl1-mesa-dri weston sway libwayland-client0

      - name: Require the AT-SPI bus
        run: echo "FLUI_REQUIRE_ATSPI=1" >> "$GITHUB_ENV"

      # The native Wayland host's tests (`cargo xtask test` runs them apart
      # from the Xvfb suite) need a compositor: a headless Weston on a socket
      # of its own. `FLUI_REQUIRE_WAYLAND` turns a missing compositor into a
      # failure instead of a skip, as `FLUI_REQUIRE_GPU` does for the GPU
      # suites. Weston loads libwayland, which the host dlopens too. The
      # primary selection suite starts a sway of its own on an Xvfb: Weston
      # has no zwp_primary_selection.
      - name: Start a headless Weston (flui-native Wayland tests)
        run: |
          runtime_dir="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          XDG_RUNTIME_DIR="$runtime_dir" nohup weston --backend=headless --socket=flui-weston \
            --idle-time=0 --log="$RUNNER_TEMP/weston.log" > /dev/null 2>&1 &
          for _ in $(seq 1 100); do
            [ -S "$runtime_dir/flui-weston" ] && break
            sleep 0.1
          done
          [ -S "$runtime_dir/flui-weston" ] || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "WAYLAND_DISPLAY=flui-weston"
            echo "FLUI_REQUIRE_WAYLAND=1"
          } >> "$GITHUB_ENV"

      # The local command, so CI and a local run cannot drift. nextest gives
      # each test its own process, so a test that mutates a genuinely
      # process-global resource needs a lock scoped to its module
      # (AGENTS.md). Native runtime suites remain local commands.
      - name: cargo xtask test --fast
        run: cargo xtask test --fast

      # Weston 13 has no xdg-decoration, wp_fractional_scale_v1, xdg-foreign
      # or xdg-activation, and headless it has no seat: the cases of the
      # Wayland suite about them (`wayland_window::optional`) said above what
      # they skipped. A headless sway offers all of them, so the task runs
      # those cases again against it and requires them
      # (`FLUI_REQUIRE_COMPOSITOR`): none passes on a skip. Its outputs are
      # scaled 1.5, which makes a surface's preferred scale a fraction, and
      # the window titled "a floating frame" floats, where sway honours a
      # request for the client's own frame. The backend and the renderer are
      # named, and the job's `WAYLAND_DISPLAY` is kept from it: that is the
      # Weston's, which wlroots would nest under.
      - name: cargo xtask wayland-optional (the cases Weston cannot run, under a headless sway)
        run: |
          runtime_dir="$RUNNER_TEMP/sway-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          printf '%s\n' 'output * scale 1.5' \
            'for_window [title="a floating frame"] floating enable' > "$runtime_dir/sway.conf"
          env -u WAYLAND_DISPLAY -u DISPLAY XDG_RUNTIME_DIR="$runtime_dir" \
            WLR_BACKENDS=headless WLR_RENDERER=pixman \
            nohup sway --config "$runtime_dir/sway.conf" > "$RUNNER_TEMP/sway.log" 2>&1 &
          socket=
          for _ in $(seq 1 100); do
            socket="$(find "$runtime_dir" -maxdepth 1 -type s -name 'wayland-*' -printf '%f\n' | head -n 1)"
            [ -n "$socket" ] && break
            sleep 0.1
          done
          [ -n "$socket" ] || { cat "$RUNNER_TEMP/sway.log"; exit 1; }
          XDG_RUNTIME_DIR="$runtime_dir" WAYLAND_DISPLAY="$socket" cargo xtask wayland-optional

      # The GPU readback suites once per backend the Linux renderer can pick:
      # Vulkan first, then the GLES fallback it takes without one. The
      # fallback runs on main only: pull requests take the Vulkan pass.
      - name: cargo xtask gpu-test --backend vulkan
        run: cargo xtask gpu-test --backend vulkan

      - name: cargo xtask gpu-test --backend gl
        if: needs.plan.outputs.lane == 'full'
        run: cargo xtask gpu-test --backend gl

      - name: cargo xtask build-all-targets (links the examples and benches)
        if: needs.plan.outputs.lane == 'full'
        run: cargo xtask build-all-targets

      # On main the disk peak is the build above, which a pull request skips;
      # the reclaim beside the builds is what keeps it above 0 (it failed
      # without one on 2026-10-30). Its log is printed here, after a failed
      # step too: a reclaim that failed shows nowhere else.
      - name: Disk usage after build
        if: ${{ !cancelled() }}
        run: |
          cat "$RUNNER_TEMP/free-disk.log" 2> /dev/null || true
          df -h /

      # insta writes `<name>.snap.new` next to a mismatched snapshot, under CI
      # too because .config/insta.yaml sets `update: new` (its default writes
      # nothing when `CI` is set). Upload them so a CI-only snapshot failure
      # is debuggable without a local repro (same pattern as egui/xilem
      # snapshot artifacts).
      - name: Upload insta snapshot candidates on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: insta-snap-new
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Nested cargo tests run in two parallel jobs: generated projects and
  # facade consumers in test-nested, compile-fail suites in test-trybuild.
  # Each keeps its own cache entry, saved on main: the nested builds live in
  # their own target dirs (target/tests/trybuild, target/cli-template-check,
  # target/facade-consumer-check), which `test`'s entry never contains, and
  # rust-cache keeps their dependency artifacts. Restoring `test`'s entry
  # instead rebuilt every nested dependency on each run.
  test-nested:
    name: test-nested
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The nested group's build outgrew the runner's free disk as well (rustc
      # failed with "No space left on device"): the same reclaim as `test`,
      # before the cache restores.
      - name: Free disk space (ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          # v2: the job builds only the packages that hold the nested-cargo
          # group (`cargo xtask test --nested --nested-group native`), so the
          # v1 entry (~4 GB of every test binary's dependencies) is not reused.
          shared-key: workspace-nested-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9

      - name: cargo xtask test --nested --nested-group native
        run: cargo xtask test --nested --nested-group native

  # The compile-fail suites, on main. Locally a changed crate's
  # `cargo nextest run` still runs its suite, and
  # `cargo xtask test --nested --nested-group trybuild` runs them all.
  #
  # Three shards on three runners (`TrybuildShard` in tools/xtask/src/tasks.rs
  # lists each one's suites): every trybuild project builds into the one
  # directory target/tests/trybuild under Cargo's lock on it, so suites
  # started together on one runner wait for each other, and one job ran them
  # one after another past its 40 minutes. Each shard builds only its own test
  # targets, with the whole run's packages and features, and keeps its own
  # cache entry, saved on main.
  test-trybuild:
    name: test-trybuild (${{ matrix.shard }})
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [facade, core, view]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exact diagnostic snapshots include standard-library declarations.
      - name: Install pinned Rust + diagnostic sources
        uses: ./.github/actions/rust-toolchain
        with:
          components: rust-src

      # One entry per shard: a shard's nested builds hold only its suites'
      # dependencies. A pull request restores the newest entry main saved
      # under the shard's prefix, whatever its Cargo.lock.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          shared-key: workspace-trybuild-v2-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9

      - name: cargo xtask test --nested --nested-group trybuild --trybuild-shard
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo xtask test --nested --nested-group trybuild --trybuild-shard "$SHARD"

      - name: Upload trybuild output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trybuild-wip-${{ matrix.shard }}
          path: "**/wip/*.stderr"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # test-features — the feature-gated test runs, split out of `test` so they
  # stop extending the critical path. They are the runs that compile crates
  # under NON-default features, so cargo rebuilds those crates and their
  # dependents regardless of what `test` already built; sharing a runner with
  # it bought nothing but serialisation (measured 2026-09-03: 203 s of the
  # `test` job's 17 min). Same coverage, now concurrent.
  # ─────────────────────────────────────────────────────────────────────────
  test-features:
    name: test-features
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9

      # flui-assets and flui-widgets both default to `default = []`, so the
      # workspace-default run above never compiles their `images`/`network`
      # decode-and-cache paths or the Image widget's own file-decode test —
      # exactly the gap that once let the flui-assets↔Image
      # verification tests go CI-dead. Explicit feature-gated run, same
      # precedent as `cargo clippy -p flui-engine --features
      # testing` above.
      #
      # `asset-images` extends the same gap to the
      # flui-assets↔Image ASYNC bridge (`AssetImage`/`NetworkImage`,
      # `image::decode_cache`): those tests only compile under their own
      # feature, so they need their own explicit run too, or they are as
      # CI-dead as the sync path was before this block existed.
      #
      # One run with every one of those features on: they are additive, so
      # each test the separate runs selected still compiles, and one feature
      # resolution builds the shared crates once instead of once per run.
      - name: cargo nextest run (flui-assets full, flui-widgets images)
        run: >
          cargo nextest run
          -p flui-assets -p flui-widgets
          --locked --no-fail-fast
          --features flui-assets/full,flui-widgets/images,flui-widgets/asset-images

      # The one configuration the run above does not cover: `images` without
      # `asset-images`, which a consumer decoding only `Image::memory` and
      # `Image::file` builds (no `flui-assets`, no `AssetImage`). Test names
      # are not the configuration they run under, so this run stays.
      - name: cargo nextest run (flui-widgets images only, Image tests)
        run: cargo nextest run -p flui-widgets --locked --no-fail-fast --features images --test image

      # Painting's optional serde admission rules need execution: neither the
      # default test scope nor the image feature runs enable this feature.
      - name: cargo nextest run (flui-painting serde value contract)
        run: cargo nextest run -p flui-painting --locked --no-fail-fast --features serde --test painting_it -E 'test(=value_contract)'

      # The facade's non-default catalogs need no run here:
      # the `test` job's TEST_SCOPE turns `flui/material,flui/cupertino` on.

      # A snapshot assertion in these suites fails with a `.snap.new` beside
      # it; upload them as `test` does, or the diff is only a log tail.
      - name: Upload insta snapshot candidates on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: insta-snap-new-features
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # doc — RUSTDOCFLAGS=-D warnings enforces zero new doc warnings. Gated on
  # `checks`. Ubuntu only — docs are platform-agnostic.
  #
  # The workspace has no rustdoc warning (intra-doc-link qualifications,
  # HTML-tag escaping of bare generics, private-leak rewrites, bare-URL
  # autolink conversions), and a new one turns main red: the job runs on
  # main only (ADR-0370).
  # ─────────────────────────────────────────────────────────────────────────
  doc:
    name: doc
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The contract's semver report builds its baseline from the base commit.
          fetch-depth: 0

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain


      - name: cargo doc --no-deps (every `testing` feature on)
        run: cargo xtask doc-strict

      # The contract rides the release train until cargo-semver-checks shows it
      # stable for two trains in a row (ADR-0153). A report, not a gate: before
      # the first publication every change to the contract is a break.
      - name: Install cargo-semver-checks
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-semver-checks@0.51

      - name: cargo semver-checks flui-platform (report)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        continue-on-error: true
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo semver-checks check-release -p flui-platform --baseline-rev "$BASELINE"

  # ─────────────────────────────────────────────────────────────────────────
  # perf-gates — what a frame costs, by counts that do not depend on the
  # runner: `cargo xtask perf --check` compares every perf scenario's frame
  # counters and allocations with crates/flui-widgets/perf/baseline/, and
  # `--instructions --check` runs each `perf_scaling_` scenario on its small
  # and large tree under callgrind and fails when the large one costs more
  # than 5% over the small. The scenarios' own assertions (equal allocations
  # on both sizes) run on every PR with flui-widgets' suite; the baseline
  # comparison and callgrind run in `full`.
  # ─────────────────────────────────────────────────────────────────────────
  perf-gates:
    name: perf-gates
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          shared-key: workspace-perf-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9

      - name: Install valgrind
        uses: ./.github/actions/apt-install
        with:
          packages: valgrind

      - name: cargo xtask perf --check
        run: cargo xtask perf --check

      - name: cargo xtask perf --instructions --check
        run: cargo xtask perf --instructions --check

  # ─────────────────────────────────────────────────────────────────────────
  # size — what an application costs before it does anything: the release
  # builds of projects `flui create --local` generates, with the profile the
  # templates write (a counter on Linux and its wasm32 module, and the host of
  # a `--hot-reload` project), each within 2% of perf/size.toml, and the
  # default graph's package counts (`cargo xtask perf --size --check`). Three
  # cold release builds, so main runs them, on every push, where one push may
  # grow a binary by 0.5% over the commit before it.
  # ─────────────────────────────────────────────────────────────────────────
  size:
    name: size
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          shared-key: workspace-size-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A push to main compares its sizes with the commit before it
      # (`github.event.before`) as well as with the baseline: the baseline's 2%
      # is cumulative, so merges that each add a little pass until a later one
      # crosses it. Each push's measurement is a cache entry keyed by its
      # commit and saved from main only, failing pushes included; a re-run
      # reads the same parent, so it fails again until the growth is answered.
      # A parent whose run was cancelled or skipped has no entry, and the push
      # is compared with the baseline alone. One file serves both options:
      # xtask reads the parent's measurement before it records this one.
      - name: Restore the previous commit's sizes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/size-step/measurement.toml
          key: size-step-${{ github.event.before }}

      - name: cargo xtask perf --size --check
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: cargo xtask perf --size --check

      - name: cargo xtask perf --size --check against the previous commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          cargo xtask perf --size --check
          --previous target/size-step/measurement.toml
          --parent "$PARENT"
          --record target/size-step/measurement.toml
        env:
          PARENT: ${{ github.event.before }}

      # Only a file this commit wrote is saved under its key: a run that failed
      # before it measured still holds the parent's file.
      - name: Check this commit recorded its sizes
        id: recorded
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if grep -qx "commit = \"$GITHUB_SHA\"" target/size-step/measurement.toml 2>/dev/null; then
            echo "measured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save this commit's sizes
        if: always() && steps.recorded.outputs.measured == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/size-step/measurement.toml
          key: size-step-${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────
  # deps — `cargo xtask deps`: cargo-deny over every workspace member (bans,
  # licenses and sources against deny.toml, advisories against RustSec).
  # Nothing compiles but xtask. A dependency no code uses, a test-only one
  # declared as a normal one and a [workspace.dependencies] entry nothing
  # inherits are cargo's `unused_dependencies` lint, which CARGO_BUILD_WARNINGS
  # above makes fatal in every job that builds. Two steps, split by what
  # decides the result:
  #   policy      the commit, and the std-replacement list cargo-deny fetches
  #               for [bans.std-replacements]: blocking on every run. A new
  #               entry in that list can fail a commit that passed, but only
  #               for a crate a member declares directly, and the fix is
  #               always ours to make (the std API, or an `ignore` with its
  #               reason in deny.toml), so it blocks with the rest.
  #   advisories  the RustSec database as of the run, so a commit that passed
  #               yesterday can fail today: blocking on main, the merge queue
  #               and a manual run; reported without failing on a pull
  #               request, so main is where it fails (ADR-0376). Between
  #               commits, advisories.yml runs this step daily against main
  #               and keeps the "RustSec advisory on main" issue.
  # ─────────────────────────────────────────────────────────────────────────
  deps:
    name: deps
    needs: [checks, plan]
    if: needs.plan.outputs.lane != 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20

      - name: Rust cache (xtask)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: xtask
          save-if: false

      - name: cargo xtask deps --only policy
        run: cargo xtask deps --strict --only policy

      - name: cargo xtask deps --only advisories
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo xtask deps --strict --only advisories

      # The packages of the facade's default graph on each target, against
      # perf/size.toml (`cargo tree` only, nothing builds). A pull request that
      # adds a package to an application's default graph fails here until
      # `cargo xtask perf --size --bless` records it; the binary sizes of the
      # same baseline are the `size` job's.
      - name: cargo xtask perf --size --graph --check
        run: cargo xtask perf --size --graph --check

  # ─────────────────────────────────────────────────────────────────────────
  # doc-test — run every rustdoc example as a test. nextest does NOT execute
  # doctests (cargo-nextest#16), so the `test` job above never covers them;
  # without this job the 700+ doc code fences in the workspace are unverified
  # prose. Unlike the `test` job, flui-native is NOT excluded here: its
  # doctests need neither `--all-features` nor a display server (verified
  # locally with and without DISPLAY set — identical 12 passed/0 failed
  # either way), so there is no green-by-construction reason to carve it out.
  # ─────────────────────────────────────────────────────────────────────────
  doc-test:
    name: doc-test
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain


      - name: cargo test --doc
        # `flui/testing` compiles the book's chapters that run through Tester, and
        # the catalogs compile the theme chapter and the facade's Material-gated half
        # (src/book.rs).
        run: cargo test --workspace --locked --doc --features flui/testing,flui/material,flui/cupertino

  # ─────────────────────────────────────────────────────────────────────────
  # miri checks selected ownership and containment contracts without a GPU:
  # flui-foundation and flui-log whole, the rendering storage arena,
  # rendering owner failure/publishing families, public GlobalKey migration,
  # surface-before-target destruction and cancellation of renderer construction.
  # It runs on main. The same scopes are used by `cargo xtask miri`; they are
  # not a full workspace memory-safety audit.
  # ─────────────────────────────────────────────────────────────────────────
  miri:
    name: miri
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Relax the workflow-level warnings gate: nightly deprecates APIs and
      # adds lints ahead of stable, and those warnings would fail this job
      # spuriously. Lint enforcement is the stable jobs' business; this job
      # exists solely to catch undefined behavior. (The weekly nightly canary
      # is where an upcoming deprecation is meant to surface, with its date.)
      # Unlike the old `RUSTFLAGS: ""` override this keeps the target/ cache
      # shared with every other job.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: miri


      # `+nightly` is required: the committed rust-toolchain.toml pin overrides
      # the job's installed default toolchain, and the pinned stable has no
      # miri component (first run failed exactly there).
      #
      # The ground every crate above stands on: flui-foundation's id newtypes,
      # notifiers and claim slot, flui-log's layer downcast, and the
      # render-node arena of flui-rendering. Every unit test of the first two
      # (their integration suites spawn processes, which Miri cannot), the
      # `storage::` module of the third.
      - name: cargo miri test (flui-foundation)
        run: cargo +nightly miri test -p flui-foundation --lib --locked
      - name: cargo miri test (flui-log)
        run: cargo +nightly miri test -p flui-log --lib --locked
      - name: cargo miri test (rendering storage)
        run: cargo +nightly miri test -p flui-rendering --lib --locked "storage::"

      - name: cargo miri test (pipeline::owner)
        run: cargo +nightly miri test -p flui-rendering --lib --locked pipeline::owner

      # The layout walk's lease (ADR-0252): double enter, non-child edge and
      # header reads beside a live node, then the cycle, panic and poison paths
      # through the real walk.
      - name: cargo miri test (layout lease)
        run: cargo +nightly miri test -p flui-rendering --lib --locked lease_
      - name: cargo miri test (layout_failure_matrix)
        run: cargo +nightly miri test -p flui-rendering --features testing --test rendering_it --locked layout_failure_matrix

      # Public GlobalKey behavior (ADR-0050): state migration, duplicate-parent
      # grafting and frame-boundary diagnostics run a real `ElementTree` through
      # `BuildOwner::finalize_tree`. No `unsafe` of its own — the point is the
      # slab-backed element arena and the reborrow chains it drives underneath.
      - name: cargo miri test (global_key_contract_matrix)
        run: cargo +nightly miri test -p flui-view --features testing --test view_it --locked global_key_contract_matrix

      # The surface-ownership drop order (ADR-0063, issue #1043): a generic
      # `SurfaceLease` fixture observes the surface dropping before its target.
      # The lib target links wgpu, but this test never enters GPU code.
      - name: cargo miri test (surface_lease)
        run: cargo +nightly miri test -p flui-engine --lib --locked surface_lease

      # The cancellation oracle for `Renderer::new` (issue #1149): drives the
      # production `probe_then_build` seam with a builder that suspends
      # forever, then releases the external owner and observes target destruction
      # after dropping the future. GPU-free by construction — the
      # synthetic builder is what keeps wgpu out of the path, since a first
      # poll of the production builder enters `wgpu::Instance::new`.
      - name: cargo miri test (cancelling_renderer_new)
        run: cargo +nightly miri test -p flui-engine --lib --locked cancelling_renderer_new

  # ─────────────────────────────────────────────────────────────────────────
  # test-without-agent — flui-app's agent tests in a build without debug
  # assertions, the only build that leaves the driver agent out
  # (`cfg(driver_agent)` is a debug build or the `driver` feature): such a
  # build reads no agent launch value, from the environment or an Android
  # intent (ADR-0288 §7). No other job compiles those tests. The dev profile
  # with debug assertions off is that build, without the release profile's
  # link time. It runs on main.
  # ─────────────────────────────────────────────────────────────────────────
  test-without-agent:
    name: test-without-agent
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: false
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: false
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Rust cache (test-without-agent)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: test-without-agent
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test without debug assertions (flui-app, the agent's launch)
        run: cargo test --locked -p flui-app --lib "agent::"

  # ─────────────────────────────────────────────────────────────────────────
  # feature-matrix — xilem-style per-feature clippy via cargo-hack. The plain
  # `clippy` job compiles the whole workspace under feature unification with
  # default features, which can mask a crate that fails to declare a feature
  # dependency (a sibling crate enables it transitively). cargo-hack checks
  # each package separately, once per feature, so per-crate feature wiring is
  # actually exercised. Two passes per package: libs/bins as downstream users
  # compile them, then tests/benches/examples. Under resolver v2 a
  # dev-dependency's features unify only while dev targets build, so a single
  # `--all-targets` pass would hide a library that compiles only because a
  # dev-dependency enabled a feature for it.
  #
  # The per-feature passes run as cargo-hack `--partition k/5` shards: its
  # command list splits into contiguous blocks, so the shards cover every
  # package and feature exactly once with no hand-kept package lists. That
  # holds only while every shard runs the same cargo-hack, hence the exact
  # version pin. The commands live in `cargo xtask feature-matrix`, so a local
  # run and CI cannot drift apart. Five, not three or four: the facade and
  # the engine sit next to each other in the command list, and with fewer
  # contiguous blocks one shard takes both (three shards took 11, 22 and
  # 18 min on main); with five the slowest should take about 15 min, beside
  # `test`.
  # ─────────────────────────────────────────────────────────────────────────
  feature-matrix:
    name: feature-matrix (${{ matrix.slice }})
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: ["1/5", "2/5", "3/5", "4/5", "5/5", combinations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + clippy
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy


      - name: Install cargo-hack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack@0.6.45

      - name: cargo xtask feature-matrix --slice ${{ matrix.slice }}
        run: cargo xtask feature-matrix --slice "$SLICE"
        env:
          SLICE: ${{ matrix.slice }}

  # ─────────────────────────────────────────────────────────────────────────
  # wasm-check — the web platform claim, machine-checked, in three xtask
  # steps (tools/xtask/src/tasks/web.rs holds the commands and why):
  #   wasm-check — check + lib/bin clippy of every package that builds for
  #                wasm32 (a package opts out with `[package.metadata.flui]
  #                wasm = false`, a reason beside it), plus `flui-hot-reload`
  #                with every feature. The clippy pass is the only lint over
  #                flui-native's wasm32-only web backend.
  #   wasm-link  — really links the two web demos and checks their import
  #                surface against tools/xtask/fixtures/wasm/import-allowlist.txt:
  #                on wasm32 an undefined symbol becomes an import, not a link
  #                error.
  #   wasm-test  — EXECUTES the wasm32 tests on node. Everything before it only
  #                compiles; swapping `web_time::Instant` for std's stays green
  #                there and panics at run time (issue #985).
  # ─────────────────────────────────────────────────────────────────────────
  wasm-check:
    name: wasm-check
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + wasm32 target
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo xtask wasm-check
        run: cargo xtask wasm-check

      - name: cargo xtask wasm-link
        run: cargo xtask wasm-link

      # The test runner must equal the LOCKED wasm-bindgen exactly or it
      # refuses to start. Installing the prebuilt binary here saves
      # `cargo xtask wasm-test` from compiling it.
      - name: Resolve the locked wasm-bindgen version
        id: wasm_bindgen_version
        run: |
          set -euo pipefail
          version="$(cargo xtask locked-version wasm-bindgen)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "locked wasm-bindgen: $version"

      - name: Install wasm-bindgen-cli (matching the lockfile)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm_bindgen_version.outputs.version }}

      - name: cargo xtask wasm-test
        run: cargo xtask wasm-test

      # The web backend's DOM side needs a browser, which node is not, so
      # `wasm-test` leaves `flui-native` alone and its `web_browser` target
      # runs here in headless Chrome. It reuses this job's wasm dependency
      # build, and the suite itself runs in about a second.
      - name: Install Chrome + matching ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          install-chromedriver: true

      - name: cargo test -p flui-native --test web_browser (headless Chrome)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          set -euo pipefail
          capabilities="$RUNNER_TEMP/webdriver.json"
          jq -n --arg binary "$CHROME_PATH" '{"goog:chromeOptions": {binary: $binary,
            args: ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]}}' \
            > "$capabilities"
          WASM_BINDGEN_TEST_WEBDRIVER_JSON="$capabilities" \
            cargo test -p flui-native --target wasm32-unknown-unknown --test web_browser --locked

      # The system services' web providers (`flui-system`'s `web::tests`, in
      # its lib test: they drive the providers' private seams) on the same
      # headless Chrome: the pickers, the launcher and the badge, with no
      # picker or window opened.
      - name: cargo test -p flui-system --lib (headless Chrome)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          set -euo pipefail
          capabilities="$RUNNER_TEMP/webdriver.json"
          jq -n --arg binary "$CHROME_PATH" '{"goog:chromeOptions": {binary: $binary,
            args: ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]}}' \
            > "$capabilities"
          WASM_BINDGEN_TEST_WEBDRIVER_JSON="$capabilities" \
            cargo test -p flui-system --target wasm32-unknown-unknown --lib --features testing --locked

  # ─────────────────────────────────────────────────────────────────────────
  # cross-typecheck — source-derived native package selection, including
  # each selected package's tests, examples and benches. Clippy does not
  # execute native targets, but C build scripts still need target headers.
  # Linux uses MSVC cross tools and the bundled NDK. Both Apple targets use
  # genuine Xcode SDKs, including os/log.h for optional macOS logging.
  # Runtime and GPU validation remain local; a green leg proves compilation
  # under the enabled features, not native runtime behavior.
  # ─────────────────────────────────────────────────────────────────────────
  cross-typecheck:
    name: cross-typecheck (${{ matrix.target }})
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: ubuntu-26.04
          - target: aarch64-apple-darwin
            os: macos-26
          - target: aarch64-linux-android
            os: ubuntu-26.04
          - target: aarch64-apple-ios
            os: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + native target
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - name: Install native C cross tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: clang llvm
          commands: clang clang-cl llvm-ar llvm-lib

      # The driver build the checks job saves; restored before the NDK step,
      # whose CC_/AR_ variables would change the key. Without it each Linux
      # leg built the driver from scratch (1.5-3 min).
      - name: Rust cache (xtask)
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: xtask
          save-if: false

      - name: Configure bundled Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          tools="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$tools/aarch64-linux-android21-clang"
          test -x "$tools/llvm-ar"
          echo "CC_aarch64_linux_android=$tools/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$tools/llvm-ar" >> "$GITHUB_ENV"

      # stacker's Windows C shim includes windows.h. cargo-xwin provisions
      # the MSVC SDK/CRT for clang-cl while retaining the shipped MSVC triple.
      - name: Install cargo-xwin
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-xwin@0.23.1

      # cargo-xwin downloads the MSVC CRT and Windows SDK on first use, 7-13
      # minutes from Microsoft's servers, then marks the directory DONE. The
      # splatted result is 1.1 GB on disk, about 260 MB compressed. The key
      # names the cargo-xwin release, which fixes the default MSVC version;
      # the cache is saved from main only, after a complete download.
      - name: Restore MSVC CRT and Windows SDK
        id: xwin-cache
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-xwin
          key: cargo-xwin-0.23.1-${{ runner.os }}

      - name: Lint source-derived native targets
        run: cargo xtask cross-typecheck --target "$NATIVE_TARGET"
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          XWIN_CACHE_DIR: ${{ runner.temp }}/cargo-xwin

      - name: Save MSVC CRT and Windows SDK
        if: matrix.target == 'x86_64-pc-windows-msvc' && github.ref == 'refs/heads/main' && steps.xwin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-xwin
          key: ${{ steps.xwin-cache.outputs.cache-primary-key }}

      - name: Lint optional native features
        run: cargo xtask cross-typecheck --target "$NATIVE_TARGET" --all-features
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          XWIN_CACHE_DIR: ${{ runner.temp }}/cargo-xwin

  # ─────────────────────────────────────────────────────────────────────────
  # ci — the one required check: red when a job it needs failed or was
  # cancelled, when a job the lane runs skipped, or when there is no lane.
  #   docs   checks, plan
  #   wide   checks, plan, deps, clippy, test
  #   full   every job it needs; a run on main, the merge queue or a manual
  #          run takes no other lane
  # A job added to the workflow and left out of `needs` gates nothing: add it.
  ci:
    name: ci
    if: always()
    needs: [checks, plan, clippy, feature-matrix, wasm-check, cross-typecheck, test, test-nested, test-trybuild, test-features, doc, perf-gates, size, deps, doc-test, miri, test-without-agent]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job it needs passed, and each the lane runs ran
        env:
          NEEDS: ${{ toJSON(needs) }}
          LANE: ${{ needs.plan.outputs.lane }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          result() { jq -r --arg job "$1" '.[$job].result' <<< "$NEEDS"; }
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(" ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then echo "::error::failed or cancelled: $failed"; exit 1; fi
          if [ "$EVENT" != pull_request ] && [ "$LANE" != full ]; then
            echo "::error::a $EVENT run takes the full lane, but plan chose '$LANE'"; exit 1
          fi
          case "$LANE" in
            docs) required="checks plan" ;;
            wide) required="checks plan deps clippy test" ;;
            full) required=$(jq -r 'keys | join(" ")' <<< "$NEEDS") ;;
            *) echo "::error::no lane: plan $(result plan)"; exit 1 ;;
          esac
          for job in $required; do
            if [ "$(result "$job")" != success ]; then
              echo "::error::lane $LANE runs $job, which is $(result "$job")"; exit 1
            fi
          done

  # ─────────────────────────────────────────────────────────────────────────
  # notify-main-red -- a red `ci` on main opens (or comments on) one tracking
  # issue, so a broken main is never silent, and the next green run on main
  # closes it again. It runs only on main: on a PR the red check on the PR
  # is the notification. The team rule for a red main (AGENTS.md): fix
  # forward within the hour or revert.
  # ─────────────────────────────────────────────────────────────────────────
  notify-main-red:
    name: notify-main-red
    needs: [ci]
    if: ${{ !cancelled() && github.event_name == 'push' && contains(fromJSON('["success","failure"]'), needs.ci.result) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Only the local action is needed from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/tracking-issue

      - name: Open, update or close the "main is red" issue
        uses: ./.github/actions/tracking-issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          title: CI is red on main
          outcome: ${{ needs.ci.result }}
          body: |
            `ci` failed on ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Rule (AGENTS.md): fix forward within the hour or revert. The next green run on main closes this issue.
