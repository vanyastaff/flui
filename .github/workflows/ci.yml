name: CI

# Linux-only CI. Ordinary PRs take docs/tooling/wide lanes; main and merge
# queue add Linux full checks. Nightly/manual runs use the same Linux jobs.
# No label enables native Windows/macOS or GPU jobs. Platform typechecking
# remains on Linux; OS runtime checks are local commands.
# test-nested and test-trybuild run independently, restoring the test cache.
# All jobs except the notification are gated by the ci aggregator.

on:
  pull_request:
    # Labels do not trigger or widen CI.
  push:
    branches: [main]
  merge_group:
  # Nightly: the extended lane against main even on a quiet day (new
  # toolchain, new advisories, a flaky test that only shows up sometimes).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: no job in this workflow writes to the repo,
# issues, or PRs. Artifact upload uses the separate Actions runtime token and
# is unaffected. zizmor (run in `checks`) audits this file.
permissions:
  contents: read

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # rust-cache hashes every toolchain rustup has installed into its key, not
  # only the one that compiles. A fresh rustup home, outside the checkout,
  # holds only the rust-toolchain.toml pin that .github/actions/rust-toolchain
  # installs, so a new stable release or runner image no longer turns every
  # Rust cache cold while the workspace still builds with the same compiler.
  RUSTUP_HOME: ${{ github.workspace }}/../flui-rustup
  # Strict workspace-wide; matches the local `cargo xtask ci`.
  #
  # `build.warnings` (Cargo 1.97+) rather than `RUSTFLAGS: -D warnings`:
  # RUSTFLAGS is part of the rustc fingerprint, so every job that needs a
  # different value (miri, below) gets a disjoint target/ cache and has to
  # blank the flag wholesale — losing every other check with it. The Cargo
  # config knob is applied after compilation and does not enter the
  # fingerprint (measured: toggling it recompiles nothing).
  CARGO_BUILD_WARNINGS: deny
  RUSTDOCFLAGS: -D warnings
  # CI builds are clean every run; no incremental artifacts to preserve.
  CARGO_INCREMENTAL: 0
  # Debuginfo trimmed to line tables in EVERY job, for two reasons that
  # must hold together. Disk: DWARF is the largest part of a debug target
  # (see the `test` job). Cache sharing: rust-cache hashes CARGO_* env
  # into its key, and the artifacts themselves carry the profile, so
  # every job's cache key and contents depend on it. Set per job it had
  # drifted (clippy had none, live-smoke half of it); set once here, it
  # cannot, and a change to it is visibly a change to every key at once.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # checks — fast source gate: `cargo xtask checks --strict` (fmt, typos,
  # Taplo, markdown links, workspace layers and manifests, toolchain, WGSL
  # uniformity, the docs-only allowlist, font assets),
  # xtask's own tests (which include the lane classification and
  # the `ci` aggregator's skip rule), and the workflow linters. It builds only
  # xtask, never the workspace, so a malformed PR fails before any workspace
  # build starts. It has no `if:`: a docs-only PR, which skips every compile
  # job, still runs it, and the link check is what such a PR most needs.
  # Ubuntu only; clippy lives in its own parallel job.
  # ─────────────────────────────────────────────────────────────────────────
  checks:
    name: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Single source of truth for the cache key below and the download URL
      # in "Install actionlint" — a literal duplicated in both let the cache
      # key silently outlive a version bump made only in the other spot.
      ACTIONLINT_VERSION: 1.7.12
      # The same for lychee, plus the SHA-256 of that version's
      # x86_64-unknown-linux-gnu tarball. 0.24.2 is also lychee-action
      # v2.9.0's default, which docs.yml runs over the rendered book: bump the
      # two together. `cargo test -p xtask` pins this line to the version
      # `cargo xtask doctor` tells a contributor to install.
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + rustfmt
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Install CI tools (typos, taplo, zizmor)
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          # Pin versions — unpinned tools surface unrelated breakage on
          # release day. Bump deliberately.
          #
          # actionlint is NOT here: install-action has no recipe for it and
          # falls back to cargo-binstall, which cannot resolve a Go tool that
          # is not on crates.io ("actionlint is not found", exit 76). It is
          # fetched from its own release below.
          tool: typos-cli@1.50,taplo-cli@0.10,zizmor@1.30.1

      # actionlint is a Go release binary, not a crates.io package: it has no
      # taiki-e/install-action recipe (falls back to cargo-binstall, which
      # cannot resolve it — "actionlint is not found", exit 76) and no
      # cargo-install source to swap for a prebuilt fetch. What IS avoidable
      # is re-downloading and re-extracting the same binary on every run —
      # cached by version, so only the first run (or a version bump) pays for
      # the curl + tar. Saved in "Save actionlint", on main only.
      - name: Restore actionlint
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint ~/.local/bin/actionlint
          rm -f actionlint actionlint.tar.gz

      # lychee (the link check in `cargo xtask checks`) comes the same way:
      # install-action has no manifest for it, and its cargo-binstall fallback
      # would fetch a binary that no checksum covers. The release tarball is
      # checked against LYCHEE_SHA256 instead, and cached by version like
      # actionlint.
      - name: Restore lychee
        id: lychee-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/lychee
          key: lychee-${{ runner.os }}-${{ env.LYCHEE_VERSION }}

      - name: Install lychee
        if: steps.lychee-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          install -m 0755 lychee ~/.local/bin/lychee
          rm -f lychee lychee.tar.gz

      - name: Put actionlint and lychee on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Exact match on the first line (`actionlint --version` prints the bare
      # version, e.g. "1.7.12", then build metadata on following lines), not
      # just "did --version print something": a cache hit serving a binary
      # from a previous ACTIONLINT_VERSION (key mismatch notwithstanding)
      # should fail loudly here instead of silently linting with the wrong
      # actionlint.
      - name: Verify actionlint
        run: actionlint --version | head -1 | grep -qx "${ACTIONLINT_VERSION}"

      - name: Verify lychee
        run: lychee --version | grep -qx "lychee ${LYCHEE_VERSION}"

      # Saved on main only, so a pull request cannot seed the cache main
      # restores, and only once the binary passed its version check above.
      - name: Save actionlint
        if: github.ref == 'refs/heads/main' && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}

      - name: Save lychee
        if: github.ref == 'refs/heads/main' && steps.lychee-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/lychee
          key: ${{ steps.lychee-cache.outputs.cache-primary-key }}

      - name: Rust cache (xtask)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `--strict`: a missing typos, taplo or lychee is a failure here, not a skip.
      - name: cargo xtask checks
        run: cargo xtask checks --strict

      - name: cargo test -p xtask
        run: cargo test -p xtask --locked

      - name: actionlint (workflow semantics)
        run: actionlint

      - name: zizmor (workflow security audit)
        run: zizmor .

  # ─────────────────────────────────────────────────────────────────────────
  # plan — what this run has to build: one `lane` output, decided by
  # `cargo xtask affected --event <event>` (the shell
  # only reads the label, live from the API):
  #   schedule, workflow_dispatch      extended
  #   push, merge_group                full
  #   pull_request, otherwise, by the change (the classification
  #   `cargo xtask check-changed` uses):
  #     docs      only documentation changed
  #     tooling   only repo tooling, or a standalone crate (own [workspace],
  #               no member depends on it): `checks` and `standalone` cover it
  #     wide      anything that compiles: the whole workspace. `mode` says
  #               whether the change was a set of packages (`packages`) or a
  #               workspace-wide input (`full`: Cargo.lock, root Cargo.toml,
  #               .cargo/, the toolchain, a workflow, the lane code)
  # Local check-changed also uses iOS scope; CI stays on Linux. The
  # docs-only allowlist and the triggers live in
  # tools/xtask/src/change_scope/, once; `cargo xtask checks` proves no
  # compiled include_str!() target falls inside it.
  #
  # Skipping is done with job-level `if:` on `plan`'s outputs, NOT with
  # `on.pull_request.paths-ignore`: that would make GitHub never create the
  # skipped jobs' check runs, leaving any required-status-check rule waiting
  # forever. Job-level `if:` keeps every job in the run as `skipped`, and the
  # `ci` aggregator checks that exactly the planned jobs skipped.
  # ─────────────────────────────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
      mode: ${{ steps.scope.outputs.mode }}
      heavy_required: ${{ steps.scope.outputs.heavy_required }}
      standalone: ${{ steps.scope.outputs.standalone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base with the PR's base branch has to be in the clone.
          fetch-depth: 0

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Rust cache (xtask)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: xtask
          save-if: false

      - id: scope
        name: Decide the lane and the affected packages
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT" --format github)
          if [ "$EVENT" = pull_request ]; then
            args+=(--base "$BASE_SHA")
          fi
          cargo xtask affected "${args[@]}" > scope.txt
          cat scope.txt >> "$GITHUB_OUTPUT"
          echo "event=$EVENT $(grep '^lane=' scope.txt)"
          cat scope.txt

  # ─────────────────────────────────────────────────────────────────────────
  # standalone — a crate under the repository with its own [workspace] that
  # no member depends on (`plan`'s `standalone` output; the repository has
  # none today): nothing in the workspace compiles it, so a change to
  # it runs the tooling lane and this job checks that it still builds
  # against its own lockfile. Warnings are not denied: these crates are
  # outside the workspace lints. Runs only when such a crate changed, never
  # on main, so it saves no cache.
  # ─────────────────────────────────────────────────────────────────────────
  standalone:
    name: standalone
    needs: [checks, plan]
    if: needs.plan.outputs.lane == 'tooling' && needs.plan.outputs.standalone != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_WARNINGS: warn
      STANDALONE: ${{ needs.plan.outputs.standalone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: cargo check (each changed standalone crate)
        run: |
          set -euo pipefail
          set -f
          # shellcheck disable=SC2086
          for d in $STANDALONE; do
            echo "::group::$d"
            cargo check --locked --all-targets --manifest-path "$d/Cargo.toml"
            echo "::endgroup::"
          done

  # ─────────────────────────────────────────────────────────────────────────
  # clippy — workspace lint with -D warnings. Split out of `checks` so it runs
  # in PARALLEL with test/doc/bench-compile instead of gating them: clippy
  # compiles the whole workspace (minutes); the rest of `checks` is seconds.
  # Gated on `checks` so a malformed PR fails cheap before this build starts.
  # ─────────────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + clippy
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy


      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Lint the feature-gated GPU suites too: `testing` gates a body of code
      # (the readback suites, the deterministic-replay tests, the bench
      # scaffolding) that the workspace pass never compiles, so a break there
      # requires local GPU readbacks. CI clippy only type-checks that suite.
      - name: cargo clippy flui-engine --features testing
        run: cargo clippy -p flui-engine --all-targets --locked --features testing -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  # test — the workspace suite on Linux (`cargo xtask test --fast`: nextest
  # over TEST_SCOPE, then flui-platform under Xvfb), then the build that
  # links the examples and benches with the same features, so it compiles
  # nothing twice (a target whose `required-features` the test scope leaves
  # off is compiled per feature by `feature-matrix`, not linked). The nested-cargo group runs beside it in `test-nested`.
  # Windows and macOS run the suite in `test-windows` and `macos-ci`.
  # `cross-typecheck` is the only job touching the AppKit/Win32/Android
  # backends on a pull request, and it only type-checks them.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: test
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          # `test-nested` restores this entry: the same TEST_SCOPE build.
          shared-key: workspace-tests-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9

      # flui-platform's suite runs under Xvfb (see `cargo xtask test`):
      # `--all-features` compiles its winit backend, `FLUI_HEADLESS=1` routes
      # `current_platform()` to the headless mock, and the winit-internals
      # tests that construct `WinitPlatform::new()` need a real (if virtual)
      # X11 connection. Unconditional install: a preinstalled xvfb-run must
      # not short-circuit the library install — winit's keyboard layer
      # dlopens libxkbcommon-x11, which the hosted runners do not ship.
      - name: Ensure Xvfb + xkbcommon are available (flui-platform winit-backend X11 tests)
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 libxkbcommon0

      # The local command, so CI and a local run cannot drift. nextest gives
      # each test its own process, so a test that mutates a genuinely
      # process-global resource needs a lock scoped to its module
      # (AGENTS.md). Windows runs flui-platform in `platform-windows`.
      - name: cargo xtask test --fast
        run: cargo xtask test --fast

      - name: cargo xtask build-all-targets (links the examples and benches)
        run: cargo xtask build-all-targets

      # The disk peak is the build above; if this trends toward 0, reclaim
      # space before the build (measured 2026-09-03: ~72 GB free after it).
      - name: Disk usage after build
        run: df -h /

      # insta writes `<name>.snap.new` next to a mismatched snapshot, under CI
      # too because .config/insta.yaml sets `update: new` (its default writes
      # nothing when `CI` is set). Upload them so a CI-only snapshot failure
      # is debuggable without a local repro (same pattern as egui/xilem
      # snapshot artifacts).
      - name: Upload insta snapshot candidates on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-snap-new
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Nested cargo tests run in two parallel jobs: generated projects and
  # facade consumers in test-nested, compile-fail suites in test-trybuild.
  # Both restore the test build cache; neither writes nested build artifacts.
  test-nested:
    name: test-nested
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          # `test`'s entry: the same TEST_SCOPE build. Restore only, so the
          # nested-cargo builds add no cache entry of their own.
          shared-key: workspace-tests-v2
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9

      - name: cargo xtask test --nested --nested-group native
        run: cargo xtask test --nested --nested-group native

  test-trybuild:
    name: test-trybuild
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          # `test`'s entry: the same TEST_SCOPE build. Restore only, so the
          # nested-cargo builds add no cache entry of their own.
          shared-key: workspace-tests-v2
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9

      - name: cargo xtask test --nested --nested-group trybuild
        run: cargo xtask test --nested --nested-group trybuild

      - name: Upload trybuild output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trybuild-wip
          path: "**/wip/*.stderr"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # test-features — the feature-gated test runs, split out of `test` so they
  # stop extending the critical path. They are the runs that compile crates
  # under NON-default features, so cargo rebuilds those crates and their
  # dependents regardless of what `test` already built; sharing a runner with
  # it bought nothing but serialisation (measured 2026-09-03: 203 s of the
  # `test` job's 17 min). Same coverage, now concurrent.
  # ─────────────────────────────────────────────────────────────────────────
  test-features:
    name: test-features
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9

      # flui-assets and flui-widgets both default to `default = []`, so the
      # workspace-default run above never compiles their `images`/`network`
      # decode-and-cache paths or the Image widget's own file-decode test —
      # exactly the gap that once let the flui-assets↔Image
      # verification tests go CI-dead. Explicit feature-gated run, same
      # precedent as `cargo clippy -p flui-engine --features
      # testing` above.
      #
      # `asset-images`/`network-images` extend the same gap to the
      # flui-assets↔Image ASYNC bridge (`AssetImage`/`NetworkImage`,
      # `image::decode_cache`): those tests only compile under their own
      # feature, so they need their own explicit run too, or they are as
      # CI-dead as the sync path was before this block existed.
      #
      # One run with every one of those features on: they are additive, so
      # each test the separate runs selected still compiles, and one feature
      # resolution builds the shared crates once instead of once per run.
      - name: cargo nextest run (flui-assets full, flui-widgets images)
        run: >
          cargo nextest run
          -p flui-assets -p flui-widgets
          --locked --no-fail-fast
          --features flui-assets/full,flui-widgets/images,flui-widgets/asset-images,flui-widgets/network-images

      # The one configuration the run above does not cover: without
      # `asset-images`, `Image` is the `StatelessView` impl (image.rs, the
      # `cfg(not(feature = "asset-images"))` blocks) that a consumer enabling
      # `images` alone builds. Test names are not the configuration they run
      # under, so this run stays.
      - name: cargo nextest run (flui-widgets images only, Image tests)
        run: cargo nextest run -p flui-widgets --locked --no-fail-fast --features images --test image

      # The facade's non-default catalogs (`tests/cupertino_demo.rs`, the
      # smoke test's localizations assertions) need no run here: the `test`
      # job's TEST_SCOPE turns `flui/cupertino,flui/localizations` on.

      # ADR-0074 realm-scoped signals live behind the non-default `signals`
      # feature on flui-view/flui-testing/flui-widgets/flui-app; the workspace
      # run never compiles their tests. Same rule as the block above: a test
      # behind a non-default feature needs its own run.
      - name: cargo nextest run (realm-scoped signals feature)
        run: >
          cargo nextest run
          -p flui-view -p flui-testing -p flui-widgets -p flui-app
          --features flui-view/signals,flui-testing/signals,flui-widgets/signals,flui-app/signals
          --locked --no-fail-fast

      # A snapshot assertion in these suites fails with a `.snap.new` beside
      # it; upload them as `test` does, or the diff is only a log tail.
      - name: Upload insta snapshot candidates on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-snap-new-features
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # live-smoke — the real-window smoke suites, split out of `test` for the
  # same reason: they need only the demo example and the harness binary, not
  # the workspace's test targets, so they were serialising ~100 s behind a
  # build they do not use. Both variants stay in ONE job because the Wayland
  # run reuses the binaries the X11 run builds.
  # ─────────────────────────────────────────────────────────────────────────
  live-smoke:
    name: live-smoke
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}


      # xvfb for the virtual display; libxkbcommon-x11 because winit's X11
      # backend dlopens it at startup (`xkbcommon-dl` panics without it, so
      # the demo dies before a window exists — the first run of this split
      # job proved it). Same pair the `test` job installs for flui-platform.
      - name: Ensure Xvfb + xkbcommon are available
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 libxkbcommon0

      # The hosted runner has no GPU: mesa-vulkan-drivers provides the
      # lavapipe software Vulkan adapter the demo's wgpu init needs (without
      # it the app panics before a window ever exists). Weston is installed
      # explicitly so the Wayland harness's weston-absent SKIP path can never
      # silently fire here.
      - name: Install lavapipe and weston
        run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers weston

      # A REAL windowed demo binary driven by REAL X11 input (XTEST fake
      # pointer), asserting on captured pixels and the process's exit code:
      # the only place the band ABOVE synthetic event dispatch is executed at
      # all. The winit translation layer, the event-loop wake chain, and
      # window-close teardown each shipped broken while every synthetic
      # gesture test stayed green. `cargo xtask live-smoke` builds the demo
      # and the harness and runs it under Xvfb (tools/xtask/src/tasks.rs,
      # `live_smoke_plan`).
      - name: live-smoke (real window, real input, real teardown)
        run: cargo xtask live-smoke

      # Wayland variant of the live smoke: the ONLY executing coverage of
      # the Wayland close-path teardown ordering, which segfaulted post-quit
      # (a wgpu swapchain destroyed after its wl_surface — issue #713) while
      # the X11 close check above stayed green, because Xlib tolerates the
      # same out-of-order teardown that is a use-after-free on Wayland's
      # client-side proxies. Runs the demo under a headless weston
      # compositor; the app closes itself via the platform's harness
      # self-close hook (FLUI_SELF_CLOSE_AFTER_MS): five cycles on the
      # compositor route (the exact CloseRequested arm a compositor close
      # takes) and two on the programmatic PlatformWindow::close route
      # (FLUI_SELF_CLOSE_ROUTE=programmatic, issue #919); each must exit 0
      # AND log the route it took. Reuses the demo and harness binaries the
      # X11 step built (the same build commands, already fresh).
      - name: live-smoke-wayland (teardown ordering under headless weston)
        run: cargo xtask live-smoke --wayland

  bench-compile:
    name: bench-compile
    needs: [checks, plan]
    if: contains(fromJSON('["full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain


      - name: cargo bench --no-run
        run: cargo bench -p flui-rendering --no-run --locked

  # ─────────────────────────────────────────────────────────────────────────
  # doc — RUSTDOCFLAGS=-D warnings enforces zero new doc warnings. Gated on
  # `checks`. Ubuntu only — docs are platform-agnostic.
  #
  # Hard-gate as of the workspace rustdoc cleanup sweep (feat/rustdoc-cleanup):
  # all 108 pre-existing rustdoc errors across 11 crates were resolved
  # (intra-doc-link qualifications, HTML-tag escaping of bare generics,
  # private-leak rewrites, bare-URL autolink conversions). A regression
  # here MUST block merge — the cleanup is the bar to keep.
  # ─────────────────────────────────────────────────────────────────────────
  doc:
    name: doc
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain


      - name: cargo doc --no-deps (every `testing` feature on)
        run: cargo xtask doc-strict

  # ─────────────────────────────────────────────────────────────────────────
  # deps — `cargo xtask deps`: cargo-deny over every workspace member (bans,
  # licenses and sources against deny.toml, advisories against RustSec) and
  # cargo-shear (a dependency no code uses, a test-only one declared as a
  # normal one, a [workspace.dependencies] entry nothing inherits; only a
  # warning when the dependency is optional or a feature names it). Nothing
  # compiles but xtask. Two steps, split by what decides the result:
  #   policy      the commit, and the std-replacement list cargo-deny fetches
  #               for [bans.std-replacements]: blocking in every lane. A new
  #               entry in that list can fail a commit that passed, but only
  #               for a crate a member declares directly, and the fix is
  #               always ours to make (the std API, or an `ignore` with its
  #               reason in deny.toml), so it blocks with the rest.
  #   advisories  the RustSec database as of the run, so a commit that passed
  #               yesterday can fail today: blocking in the wide, full and
  #               extended lanes on main, nightly, the merge queue, and any PR
  #               whose change is workspace-wide or touches a heavy-job input
  #               (`mode` full, or `heavy_required`: Cargo.lock, deny.toml,
  #               see `plan`); on a PR that changes only packages
  #               or tooling a new advisory is reported without failing
  #               unrelated work, and the next run on main turns red for it.
  # ─────────────────────────────────────────────────────────────────────────
  deps:
    name: deps
    needs: [checks, plan]
    if: needs.plan.outputs.lane != 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Install cargo-deny and cargo-shear
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          # cargo-shear 1.13: the newest this install-action release has a
          # prebuilt binary for; a later pin falls back to compiling it.
          tool: cargo-deny@0.20,cargo-shear@1.13

      - name: Rust cache (xtask)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: xtask
          save-if: false

      - name: cargo xtask deps --only policy
        run: cargo xtask deps --strict --only policy

      - name: cargo xtask deps --only advisories
        continue-on-error: ${{ needs.plan.outputs.lane == 'tooling' || (needs.plan.outputs.lane == 'wide' && needs.plan.outputs.mode == 'packages' && needs.plan.outputs.heavy_required == 'false') }}
        run: cargo xtask deps --strict --only advisories

  # ─────────────────────────────────────────────────────────────────────────
  # doc-test — run every rustdoc example as a test. nextest does NOT execute
  # doctests (cargo-nextest#16), so the `test` job above never covers them;
  # without this job the 700+ doc code fences in the workspace are unverified
  # prose. Unlike the `test` job, flui-platform is NOT excluded here: its
  # doctests need neither `--all-features` nor a display server (verified
  # locally with and without DISPLAY set — identical 12 passed/0 failed
  # either way), so there is no green-by-construction reason to carve it out.
  # ─────────────────────────────────────────────────────────────────────────
  doc-test:
    name: doc-test
    needs: [checks, plan]
    if: contains(fromJSON('["full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain


      - name: cargo test --doc
        run: cargo test --workspace --locked --doc

  # ─────────────────────────────────────────────────────────────────────────
  # miri checks selected ownership and containment contracts without a GPU:
  # rendering owner failure/publishing families, public GlobalKey migration,
  # surface-before-target destruction and cancellation of renderer construction.
  # The same scopes are used by `cargo xtask miri`; they are not a full
  # workspace memory-safety audit.
  # ─────────────────────────────────────────────────────────────────────────
  miri:
    name: miri
    needs: [checks, plan]
    if: contains(fromJSON('["full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Relax the workflow-level warnings gate: nightly deprecates APIs and
      # adds lints ahead of stable, and those warnings would fail this job
      # spuriously. Lint enforcement is the stable jobs' business; this job
      # exists solely to catch undefined behavior. (The weekly nightly canary
      # is where an upcoming deprecation is meant to surface, with its date.)
      # Unlike the old `RUSTFLAGS: ""` override this keeps the target/ cache
      # shared with every other job.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: miri


      # `+nightly` is required: the committed rust-toolchain.toml pin overrides
      # the job's installed default toolchain, and the pinned stable has no
      # miri component (first run failed exactly there).
      - name: cargo miri test (pipeline::owner)
        run: cargo +nightly miri test -p flui-rendering --lib --locked pipeline::owner

      # Public GlobalKey behavior (ADR-0050): state migration, duplicate-parent
      # grafting and frame-boundary diagnostics run a real `ElementTree` through
      # `BuildOwner::finalize_tree`. No `unsafe` of its own — the point is the
      # slab-backed element arena and the reborrow chains it drives underneath.
      - name: cargo miri test (global_key_contract_matrix)
        run: cargo +nightly miri test -p flui-view --test view_it --locked global_key_contract_matrix

      # The surface-ownership drop order (ADR-0063, issue #1043): a generic
      # `SurfaceLease` fixture observes the surface dropping before its target.
      # The lib target links wgpu, but this test never enters GPU code.
      - name: cargo miri test (surface_lease)
        run: cargo +nightly miri test -p flui-engine --lib --locked surface_lease

      # The cancellation oracle for `Renderer::new` (issue #1149): drives the
      # production `probe_then_build` seam with a builder that suspends
      # forever, then releases the external owner and observes target destruction
      # after dropping the future. GPU-free by construction — the
      # synthetic builder is what keeps wgpu out of the path, since a first
      # poll of the production builder enters `wgpu::Instance::new`.
      - name: cargo miri test (cancelling_renderer_new)
        run: cargo +nightly miri test -p flui-engine --lib --locked cancelling_renderer_new

  # ─────────────────────────────────────────────────────────────────────────
  # feature-matrix — xilem-style per-feature clippy via cargo-hack. The plain
  # `clippy` job compiles the whole workspace under feature unification with
  # default features, which can mask a crate that fails to declare a feature
  # dependency (a sibling crate enables it transitively). cargo-hack checks
  # each package separately, once per feature, so per-crate feature wiring is
  # actually exercised. Two passes per package: libs/bins as downstream users
  # compile them, then tests/benches/examples. Under resolver v2 a
  # dev-dependency's features unify only while dev targets build, so a single
  # `--all-targets` pass would hide a library that compiles only because a
  # dev-dependency enabled a feature for it.
  #
  # The per-feature passes run as cargo-hack `--partition k/3` shards: its
  # command list splits into contiguous blocks, so the shards cover every
  # package and feature exactly once with no hand-kept package lists. That
  # holds only while every shard runs the same cargo-hack, hence the exact
  # version pin. The commands live in `cargo xtask feature-matrix`, so a local
  # run and CI cannot drift apart.
  # ─────────────────────────────────────────────────────────────────────────
  feature-matrix:
    name: feature-matrix (${{ matrix.slice }})
    needs: [checks, plan]
    if: contains(fromJSON('["full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: ["1/3", "2/3", "3/3", combinations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + clippy
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy


      - name: Install cargo-hack
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-hack@0.6.45

      - name: cargo xtask feature-matrix --slice ${{ matrix.slice }}
        run: cargo xtask feature-matrix --slice "$SLICE"
        env:
          SLICE: ${{ matrix.slice }}

  # ─────────────────────────────────────────────────────────────────────────
  # wasm-check — the web platform claim, machine-checked, in three xtask
  # steps (tools/xtask/src/tasks/web.rs holds the commands and why):
  #   wasm-check — check + lib/bin clippy of every package that builds for
  #                wasm32 (a package opts out with `[package.metadata.flui]
  #                wasm = false`, a reason beside it), plus the facade's
  #                hot-reload feature. The clippy pass is the only lint over
  #                flui-platform's wasm32-only web backend.
  #   wasm-link  — really links the two web demos and checks their import
  #                surface against tools/xtask/fixtures/wasm/import-allowlist.txt:
  #                on wasm32 an undefined symbol becomes an import, not a link
  #                error.
  #   wasm-test  — EXECUTES the wasm32 tests on node. Everything before it only
  #                compiles; swapping `web_time::Instant` for std's stays green
  #                there and panics at run time (issue #985).
  # ─────────────────────────────────────────────────────────────────────────
  wasm-check:
    name: wasm-check
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + wasm32 target
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo xtask wasm-check
        run: cargo xtask wasm-check

      - name: cargo xtask wasm-link
        run: cargo xtask wasm-link

      # The test runner must equal the LOCKED wasm-bindgen exactly or it
      # refuses to start. Installing the prebuilt binary here saves
      # `cargo xtask wasm-test` from compiling it.
      - name: Resolve the locked wasm-bindgen version
        id: wasm_bindgen_version
        run: |
          set -euo pipefail
          version="$(cargo xtask locked-version wasm-bindgen)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "locked wasm-bindgen: $version"

      - name: Install wasm-bindgen-cli (matching the lockfile)
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm_bindgen_version.outputs.version }}

      - name: cargo xtask wasm-test
        run: cargo xtask wasm-test

  # ─────────────────────────────────────────────────────────────────────────
  # cross-typecheck — flui-platform's per-OS backends, LINTED from Linux.
  # `cargo clippy` does not link, so the Win32, AppKit, and Android backends
  # compile from any host. Before this job they were only ever built by
  # whoever happened to develop on that OS: the Windows backend had a hard
  # `missing_docs` error (`pub mod win32`) and both backends had missing
  # Debug impls that the Linux and wasm gates structurally could not see.
  # Android joined this matrix later, for the identical reason: it had never
  # been built, type-checked, or linted anywhere in CI, so that whole module
  # could have stopped compiling with no gate to notice. On arrival it had 24
  # violations under `-D warnings`, one of them a derived `Debug` that printed
  # the user's clipboard.
  #
  # clippy, not plain check, on purpose: `cfg(windows)`/`cfg(macos)`/
  # `cfg(target_os = "android")` code is invisible to every other lint gate,
  # and running only `cargo check` here let ~80 deny-level lint violations
  # accumulate unseen on Windows/macOS (found the day this switched) and a
  # further ~24 on Android (found when it joined this matrix). It still does
  # NOT link and runs NO tests — Android's own build needs the NDK's
  # cross-linker, which this runner does not have; `cargo clippy` never
  # reaches that step. The `test` job's dedicated flui-platform step only
  # runs the Linux-buildable backends (headless + winit-on-X11); the
  # Windows, macOS, and Android backends this job lints are never linked or
  # executed by anything, so this remains the only gate touching that
  # source at all. Green here means "compiles clean under the workspace
  # lints", nothing more. Triples are the shipped desktop ones — MSVC (what
  # backend uses) and aarch64 macOS — plus aarch64 Android, with
  # `--all-targets` so per-OS test targets compile too.
  # ─────────────────────────────────────────────────────────────────────────
  cross-typecheck:
    name: cross-typecheck
    needs: [checks, plan]
    if: contains(fromJSON('["wide","full","extended"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust + windows/macos/android targets
        uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,aarch64-linux-android,aarch64-apple-ios

      # `--features a11y` on every line: the UIA/NSAccessibility bridges are
      # feature-gated and this job is the ONLY gate that compiles them at all
      # (the a11y-off configuration is a strict subset — no cfg(not(a11y))
      # code exists — so checking with the feature supersedes checking
      # without; on Android the feature enables nothing target-gated).
      - name: cargo clippy (windows backend)
        run: cargo clippy -p flui-platform --locked --all-targets --features a11y --target x86_64-pc-windows-msvc -- -D warnings

      - name: cargo clippy (macos backend)
        run: cargo clippy -p flui-platform --locked --all-targets --features a11y --target aarch64-apple-darwin -- -D warnings

      - name: cargo clippy (android backend)
        run: cargo clippy -p flui-platform --locked --all-targets --features a11y --target aarch64-linux-android -- -D warnings

      # flui-desktop-mcp's real backends (UI Automation, capture, input) sit
      # behind cfg(windows) / cfg(target_os = "macos"); on this Linux runner
      # every other gate compiles only its unsupported fallbacks.
      - name: cargo clippy (desktop-mcp, windows)
        run: cargo clippy -p flui-desktop-mcp --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: cargo clippy (desktop-mcp, macos)
        run: cargo clippy -p flui-desktop-mcp --locked --all-targets --target aarch64-apple-darwin -- -D warnings

      # The native UIKit backend had no lint gate at all before this step.
      # `cargo xtask device ios-sim` (run on a Mac) is the only
      # EXECUTING coverage; this line is the type-check half, matching how the
      # other three native backends are gated.
      - name: cargo clippy (ios backend)
        run: cargo clippy -p flui-platform --locked --all-targets --features a11y --target aarch64-apple-ios -- -D warnings

      # The mobile RUNNERS live in flui-app (`app/runner/{android,ios}.rs`),
      # behind `cfg(target_os = ...)`, so the four platform lines above never
      # compile them: until these two steps, a broken Android or iOS runner
      # was invisible to every gate (found the day they were added — an
      # unused import and a `map_or_else` finding on the Android runner, and
      # a facade re-export of an item flui-app gates out on iOS). The `flui`
      # facade rides along for that last class: it is what a consumer builds
      # against on these targets. Library targets only: the tests are
      # host-run by the `test` job, and `--all-targets` would pull
      # dev-dependencies this runner cannot build for the mobile triples.
      # iOS runner checks need xcrun and are performed locally on macOS.
      - name: cargo clippy (android runner)
        env:
          CC_aarch64_linux_android: clang
          CFLAGS_aarch64_linux_android: --target=aarch64-linux-android21
          AR_aarch64_linux_android: ar
        run: cargo clippy -p flui-app -p flui --locked --target aarch64-linux-android -- -D warnings

      # The CLI ships on Windows but the `test` matrix is Linux-only and no
      # Windows job exists, so a Windows-only compile break in `flui-cli`
      # was invisible (found the day this step was added: tokio's `signal`
      # feature does not expose `enable_io` on Windows). `--all-targets`
      # so the integration suite's Windows arms type-check too.
      - name: cargo clippy (cli, windows)
        run: cargo clippy -p flui-cli --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  # ci — require each planned Linux job and reject unexpected skips.
  ci:
    name: ci
    if: always()
    needs: [checks, plan, standalone, clippy, feature-matrix, wasm-check, cross-typecheck, test, test-nested, test-trybuild, test-features, live-smoke, bench-compile, doc, deps, doc-test, miri]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # The aggregator reads its own workflow file so it can prove the `needs`
      # list above is complete, and builds xtask to do it (cached, so a warm
      # run is seconds).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Rust cache (xtask)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: xtask
          save-if: false

      # Two rules (tools/xtask/src/change_scope/aggregator.rs):
      #
      # 1. COMPLETENESS -- every job in this workflow except `ci` itself (and
      #    `notify-main-red`, which runs after it) must appear in `needs`.
      #    Without this, a job ADDED without editing the list above ran,
      #    passed or failed, and gated nothing.
      #
      # 2. EXACTLY THE EXPECTED SKIPS -- which jobs run is decided by
      #    `plan`'s `lane` alone, and the aggregator recomputes it instead of
      #    trusting each job's `if:`. Every lane runs checks and plan; then
      #      docs      nothing else
      #      tooling   deps, and standalone when plan names a standalone crate
      #      wide      deps + HEAVY_JOBS (the Linux PR gate)
      #      full      wide + FULL_JOBS (additional Linux checks)
      #      extended  full + EXTENDED_JOBS
      #    Every other job must skip. Any other skip (a drifted `if:`, a
      #    cancellation) or a job that ran where it should have skipped fails
      #    the aggregator. Each list must equal the jobs whose `if:` names its
      #    lanes; `cargo test -p xtask` (in `checks`) pins that.
      - name: Verify every job is gated and exactly the expected jobs skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY_JOBS: >-
            clippy wasm-check cross-typecheck test test-nested test-trybuild doc
            test-features live-smoke
          FULL_JOBS: >-
            feature-matrix bench-compile
            doc-test miri
          EXTENDED_JOBS: >-
          LANE: ${{ needs.plan.outputs.lane }}
          STANDALONE: ${{ needs.plan.outputs.standalone }}
          EVENT: ${{ github.event_name }}
        run: cargo xtask ci-verify

  # ─────────────────────────────────────────────────────────────────────────
  # notify-main-red -- a red `ci` on main or on the nightly run opens (or
  # comments on) one tracking issue, so a broken main is never silent. It
  # runs only there: on a PR the red check on the PR is the notification.
  # The team rule for a red main (AGENTS.md): fix forward within the hour or
  # revert.
  # ─────────────────────────────────────────────────────────────────────────
  notify-main-red:
    name: notify-main-red
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.result == 'failure' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the "main is red" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="CI is red on main"
          body="\`ci\` failed on \`${SHA:0:10}\` ($EVENT): $RUN_URL
          Rule (AGENTS.md): fix forward within the hour or revert. Close this issue once main is green again."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "commented on #$number"
          else
            gh issue create --title "$title" --body "$body"
          fi
