name: Advisories

# The RustSec database changes without a commit: a dependency that passed
# ci.yml's `deps` job yesterday can carry an advisory today, and on a quiet
# day no run on main would notice. This workflow runs the same advisories
# step against main once a day and keeps one tracking issue: a finding opens
# (or comments on) "RustSec advisory on main", and a clean run closes it.
# Runs at 03:17 UTC, off the :00/:30 herd marks. Not a merge gate: on a pull
# request `deps` reports advisories without failing, and main's run blocks on
# them (ADR-0376).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Nothing compiles: cargo-deny reads `cargo metadata`.
env:
  CARGO_TERM_COLOR: always
  RUSTUP_HOME: ${{ github.workspace }}/../flui-rustup

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20

      # The outcome feeds the tracking issue below, then fails the run.
      - id: deny
        name: cargo deny check advisories
        continue-on-error: true
        run: cargo deny --workspace --locked check advisories

      # Only a run of main's own tree may touch the issue: a manual run from
      # another ref (`workflow_dispatch --ref`) checks out that ref, whose
      # deny.toml ignores or dependency bumps say nothing about main.
      - name: Open, update or close the advisory issue
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/tracking-issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          title: RustSec advisory on main
          outcome: ${{ steps.deny.outcome }}
          body: |
            `cargo deny check advisories` failed on main: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Bump the dependency, or add an `ignore` with its reason to deny.toml. The next clean run closes this issue.

      - name: Fail the run on an open advisory
        if: steps.deny.outcome == 'failure'
        run: exit 1
