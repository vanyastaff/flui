name: Weekly

# Scheduled maintenance that PR CI cannot catch:
#   advisories  — new RUSTSEC entries against the committed lockfile (PR CI
#                 only re-checks advisories when a dependency changes)
#   latest-deps — upstream semver breakage: fresh `cargo update` + full build
#                 and test run, so a breaking dependency release surfaces here
#                 before it lands in someone's PR
#   bench       — executes the criterion benches and uploads the numbers as
#                 an artifact. TREND DATA ONLY, never a gate: shared runners
#                 are noisy, so the numbers support "did this drift over
#                 weeks", not "did this PR regress" — real A/B comparisons
#                 happen locally via `just bench-save` / `just bench-compare`.
#   release-lints — clippy over the workspace in the RELEASE profile. PR CI
#                 only ever compiles release through `cargo bench -p
#                 flui-rendering --no-run`, so every crate outside that one
#                 dependency graph is linted with `debug_assertions` on and
#                 nothing else. Release turns it off, which deletes
#                 `cfg(debug_assertions)` code and can strand imports, make
#                 a receiver unused, or unfulfil an expectation. Advisory.
#   nightly-canary — `cargo +nightly check` + `clippy` over the workspace,
#                 then the future-incompatibility report and a duplicate-
#                 versions metric. ADVISORY: nightly is where the next
#                 stable's deprecations, new lints, and future-incompat
#                 errors appear first (each with a known release date), so a
#                 red canary is a dated warning to act on, never a gate.
#                 Read it alongside This Week in Rust's "Calls for Testing"
#                 and "Final Comment Period" sections. Local mirror:
#                 `just nightly-check`.
#   cli-live-build — `flui create --local` + `flui build desktop` of the
#                 generated project (FLUI_CLI_LIVE_BUILD=1), the only run of
#                 the CLI test that compiles a scaffolded app end to end.
# Runs Monday ~05:17 UTC (off the :00/:30 herd marks). Not a merge gate;
# failures surface in the Actions tab.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # See ci.yml's env block: the Cargo config knob keeps the warnings gate out
  # of the rustc fingerprint, so it does not fragment the build cache.
  CARGO_BUILD_WARNINGS: deny
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  advisories:
    name: cargo deny (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-deny@0.19

      - name: cargo deny check advisories
        run: cargo deny check advisories

  latest-deps:
    name: latest deps (cargo update + build + nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same reclaim as the PR `test` job — the full-workspace build with
      # dev-deps approaches the runner's disk ceiling without it.
      - name: Free disk space (ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9

      - name: cargo update --workspace (fresh lockfile in-memory only)
        run: cargo update --workspace

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo nextest run (lib + integration)
        run: cargo nextest run --workspace --exclude flui-platform --no-fail-fast

      # Advisory. ADR-0045 pins macOS to the inline raster lane because
      # wgpu-hal's Metal `acquire_texture` messages AppKit UI objects from the
      # calling thread (issue #653). It asks that against the
      # `cargo update --workspace` resolution above rather than the committed
      # lockfile, because a lockfile comparison can only report that the lock
      # moved, and only after it already has.
      #
      # That reaches the newest COMPATIBLE wgpu-hal, not the newest published
      # one: `cargo update` does not cross a semver major and the workspace
      # pins `wgpu = "30.0"`. The script asks crates.io for the newest release
      # and says so loudly when it is out of reach, so a quiet run is never
      # read as "nothing changed upstream".
      #
      # Never gates. Every direction it can be wrong leaves macOS on the inline
      # lane, which is slower than necessary and not unsound. Result goes to the
      # job summary; the script explains the half of the condition it cannot see.
      - name: macOS raster reopen probe (advisory)
        if: '!cancelled()'
        run: bash scripts/probe-metal-acquire-main-thread.sh

      # Two upstream facts that would move WITHOUT a panic, a compile error, or a
      # red test (issue #983): winit calling `XInitThreads()` before
      # `XOpenDisplay` (ADR-0045 decision 1 permits off-thread X11 surface work
      # only because it does), and wgpu-hal requesting
      # `min_image_count(maximum_frame_latency + 1)` (ADR-0058's deadline pacer
      # was measured against the two images that yields).
      #
      # The issue's other three facts are NOT here because they already fail
      # loudly: `pre_present_notify` and `Occluded` are both asserted by
      # live-smoke, and winit's `Ime` enum is pinned by an exhaustive wildcard-free
      # match against a type that is not `#[non_exhaustive]`, so the compiler
      # catches it. Probing what a gate already covers is noise.
      #
      # Runs here, after `cargo update`, for the same reason the probe above does:
      # the question is whether upstream has moved YET, which a check against the
      # committed lock cannot answer. Advisory, never a gate.
      - name: upstream silent-fact probe (advisory)
        if: '!cancelled()'
        run: bash scripts/probe-upstream-silent-facts.sh

  bench:
    name: bench (criterion numbers, trend artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Advisory by design: a noisy-runner outlier must not page anyone.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The script enumerates the real [[bench]] targets (plain `cargo bench`
      # also selects libtest-harness targets, which reject criterion flags)
      # and skips the feature-gated GPU benches. --noplot keeps the artifact
      # to the raw estimates.json files, which is what comparisons consume.
      - name: Run criterion benches (save weekly baseline)
        run: bash scripts/bench-collect.sh weekly

      - name: Upload criterion numbers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-weekly-${{ github.run_id }}
          path: target/criterion
          retention-days: 90

  nightly-canary:
    name: nightly canary (check + clippy + future-incompat, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory by design (see the header): a failure here is information
    # about a coming stable release, not a regression in this tree.
    continue-on-error: true
    env:
      # Nightly deprecates APIs and adds lints ahead of stable; a deny gate
      # here would abort on the first one and hide the rest of the report.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `+nightly` on every cargo line: the committed rust-toolchain.toml pin
      # overrides the job's installed default (same as the miri job).
      - name: cargo +nightly check (workspace, all targets)
        run: cargo +nightly check --workspace --all-targets --locked

      - name: cargo +nightly clippy (workspace, all targets)
        run: cargo +nightly clippy --workspace --all-targets --locked

      # Lints that will become hard errors in a future release, collected
      # from the build above. Empty output is the good outcome.
      - name: Future-incompatibility report
        run: cargo +nightly report future-incompatibilities || true

      # Duplicate-version metric for the committed lockfile. Duplicates are
      # removed by bumping the upstream that pins the old version, never by
      # patching — this step only makes the count visible week over week.
      - name: Duplicate dependency versions (metric, informational)
        run: cargo tree --workspace --duplicates --edges normal

  release-lints:
    name: release-profile clippy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Advisory: nothing in PR CI compiles most of the workspace in release,
    # so a finding here is latent debt to schedule, not a broken build. It is
    # what `just test-release` would hit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo clippy --release (workspace, all targets)
        run: cargo clippy --workspace --all-targets --release --locked --keep-going -- -D warnings

  # cli-live-build — the one flui-cli test that runs a real `cargo build`:
  # `flui create --local <checkout>` then `flui build desktop --json` on the
  # generated project, asserting the `build.done` artifact exists on disk.
  # PR CI skips it (it compiles the framework a second time, in the generated
  # project's own target dir), so this is where the scaffold → build path is
  # proven end to end. `cargo fetch` first: the test copies the workspace
  # lockfile into the project and builds offline.
  cli-live-build:
    name: flui create + build desktop / web + dev server (live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9

      - name: cargo fetch (the generated project builds offline from this lockfile)
        run: cargo fetch --locked

      - name: live desktop build of a generated project
        env:
          FLUI_CLI_LIVE_BUILD: "1"
        run: cargo nextest run -p flui-cli --locked -E 'test(live_desktop_build_produces_an_artifact_on_disk)'

      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli must match the locked wasm-bindgen crate exactly
      # (the runner refuses to start otherwise), so the version comes from
      # Cargo.lock — same source of truth `just wasm-test` and ci.yml's
      # `wasm-check` job read. Installed as a prebuilt binary via
      # taiki-e/install-action (same as `wasm-check`), not `cargo install
      # --locked`: the latter compiles wasm-bindgen-cli from source on every
      # run, which is minutes of build time for a leaf tool this job doesn't
      # otherwise need to build.
      - name: Resolve the locked wasm-bindgen version
        id: wasm_bindgen_version
        run: |
          set -euo pipefail
          version="$(bash scripts/locked-version.sh wasm-bindgen)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "locked wasm-bindgen: $version"

      - name: Install wasm-bindgen-cli (matching the lockfile)
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm_bindgen_version.outputs.version }}

      # Chromium is preinstalled on ubuntu-latest, so `flui devices` lists a
      # browser and the serve half runs; `--no-open` keeps it headless.
      - name: live web build and dev server of a generated project
        env:
          FLUI_CLI_LIVE_WEB: "1"
        run: cargo nextest run -p flui-cli --locked -E 'test(live_web_build_and_run_serve_the_generated_project)'

  # ───────────────────────────────────────────────────────────────────────
  # publish-dry-run — `cargo publish --dry-run` for every publishable
  # workspace crate, leaves-first (scripts/publish-order.sh). Advisory: right
  # now every crate except `flui-cli` depends on at least one sibling
  # workspace crate that isn't on crates.io yet, so `cargo publish --dry-run`
  # fails for all of them on version resolution alone — that specific,
  # expected failure is reported informational by the script, not as an
  # "unexpected failure". `continue-on-error: true` at the job level besides:
  # this is the FIRST run of the mechanism, so a genuine unexpected finding
  # (a missing `license`/`description`/`readme`, a manifest error) should be
  # visible and read, not silently red-main a workflow nobody has tuned yet.
  # Tighten to a hard gate once a few weeks of green (or understood-red)
  # runs build confidence in the signal.
  # ───────────────────────────────────────────────────────────────────────
  publish-dry-run:
    name: publish dry-run, leaves-first (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo publish --dry-run, leaves-first
        run: bash scripts/publish-order.sh

  # ───────────────────────────────────────────────────────────────────────
  # cargo-machete — unused-dependency audit. Advisory: a false positive is
  # possible (a dependency used only behind a cfg the default feature set
  # doesn't build, a re-export machete's static scan can't see), so this
  # reports rather than gates. None of `deny`/`clippy`/`feature-matrix`
  # catch a genuinely-unused *normal* dependency.
  # ───────────────────────────────────────────────────────────────────────
  cargo-machete:
    name: cargo-machete (unused dependencies, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-machete@0.7

      - name: cargo machete
        run: cargo machete
