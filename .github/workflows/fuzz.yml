name: Fuzz

# The fuzz targets under libFuzzer, every night against main: `cargo xtask
# fuzz` builds each target with coverage counters and AddressSanitizer and
# lets libFuzzer mutate its inputs toward code none has reached yet.
#
#   image_decode — encoded image bytes into `Image::decode`.
#   agent_wire   — what a client writes to a development agent's session.
#
# The property tests of the same two entries (`image_decode_contract`,
# `any_client_bytes_are_answered_or_refused_in_whole_lines`) draw their bytes
# at random on every pull request. A fuzzer keeps the inputs that reached new
# code and mutates those, so it gets past a header check or a method name that
# random bytes almost never satisfy; that takes minutes per target, which is
# why it runs here and not on a pull request.
#
# The corpus (the inputs kept so far) is carried from one night to the next
# through the cache, saved from main only, so a run starts where the last one
# stopped. An input that panics, aborts, trips the sanitizer, hangs or runs
# out of memory fails the run and is uploaded as the `fuzz-findings`
# artifact: `cargo run -p <crate> --example fuzz_<target> -- <file>` replays
# it on the pinned toolchain, and its fix adds the input's case to the
# owning crate's tests.
#
# A pull request that edits a fuzz target, this file or the task runs each
# target for a minute, enough to see that it builds and starts. A red run on
# main keeps the "Fuzzing found a failing input on main" issue open, and a
# green one closes it.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "tools/xtask/src/tasks/fuzz.rs"
      - "crates/*/fuzz/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUSTUP_HOME: ${{ github.workspace }}/../flui-fuzz-rustup
  # Seconds each target runs: ten minutes a night, one on a pull request.
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      # The sanitizer and the coverage passes are nightly-only; the task
      # builds the targets with `cargo +nightly`, so the pin stays the
      # toolchain of the task itself.
      - name: Install Rust nightly (sanitizer coverage)
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly

      # No build cache: a sanitizer build of both targets is several GB that
      # nothing else reuses. The corpus is a few MB. Its key ends in the run,
      # so every night saves a new entry and the next restores the latest.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fuzz/*/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: cargo xtask fuzz
        run: cargo xtask fuzz --seconds "$FUZZ_SECONDS"

      - name: Save the corpus
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fuzz/*/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            target/fuzz/*/crash-*
            target/fuzz/*/timeout-*
            target/fuzz/*/oom-*
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: report
    needs: [fuzz]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep the tracking issue
        uses: ./.github/actions/tracking-issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          title: Fuzzing found a failing input on main
          outcome: ${{ needs.fuzz.result }}
          body: >-
            A fuzz target failed on main. The run names the target and uploads
            the input as the `fuzz-findings` artifact; replay it with
            `cargo run -p <crate> --example fuzz_<target> -- <file>`:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
