name: Fuzz

# The fuzz targets under libFuzzer, every night against main: `cargo xtask
# fuzz` builds a target with coverage counters and AddressSanitizer and lets
# libFuzzer mutate its inputs toward code none has reached yet.
#
#   image_decode — encoded image bytes into `Image::decode`.
#   agent_wire   — what a client writes to a development agent's session.
#
# The property tests of the same two entries (`image_decode_contract`,
# `any_client_bytes_are_answered_or_refused_in_whole_lines`) draw their bytes
# at random wherever their crate's tests run. A fuzzer keeps the inputs that
# reached new code and mutates those, so it gets past a header check or a
# method name that random bytes almost never satisfy; that takes a sanitizer
# build of the crate's whole test graph and minutes of running, which is why
# it runs here and not on every pull request.
#
# Each target is a job of its own, so a finding in one does not keep the
# other from running. The corpus (the inputs kept so far) is carried from one
# night to the next through the cache, saved from main only and after a red
# run too, so a run starts where the last one stopped. An input that panics,
# aborts, trips the sanitizer, hangs, leaks or allocates past its target's
# limit fails the run and is uploaded as `fuzz-findings-<target>`:
# `cargo xtask fuzz <target> --replay <file>` runs it again in the build that
# found it, and its fix adds the input's case to the owning crate's tests
# (docs/testing.md, "Fuzzing").
#
# A pull request that edits what a target is built from (this file, the task,
# a target, its seeds, the property it shares with its crate's tests, a
# manifest that names it) runs each target for a minute, enough to see that
# it builds and starts. A change that reaches the build only through
# `Cargo.lock` is first seen by the night's run. A red run on main keeps the
# "Fuzzing failed on main" issue open, and a green one closes it.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "tools/xtask/src/tasks/fuzz.rs"
      - "Cargo.toml"
      - "crates/flui-painting/Cargo.toml"
      - "crates/flui-runtime/Cargo.toml"
      - "crates/*/fuzz/**"
      - "crates/flui-painting/tests/support/foreign_image.rs"
      - "crates/flui-painting/tests/fixtures/**"
      - "crates/flui-runtime/tests/support/agent_wire.rs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUSTUP_HOME: ${{ github.workspace }}/../flui-fuzz-rustup
  # Seconds a target runs: ten minutes a night, one on a pull request.
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [image_decode, agent_wire]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      # The sanitizer and the coverage passes are nightly-only; the task
      # builds the targets with `cargo +nightly`, so the pin stays the
      # toolchain of the task itself.
      - name: Install Rust nightly (sanitizer coverage)
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly

      # No build cache: a sanitizer build of a target is several GB that
      # nothing else reuses. The corpus is a few MB. Its key ends in the run
      # and the attempt, so every run saves a new entry and the next restores
      # the latest.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fuzz/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # The step has the time limit, not only the job: a step that runs out
      # of time fails, and the steps after it still save the corpus and
      # upload what was found. The build of `agent_wire` is the long part
      # (its crate's whole test graph under the sanitizer).
      - name: cargo xtask fuzz
        timeout-minutes: 75
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo xtask fuzz "$FUZZ_TARGET" --seconds "$FUZZ_SECONDS"

      - name: Save the corpus
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fuzz/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: target/fuzz/${{ matrix.target }}/findings/
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: report
    needs: [fuzz]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep the tracking issue
        uses: ./.github/actions/tracking-issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          title: Fuzzing failed on main
          outcome: ${{ needs.fuzz.result }}
          body: >-
            A fuzz job failed on main. Its log says which it was: a target
            that found an input (uploaded as `fuzz-findings-<target>`, and
            replayed with `cargo xtask fuzz <target> --replay <file>`), a
            build that broke, or a run out of time:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
