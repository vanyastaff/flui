name: Fuzz

# The fuzz targets under libFuzzer, every night against main: each target is
# an example of the crate it tests, built by `cargo +nightly --config
# .cargo/fuzz.toml run` with coverage counters and AddressSanitizer, and
# libFuzzer mutates its inputs toward code none has reached yet.
#
#   image_decode — encoded image bytes into `Image::decode`.
#   agent_wire   — what a client writes to a development agent's session.
#
# The property tests of the same two entries (`image_decode_contract`,
# `any_client_bytes_are_answered_or_refused_in_whole_lines`) draw their bytes
# at random wherever their crate's tests run. A fuzzer keeps the inputs that
# reached new code and mutates those, so it gets past a header check or a
# method name that random bytes almost never satisfy; that takes a sanitizer
# build of the crate's whole test graph and minutes of running, which is why
# it runs here and not on every pull request.
#
# Each target is a job of its own, so a finding in one does not keep the
# other from running. The corpus (the inputs kept so far) is carried from one
# night to the next through the cache, saved from main only and after a red
# run too, so a run starts where the last one stopped. An input that panics,
# aborts, trips the sanitizer, hangs, leaks or allocates past its target's
# limit fails the run and is uploaded as `fuzz-findings-<target>`: the same
# command with the file in place of the corpus and seeds, and the target's
# limits, runs it again with the same flags, and its fix adds the input's case
# to the owning crate's tests (docs/testing.md, "Fuzzing").
#
# No pull request runs it (ADR-0376): a change to a target, its seeds or what it
# is built from runs the workflow on its branch (`gh workflow run Fuzz --ref
# <branch>`) at the head that merges, and the night's run sees every other
# change. A red run on main keeps the "Fuzzing failed on main" issue open, and
# a green one closes it.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUSTUP_HOME: ${{ github.workspace }}/../flui-fuzz-rustup
  # Seconds a target runs a night.
  FUZZ_SECONDS: 600

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Each target: the package whose example (`fuzz_<target>`) it is, the
      # directory of inputs its run starts from (read, never written), the
      # longest input libFuzzer writes, and the limits an input runs under in a
      # run and in its replay: 20 seconds before it counts as a hang, and for a
      # target whose entry promises no bound of its own, a cap on one
      # allocation. `image_decode` keeps libFuzzer's RSS limit: its property
      # bounds every block a decode asks for by `MAX_DECODED_IMAGE_BYTES`,
      # which a decode may reach exactly. A conversation of 2 KiB asks an
      # agent session for nothing near 64 MiB.
      matrix:
        include:
          - target: image_decode
            package: flui-painting
            seeds: crates/flui-painting/tests/fixtures
            max_len: 4096
            limits: -timeout=20
          - target: agent_wire
            package: flui-runtime
            seeds: crates/flui-runtime/fuzz/seeds/agent_wire
            max_len: 2048
            limits: -timeout=20 -malloc_limit_mb=64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The sanitizer is nightly-only, so the target builds with
      # `cargo +nightly`, the job's one cargo command; the pinned release is
      # not installed, since nothing here runs on it.
      - name: Install Rust nightly (sanitizer coverage)
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly

      # No build cache: a sanitizer build of a target is several GB that
      # nothing else reuses. The corpus is a few MB. Its key ends in the run
      # and the attempt, so every run saves a new entry and the next restores
      # the latest.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fuzz/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # The step has the time limit, not only the job: a step that runs out
      # of time fails, and the steps after it still save the corpus and
      # upload what was found. The build of `agent_wire` is the long part
      # (its crate's whole test graph under the sanitizer).
      # libFuzzer keeps the inputs that reached new code in the corpus
      # directory, its first argument, reads the seeds as inputs, and writes
      # the input that ended the run to `findings/`, named by what it did
      # (`crash-`, `timeout-`, `oom-`, `leak-<hash>`). Nightly adds lints ahead of stable; this run is for
      # findings, so warnings stay warnings.
      - name: cargo +nightly run the fuzz target
        timeout-minutes: 75
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_SEEDS: ${{ matrix.seeds }}
          FUZZ_MAX_LEN: ${{ matrix.max_len }}
          FUZZ_LIMITS: ${{ matrix.limits }}
          CARGO_BUILD_WARNINGS: warn
        run: |
          set -euo pipefail
          dir=target/fuzz/$FUZZ_TARGET
          mkdir -p "$dir/corpus" "$dir/findings"
          read -ra limits <<< "$FUZZ_LIMITS"
          cargo +nightly --config .cargo/fuzz.toml run --locked \
            --target x86_64-unknown-linux-gnu -p "$FUZZ_PACKAGE" --example "fuzz_$FUZZ_TARGET" -- \
            "$dir/corpus" "$FUZZ_SEEDS" \
            -artifact_prefix="$dir/findings/" -max_total_time="$FUZZ_SECONDS" \
            -max_len="$FUZZ_MAX_LEN" "${limits[@]}" -print_final_stats=1

      - name: Save the corpus
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fuzz/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: target/fuzz/${{ matrix.target }}/findings/
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: report
    needs: [fuzz]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep the tracking issue
        uses: ./.github/actions/tracking-issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          title: Fuzzing failed on main
          outcome: ${{ needs.fuzz.result }}
          body: >-
            A fuzz job failed on main. Its log says which it was: a target
            that found an input (uploaded as `fuzz-findings-<target>`, and
            replayed as docs/testing.md "Fuzzing" shows), a build that broke,
            or a run out of time:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
