name: Docs

# Builds the mdBook site under `book/` and deploys it to GitHub Pages from
# `main`. Scoped to `book/**`, `src/book.rs` and this file via `paths:`, so it
# never runs on a PR that doesn't touch the book; `ci.yml`'s main-only
# `doc-test` job runs the book's samples with every other doctest after any
# change to the facade they compile against.
#
# `mdbook test` is not used: it compiles each fence without the workspace's
# crates. The `samples` job compiles the book's Rust fences as doctests of the
# facade instead (src/book.rs). The `build` job checks every internal link,
# via `lychee` in `--offline` mode over the built HTML; an external-link check
# is left out of the required gate (rate limits and third-party downtime
# would make it flaky).
#
# Enabling this requires a one-time repo setting only the repo owner can
# make: Settings → Pages → Source = "GitHub Actions". Until that's set,
# the `deploy` job below fails with a clear error naming the missing
# setting; `build` (and its link check) still runs and gates every PR.

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'src/book.rs'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'book/**'
      - 'src/book.rs'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdbook
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # Pinned like every CI tool: a new release is a deliberate bump.
          tool: mdbook@0.5.4

      - name: mdbook build
        run: mdbook build book

      - name: lychee (internal links only)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --root-dir book/book
            --exclude-path book/book/print.html
            book/book
          fail: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: book/book

  # Every `rust` fence in the book compiles against the facade, and the ones
  # not marked `no_run` run: src/book.rs makes each chapter a doctest, and its
  # unit tests refuse an `ignore` fence and a chapter missing from the list.
  # ci.yml's `doc-test` runs the same doctests on main, where a facade change
  # can break a sample without touching the book.
  samples:
    name: samples
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../flui-rustup
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_WARNINGS: deny
      RUSTDOCFLAGS: -D warnings
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain

      - name: The book's chapter list and fences
        run: "cargo test -p flui --locked --lib book::"

      - name: The book's samples
        run: "cargo test -p flui --locked --features testing,material,cupertino --doc book::"

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
