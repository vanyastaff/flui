name: Windows input diagnostics (temporary)

# Temporary: flui-native's Windows suite as the nightly runs it, on this
# branch and on main, each on a fresh runner. Removed before the pull request
# merges.

on:
  pull_request:
    paths:
      - ".github/workflows/windows-input-diagnostics.yml"
      - "crates/flui-native/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUSTUP_HOME: ${{ github.workspace }}/../flui-diag-rustup

jobs:
  branch:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain
      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9
      - name: Build
        run: cargo nextest run -p flui-native --locked --test platform_it --no-run
      - name: When the touch keyboard host appears after a touch
        run: |
          set +e
          one() {
            FLUI_NATIVE_WINDOW_CONTRACT_CHILD=$1 cargo nextest run -p flui-native --locked --test platform_it --no-capture -E 'test(=contract::test_window_lifecycle_contract)' 2>&1 | grep -E "PASS \[|FAIL \["
          }
          watch() {
            start=$(date +%s%N)
            for i in $(seq 1 80); do
              if tasklist //fi 'imagename eq TabTip.exe' //fo csv //nh | grep -q TabTip; then
                echo "TabTip after $(( ($(date +%s%N) - start) / 1000000 )) ms"; return
              fi
              sleep 0.25
            done
            echo "no TabTip within 20 s"
          }
          for row in focus_loss_ends_a_touch_and_silences_its_tail synthetic_touch_and_pen_reach_native_pointer_dispatch two_injected_touches_arrive_as_one_pointer_frame a_captured_native_pointer_session_replays_to_what_it_delivered; do
            echo "== $row"
            one $row & pid=$!
            watch
            wait $pid
            taskkill //F //IM TabTip.exe
            sleep 2
          done
          exit 0
