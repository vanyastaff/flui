name: Windows input diagnostics (temporary)

# Temporary: flui-native's Windows suite as the nightly runs it, on this
# branch and on main, each on a fresh runner. Removed before the pull request
# merges.

on:
  pull_request:
    paths:
      - ".github/workflows/windows-input-diagnostics.yml"
      - "crates/flui-native/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUSTUP_HOME: ${{ github.workspace }}/../flui-diag-rustup

jobs:
  branch:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain
      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9
      - name: Whole suite, as the nightly runs it
        run: cargo xtask platform-test
      - name: Whole window contract again
        if: ${{ !cancelled() }}
        run: cargo test -p flui-native --locked --test platform_it -- --exact contract::test_window_lifecycle_contract

  main:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain
      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9
      - name: Whole suite on main
        run: cargo xtask platform-test
      - name: Whole window contract again
        if: ${{ !cancelled() }}
        run: cargo test -p flui-native --locked --test platform_it -- --exact contract::test_window_lifecycle_contract
