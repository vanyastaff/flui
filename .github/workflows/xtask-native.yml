name: Native xtask

# Host-tool coverage for cache keys and locks on Windows and macOS, weekly and by
# hand (ADR-0376): xtask is repository tooling, and ci.yml's `checks` job runs
# `cargo test -p xtask` on Linux for every pull request. A change to xtask's
# Windows or macOS paths runs `cargo test -p xtask` on that host before its PR.
on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUSTUP_HOME: ${{ github.workspace }}/../flui-xtask-rustup

jobs:
  xtask:
    name: xtask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Rust cache (native xtask)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: xtask-native-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy -p xtask --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p xtask --locked --no-fail-fast
