name: Native xtask

# Host-tool coverage for cache keys and locks on
# Windows and macOS. Linux needs no leg: ci.yml's `checks` job runs
# `cargo test -p xtask` and its `clippy` job lints the workspace, xtask
# included, on every pull request. Dependency bumps (Cargo.lock, the root
# Cargo.toml) do not trigger it either: xtask's own code and toolchain do.
on:
  pull_request:
    paths:
      - "tools/xtask/**"
      - ".github/workflows/xtask-native.yml"
      - ".github/actions/rust-toolchain/**"
      - ".cargo/**"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "tools/xtask/**"
      - ".github/workflows/xtask-native.yml"
      - ".github/actions/rust-toolchain/**"
      - ".cargo/**"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUSTUP_HOME: ${{ github.workspace }}/../flui-xtask-rustup

jobs:
  xtask:
    name: xtask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Rust cache (native xtask)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          shared-key: xtask-native-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy -p xtask --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p xtask --locked --no-fail-fast
