[package]
publish = ["crates-io"]
name = "flui-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform abstraction layer for FLUI - cross-platform window and input handling"
keywords = ["gui", "window", "platform", "input", "flui"]
categories = ["gui", "os"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md"]
# Single-binary integration-test consolidation: every root test file is a
# module of `tests/main.rs` (one link of the full dep stack instead of 11
# separate binaries). See the `[[test]] name = "platform_it"` target below.
autotests = false

[dependencies]
# The accessibility tree the `PlatformAccessibility` capability speaks. Data
# model only -- the per-OS `accesskit_*` adapters are separate, target-specific
# dependencies below. An already-translated `accesskit::TreeUpdate` is what
# crosses the seam.
accesskit = { workspace = true }
# `PlatformAccessibility` and its listener types, which the backends implement
# and `HostWindow` hands out. The trait lives there so the
# frame runtime can hold a window's bridge without linking a backend
# (ADR-0082 §2).
flui-semantics = { path = "../flui-semantics", version = "=0.2.0-dev" }
# The host's fallback answer `fonts::system_fallback` gives (`SystemFallback`,
# ADR-0271 §3), and the text stack (Parley, swash) the Wayland window's own
# frame shapes and rasterizes its title with. `flui-app` links it already.
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }

# The contracts the backends implement (capability traits, window/input and
# data-transfer vocabulary), re-exported here at their old paths (ADR-0082).
flui-platform = { workspace = true }
# Layer-legal downward edge (foundation sits below platform in the DAG),
# carrying two seams: OwnerAffinity — the ADR-0039 owner-thread backstop,
# hosted in foundation so its tests run in CI (flui-native's suite does
# not) — and the generational DataTransferId for the ADR-0038 transport.
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
# Wasm-safe Instant for input timestamps (std re-export on native).
web-time = { workspace = true }

cursor-icon = { workspace = true }
# Native keyboard adapters are confined to Winit and Android.
keyboard-types = { workspace = true, optional = true }

# Windowing (for platform implementations)
winit = { workspace = true, optional = true }

# The ecosystem bridge from winit's native event types to our canonical
# `ui_events`/`keyboard-types` vocabulary (Masonry ships it too) — the winit
# backend's whole keyboard event (code, logical key, location, state,
# repeat, modifiers) delegates to it entirely rather than hand-assembling
# any of those fields here. See ARCHITECTURE.md §Mapping decisions for why
# the Win32 and AppKit backends keep their own hand-written `Code`/`Key`
# tables instead of also delegating. Pins `winit ^0.30`; if the workspace
# winit pin needs to move to 0.31 before this crate follows, patch it via
# `[patch.crates-io]` pointing at the upstream git repo (and add that repo
# to `deny.toml`'s `sources.allow-git`) rather than reviving a hand table.
ui-events-winit = { version = "0.3", optional = true }

# Error handling & logging. `anyhow` is deliberately absent here: the
# public API is typed (`PlatformError`/`OpenWindowError`, thiserror), and
# only tests still consume `anyhow` (see [dev-dependencies]).
thiserror = { workspace = true }
tracing = { workspace = true }
# Pointer assembly returns the one or two events a reading makes inline.
smallvec = { workspace = true }

# The native recording codec (`journal::codec`, ADR-0215 §4), with
# `native-capture` or `testing` only, so the backends link no serializer.
# Recordings are JSON Lines in the schema `flui-protocol` declares. A replay
# reproduces the delivered floats only if every number reads back to the bits
# it was written from, which serde_json's default parser does not guarantee.
flui-protocol = { workspace = true, optional = true, features = ["serde"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }

# Synchronization
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true, optional = true }

# Window handle abstraction
raw-window-handle = "0.6"

# Compile-time auto-trait fences for `OwnerPlatform`/`PlatformProxy`/
# `PendingWindow` (ADR-0039 §6-8): item-position `assert_not_impl_any!`/
# `assert_impl_all!` in `owner/mod.rs`, expanded unconditionally by every
# `cargo check` (including cross-typecheck on win/mac) — not gated behind
# `#[cfg(test)]` — so this must be a real dependency, not dev-only, or the
# assertions never expand outside this crate's own test builds.
static_assertions = { workspace = true }

# The winit fallback uses a desktop clipboard; mobile backends own their
# native clipboard implementations even when every feature is enabled.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { workspace = true, optional = true }

# Windows platform
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    # Pen haptics: `PenDevice::GetFromPointerId` and its
    # `SimpleHapticsController` (ADR-0210 §7).
    "Devices_Haptics",
    "Devices_Input",
    "UI_ViewManagement",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    # Precision touchpad: the manual-update viewport behind precise scrolling
    # and pinch (ADR-0217 §4).
    "Win32_Graphics_DirectManipulation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    # A display's colour: `IDXGIOutput6::GetDesc1` (colour space and peak).
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    # The system font fallback, `IDWriteFontFallback::MapCharacters`
    # (`fonts::windows`, ADR-0271 §3).
    "Win32_Graphics_DirectWrite",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # OLE drag and drop: `IDataObject`'s implementable trait needs the
    # structured-storage medium, `IDropTarget`/`IDropSource` the `MK_*` key
    # state (ADR-0211).
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_SystemInformation",
    # `RtlGetVersion`: the real OS build, which the display source reads once.
    "Wdk_System_SystemServices",
    # Pointer readings carry a `QueryPerformanceCounter` timestamp.
    "Win32_System_Performance",
    # TSF: the thread manager, document managers and the `ITextStoreACP`
    # text store (ADR-0090 §3). `Win32_UI_Input_Ime` (IMM32) stays off: the
    # text services are the only IME path. `Variant` is required by the
    # `ITextStoreACP` bindings.
    "Win32_UI_TextServices",
    "Win32_System_Variant",
    # Session end: `ShutdownBlockReasonCreate`/`Destroy` while the
    # registry is flushed on log-off.
    "Win32_System_Shutdown",
    # Session lock and unlock: `WTSRegisterSessionNotification` on the hidden
    # top-level receiver.
    "Win32_System_RemoteDesktop",
] }
# `#[implement]` (the COM objects the text services hand TSF) expands to
# `::windows_core` paths.
windows-core = { workspace = true }

# macOS platform
[target.'cfg(target_os = "macos")'.dependencies]
# `objc2` is the backend's binding stack. The `cocoa`/`objc` pair it replaced
# is gone entirely: `objc` had not released since 2019, and `cocoa` deprecated
# its whole surface in favor of this family. Versions are the ones `wgpu-hal`
# already pins, so no new crate generation was introduced.
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "std",
    "objc2-core-foundation",
    "NSObject",
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSValue",
    "NSThread",
    "NSProcessInfo",
    "NSGeometry",
    "NSEnumerator",
    "NSRunLoop",
    # The deadline `testing::appkit` waits for an event until.
    "NSDate",
    "NSBundle",
    "NSRange",
    "NSNotification",
    "NSDistributedNotificationCenter",
    "NSLocale",
    "NSOperation",
    "block2",
] }
# The screen-parameters observer is a block handed to `NSNotificationCenter`.
block2.workspace = true
# `CGDisplayCreateUUIDFromDisplayID` returns a `CFUUID`, whose 16 bytes are the
# display key. The version `core-graphics` 0.25 already uses.
core-foundation = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "objc2-core-foundation",
    # `NSEvent`'s local monitor, the route of a key release under Command.
    "block2",
    "NSApplication",
    "NSGraphicsContext",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
    "NSResponder",
    "NSEvent",
    "NSAccessibility",
    "NSWorkspace",
    "NSScreen",
    "NSPasteboard",
    "NSGraphics",
    "NSCursor",
    "NSVisualEffectView",
    "NSWindowScripting",
    "NSAppearance",
    # `NSHapticFeedbackManager`, the window's haptic actuator (ADR-0210).
    "NSHapticFeedback",
] }
dispatch2.workspace = true
# CoreGraphics, for the one display property Cocoa does not expose: the
# refresh rate of the display's *current* mode (`CGDisplayModeGetRefreshRate`),
# which is what `PlatformWindow::refresh_period` needs. NSScreen has no
# current-mode rate — its `maximumFramesPerSecond` is the hardware *maximum*
# (it over-reports on a ProMotion panel running a 60 Hz mode) and is macOS 12+,
# above this crate's 11.0 deployment floor — and the winit backend this mirrors
# reads the mode rate the same way. Pinned to the version `cocoa` 0.27 already
# pulls in, so no second copy of the crate enters the tree.
core-graphics = { workspace = true }
# The view's backing layer (`owner::apple::metal_layer`): a `CAMetalLayer`
# whose drawables report when they reached the screen. Both the versions
# `wgpu-hal` 30 already pins.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    # `CACurrentMediaTime`, the clock the link stamps its ticks on.
    "CABase",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTLDrawable",
    "block2",
    "objc2-core-foundation",
] }
# Grand Central Dispatch: the owner lane (AppKit main queue, or a test serial
# queue) every NSPasteboard operation is routed through. Zero-dep crate;
# 0.2.0 is already pinned in Cargo.lock transitively via objc2-foundation.
dispatch = "0.2"

# Apple platforms: CoreText's answer to which faces fall back
# (`fonts::apple`, ADR-0271 §3). Both are in the tree already, through
# AppKit's and UIKit's bindings.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFString",
    "CFURL",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std",
    "CTFont",
    "CTFontDescriptor",
] }

# Android platform
[target.'cfg(target_os = "android")'.dependencies]
ui-events = { workspace = true }
keyboard-types = { workspace = true }
android-activity = { workspace = true }
jni.workspace = true
# The system's fallback order below API 29, read from `fonts.xml`
# (`fonts::android`).
roxmltree.workspace = true

# Every Unix: `_exit`, the exit watchdog's end of the process (ADR-0258 §7).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Native-only async dependencies (not available on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
# The file store behind `flui::AppConfig::with_storage_dir`: the per-user data directories, and
# the uniquely named temporary file each write is staged in before it
# replaces the target. wasm32 keeps values in the page's IndexedDB
# instead, so neither is there.
dirs = { workspace = true }
tempfile = { workspace = true }

# Web/WASM platform
[target.'cfg(target_arch = "wasm32")'.dependencies]
icu_properties.workspace = true
icu_normalizer.workspace = true
wasm-bindgen = "0.2"
js-sys.workspace = true
# The page store answers from IndexedDB in a later task of the page; its
# futures hand that answer to the host's `Send` IO tasks through a oneshot.
wasm-bindgen-futures.workspace = true
tokio = { workspace = true, features = ["sync"] }
web-sys = { version = "0.3", features = [
    # Core DOM
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    # The semantics host's range inputs
    "HtmlInputElement",
    # The page's selection in the semantics host's static text
    "Selection",
    # Events
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "PointerEvent",
    "KeyboardEvent",
    "WheelEvent",
    "MouseEvent",
    "FocusEvent",
    "FocusOptions",
    "UiEvent",
    # Text input: the hidden editor where the browser has no EditContext
    "HtmlTextAreaElement",
    "Node",
    # HTML drag and drop
    "DragEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "File",
    "FileList",
    "Blob",
    # Rendering
    "CanvasRenderingContext2d",
    "DomRect",
    "DomRectList",
    # Display
    "Screen",
    "MediaQueryList",
    "MediaQueryListEvent",
    # Observers
    "MutationObserver",
    "MutationObserverInit",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    # Animation
    "Performance",
    # Clipboard
    "Clipboard",
    "Navigator",
    # Visibility
    "VisibilityState",
    # Location
    "Location",
    # Styling
    "CssStyleDeclaration",
    # The soft keyboard over the page
    "VisualViewport",
    # Console
    "console",
] }
console_error_panic_hook = "0.1"

# D-Bus on Linux: the Settings portal (`preferences::linux`), logind
# (`lifecycle::linux`) and AT-SPI, the accessibility bridge
# (`accessibility::linux`, through `accesskit_unix`). Every Linux host reads
# them, so they are unconditional Linux dependencies and every Linux window is
# accessible with no feature of its own (ADR-0151 §15).
[target.'cfg(target_os = "linux")'.dependencies]
# The X server's client, behind the `x11` feature: the native X11 host's
# connection on libxcb (`allow-unsafe-code` and `dl-libxcb`, so a surface can be
# made from it and libxcb is loaded at run time rather than linked), and the
# display source's pure-Rust connection for RandR. winit enables the same
# features, so the tree gains no crate.
x11rb = { workspace = true, optional = true, features = [
    "allow-unsafe-code",
    "dl-libxcb",
    # The X11 host's input: XInput 2 (pointer, touch, pen, smooth scrolling),
    # XKB's keyboard events and the cursor theme.
    "xinput",
    "xkb",
    "cursor",
] }
# libxkbcommon and libxkbcommon-x11, loaded at run time as winit loads them:
# the keymap, the keyboard state and compose, which both Linux hosts read
# through `input::linux::xkb`.
xkbcommon-dl = { version = "0.4", optional = true, features = ["x11"] }
# The native Wayland host's protocol clients, also the display source's, and
# the descriptor primitives both Linux hosts wait on, behind the `wayland` and
# `x11` features (`desktop` and `winit-backend` enable both).
wayland-client = { workspace = true, optional = true }
# `staging` for `cursor-shape`, which the Wayland host's input speaks beside
# the unstable `tablet` and `pointer-gestures`.
wayland-protocols = { workspace = true, optional = true, features = ["staging"] }
wayland-backend = { workspace = true, optional = true }
# `time`: the monotonic clock the X server and a Wayland compositor stamp
# their input on, and the clock a compositor stamps presentation times on;
# `fs`: the memory file a Wayland window's own frame is drawn into.
rustix = { workspace = true, optional = true, features = ["time", "fs", "pipe"] }
# The cursor theme the Wayland host draws a cursor from where the compositor
# has no `cursor-shape`. winit loads the same crate, so the tree gains none.
wayland-cursor = { version = "0.31", optional = true }
accesskit_unix = { version = "0.24" }
zbus = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

# iOS native backend (UIKit + Metal). `objc2` is the maintained Objective-C
# binding stack — the `objc` crate the macOS backend still uses has not
# released since 2019, and `cocoa` has no UIKit surface at all. Only the
# classes this backend messages are enabled: objc2-ui-kit exposes one feature
# per header and turns all ~456 on by default, which would compile the whole
# framework's bindings for a handful of classes. Versions are the ones already
# in the lock via `wgpu-hal` 30.0.1, so this adds no new crate generation.
#   - `dispatch2` is Grand Central Dispatch (the main queue, the owner lane).
#   - `objc2-quartz-core`'s `CADisplayLink` is the per-frame signal; QuartzCore
#     rather than UIKit because `CADisplayLink` is declared there.
[target.'cfg(target_os = "ios")'.dependencies]
# Grapheme clusters, to delete a replaced run before the caret as the field
# deletes it, a Backspace per cluster (`text::apple::composition`).
icu_segmenter.workspace = true
objc2 = { version = "0.6.4", features = ["std", "exception"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "block2",
    "NSOperation",
    "std",
    "objc2-core-foundation",
    "NSObject",
    "NSString",
    "NSSet",
    "NSProcessInfo",
    "NSArray",
    "NSDictionary",
    "NSNotification",
    "NSValue",
    "NSThread",
    "NSGeometry",
    "NSData",
    "NSURL",
    "NSEnumerator",
    "NSRunLoop",
    "NSLocale",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "UIFont",
    "UIFontDescriptor",
    "UIFontMetrics",
    "UIContentSizeCategory",
    "UIAccessibility",
    "objc2-core-foundation",
    "UIApplication",
    "UIScene",
    "UISceneDefinitions",
    "block2",
    "UISceneSession",
    "UISceneConfiguration",
    "UISceneOptions",
    "UIWindowScene",
    "UIEvent",
    "UIGestureRecognizer",
    "UIHoverGestureRecognizer",
    # An iPad's trackpad: its two-finger scroll, pinch and rotation.
    "UIPanGestureRecognizer",
    "UIPinchGestureRecognizer",
    "UIRotationGestureRecognizer",
    "UIGeometry",
    "UIKey",
    "UIResponder",
    "UIScreen",
    "UIScreenMode",
    "UITraitCollection",
    "UIInterface",
    "UITouch",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIPasteboard",
    "UIColor",
    # `UIUserInterfaceIdiom`: whether the device shows a pointer.
    "UIDevice",
    # The feedback generators, the window's haptic actuator (ADR-0210).
    "UIFeedbackGenerator",
    "UIImpactFeedbackGenerator",
    "UINotificationFeedbackGenerator",
    "UISelectionFeedbackGenerator",
    # The invisible responder the system keyboard types into (ADR-0255
    # decision 11): the protocol, its traits, and the writing direction its
    # positions answer.
    "UITextInput",
    "UITextInputTraits",
    "NSText",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    # `CACurrentMediaTime`, the clock the link stamps its ticks on.
    "CABase",
    "CADisplayLink",
    # `CAFrameRateRange` is the type of `preferredFrameRateRange`; the
    # `objc2-core-foundation` feature gates the link's `timestamp` and
    # `targetTimestamp`, whose difference is the cadence the link runs at.
    "CAFrameRateRange",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
] }
block2.workspace = true
dispatch2 = "0.3.1"
# Core Haptics plays haptic patterns exactly (ADR-0210 §7).
objc2-core-haptics = { workspace = true, features = [
    "std",
    "block2",
    "CHHapticEngine",
    "CHHapticPattern",
    "CHHapticEvent",
    "CHHapticParameter",
    "CHHapticPatternPlayer",
    "CHHapticDeviceCapability",
] }

# UIA bridge for Windows, which every Win32 window builds. Version cohort must
# match the workspace `accesskit` (0.25) -- 0.35 is that cohort -- and its
# `windows` dependency (0.62) matches the backend's own, so no duplicate
# windows-rs stack is linked.
[target.'cfg(target_os = "windows")'.dependencies.accesskit_windows]
version = "0.35.1"

# NSAccessibility bridge for macOS, which every AppKit window builds, in the
# same 0.25 accesskit cohort. Uses the same objc2 binding family as the
# backend.
[target.'cfg(target_os = "macos")'.dependencies.accesskit_macos]
version = "0.27.1"

# UIAccessibility (ADR-0255 decision 12): the low-level adapter, which the
# window's own view forwards to. Same 0.25 accesskit cohort; it is built on
# objc2 0.5 beside FLUI's 0.6, and the two meet only through raw pointers.
# VoiceOver's cursor reaches FLUI through a hook the published adapter does not
# have yet (gap 36), so the build takes the vendored copy listed in
# third_party/README.md. A path dependency, not a root `[patch]`: a patch binds
# only this workspace, and an app depending on FLUI by path or git would build
# the published crate, which lacks the hook.
[target.'cfg(target_os = "ios")'.dependencies.accesskit_ios]
version = "0.2.2"
path = "../../third_party/accesskit_ios"

# TalkBack (gap 2 of docs/gaps.md): the low-level adapter, which `FluiView`'s
# node provider forwards to on the Java main thread. Same 0.25 accesskit
# cohort. It is built on jni 0.21 beside FLUI's 0.22, and the two meet only
# through raw pointers (the environment and the view in, the node info out),
# until accesskit_android moves to jni 0.22. TalkBack's cursor needs a hook the
# published adapter keeps private, so the build takes the vendored copy, by
# path for the reason given at accesskit_ios.
[target.'cfg(target_os = "android")'.dependencies.accesskit_android]
version = "0.9.1"
path = "../../third_party/accesskit_android"

[features]
default = ["desktop"]

# The native desktop hosts, selected by target OS: on Linux the Wayland and
# X11 hosts, of which the session picks one; Windows and macOS need no feature.
# The optional winit fallback belongs to `winit-backend` alone.
desktop = ["wayland", "x11"]

# Linux display server protocols. `wayland` is the native Wayland host and `x11`
# the native X11 host (`hosts::linux`), and both read the outputs and their
# refresh rates from the server for the display source (`display::linux`). On
# other targets the features exist and add nothing.
wayland = [
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-backend",
    "dep:rustix",
    "dep:xkbcommon-dl",
    "dep:wayland-cursor",
]

# winit fallback backend — the Linux host `current_platform` picks while it is
# built, until the native Wayland and X11 hosts are complete (ADR-0151 §11);
# optional on Windows/macOS.
winit-backend = [
    "dep:winit",
    "dep:arboard",
    "dep:crossbeam-channel",
    "dep:ui-events-winit",
    "dep:keyboard-types",
    # The winit backend takes its Linux display list from the compositor
    # through these two (the dependencies themselves exist on Linux only).
    "wayland",
    "x11",
]

# Web platform
# Honest note (verified 2026-08-04): no-op selector — zero
# `feature = "web"` references in this crate's src. The web host and each
# feature's `web` file are gated by `#[cfg(target_arch = "wasm32")]` on the
# actual compile target (`src/hosts/mod.rs`), not by this flag; enabling or
# disabling it changes nothing observable. Kept as a forward-compatible name
# for downstream `Cargo.toml`s, mirroring `desktop`.
web = []
x11 = ["dep:x11rb", "dep:rustix", "dep:xkbcommon-dl"]

# Debug builds only: `journal::capture` journals every pointer registry call
# on a thread as a native recording (ADR-0215 §4), for turning a session on a
# native host into a checked-in test; with it comes the recording codec.
native-capture = ["dep:flui-protocol", "dep:serde", "dep:serde_json"]

# The `testing` module (ADR-0243): what a test of a native host's windows
# needs from the host itself, such as turns of the AppKit event loop, and the
# native recording codec the tests replay recordings through. Off by
# default and not part of the release API; this crate's tests turn it on
# through the dev-dependency on itself.
testing = ["dep:flui-protocol", "dep:serde", "dep:serde_json"]

# The `unexpected_cfgs` check-cfg declaration for objc 0.2's
# `cfg(feature = "cargo-clippy")` probes lives in build.rs — Cargo forbids
# mixing local lint keys with `workspace = true`.
[lints]
workspace = true

[build-dependencies]
# Names the compound `cfg` conditions once (`build.rs`), such as `linux_host`.
cfg_aliases = { workspace = true }

[dev-dependencies]
# `assert_backend_conforms` (ADR-0215 §7) over the shared decoders and the
# headless backend. Checkout-only test edge: versionless, so Cargo drops it
# from the published manifest; flui-testing never depends on this crate.
flui-testing = { path = "../flui-testing" }
# `text::apple::composition`'s rules, which run on every host.
icu_segmenter.workspace = true
# `fonts::android`'s parse, which runs on every host over recorded files.
roxmltree.workspace = true
# The host's own test support, the `testing` module. Checkout-only test edge:
# versionless, so Cargo drops it from the published manifest.
flui-native = { path = ".", features = ["testing"] }
# Application-side error handling in tests only — never a normal
# dependency again: no `anyhow` token may appear in this crate's public API.
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
# Exact diagnostics for owner capabilities and retired public names.
trybuild = { workspace = true }
# The native recordings read straight into `flui-protocol`'s schema, as a
# reader without this crate reads them, and the browser fixtures' JSON. A
# replay reproduces the delivered floats only if every number reads back to
# the bits it was written from, which serde_json's default parser does not
# guarantee.
flui-protocol = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }

# Browser API fixtures mutate JS globals and therefore have their own process.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

# A DXGI swap chain on a test window, presented the way a renderer presents,
# whose frame statistics the window turns into its presentation report
# (`the_win32_window_conforms`).
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# The harnesses that run their cases on the main thread, where winit builds
# its event loop (`linux_preferences`, `os_extensions`).
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dev-dependencies]
libtest-mimic.workspace = true

# The X11 host's input tests press keys and buttons and move the pointer on
# their own X server through XTest, as a user's devices do; `wayland_input`
# drives a Weston's X11 backend the same way.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { workspace = true, features = ["xtest"] }
# The stand-in D-Bus services the logind and portal tests serve.
zbus = { workspace = true, features = ["service"] }

# Main-thread winit ownership plus one private D-Bus service per process.
# libtest-mimic supplies the Cargo/nextest protocol without a custom parser.
[[test]]
name = "linux_preferences"
path = "tests/linux_preferences.rs"
harness = false
required-features = ["winit-backend"]

# An OS extension on another host's windows, the winit host's among them: its
# own harness, because winit builds its event loop on the main thread only.
[[test]]
name = "os_extensions"
path = "tests/os_extensions.rs"
harness = false

# The AppKit window against the window conformance checks: its own harness,
# because AppKit windows are built on the main thread.
[[test]]
name = "appkit_window"
path = "tests/appkit_window.rs"
harness = false

# The native X11 host's window against the window conformance checks, and its
# loop: its own harness, because it starts an X server and a window manager of
# its own before anything connects.
[[test]]
name = "x11_window"
path = "tests/x11_window.rs"
harness = false
required-features = ["x11"]

# The native Wayland host's input from a real compositor seat: its own
# harness, because it starts an X server and a Weston on it and names that
# Weston in the process's environment before anything connects.
[[test]]
name = "wayland_input"
path = "tests/wayland_input.rs"
harness = false
required-features = ["wayland"]

# The native Wayland host's clipboard between two clients of a Weston on an
# X server of its own: its own harness, for the same reason.
[[test]]
name = "wayland_clipboard"
path = "tests/wayland_clipboard.rs"
harness = false
required-features = ["wayland"]

[[test]]
name = "wayland_primary_selection"
path = "tests/wayland_primary_selection.rs"
harness = false
required-features = ["wayland"]

# The native Wayland host's own window frame under a compositor that draws
# none (Weston's desktop shell), read back from the X server it runs on and
# driven through XTest: its own harness, for the same reason.
[[test]]
name = "wayland_frame"
path = "tests/wayland_frame.rs"
harness = false
required-features = ["wayland"]

[[test]]
name = "wasm32"
path = "tests/wasm32.rs"

# The web backend's producer in a real browser (headless Chrome). Its own
# target because `cargo xtask wasm-test` runs `wasm32` on node, which has no DOM.
[[test]]
name = "web_browser"
path = "tests/web_browser.rs"

# Nested Cargo stays separate from the native platform contract binary.
[[test]]
name = "compiler_guards"
path = "tests/compiler_guards.rs"

[[test]]
name = "platform_it"
path = "tests/main.rs"

# Own target: installs a counting `#[global_allocator]`, which is process-wide.
[[test]]
name = "pointer_assembly_allocation"
path = "tests/pointer_assembly_allocation.rs"

# Deliberately its own process: these tests WRITE the process-wide
# `FLUI_HEADLESS` env var (`unsafe env::set_var`/`remove_var`) to exercise
# headless-backend selection; env vars are process-global, so isolation —
# not opt-in locking — keeps the rest of the suite (which READS
# `FLUI_HEADLESS`) from racing the mutation.
[[test]]
name = "headless"
path = "tests/headless.rs"

# Re-export dependencies that might be needed by consumers
[package.metadata.docs.rs]
all-features = true

# Exercise the exact asynchronous UIKit error block on an Apple host.
[target.'cfg(target_os = "macos")'.dev-dependencies]
block2.workspace = true
# The AppKit conformance fixture presents Metal drawables into its window's
# layer, as wgpu does, to see the layer report them.
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLDrawable",
    "MTLPixelFormat",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
] }

# Layer 3, not the substrate's 2: its `flui-semantics` edge (the
# `PlatformAccessibility` trait, ADR-0082 §2) points at layer 3. Only
# `flui-app` (layer 9) depends on it, so nothing below is affected.
[package.metadata.flui]
layer = 3
tier = "H"
tier-kind = "internal"
order = 1
# ADR-0082 §2: only composition roots link the OS backends. Crates that
# program against a capability trait depend on `flui-platform` instead.
# Examples and tools are applications and are exempt from this list.
allowed-dependents = ["flui-app"]
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "owner::windows::WindowIdentity::source::NEXT", grant = "ADR-0097", class = "counter", reason = "Windows backend identities, advanced by try_update with permanent exhaustion refusal before native acquisition" },
    { item = "input::android::AndroidInput::motion::FIRST_MOTION_SEEN", grant = "ADR-0097", class = "diagnostic", reason = "logs the first motion event at a higher level; no behavior reads it" },
    { item = "owner::slot::LAST_SLOT_KEY", grant = "ADR-0097", class = "counter", reason = "owner-slot keys, advanced by `try_update` so exhaustion refuses the slot instead of reissuing a key" },
    { item = "owner::slot::OWNER_VALUES", exit = "ADR-0082", reason = "owner-thread storage of the shared backends' non-Send input callbacks until each backend's owner context holds them, as Win32's does" },
    { item = "window::state::NEXT_CAPABILITIES_OWNER", grant = "ADR-0097", class = "counter", reason = "capabilities owners, one per window cell, advanced by a checked `fetch_update` so exhaustion refuses instead of reissuing an owner" },
    { item = "window::headless::NEXT_HEADLESS_WINDOW_ID", grant = "ADR-0097", class = "counter", reason = "headless window IDs, advanced by `try_update` so exhaustion is an error" },
    { item = "owner::apple::ios::DELEGATE_STATE", grant = "ADR-0097", class = "trampoline", reason = "UIKit delegate methods reach the platform through it; they carry no user-data pointer" },
    { item = "owner::apple::macos::display_pass::IN_DISPLAY_PASS", grant = "ADR-0097", class = "process", reason = "marks AppKit's display pass (the view's `updateLayer`) on the main thread, which the process has once" },
    { item = "owner::apple::macos::owner_lane::ON_OWNER_QUEUE", grant = "ADR-0097", class = "process", reason = "marks a block running on the owner GCD queue, which the process has once" },
    { item = "owner::apple::macos::owner_lane::owner_queue::Q", grant = "ADR-0097", class = "process", reason = "the owner GCD queue, created once per process" },
    { item = "owner::apple::macos::content_view::view_class::INIT", grant = "ADR-0097", class = "process", reason = "registers the Objective-C view class, which the runtime holds once per process" },
    { item = "owner::apple::macos::wake_pump::base::BASE", grant = "ADR-0097", class = "immutable", reason = "the wake pump's time base, set once and read for the process's life" },
    { item = "clipboard::windows::owner_window::OWNER", grant = "ADR-0097", class = "process", reason = "the message-only window that owns the system clipboard, created once per process" },
    { item = "window::apple::macos::delegate::get_or_create_delegate_class::INIT", grant = "ADR-0097", class = "process", reason = "registers the Objective-C window delegate class, which the runtime holds once per process" },
    { item = "window::apple::macos::window_class::INIT", grant = "ADR-0097", class = "process", reason = "registers the Objective-C window class, which the runtime holds once per process" },
    { item = "owner::windows::control::REGISTERED", grant = "ADR-0097", class = "process", reason = "the registered Win32 owner-control window class, which Windows holds once per process" },
    { item = "owner::windows::WINDOW_CLASS", grant = "ADR-0097", class = "process", reason = "Windows' registration of FLUI's window class with the host whose hooks its procedure dispatches to: Windows holds the class, and the procedure it was registered with, once per process, so a second host is refused" },
    { item = "owner::windows::CLASS_ON_THREAD", grant = "ADR-0097", class = "trampoline", reason = "the Win32 window procedure is called with a window's handle and no pointer of FLUI's: it reads here the hooks of FLUI's window class on its thread, each of which keeps its own state of a window, keyed by the window's identity" },
    { item = "owner::winit::ACTIVE_EVENT_LOOP", grant = "ADR-0097", class = "trampoline", reason = "winit's event-loop borrow, reached from its callbacks for same-thread window creation" },
    { item = "clipboard::lock::CLIPBOARD", grant = "ADR-0097", class = "process", reason = "serializes access to the system clipboard, which the process shares with every window" },
    { item = "clipboard::lock::reentrancy::SESSION_OPEN", grant = "ADR-0097", class = "diagnostic", reason = "debug-build detection of a nested clipboard session; it only asserts" },
    { item = "journal::capture::INSTALLED", grant = "ADR-0097", class = "diagnostic", reason = "debug-build `native-capture` journal of pointer registry calls; it only observes" },
]

[package.metadata.flui.modules]
# Import directions between the core host's modules (ADR-0151 §10), checked by
# `cargo xtask module-dag`: nothing names `hosts`, which names everything; the
# owner thread, the OS versions and the storage position's vocabulary name no
# feature. Every other top-level module is `crate-level`, and one with no role
# is a finding (`table_test` is built for tests only and needs none; the root,
# `lib.rs`, is no module).
features = [
    "display",
    "text",
    "preferences",
    "lifecycle",
    "clipboard",
    "drag",
    "accessibility",
    "haptics",
    "window",
    "input",
    "fonts",
]
platforms = ["windows", "apple", "android", "web", "linux", "winit", "headless"]
groups = { apple = ["macos", "ios"], linux = ["wayland", "x11"] }
base = ["owner", "version", "storage"]
hosts = "hosts"
crate-level = [
    "host",
    "platform",
    "host_window",
    "error",
    "executor",
    "task",
    "os",
    "testing",
    "journal",
    "process",
]
# The one edge between platform files of one feature: the winit host on Linux
# reads the compositor's outputs through the Linux source, which leaves with
# winit. No window file names another feature's: a window's text input,
# accessibility, actuator and chrome come from the host table, a feature keeps
# its own state of a window, and the owner hands a window the facts it reads.
exceptions = [
    { from = "display::winit", to = "display::linux", exit = "ADR-0151", since = "2026-10-22", reason = "the winit host on Linux takes its displays from the Linux source (display::linux) until the native Linux host replaces winit (ADR-0151 §11)" },
]
[package.metadata.flui.api-closure]
# The only upstream crates a public path may name: the raw handles
# (ADR-0089 §2), the contract's cursor, the lock the window's callback setters
# hand out, the pointer assembly's inline buffers (hidden, for `tests/`) and the
# web's `Instant`. Anything else, an OS binding first, is a finding.
allow = ["cursor_icon", "parking_lot", "raw_window_handle", "smallvec", "web_time"]
# The windows' accessibility bridges implement `flui-semantics`' trait, whose
# methods take AccessKit's tree.
traits = [{ trait = "flui_semantics::platform::PlatformAccessibility", crate = "accesskit" }]
# The Activity is the system's, handed only to the application's
# `android_main`: the composition root passes it on through this one entry, as
# the facade's `run_app_android` takes it.
entries = [{ item = "flui_native::android_platform", crate = "android_activity" }]
# Each target the core builds a host for, with the features that add public
# items there.
targets = [
    { target = "x86_64-unknown-linux-gnu", all-features = true },
    { target = "x86_64-pc-windows-msvc", all-features = true },
    { target = "aarch64-apple-darwin", all-features = true },
    { target = "aarch64-apple-ios" },
    { target = "aarch64-linux-android" },
    { target = "wasm32-unknown-unknown" },
]
