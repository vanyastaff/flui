<!doctype html>
<meta charset="utf-8">
<title>FLUI browser contracts</title>
<style>
body { font: 16px monospace; padding-top: 96px; }

</style>
<nav>
  <button id="input">Install input</button>
  <button id="events">Check pointer and wheel events</button>
  <button id="cancel">Check browser cancellation</button>
  <button id="capture-loss">Check capture loss</button>
  <button id="fractional">Check fractional positions</button>
  <button id="owned-wheel">Check wheel units and precision</button>
  <button id="owned-keyboard">Check Web key vocabulary and Unicode</button>
  <button id="canvas-ownership">Check canvas ownership and recovery (fresh page)</button>
  <button id="keyboard-dispatch">Check independent keyboard dispatch bits (fresh page)</button>
  <button id="registration-rollback">Check registration rollback (fresh page)</button>
  <button id="registration-focus">Check focus during registration (fresh page)</button>
  <button id="document-visibility">Check document visibility source and retirement (fresh page)</button>
  <button id="pointer-retirement">Arm trusted pointer retirement matrix (fresh page)</button>
  <button id="frame-retirement">Check frame retirement and replacement (fresh page)</button>
  <button id="keyboard-getter-reentry">Check keyboard getter reentry (fresh page)</button>
  <button id="wheel-getter-reentry">Check wheel getter reentry (fresh page)</button>
  <button id="pen-samples">Check pen samples</button>
  <button id="chord">Check native pointer chord</button>
  <button id="sensor-validation">Check pen sensor validation</button>

  <button id="getter-reentry">Check getter reentry (fresh page)</button>

<pre id="loaded">Loading wasm</pre>
<script type="module">
import init, {
  input_probe, keyboard_window_probe, frame_retirement_probe, display_probe, created_callback_probe, quit_callback_probe,
} from './browser_input_probe.js';

const report = (id, text) => {
  let node = document.getElementById(id);
  if (!node) {
    node = document.createElement('pre');
    node.id = id;
    document.body.append(node);
  }
  node.textContent = text;
};
const check = (id, run) => {
  try {
    run();
    report(id, 'PASS');
  } catch (error) {
    report(id, `FAIL: ${error}`);
  }
};
const equal = (actual, expected) => {
  for (const [key, value] of Object.entries(expected)) {
    if (actual[key] !== value) {
      throw new Error(`${key}: expected ${value}, got ${actual[key]}`);
    }
  }
};

await init();
report('loaded', 'wasm loaded');
let inputOwner;
document.getElementById('input').onclick = () => check('input-check', () => {
  inputOwner?.close();
  inputOwner?.free();
  inputOwner = input_probe();
});
document.getElementById('canvas-ownership').onclick = () => check('canvas-ownership-check', () => {
  if (inputOwner) throw new Error('Run on a fresh page');
  const host = document.createElement('input');
  document.body.append(host);
  host.focus();
  const owner = keyboard_window_probe('contract', false, true);
  const canvas = document.querySelector('canvas');
  equal(JSON.parse(owner.snapshot()), { focused: false, active: false, capture_alive: true, surface_available: true });
  const key = (target, value) => {
    const event = new KeyboardEvent('keydown', { key: value, bubbles: true, cancelable: true });
    target.dispatchEvent(event);
    return event;
  };
  let ancestors = 0;
  let peers = 0;
  const ancestor = () => { ancestors += 1; };
  const peer = () => { peers += 1; };
  document.body.addEventListener('keydown', ancestor);
  canvas.addEventListener('keydown', peer);
  try {
    equal({ prevented: key(host, 'h').defaultPrevented }, { prevented: false });
    canvas.focus();
    equal({ prevented: key(canvas, 'q').defaultPrevented }, { prevented: true });
    equal({ ancestors, peers, keys: document.getElementById('focus-keys-contract')?.textContent }, { ancestors: 1, peers: 1, keys: 'q,' });
    equal({ focus: document.getElementById('focus-state-contract')?.textContent }, { focus: 'true:true:true,' });
    let refused = false;
    try { keyboard_window_probe('duplicate', true, false); } catch { refused = true; }
    if (!refused) throw new Error('Second live owner was admitted');
    host.focus();
    equal({ focus: document.getElementById('focus-state-contract')?.textContent }, { focus: 'true:true:true,false:false:false,' });
    owner.close();
    owner.close();
    equal(JSON.parse(owner.snapshot()), { capture_alive: false, surface_available: false });
    equal({ capture: owner.install_late_input() }, { capture: false });
    canvas.focus();
    equal({ prevented: key(canvas, 'r').defaultPrevented }, { prevented: false });
    const next = owner.reopen('reopened', true, false);
    try {
      equal(JSON.parse(next.snapshot()), { surface_available: true });
      equal(JSON.parse(owner.snapshot()), { surface_available: false });
      key(canvas, 's');
      equal({ old: document.getElementById('focus-keys-contract')?.textContent, next: document.getElementById('focus-keys-reopened')?.textContent }, { old: 'q,', next: 's,' });
    } finally {
      next.close();
      equal(JSON.parse(next.snapshot()), { surface_available: false });
      next.free();
    }
  } finally {
    document.body.removeEventListener('keydown', ancestor);
    canvas.removeEventListener('keydown', peer);
    owner.close(); owner.free(); host.remove();
  }
});
document.getElementById('keyboard-dispatch').onclick = () => check('keyboard-dispatch-check', () => {
  if (inputOwner) throw new Error('Run on a fresh page');
  let row = 0;
  for (const propagate of [false, true]) for (const prevent of [false, true]) {
    const owner = keyboard_window_probe(`dispatch-${row++}`, propagate, prevent);
    const canvas = document.querySelector('canvas');
    canvas.focus();
    let ancestors = 0;
    let peers = 0;
    const ancestor = () => { ancestors += 1; };
    const peer = () => { peers += 1; };
    document.body.addEventListener('keydown', ancestor);
    document.body.addEventListener('keyup', ancestor);
    canvas.addEventListener('keydown', peer);
    canvas.addEventListener('keyup', peer);
    try {
      for (const type of ['keydown', 'keyup']) for (const cancelable of [false, true]) for (const cancelled of [false, true]) {
        const source = new KeyboardEvent(type, { key: 'q', bubbles: true, cancelable });
        if (cancelled) source.preventDefault();
        const beforeAncestor = ancestors;
        const beforePeer = peers;
        const accepted = canvas.dispatchEvent(source);
        const prevented = cancelable && (prevent || cancelled);
        equal({ prevented: source.defaultPrevented, accepted, ancestors: ancestors - beforeAncestor, peers: peers - beforePeer }, {
          prevented, accepted: !prevented, ancestors: Number(propagate), peers: 1,
        });
      }
    } finally {
      for (const type of ['keydown', 'keyup']) {
        document.body.removeEventListener(type, ancestor);
        canvas.removeEventListener(type, peer);
      }
      owner.close(); owner.free();
    }
  }
});
document.getElementById('registration-rollback').onclick = () => check('registration-rollback-check', () => {
  if (inputOwner) throw new Error('Run on a fresh page');
  const canvas = document.createElement('canvas');
  canvas.id = 'flui-canvas';
  document.body.append(canvas);
  const original = canvas.addEventListener;
  let refused = false;
  canvas.addEventListener = function(type, listener, options) {
    original.call(this, type, listener, options);
    if (type === 'keyup') throw new Error('installed prefix failure');
  };
  try { keyboard_window_probe('failed', true, false); } catch { refused = true; }
  finally { canvas.addEventListener = original; }
  if (!refused || document.getElementById('created-failed')) throw new Error('Partial opening published Created');
  const next = keyboard_window_probe('retry', true, false);
  try {
    canvas.focus();
    canvas.dispatchEvent(new KeyboardEvent('keydown', { key: 'r' }));
    equal({ keys: document.getElementById('focus-keys-retry')?.textContent }, { keys: 'r,' });
  } finally { next.close(); next.free(); }
});
document.getElementById('registration-focus').onclick = () => check('registration-focus-check', () => {
  if (inputOwner) throw new Error('Run on a fresh page');
  const host = document.createElement('input');
  const canvas = document.createElement('canvas');
  canvas.id = 'flui-canvas';
  document.body.append(host, canvas);
  host.focus();
  const original = canvas.addEventListener;
  let changed = false;
  canvas.addEventListener = function(type, listener, options) {
    original.call(this, type, listener, options);
    if (!changed) { changed = true; canvas.focus(); }
  };
  let owner;
  try {
    owner = keyboard_window_probe('installation-focus', true, false);
    equal({ actual: document.activeElement === canvas, ...JSON.parse(owner.snapshot()) }, { actual: true, focused: true, active: true });
    host.focus();
    equal(JSON.parse(owner.snapshot()), { focused: false, active: false });
    equal({ focus: document.getElementById('focus-state-installation-focus')?.textContent }, { focus: 'false:false:false,' });
  } finally {
    canvas.addEventListener = original;
    owner?.close(); owner?.free(); host.remove();
  }
});
document.getElementById('document-visibility').onclick = () => check('document-visibility-check', () => {
  if (inputOwner) throw new Error('Run on a fresh page');
  // Controlled document source, real registration and public window handles.
  // This does not claim an OS/browser tab switch occurred.
  const descriptor = Object.getOwnPropertyDescriptor(document, 'hidden');
  const text = Object.getOwnPropertyDescriptor(Node.prototype, 'textContent');
  const add = EventTarget.prototype.addEventListener;
  const owners = [];
  let hidden = true;
  Object.defineProperty(document, 'hidden', { configurable: true, get: () => hidden });
  const emit = value => { hidden = value; document.dispatchEvent(new Event('visibilitychange')); };
  const output = label => document.getElementById(`visibility-state-${label}`)?.textContent || '';
  try {
    const owner = keyboard_window_probe('visibility', true, false); owners.push(owner);
    equal(JSON.parse(owner.snapshot()), { visible: false });
    report('visibility-initial', 'PASS');
    emit(false); emit(false); emit(true);
    equal({ trace: output('visibility'), ...JSON.parse(owner.snapshot()) }, { trace: 'true:true,false:false,', visible: false });
    emit(false);
    report('visibility-transitions', 'PASS');
    let fired = false;
    Object.defineProperty(Node.prototype, 'textContent', { ...text, set(value) {
      text.set.call(this, value);
      if (this.id === 'focus-keys-visibility' && !fired) { fired = true; emit(true); emit(false); }
    }});
    const canvas = document.querySelector('canvas'); canvas.focus();
    canvas.dispatchEvent(new KeyboardEvent('keydown', { key: 'v', bubbles: true }));
    Object.defineProperty(Node.prototype, 'textContent', text);
    equal({ fired, trace: output('visibility') }, { fired: true, trace: 'true:true,false:false,true:true,false:false,true:true,' });
    report('visibility-causal', 'PASS');
    owner.close_on('visibility'); emit(true);
    equal({ trace: document.getElementById('close-prefix')?.textContent, ...JSON.parse(owner.snapshot()) }, { trace: 'visibility,returned,closed,', surface_available: false });
    emit(false);
    const next = owner.reopen('visibility-next', true, false); owners.push(next);
    emit(true);
    equal({ trace: output('visibility-next'), old: output('visibility') }, { trace: 'false:false,', old: 'true:true,false:false,true:true,false:false,true:true,' });
    next.close(); emit(false);
    equal({ trace: output('visibility-next') }, { trace: 'false:false,' });
    report('visibility-retirement', 'PASS');
    let changed = false;
    EventTarget.prototype.addEventListener = function(kind, listener, options) {
      const result = add.call(this, kind, listener, options);
      if (this instanceof HTMLCanvasElement && !changed) { changed = true; hidden = true; }
      return result;
    };
    const installed = keyboard_window_probe('visibility-installed', true, false); owners.push(installed);
    EventTarget.prototype.addEventListener = add;
    equal({ changed, ...JSON.parse(installed.snapshot()) }, { changed: true, visible: false });
    installed.close();
    report('visibility-installation', 'PASS');
    EventTarget.prototype.addEventListener = function(kind, listener, options) {
      add.call(this, kind, listener, options);
      if (this === document && kind === 'visibilitychange') throw new Error('visibility source admission refused');
    };
    let refused = false;
    try { const partial = keyboard_window_probe('visibility-refused', true, false); owners.push(partial); } catch { refused = true; }
    EventTarget.prototype.addEventListener = add;
    equal({ refused, created: document.getElementById('created-visibility-refused')?.textContent || '' }, { refused: true, created: '' });
    const repaired = keyboard_window_probe('visibility-repaired', true, false); owners.push(repaired);
    equal(JSON.parse(repaired.snapshot()), { visible: false });
    emit(false);
    equal({ trace: output('visibility-repaired') }, { trace: 'true:true,' });
    report('visibility-rollback', 'PASS');
  } finally {
    EventTarget.prototype.addEventListener = add;
    Object.defineProperty(Node.prototype, 'textContent', text);
    for (const owner of owners) { owner.close(); owner.free(); }
    if (descriptor) Object.defineProperty(document, 'hidden', descriptor);
    else delete document.hidden;
  }
});

document.getElementById('pointer-retirement').onclick = () => check('pointer-retirement-armed', () => {
  if (inputOwner) throw new Error('Run on a fresh page');
  const cases = ['pointerId', 'buttons', 'capture-close', 'getter-reopen', 'capture-reopen-admitted'];
  let row = 0;
  const arm = () => {
    const mode = cases[row];
    const owner = keyboard_window_probe(`pointer-${mode}`, true, false);
    const canvas = document.querySelector('canvas');
    canvas.style.cssText = 'display:block;width:240px;height:140px;background:#ccd';
    report('pointer-retirement-prompt', `Click the canvas: ${mode} (${row + 1}/${cases.length})`);
    canvas.addEventListener('pointerdown', event => {
      if (!event.isTrusted) { owner.close(); owner.free(); throw new Error('Use trusted pointer input'); }
      const id = event.pointerId;
      const buttons = event.buttons;
      const originalCapture = canvas.setPointerCapture;
      let next;
      let entered = false;
      if (mode === 'pointerId' || mode === 'buttons' || mode === 'getter-reopen') {
        const property = mode === 'buttons' ? 'buttons' : 'pointerId';
        Object.defineProperty(event, property, { get() {
          if (!entered) {
            entered = true;
            owner.close();
            if (mode === 'getter-reopen') next = owner.reopen('pointer-new-unadmitted', true, false);
          }
          return property === 'buttons' ? buttons : id;
        } });
      } else {
        canvas.setPointerCapture = function(pointer) {
          if (!entered) {
            entered = true;
            owner.close();
            if (mode === 'capture-reopen-admitted') {
              next = owner.reopen('pointer-new-admitted', true, false);
              canvas.dispatchEvent(new PointerEvent('pointerdown', {
                pointerId: id, pointerType: event.pointerType, button: 0, buttons,
                clientX: event.clientX, clientY: event.clientY,
              }));
            }
          }
          originalCapture.call(this, pointer);
        };
      }
      // A trusted event can checkpoint microtasks between capture and bubble
      // listener invocations. Observe in a later task, after delivery finishes.
      setTimeout(() => {
        try {
          canvas.setPointerCapture = originalCapture;
          equal({ entered, captured: canvas.hasPointerCapture(id), ...JSON.parse(owner.snapshot()) }, {
            entered: true, captured: mode === 'capture-reopen-admitted', capture_alive: false, surface_available: false,
          });
          next?.close();
          equal({ captured: canvas.hasPointerCapture(id) }, { captured: false });
          report(`pointer-retirement-${mode}`, 'PASS');
          row += 1;
          if (row === cases.length) report('pointer-retirement-check', 'PASS');
          // Arm the next case from a separate button click, after release of
          // the current physical contact; no synthetic event proves this part.
          else document.getElementById('pointer-retirement').onclick = () => arm();
        } catch (error) { report('pointer-retirement-check', `FAIL: ${error}`); }
        finally { owner.close(); owner.free(); next?.close(); next?.free(); }
      }, 0);
    }, { once: true, capture: true });
  };
  arm();
});
document.getElementById('frame-retirement').onclick = async () => {
  let owner;
  let timer;
  report('frame-callbacks', '');
  report('frame-redraws', '');
  const callbacks = document.getElementById('frame-callbacks');
  const redraws = document.getElementById('frame-redraws');
  const text = Object.getOwnPropertyDescriptor(Node.prototype, 'textContent');
  try {
    if (inputOwner) throw new Error('Run on a fresh page');
    let oldFrames = 0;
    let newFrames = 0;
    let complete;
    const finished = new Promise((resolve, reject) => {
      complete = resolve;
      timer = setTimeout(() => reject(new Error('Frame contract timed out')), 3000);
    });
    Object.defineProperty(callbacks, 'textContent', {
      configurable: true,
      get() { return text.get.call(this); },
      set(value) {
        text.set.call(this, value);
        if (value.endsWith('old,')) {
          oldFrames += 1;
          owner.reopen('new');
        } else if (value.endsWith('new,')) newFrames += 1;
      },
    });
    Object.defineProperty(redraws, 'textContent', {
      configurable: true,
      get() { return text.get.call(this); },
      set(value) {
        text.set.call(this, value);
        // The old receipt cannot emit a redraw for the newly installed slot.
        if (newFrames === 0) throw new Error('Retired receipt published redraw');
        owner.close();
        complete();
      },
    });
    owner = frame_retirement_probe('old');
    await finished;
    equal({ oldFrames, newFrames, active: owner.platform_active(), redraws: redraws.textContent }, { oldFrames: 1, newFrames: 1, active: false, redraws: 'redraw,' });
    report('frame-retirement-check', 'PASS');
  } catch (error) { report('frame-retirement-check', `FAIL: ${error}`); }
  finally {
    clearTimeout(timer);
    delete callbacks.textContent;
    delete redraws.textContent;
    owner?.free();
  }
};
document.getElementById('display').onclick = () => check('display-check', () => {
  const actual = JSON.parse(display_probe());
  const expected = {
    width: Math.round(screen.width * devicePixelRatio),
    height: Math.round(screen.height * devicePixelRatio),
    scale: devicePixelRatio,
  };
  report('display-result', JSON.stringify(actual));
  report('display-expected', JSON.stringify(expected));
  equal(actual, expected);
});
document.getElementById('created').onclick = () => check('created-check', () => {
  created_callback_probe();
  equal({ result: document.getElementById('created-finished')?.textContent }, { result: 'returned' });
});
document.getElementById('quit').onclick = () => check('quit-check', () => {
  quit_callback_probe();
  equal({ result: document.getElementById('quit-finished')?.textContent }, { result: 'returned' });
});
document.getElementById('events').onclick = () => check('events-check', () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) throw new Error('Install input first');
  const rect = canvas.getBoundingClientRect();
  const common = {
    clientX: rect.left + 80, clientY: rect.top + 40,
    pointerId: 1, pointerType: 'mouse', bubbles: true,
  };
  canvas.dispatchEvent(new PointerEvent('pointerdown', { ...common, button: 3, buttons: 24 }));
  canvas.dispatchEvent(new PointerEvent('pointermove', { ...common, button: -1, buttons: 24 }));
  canvas.dispatchEvent(new WheelEvent('wheel', { ...common, buttons: 24, deltaX: 3, deltaY: 6, deltaMode: 0 }));
  canvas.dispatchEvent(new PointerEvent('pointerup', { ...common, button: 4, buttons: 8 }));
  for (const kind of ['button-press', 'move', 'scroll', 'button-release']) {
    const actual = JSON.parse(document.getElementById(kind)?.textContent ?? 'null');
    if (!actual) throw new Error(`${kind} was not delivered`);
    equal(actual, { x: 80, y: 40 });
    if (kind !== 'scroll') equal(actual, { x1: true, x2: kind !== 'button-release' });
  }
});
document.getElementById('cancel').onclick = () => check('cancel-check', () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) throw new Error('Install input first');
  report('sequence', '');
  const common = { pointerId: 7, pointerType: 'touch', bubbles: true, clientX: 80, clientY: 40 };
  canvas.dispatchEvent(new PointerEvent('pointerdown', { ...common, button: 0, buttons: 1 }));
  canvas.dispatchEvent(new PointerEvent('pointercancel', { ...common, button: -1, buttons: 0 }));
  equal({ reason: document.getElementById('cancel-reason')?.textContent }, { reason: 'Platform' });
  // Capture loss after cancellation cannot deliver a second terminal event.
  canvas.dispatchEvent(new PointerEvent('lostpointercapture', common));
  canvas.dispatchEvent(new PointerEvent('pointerdown', { ...common, button: 0, buttons: 1 }));
  canvas.dispatchEvent(new PointerEvent('pointerup', { ...common, button: 0, buttons: 0 }));
  equal({ sequence: document.getElementById('sequence')?.textContent }, { sequence: 'down,cancel,down,up,' });
});
document.getElementById('owned-wheel').onclick = () => check('owned-wheel-check', () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) throw new Error('Install input first');
  for (const [deltaMode, unit] of [[0, 'Pixels'], [1, 'Lines'], [2, 'Pages']]) {
    canvas.dispatchEvent(new WheelEvent('wheel', {
      bubbles: true, clientX: 80, clientY: 40, deltaMode,
      deltaX: 1.000000000123, deltaY: -2.000000000456, shiftKey: true,
    }));
    equal(JSON.parse(document.getElementById('scroll-data').textContent), {
      unit, x: 1.000000000123, y: -2.000000000456, precision: 'Unknown', shift: true,
    });
  }
});
document.getElementById('owned-keyboard').onclick = () => check('owned-keyboard-check', () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) throw new Error('Install input first');
  canvas.focus();
  for (const [key, expectedKey, key_kind, code, location, expectedLocation] of [
    ['Dead', 'Dead', 'Named', 'Quote', 0, 'Standard'],
    ['AudioVolumeUp', 'AudioVolumeUp', 'Named', 'AudioVolumeUp', 0, 'Standard'],
    ['Enter', 'Enter', 'Named', 'NumpadEnter', 3, 'Numpad'],
    ['Tab', 'Tab', 'Named', 'Tab', 0, 'Standard'],
    ['Hyper', 'Meta', 'Named', 'MetaLeft', 1, 'Left'],
    ['Super', 'Meta', 'Named', 'MetaRight', 2, 'Right'],
    ['a', 'a', 'Character', 'KeyA', 0, 'Standard'],
    ['ж', 'ж', 'Character', 'KeyA', 0, 'Standard'],
    ['😀', '😀', 'Character', 'KeyA', 0, 'Standard'],
    [' ', ' ', 'Character', 'Space', 0, 'Standard'],
    ['\u200c', '\u200c', 'Character', 'KeyA', 0, 'Standard'],
    ['ﬃ', 'ﬃ', 'Character', 'KeyA', 0, 'Standard'],
    ['"', '"', 'Character', 'Quote', 0, 'Standard'],
    ['\\', '\\', 'Character', 'Backslash', 0, 'Standard'],
    ['\u1e0d\u0307', '\u1e0d\u0307', 'Character', 'KeyD', 0, 'Standard'],
    ['\u0915\u093e', '\u0915\u093e', 'Character', 'KeyK', 0, 'Standard'],
    ['\u0301', '\u0301', 'Character', 'KeyA', 0, 'Standard'],
    ['\u0301\u0307', '\u0301\u0307', 'Character', 'KeyA', 0, 'Standard'],
    ['\u093e', '\u093e', 'Character', 'KeyA', 0, 'Standard'],
    ['\u093e\u093e', '\u093e\u093e', 'Character', 'KeyA', 0, 'Standard'],
    ['FutureKey', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['ab', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['e\u0301', 'Unidentified', 'Named', 'KeyE', 0, 'Standard'],
    ['\u0301a', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['a\u200c', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['a\ufe0f', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['\u0307\u0323', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['\u0000', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['\u0009', 'Unidentified', 'Named', 'Tab', 0, 'Standard'],
    ['\u007f', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['\u0085', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['a\u0000', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['\ud800', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['\udc00', 'Unidentified', 'Named', 'KeyA', 0, 'Standard'],
    ['\ufffd', '\ufffd', 'Character', 'KeyA', 0, 'Standard'],
    ['z', 'z', 'Character', 'KeyZ', 0, 'Standard'],
  ]) {
    for (const [type, state, repeat] of [
      ['keydown', 'Down', 'AutoRepeat'], ['keyup', 'Up', 'First'],
    ]) {
      const source = new KeyboardEvent(type, {
        key, code, location, repeat: true, isComposing: true,
        shiftKey: true, ctrlKey: true, altKey: true, metaKey: true,
      });
      equal(source, { key, code, location, repeat: true, isComposing: true });
      report('keyboard', 'null');
      canvas.dispatchEvent(source);
      equal(JSON.parse(document.getElementById('keyboard').textContent), {
        key: expectedKey, key_kind, code, time: Math.trunc(source.timeStamp * 1_000_000),
        state, location: expectedLocation, repeat, composition: 'Active',
        shift: true, control: true, alt: true, meta: true,
      });
    }
  }
  // A refused key must not leave composition, modifiers or repeat on the next event.
  for (const [type, state] of [['keydown', 'Down'], ['keyup', 'Up']]) {
    const source = new KeyboardEvent(type, { key: 'z', code: 'KeyZ' });
    report('keyboard', 'null');
    canvas.dispatchEvent(source);
    equal(JSON.parse(document.getElementById('keyboard').textContent), {
      key: 'z', key_kind: 'Character', code: 'KeyZ',
      time: Math.trunc(source.timeStamp * 1_000_000), state, location: 'Standard',
      repeat: 'First', composition: 'Inactive',
      shift: false, control: false, alt: false, meta: false,
    });
  }
});

document.getElementById('fractional').onclick = () => check('fractional-check', () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) throw new Error('Install input first');
  const rect = canvas.getBoundingClientRect();
  const common = { clientX: rect.left + 80.25, clientY: rect.top + 40.75, bubbles: true };
  const pointer = new PointerEvent('pointermove', { ...common, pointerId: 1, pointerType: 'mouse' });
  equal({ x: pointer.clientX - rect.left, y: pointer.clientY - rect.top }, { x: 80.25, y: 40.75 });
  canvas.dispatchEvent(pointer);
  equal(JSON.parse(document.getElementById('move')?.textContent ?? 'null'), { x: 80.25, y: 40.75 });
  // WheelEvent's legacy constructor coerces fractional client coordinates
  // to integers. Use an integer source and a fractional canvas origin instead.
  const originalStyle = canvas.getAttribute('style');
  try {
    canvas.style.cssText = 'position:absolute;left:8.25px;top:51.75px;margin:0;border:2px solid transparent;padding:3px;width:200px;height:100px;box-sizing:content-box;transform:none';
    const wheelRect = canvas.getBoundingClientRect();
    equal({ left: wheelRect.left, top: wheelRect.top }, { left: 8.25, top: 51.75 });
    const wheel = new WheelEvent('wheel', { clientX: 100, clientY: 100, bubbles: true, deltaY: 1 });
    equal({ clientX: wheel.clientX, clientY: wheel.clientY }, { clientX: 100, clientY: 100 });
    report('wheel-source', JSON.stringify({ clientX: wheel.clientX, clientY: wheel.clientY, left: wheelRect.left, top: wheelRect.top, border: 2, padding: 3 }));
    canvas.dispatchEvent(new PointerEvent('pointermove', { clientX: 100, clientY: 100, pointerId: 1, pointerType: 'mouse', bubbles: true }));
    equal(JSON.parse(document.getElementById('move')?.textContent ?? 'null'), { x: 89.75, y: 46.25 });
    canvas.dispatchEvent(wheel);
    equal(JSON.parse(document.getElementById('scroll')?.textContent ?? 'null'), { x: 89.75, y: 46.25 });
    // A viewport rectangle cannot invert a transformed canvas. The browser's
    // own local-offset path must remain authoritative for this shape.
    canvas.style.transform = 'scale(2)';
    canvas.style.transformOrigin = '0 0';
    canvas.dispatchEvent(new WheelEvent('wheel', { clientX: 100, clientY: 100, bubbles: true, deltaY: 1 }));
    equal(JSON.parse(document.getElementById('scroll')?.textContent ?? 'null'), { x: 44, y: 22 });
  } finally {
    if (originalStyle === null) canvas.removeAttribute('style');
    else canvas.setAttribute('style', originalStyle);
  }
});

document.getElementById('capture').onclick = () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) return report('capture-check', 'FAIL: Install input first');
  report('sequence', '');
  report('capture-check', 'Press the canvas, drag outside its bounds, then release');
  canvas.addEventListener('pointerdown', event => {
    if (!event.isTrusted) return report('capture-check', 'FAIL: trusted pointer required');
    report('capture-admission', canvas.hasPointerCapture(event.pointerId) ? 'PASS' : 'FAIL: no native capture');
  }, { once: true });
  canvas.addEventListener('pointerup', event => {
    if (!event.isTrusted) return;
    check('capture-check', () => {
      equal({ admitted: document.getElementById('capture-admission')?.textContent }, { admitted: 'PASS' });
      if (event.clientX >= canvas.getBoundingClientRect().left && event.clientX <= canvas.getBoundingClientRect().right &&
          event.clientY >= canvas.getBoundingClientRect().top && event.clientY <= canvas.getBoundingClientRect().bottom) {
        throw new Error('release must occur outside canvas bounds');
      }
      if (!document.getElementById('sequence')?.textContent.endsWith('up,')) throw new Error('outside release was not delivered');
    });
  }, { once: true });
};

document.getElementById('pen-samples').onclick = () => check('samples-check', () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) throw new Error('Install input first');
  const rect = canvas.getBoundingClientRect();
  const make = (time, x, pressure) => {
    const event = new PointerEvent('pointermove', {
      pointerId: 11, pointerType: 'pen', isPrimary: true, bubbles: true,
      clientX: rect.left + x, clientY: rect.top + 30.5, button: -1, buttons: 1,
      pressure, tangentialPressure: 0, altitudeAngle: Math.PI / 4,
      azimuthAngle: Math.PI / 2, twist: 270, width: 7.25, height: 9.5,
    });
    Object.defineProperty(event, 'timeStamp', { value: time });
    // Dispatch each real sample object once so its browser-owned target and
    // local coordinates match the parent event's canvas. This fixture supplies
    // source lists; it does not claim physical hardware generated the lists.
    canvas.dispatchEvent(event);
    equal(event, { timeStamp: time, pressure, tangentialPressure: 0, twist: 270, width: 7.25, height: 9.5, altitudeAngle: Math.PI / 4, azimuthAngle: Math.PI / 2 });
    equal({ x: event.offsetX, y: event.offsetY }, { x, y: 30.5 });
    return event;
  };
  const first = make(10, 20.25, .125);
  const second = make(20, 40.5, .25);
  const current = make(30, 50.75, .375);
  const next = make(40, 60.25, .5);
  const last = make(50, 80.5, .75);
  // The PointerEvent constructor has no source-list arguments. Exercise the
  // platform's actual DOM method calls using explicit lists of DOM objects.
  Object.defineProperty(current, 'getCoalescedEvents', { value: () => [second, first, current, last] });
  Object.defineProperty(current, 'getPredictedEvents', { value: () => [last, first, current, next] });
  report('sample-source', JSON.stringify({ current: current.timeStamp, coalesced: current.getCoalescedEvents().map(e => e.timeStamp), predicted: current.getPredictedEvents().map(e => e.timeStamp), altitude: current.altitudeAngle, azimuth: current.azimuthAngle }));
  canvas.dispatchEvent(current);
  const actual = JSON.parse(document.getElementById('samples')?.textContent ?? 'null');
  if (!actual) throw new Error('no public samples');
  equal(actual, { kind: 'Pen { tool: Tip }', role: 'Primary' });
  equal(actual.current, { time: 30000000, x: 50.75, y: 30.5, pressure: .375, tangential: 0, width: 7.25, height: 9.5 });
  const near = (actual, expected) => { if (Math.abs(actual - expected) > 1e-12) throw new Error(`angle: expected ${expected}, got ${actual}`); };
  if (actual.current.altitude === null || actual.current.azimuth === null || actual.current.twist === null) throw new Error('pen angles missing');
  near(actual.current.altitude, Math.PI / 4); near(actual.current.azimuth, Math.PI / 2); near(actual.current.twist, 3 * Math.PI / 2);
  equal({ times: actual.coalesced.map(s => s.time).join(',') }, { times: '10000000,20000000' });
  equal({ times: actual.predicted.map(s => s.time).join(',') }, { times: '40000000,50000000' });
  equal(actual.coalesced[0], { x: 20.25, pressure: .125 });
  equal(actual.predicted[1], { x: 80.5, pressure: .75 });
});

document.getElementById('sensor-validation').onclick = () => check('sensor-validation-check', () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) throw new Error('Install input first');
  const rect = canvas.getBoundingClientRect();
  const make = (readings = {}) => {
    const event = new PointerEvent('pointermove', {
      pointerId: 1, pointerType: 'pen', isPrimary: false, bubbles: true,
      clientX: rect.left + 60.25, clientY: rect.top + 40.5,
      button: -1, buttons: 0, pressure: 0, tangentialPressure: 0,
    });
    // Deliberately malformed/absent source readings exercise the public DOM
    // boundary. Verify the source before checking the resulting owned sample.
    for (const [name, value] of Object.entries(readings)) Object.defineProperty(event, name, { value });
    return event;
  };
  const deliver = event => {
    canvas.dispatchEvent(event);
    return JSON.parse(document.getElementById('samples')?.textContent ?? 'null');
  };
  const near = (actual, expected) => { if (actual === null || Math.abs(actual - expected) > 1e-12) throw new Error(`angle: expected ${expected}, got ${actual}`); };
  for (const [altitude, azimuth, expectedAltitude, expectedAzimuth] of [
    [NaN, Math.PI / 2, null, Math.PI / 2],
    [Math.PI / 4, undefined, Math.PI / 4, null],
    [undefined, undefined, null, null],
  ]) {
    const event = make({ altitudeAngle: altitude, azimuthAngle: azimuth });
    if (!Object.is(event.altitudeAngle, altitude) || !Object.is(event.azimuthAngle, azimuth)) throw new Error('source angle precondition');
    const actual = deliver(event);
    equal(actual, { role: 'Additional' });
    equal(actual.current, { pressure: 0, tangential: 0 });
    if (expectedAltitude === null) equal(actual.current, { altitude: null }); else near(actual.current.altitude, expectedAltitude);
    if (expectedAzimuth === null) equal(actual.current, { azimuth: null }); else near(actual.current.azimuth, expectedAzimuth);
  }
  const malformed = make({ pressure: Infinity, tangentialPressure: NaN, twist: NaN, width: NaN });
  if (!Number.isNaN(malformed.twist) || malformed.pressure !== Infinity) throw new Error('source nonfinite precondition');
  equal(deliver(malformed).current, { pressure: null, tangential: null, twist: null, width: null, height: null });
  const wrapped = make({ twist: 450 });
  equal(wrapped, { twist: 450 });
  near(deliver(wrapped).current.twist, Math.PI / 2);
  const absentMethods = make({ getCoalescedEvents: undefined, getPredictedEvents: () => { throw new Error('source list unavailable'); } });
  const recovered = deliver(absentMethods);
  equal({ coalesced: recovered.coalesced.length, predicted: recovered.predicted.length }, { coalesced: 0, predicted: 0 });
  const eraser = new PointerEvent('pointermove', { pointerId: 19, pointerType: 'pen', isPrimary: true, bubbles: true, button: -1, buttons: 32, pressure: 0, clientX: rect.left + 60.25, clientY: rect.top + 40.5 });
  equal(eraser, { buttons: 32, isPrimary: true });
  equal(deliver(eraser), { kind: 'Pen { tool: Eraser }', role: 'Primary' });
  equal(JSON.parse(document.getElementById('move')?.textContent ?? 'null'), { primary: true, secondary: false });
});

document.getElementById('native-samples').onclick = () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) return report('native-samples-check', 'FAIL: Install input first');
  report('native-samples-check', 'Move the real pointer over the canvas');
  canvas.addEventListener('pointermove', event => check('native-samples-check', () => {
    if (!event.isTrusted || event.pointerType !== 'mouse') throw new Error('trusted mouse source required');
    const rect = canvas.getBoundingClientRect();
    const style = getComputedStyle(canvas);
    if (style.transform !== 'none') throw new Error('trusted source fixture requires an untransformed canvas');
    const reading = source => {
      const expectedX = source.clientX - rect.left - parseFloat(style.borderLeftWidth);
      const expectedY = source.clientY - rect.top - parseFloat(style.borderTopWidth);
      if (Math.abs(source.offsetX - expectedX) > 1e-9 || Math.abs(source.offsetY - expectedY) > 1e-9) throw new Error('native sample must retain canvas-local source coordinates');
      return { time: Math.trunc(source.timeStamp * 1000000), x: expectedX, y: expectedY };
    };
    const current = reading(event);
    const coalesced = event.getCoalescedEvents?.() ?? [];
    const predicted = event.getPredictedEvents?.() ?? [];
    report('native-sample-source', JSON.stringify({ trusted: event.isTrusted, coalescedAPI: typeof event.getCoalescedEvents, predictedAPI: typeof event.getPredictedEvents, current, coalesced: coalesced.map(reading), predicted: predicted.map(reading) }));
    const expected = (sources, before) => sources.map(reading).filter(sample =>
      (before ? sample.time <= current.time : sample.time >= current.time) &&
      !(sample.time === current.time && sample.x === current.x && sample.y === current.y)
    ).sort((a, b) => a.time - b.time);
    const actual = JSON.parse(document.getElementById('samples')?.textContent ?? 'null');
    equal(actual.current, { ...current, pressure: null });
    const positions = samples => samples.map(({ time, x, y }) => ({ time, x, y }));
    for (const [family, sources, before] of [['coalesced', coalesced, true], ['predicted', predicted, false]]) {
      if (JSON.stringify(positions(actual[family])) !== JSON.stringify(expected(sources, before))) throw new Error(`${family} differs from trusted native source`);
    }
  }), { once: true });
};

document.getElementById('getter-reentry').onclick = () => check('getter-reentry-check', () => {
  const canvas = document.querySelector('canvas');
  if (!canvas) throw new Error('Install input first');
  report('sequence', '');
  report('getter-error', 'none');
  const common = { pointerType: 'touch', bubbles: true, clientX: 80, clientY: 40, button: 0 };
  const inner = new PointerEvent('pointerdown', { ...common, pointerId: 22, buttons: 1 });
  const outer = new PointerEvent('pointerdown', { ...common, pointerId: 21, buttons: 1 });
  let entered = false;
  Object.defineProperty(outer, 'buttons', { get() {
    if (!entered) {
      entered = true;
      report('getter-stage', 'nested native DOM dispatch');
      canvas.dispatchEvent(inner);
    }
    return 1;
  } });
  const onerror = error => report('getter-error', error.message);
  window.addEventListener('error', onerror);
  try {
    canvas.dispatchEvent(outer);
    if (!entered) throw new Error('source getter was not reached');
    equal({ sequence: document.getElementById('sequence')?.textContent }, { sequence: 'down,down,' });
    canvas.dispatchEvent(new PointerEvent('pointerup', { ...common, pointerId: 22, buttons: 0 }));
    canvas.dispatchEvent(new PointerEvent('pointerup', { ...common, pointerId: 21, buttons: 0 }));
    equal({ sequence: document.getElementById('sequence')?.textContent }, { sequence: 'down,down,up,up,' });
    equal({ error: document.getElementById('getter-error')?.textContent }, { error: 'none' });
  } finally {
    window.removeEventListener('error', onerror);
  }
});
