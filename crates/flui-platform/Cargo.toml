[package]
name = "flui-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Platform abstraction layer for FLUI - cross-platform window and input handling"
# Single-binary integration-test consolidation: every root test file is a
# module of `tests/main.rs` (one link of the full dep stack instead of 11
# separate binaries). See the `[[test]] name = "platform_it"` target below.
autotests = false

[dependencies]
# The accessibility tree this crate's `PlatformAccessibility` capability
# speaks. Data model only -- the per-OS `accesskit_*` adapters are separate and
# feature-gated. This crate is layer 2 and cannot name `flui-semantics` (layer
# 3) types, so an already-translated `accesskit::TreeUpdate` is what crosses
# the seam.
accesskit = { workspace = true }

flui-types = { path = "../flui-types", version = "0.2.0" }
# Layer-legal downward edge (foundation sits below platform in the DAG),
# carrying two seams: OwnerAffinity — the ADR-0039 owner-thread backstop,
# hosted in foundation so its tests run in CI (flui-platform's suite does
# not) — and the generational DataTransferId for the ADR-0038 transport.
flui-foundation = { path = "../flui-foundation", version = "0.2.0" }
# Wasm-safe Instant for input timestamps (std re-export on native).
web-time = { workspace = true }

# UI Events - W3C compliant event types
ui-events = { workspace = true }
cursor-icon = { workspace = true }
keyboard-types = "0.8"
dpi = "0.1"

# Windowing (for platform implementations)
winit = { workspace = true, optional = true }

# Clipboard (for winit backend)
arboard = { workspace = true, optional = true }

# Error handling & logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Synchronization
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true, optional = true }

# Window handle abstraction
raw-window-handle = "0.6"

# Bitflags for platform-specific flags
bitflags = "2.6"

# Compile-time auto-trait fences for `OwnerPlatform`/`PlatformProxy`/
# `PendingWindow` (ADR-0039 §6-8): item-position `assert_not_impl_any!`/
# `assert_impl_all!` in `traits/owner.rs`, expanded unconditionally by every
# `cargo check` (including cross-typecheck on win/mac) — not gated behind
# `#[cfg(test)]` — so this must be a real dependency, not dev-only, or the
# assertions never expand outside this crate's own test builds.
static_assertions = { workspace = true }

# Windows platform
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
] }

# macOS platform
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
objc = "0.2"

# Android platform
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
libc = "0.2"

# Native-only async dependencies (not available on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
num_cpus = "1.16"

# Web/WASM platform
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    # Core DOM
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    # Events
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "PointerEvent",
    "KeyboardEvent",
    "WheelEvent",
    "MouseEvent",
    "FocusEvent",
    "UiEvent",
    # Rendering
    "CanvasRenderingContext2d",
    "DomRect",
    # Display
    "Screen",
    "MediaQueryList",
    "MediaQueryListEvent",
    # Observers
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    # Animation
    "Performance",
    # Clipboard
    "Clipboard",
    "Navigator",
    # Visibility
    "VisibilityState",
    # Location
    "Location",
    # Styling
    "CssStyleDeclaration",
    # Console
    "console",
] }
console_error_panic_hook = "0.1"

# AT-SPI bridge for Linux, behind the `a11y` feature. Off by default because it
# brings ~66 crates (zbus, atspi, an async executor) -- AT-SPI *is* D-Bus, so
# there is no lighter path, but an application that does not want a
# screen-reader bridge should not link a D-Bus stack.
[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = { version = "0.22", optional = true }

# UIA bridge for Windows, same `a11y` feature. Version cohort must match the
# workspace `accesskit` (0.24) -- 0.34 is that cohort -- and its `windows`
# dependency (0.62) matches the backend's own, so no duplicate windows-rs
# stack is linked.
[target.'cfg(target_os = "windows")'.dependencies.accesskit_windows]
version = "0.34"
optional = true

# NSAccessibility bridge for macOS, same `a11y` feature and the same 0.24
# accesskit cohort. Uses objc2 internally; independent of the backend's
# `cocoa`/`objc` stack.
[target.'cfg(target_os = "macos")'.dependencies.accesskit_macos]
version = "0.26"
optional = true

[features]
default = ["desktop"]

# Platform features
desktop = ["dep:winit"]

# Per-OS accessibility bridges (AT-SPI on Linux, UIA on Windows,
# NSAccessibility on macOS) -- one feature, target-gated dependencies, so a
# build only ever links its own OS's stack. Off by default: see the Linux
# dependency note above for why ~66 crates should be an opt-in rather than a
# default.
a11y = ["dep:accesskit_unix", "dep:accesskit_windows", "dep:accesskit_macos"]

# winit fallback backend — primary on Linux until native Wayland/X11 lands
# (roadmap Cross.P); optional on Windows/macOS.
winit-backend = ["dep:winit", "dep:arboard", "dep:crossbeam-channel"]

# Web platform
# Honest note (verified 2026-08-04): no-op selector — zero
# `feature = "web"` references in this crate's src. `platforms::web` is
# gated by `#[cfg(target_arch = "wasm32")]` on the actual compile target
# (`src/platforms/mod.rs`), not by this flag; enabling or disabling it
# changes nothing observable. Kept as a forward-compatible name for
# downstream `Cargo.toml`s, mirroring `desktop` (which — unlike this one —
# really does gate `dep:winit`).
web = []

# Linux display server protocols
wayland = []
x11 = []

# The `unexpected_cfgs` check-cfg declaration for objc 0.2's
# `cfg(feature = "cargo-clippy")` probes lives in build.rs — Cargo forbids
# mixing local lint keys with `workspace = true`.
[lints]
workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true }

[[test]]
name = "platform_it"
path = "tests/main.rs"

# Deliberately its own process: these tests WRITE the process-wide
# `FLUI_HEADLESS` env var (`unsafe env::set_var`/`remove_var`) to exercise
# headless-backend selection; env vars are process-global, so isolation —
# not opt-in locking — keeps the rest of the suite (which READS
# `FLUI_HEADLESS`) from racing the mutation.
[[test]]
name = "headless"
path = "tests/headless.rs"

# Re-export dependencies that might be needed by consumers
[package.metadata.docs.rs]
all-features = true
