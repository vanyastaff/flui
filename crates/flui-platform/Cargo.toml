[package]
publish = ["crates-io"]
name = "flui-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform contracts for FLUI: capability traits and the window, input and data-transfer vocabulary, with no OS backend"
documentation = "https://docs.rs/flui-platform"
keywords = ["gui", "platform", "input", "ime", "flui"]
categories = ["gui"]

# Dev-only files kept out of the published archive:
exclude = ["/ARCHITECTURE.md"]
autotests = false

[lints]
workspace = true

[dependencies]
# `Cursor::Icon`'s `CursorIcon`, allowed in stable signatures
# by ADR-0089.
cursor-icon = { workspace = true }
# `DataTransferId`, the generational id of the ADR-0312 transport.
flui-foundation = { workspace = true }
language-tags = { workspace = true }
# `PlatformWindow`'s GPU handles, through `HasWindowHandle`/`HasDisplayHandle`
# only (ADR-0089). `alloc` carries those traits through `Arc`, so the
# `Arc<dyn PlatformWindow>` a renderer holds is itself a handle source; without
# it that holds only while something else in the graph (wgpu) turns the
# feature on.
raw-window-handle = { workspace = true, features = ["alloc"] }
thiserror = { workspace = true }
# `Locale` and the other platform values serialize under the `serde` feature.
serde = { workspace = true, optional = true }

[dev-dependencies]
# Pins that the commit gate is owner-thread only.
static_assertions = { workspace = true }
serde_json = { workspace = true }
# `CountingWaker`, the waker whose wakes a transfer or capability test counts.
flui-foundation = { workspace = true, features = ["testing"] }
# Compile-fail fixtures: `DisplayId` cannot be built from a number.
trybuild = { workspace = true }

[[test]]
name = "platform_api_it"
path = "tests/main.rs"

# Compiler contracts invoke Cargo in a separate test process. The snapshots
# name `WindowId::try_from_raw`, which only the `testing` feature declares.
[[test]]
name = "compile_fail"
path = "tests/compile_fail.rs"
required-features = ["testing"]

[features]
default = []
serde = ["dep:serde"]
# The doubles of the contracts this crate owns, in `testing` (ADR-0243),
# built on the scenario primitive.
testing = ["scripted"]
# The scenario primitive (`capability::scripted`) a capability's simulated
# provider is built from, here because a capability crate cannot depend on
# `flui-testing` (ADR-0154 §10).
scripted = []

# `O_NONBLOCK`, with which `assets::DirectoryAssets` opens a file, so a FIFO swapped in
# for an asset cannot block the IO lane before the open file is checked (ADR-0384 §2).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# A browser page's entropy for `ProcessNonce::mint`: wasm32-unknown-unknown's
# std has none, so `RandomState` alone mints the same nonce on every page.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Tier C, order 1: the contracts sit below every backend (ADR-0082 §1) and
# above the values tier; its dependents are `flui-interaction`, `flui-native`,
# `flui-widgets` and `flui-app`. On top of its tier's set this crate may never
# reach AccessKit or tokio (ADR-0082 Verification), and does not log: the
# caller of a contract function does (ADR-0151 §7). `flui-foundation`'s own
# instrumentation is the one path to `tracing`, excused there.
[package.metadata.flui]
tier = "C"
tier-kind = "stable"
order = 1
reach-forbid = [
    "accesskit",
    "dpi",
    "keyboard-types",
    "parking_lot",
    "tokio",
    "tracing",
    "ui-events",
]
