[package]
publish = ["crates-io"]
name = "flui-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Frame runtime for FLUI: the UI UI runtime, the per-presentation frame transaction it drives between the widget tree and a host, and the frame sink it submits through (internal)"
documentation = "https://docs.rs/flui-runtime"
keywords = ["gui", "ui", "runtime", "flui"]
categories = ["gui"]

# Dev-only files kept out of the published archive:
exclude = ["/ARCHITECTURE.md"]

[lints]
workspace = true

[features]
# Test hooks (`HeldPointerQueue::append`/`len`, the `SemanticsHost` surface
# that has no production caller yet, and `ExecutionServices::with_limits`/
# `default_pools_started`), and the `testing` module's `TestWindow` and
# `ScriptedSink` doubles, and decoding a recording's rows (`InputRecord::from_wire`,
# which names a window by value), for this crate's own tests, `flui-testing`'s and `flui-app`'s,
# which enable it on their dev edge. Never on a normal edge.
testing = ["flui-platform/testing"]
# `reload::ReloadTier`, the development reload the UI runtime applies. Names no
# hot-reload crate; `flui-app` always turns it on and translates an installed
# `DevReloadHook`'s event into it (ADR-0311 §1).
hot-reload = []

[dependencies]
# `ActionRequest`, the assistive-technology variant of `HostInput` (ADR-0207 §1).
accesskit = { workspace = true }
# `PresentationId`, which names a held-input queue in traces.
flui-foundation = { workspace = true }
# `PointerEvent`/`PointerId`, the events the held-input lane retains.
flui-interaction = { workspace = true }
# `Scene`, what a frame sink submits.
flui-layer = { workspace = true }
# `Assertiveness`/`SemanticsEvent`, what the semantics host delivers, and the
# wire projection a semantics agent reads through.
flui-semantics = { workspace = true }
# The agent-protocol schema a semantics agent reads and acts in (ADR-0095), and
# the JSON lines the agent service speaks (ADR-0288): always compiled, so an
# app that never starts the agent pays only for the code.
flui-protocol = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
# `PlatformWindow` and its capability traits, the window contract a
# presentation drives; no backend (ADR-0082).
flui-platform = { workspace = true }
# Window sizes and geometry; `FontCollection`/`TextContext`, the text service
# each UI runtime owns over the app's font collection (ADR-0092 §3).
flui-painting = { workspace = true }
# The UI runtime core (ADR-0083 move 4): the widget tree a presentation hosts
# (`WidgetsBinding`, `GlobalKeyScope`; `flui_view::__runtime` is the seam a
# UI runtime drives it through), its render pipeline, the UI runtime-owned scheduler,
# the vsync the root's animations tick on, and the root wrappers the UI runtime
# installs above every root widget (`FocusTreeRoot`, `GestureArenaScope`,
# `VsyncScope`).
flui-view = { workspace = true }
flui-rendering = { workspace = true }
flui-scheduler = { workspace = true }
flui-animation = { workspace = true }
# The UI runtime's bounded owner inbox.
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
# `SpawnError`'s messages.
thiserror = { workspace = true }
tracing = { workspace = true }
# The cross-platform clock the runtime stamps frames with (std's `Instant` panics
# on wasm32).
web-time = { workspace = true }

# The execution services' default IO and compute pools, and the cancellation
# root the host's lifecycle layer derives from. Native only: the wasm32 build
# of `execution` is the sequential backend and needs neither crate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }

# The sequential backend's IO lane (`spawn_local` on the browser's microtask
# queue).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
# `flui_platform::testing::FakeHaptics`, the actuator the preference tests record.
flui-platform = { workspace = true, features = ["testing"] }
# `CountingWaker`, the transport signal an agent-service test counts.
flui-foundation = { workspace = true, features = ["testing"] }
# The widget catalog, for the tests that drive a presentation through real
# widgets; the runtime itself names no widget.
flui-widgets = { workspace = true }
# Arbitrary bytes on the agent's wire (`agent_service`); the nightly run
# raises `PROPTEST_CASES`.
proptest = { workspace = true }
# `flui_interaction::events::make_*_event`, the synthetic pointer events the
# held-input tests queue.
flui-interaction = { workspace = true, features = ["testing"] }
# `log_capture::capture`, which the semantics agent's privacy test calls so a
# sibling test cannot poison the callsites it captures.
# Checkout-only test edge: versionless, so Cargo drops it from the published manifest.
flui-testing = { path = "../flui-testing" }
# The UI runtime tests: the headless platform's windows and capability fakes
# (`headless_platform`, `FakeTextInput`, `FakeAccessibility`),
# a dev edge only, so the shipped crate still links no backend; the concrete
# render objects some tests mount; AccessKit action requests driven the way
# an adapter would; and `!Send` pins on the UI runtime.
flui-native = { workspace = true }
flui-objects = { workspace = true }
static_assertions = { workspace = true }
# Exact diagnostics for owner-thread and frame-entry boundaries.
trybuild = { workspace = true }
# A semantics agent's read round-trips through JSON in its tests.
flui-protocol = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
# The test-only hooks of the crates the UI runtime drives: `push_pending_child_
# request_for_test`, `register_layout_builder_for_test`.
flui-rendering = { workspace = true, features = ["testing"] }
flui-view = { workspace = true, features = ["testing"] }
# `testing::font_collection_holders`, which pins who holds the app's font
# collection and when a UI runtime lets go of it.
flui-painting = { workspace = true, features = ["testing"] }

# Executing wasm32 unit tests: the execution services' sequential backend is
# pinned by lib tests that run on wasm32 (`cargo xtask wasm-test`). Pinned to
# the release that pairs with the locked wasm-bindgen; the unpinned "0.3"
# resolves to one requiring a newer wasm-bindgen and would bump the workspace
# lock as a side effect of adding a dev-dependency. flui-foundation carries the
# same pin for the same reason.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[package.metadata.docs.rs]
all-features = true

# Tier K, order 4: the frame runtime of ADR-0083 §1 sits in the spine tier
# above `flui-view` and `flui-widgets` in the order, because the UI runtime it
# owns drives a widget tree (naming no widget: see `reach-forbid`), and below
# `flui-testing`, the headless host that pumps it;
# `flui-app` (tier H) is its only other normal dependent. Internal: it is not an embedder API (ADR-0027 §9), except
# the execution host-injection seam and the frame-failure report types that
# `flui-app` re-exports (ADR-0089 §1).
[package.metadata.flui]
tier = "K"
tier-kind = "internal"
order = 4
# ADR-0047: only a host crate constructs the execution services, and no other
# workspace crate reaches their pools. They are `pub` here only so the host can
# construct them, so the hosts are the crates allowed a normal edge: `flui-app`,
# and `flui-testing`, the host of the headless test loop, whose driver runs the
# UI runtime's frame (ADR-0083 §4). Dev edges are not restricted.
allowed-dependents = ["flui-app", "flui-testing"]
# The UI runtime names no widget catalog: the presentation's root scopes
# live in `flui-view`, keyboard traversal is installed by the composition
# root through `flui_widgets::app_root`, and tests drive widgets as dev edges.
reach-forbid = ["flui-widgets"]
# Process-unique identity only; UI runtime services and registries remain owned.
globals = [
    { item = "runtime_services::NEXT_INCARNATION", grant = "ADR-0097", class = "counter", reason = "Runtime and presentation generations, advanced by try_update with permanent exhaustion" },
]
