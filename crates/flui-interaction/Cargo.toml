[package]
publish = ["crates-io"]
name = "flui-interaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Event routing, interaction handling, and gesture recognition for FLUI"
categories = ["gui"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/benches/", "/docs/", "/proptest-regressions/"]
keywords = ["gui", "ui", "events", "gestures", "interaction"]
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

[dependencies]
# Flui dependencies
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
# Instant that works on wasm32 (std's panics there). Must be the same type
# the foundation clock returns, so timestamps interoperate.
web-time = { workspace = true }
# Presentation-owned IME state holds the exact platform capability directly.
# This removes the former app-layer Any/downcast + closure-bridge path. The
# contract crate, not `flui-platform`: naming a capability trait must not link
# the OS backends (ADR-0082).
flui-platform-api = { workspace = true }

# UI Events - Cross-platform input event abstraction (W3C compliant)
ui-events = { workspace = true }
cursor-icon = { workspace = true }

# Synchronization & Concurrency
parking_lot = { workspace = true }
dashmap = { workspace = true }

# Collections (optimized for small sizes)
smallvec = { workspace = true }

# Logging
tracing = { workspace = true }
thiserror = { workspace = true }
dpi = "0.1.2"

[dev-dependencies]
# `log_capture::disarm_interest_cache`, which this crate's tracing-capturing
# tests call so a sibling test cannot poison their callsites' cached interest.
# A dev-only edge, and a dev-only CYCLE: flui-testing depends on this crate
# normally, which cargo permits for dev-dependencies precisely so a lower crate
# can use the test support built on it.
# Checkout-only test edge: versionless, so Cargo drops it from the published manifest.
flui-testing = { path = "../flui-testing" }
static_assertions = { workspace = true }
# `tracing-subscriber` is a dev-only dependency — the observability tests
# install a `fmt::TestWriter` subscriber to exercise span emission on hot
# paths. End users configure their subscriber at the app boundary via
# `flui_foundation::log::Logger`, not via this crate.
tracing-subscriber = { workspace = true }
# Criterion — hot-path regression guards. Benches cover VelocityTracker
# (per-pointer-move), GestureArena (per-pointer-up), TapGestureRecognizer
# (per-pointer-event), PointerEventResampler (per-raw-input), and
# InteractionLane route resolution/invocation. Each follows the workspace
# benchmark template at `rust-studio/.../templates/benchmark-report.md`.
criterion = { workspace = true }
# Property tests for the pure-math substrate (LSQ solver, velocity tracker).
# Same version as the rest of the workspace (flui-types / flui-geometry).
proptest = "1.5"
# Bench fixtures use the `make_*_event` test helpers which are gated
# behind the `testing` feature (they're not part of the release API).
# Checkout-only test edge: versionless, so Cargo drops it from the published manifest.
flui-interaction = { path = ".", features = ["testing"] }

[[test]]
name = "interaction_it"
path = "tests/main.rs"

# Own target: installs a counting `#[global_allocator]`, which is process-wide.
[[test]]
name = "pointer_route_hot_path"
path = "tests/pointer_route_hot_path.rs"

[[bench]]
name = "velocity_tracker_bench"
harness = false

[[bench]]
name = "gesture_arena_bench"
harness = false

[[bench]]
name = "tap_detector_bench"
harness = false

[[bench]]
name = "pointer_resampler_bench"
harness = false

[[bench]]
name = "pointer_route_bench"
harness = false

[features]
default = []

# Gates the `testing/` submodule (gesture recording, replay, builders)
# plus `PointerEventData` / `PointerEventKind` / `make_*_event` compat
# helpers from `events.rs`. Off by default — opt in via dev-dependencies
# or downstream `flui-interaction = { features = ["testing"] }`.
# Auto-enabled in test builds via `cfg(any(test, feature = "testing"))`.
testing = []

# Serialization support (if needed in the future)
serde = ["flui-types/serde"]

[lints]
workspace = true

[package.metadata.flui]
layer = 2
tier = "S"
tier-kind = "internal"
order = 4
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "routing::interaction_lane::ACTIVE_LANES", exit = "ADR-0091", reason = "the owner thread's stack of active interaction lanes" },
    { item = "routing::interaction_lane::LOCAL_LANES", exit = "ADR-0091", reason = "the owner thread's registry of local interaction lanes" },
    { item = "routing::interaction_lane::NEXT_LANE_ID", grant = "ADR-0097", class = "counter", reason = "lane IDs, advanced by `try_update` through a reference so exhaustion is an error" },
]
