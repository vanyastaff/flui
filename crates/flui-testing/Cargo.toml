[package]
publish = ["crates-io"]
name = "flui-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Test support for FLUI: a deterministic headless frame driver on a virtual clock, the canonical mount bootstrap, gesture replay, and race-free tracing capture"
keywords = ["ui", "gesture", "headless", "testing"]
categories = ["gui"]

# Dev-only files kept out of the published archive:
exclude = ["/ARCHITECTURE.md"]

# Single-binary integration-test consolidation: every root test file is a
# module of `tests/main.rs` (one link of the full dep stack instead of 2
# separate binaries). See the `[[test]] name = "flui_testing_it"` target below.
# Ambient-state note: no root test writes process-global state (each test
# drives its own `HeadlessBinding` instance), so no isolated targets.
autotests = false

[features]
# Accepted and ignored: `HeadlessBinding::reactive()` is always available
# (ADR-0085 §5). It stays only because CI's `test-features` job still passes
# `--features flui-testing/signals`; it goes with that step.
signals = []

[lints]
workspace = true

[dependencies]
# The virtual clock (`ManualClock`) + clock-bound gesture arena (deadline
# polling). `features = ["testing"]` on the NORMAL edge, not just the dev one:
# `replay` builds its scripted events through flui-interaction's own
# `make_*_event_for_id` constructors, so a script cannot drift from the event
# shape a real platform translation produces. This crate is itself test
# support and never enters a production graph (dev edges only, plus the
# facade's optional `testing` feature), so the feature travels nowhere new.
flui-interaction = { path = "../flui-interaction", version = "=0.2.0-dev", features = ["testing"] }
# PresentationId, the multi-presentation clock registry's key -- it now
# appears directly in HeadlessBinding's own public method signatures
# (install_presentation_clock/pump_presentation/pump_all/etc.), which is what
# promotes this from a transitive (dev-only) dependency to a normal one.
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
# The text-store contract `text_store_kit` certifies stores against, and
# `InMemoryTextStore`, the reference store its own fixture drives.
flui-platform-api = { workspace = true }
# Canonical hit-test positions accepted by the production input pipeline.
# The element tree + build owner this binding drives each frame (`build_scope`
# drains the external inbox an animation/listenable tick fills).
flui-view = { path = "../flui-view", version = "=0.2.0-dev" }
# The pipeline owner the frame loop lays out / paints / composites (`run_frame`).
# `testing` for `inspect`, the committed-geometry and layer accessors the
# widget harness (`widgets`) reads.
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", features = ["testing"] }
# The widget harness (`widgets`): the catalog widgets it wraps a root in
# (`Align`, `ConstrainedBox`, `UnconstrainedBox`, `FocusRoot`,
# `GestureArenaScope`), and the concrete render objects its probes downcast.
flui-widgets = { path = "../flui-widgets", version = "=0.2.0-dev" }
flui-objects = { workspace = true }
# `HeadlessHost` hosts a `UiRuntime` and drives its frame transaction
# (`UiRuntime::pump`, ADR-0083 §4). The runtime admits this crate as a normal
# dependent beside the host. `test-support` exposes the test-only UI runtime hooks
# the harness reads (`UiRuntime::active_text_store`).
flui-runtime = { path = "../flui-runtime", version = "=0.2.0-dev", features = ["test-support"] }
# The widget harness's recording IME double.
parking_lot = { workspace = true }
# The font collection a headless UI runtime shapes on (bundled faces only, so text
# measures alike on every host) and the painting values the widget harness
# reads.
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
# Registered `AnimationController`s the frame loop ticks on the virtual timeline,
# restart-aware via the controller's `run_generation` counter.
flui-animation = { path = "../flui-animation", version = "=0.2.0-dev" }
# The frame phases and the binding's `OwnerFrame`. `pump_frame` runs the SAME
# `UpdateScheduler::drive_frame` a UI runtime's pump runs, whose begin frame polls the
# owner-local tasks in the same slot — between the vsync tick and `build_scope`.
# `testing` exposes the scheduler's test probes (`AsyncDriver::set_request_frame`,
# `is_unlocked`) to every test that links this crate, the scheduler's own
# integration tests included.
flui-scheduler = { path = "../flui-scheduler", version = "=0.2.0-dev", features = ["testing"] }
# Names the shared `Arc<RwLock<PipelineOwner>>` the element tree and the binding
# both hold (render-object attachment shares the owner; the binding does not own
# it exclusively).
# The accessibility tree the query-by-role API asserts against. flui-testing
# reads the assembled `SemanticsOwner` tree out of the pipeline owner and
# translates it with `flui_semantics::tree_to_update` -- the SAME translation a
# platform adapter uses, so a test and a screen reader cannot disagree.
flui-semantics = { path = "../flui-semantics", version = "=0.2.0-dev" }
# Deliberately part of this crate's public contract: `A11yTree` hands back
# AccessKit roles/nodes rather than a test-only mirror of them. The named types
# are re-exported from `a11y` so a consumer does not have to add (and
# version-match) accesskit itself.
accesskit = { workspace = true }
# Typed query-failure errors (`A11yQueryError`), per the workspace convention:
# thiserror in libraries, anyhow only in binaries.
thiserror = { workspace = true }
# Reports secondary panics without replacing the first transaction unwind.
tracing = { workspace = true }

[dev-dependencies]
static_assertions.workspace = true
# Enable flui-view's `test-utils` feature in test builds so the layout-builder
# seam test can plant a registry entry (`register_layout_builder_for_test`).
# Same dev-only feature-unification pattern used by flui-app; the hook stays out
# of release builds.
flui-view = { path = "../flui-view", version = "=0.2.0-dev", features = ["test-utils"] }
# The long-press deadline recognizer + settings exercised by the pump_frame test,
# plus the geometry/offset types for the synthetic pointer-down. The `testing`
# feature is NOT required: `add_pointer`/`poll_deadlines` are part of the release
# API, so the deterministic deadline test runs against the public surface.
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }

[[test]]
name = "flui_testing_it"
path = "tests/main.rs"

[package.metadata.flui]
layer = 6
tier = "K"
tier-kind = "internal"
# Above flui-widgets (3), flui-runtime (4) and flui-sdk (5): the test driver
# wraps the catalog and the frame runtime (ADR-0083 §4). Every crate below
# names it only on a dev edge.
order = 6
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "log_capture::SINK", grant = "ADR-0097", class = "process", reason = "per-thread capture buffer behind tracing's global dispatcher, which the process has once" },
    { item = "log_capture::disarm_interest_cache::SENTINELS", grant = "ADR-0097", class = "process", reason = "dispatchers that reset tracing's global callsite interest cache, which the process has once" },
]
