[package]
name = "flui-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Application framework for FLUI - Flutter-inspired UI"

[lib]
crate-type = ["rlib"]

[features]
default = ["desktop"]

# === Platform Features ===
# Honest note (verified 2026-08-04): these four are no-op selectors today —
# `rg 'feature\s*=\s*"(desktop|android|ios|web)"' crates/flui-app/src` has
# zero hits. Platform dispatch in this crate is `#[cfg(target_os = "...")]`
# on the actual target, not one of these flags; enabling or disabling any of
# them changes nothing observable. They exist as forward-compatible names for
# downstream `Cargo.toml`s to opt into (e.g. `default-features = false,
# features = ["desktop"]`) if/when this crate grows real per-platform gating,
# and `desktop` staying default keeps that future migration additive. Do not
# assume enabling one of these turns on platform-specific code — check the
# actual `#[cfg(target_os = ...)]` gates for that.
desktop = []
android = []
ios = []
web = []

# === Development capabilities ===
# Hot reload is a development capability, not part of an ordinary production
# graph: with this feature off, `flui-hot-reload` is absent from
# `cargo tree -p flui-app` and no target of this crate imports it. Everything
# that would touch it goes through `app::hot_reload`, which has a real and an
# inert implementation; the inert one names no `flui_hot_reload` item at all.
# Desktop and Android install drivers. Web and iOS remain compile-safe when
# feature unification enables this feature, but do not install a driver yet.
hot-reload = ["dep:flui-hot-reload"]

# === Debug Features ===
# Honest note (verified 2026-08-04): also no-op selectors — zero
# `feature = "debug-overlay"` / `feature = "performance-overlay"` references
# in this crate's src. There is one runtime toggle for this, not two:
# `AppConfig::show_performance_overlay` (`app/config.rs`), which `runner.rs`
# also calls "the debug overlay" in comments — it is the same overlay under
# both names, controlled entirely at runtime, not by either compile-time
# feature. Kept for the same forward-compatible-name reason as the platform
# features above.
debug-overlay = []
performance-overlay = []

[dependencies]
# Core FLUI crates
flui-view = { path = "../flui-view", version = "0.2.0", features = ["runtime-internals"] }
flui-rendering = { path = "../flui-rendering", version = "0.2.0" }
# Concrete render-object catalog (moved out of flui-rendering per ADR-0008).
flui-objects = { path = "../flui-objects", version = "0.2.0" }
flui-types = { path = "../flui-types", version = "0.2.0" }
flui-foundation = { path = "../flui-foundation", version = "0.2.0" }
# Composition-only logging backend. `flui-app` is a composition root, so it is
# one of the three crates allowed a normal edge here — see
# docs/workspace-layers.toml. No framework crate may add this dependency.
flui-log = { workspace = true }
flui-interaction = { path = "../flui-interaction", version = "0.2.0" }
flui-scheduler = { path = "../flui-scheduler", version = "0.2.0" }
flui-painting = { path = "../flui-painting", version = "0.2.0" }
flui-layer = { path = "../flui-layer", version = "0.2.0" }
flui-semantics = { path = "../flui-semantics", version = "0.2.0" }
flui-engine = { path = "../flui-engine", version = "0.2.0" }
flui-platform = { path = "../flui-platform", version = "0.2.0" }
# Development-only; see the `hot-reload` feature above.
flui-hot-reload = { path = "../flui-hot-reload", version = "0.2.0", features = [
    "app-plugin",
], optional = true }
flui-animation = { path = "../flui-animation", version = "0.2.0" }
# Widget catalog: provides `VsyncScope`, which `AppBinding::attach_root_widget*`
# auto-wraps the root in so implicit-animation widgets work with zero boilerplate.
# Zero new link-time deps: every crate flui-widgets pulls is already transitively
# present in flui-app's closure (verified via `cargo tree -p flui-app`); this adds
# only a direct Cargo edge + re-exports. FOUNDATIONS.md targets app → widgets.
flui-widgets = { path = "../flui-widgets", version = "0.2.0" }

# Utilities
tracing.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
# UiRealm owner inbox (bounded typed mailbox)
crossbeam-channel.workspace = true
anyhow.workspace = true
raw-window-handle.workspace = true
pollster = { workspace = true }
web-time = { workspace = true }

# Default execution services (issue #557): the loop-scoped `AppRuntime` owns
# the process's background worker pools (an IO runtime and a bounded compute
# pool), replacing the per-platform full-core `BackgroundExecutor`s. Native
# only — the wasm32 build of `app::execution` is the sequential variant and
# needs neither crate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }

# Web/WASM platform (runner spawns the frame loop via spawn_local)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

# Android platform (android_main entry point needs AndroidApp type)
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

# Linux desktop: native Wayland/X11 (`LinuxPlatform`) is a stub (roadmap
# Cross.P), so enable flui-platform's winit fallback backend here. Additive
# `features` on a target-scoped re-declaration of an existing dependency —
# Windows/macOS builds stay on their native backends and never pull in
# `winit-backend`'s `arboard` (clipboard) dependency.
#
# Same pattern for flui-engine: `Renderer::select_backend()` picks Vulkan on
# Linux, but wgpu compiles only the GPU API backends named in flui-engine's
# Cargo features — nothing else in flui-app's closure requests `vulkan`, so
# without this the surface never gets a usable adapter (`SurfaceCreation`
# fails at GPU init).
[target.'cfg(target_os = "linux")'.dependencies]
flui-platform = { path = "../flui-platform", version = "0.2.0", features = ["winit-backend"] }
flui-engine = { path = "../flui-engine", version = "0.2.0", features = ["vulkan"] }

[dev-dependencies]
static_assertions.workspace = true
# Test-only: constructing `accesskit::ActionRequest`s to drive the platform
# accessibility wire exactly the way a real adapter would. The shipped crate
# never names accesskit types — they cross it fully type-inferred, through
# flui-semantics's deliberate named re-exports.
accesskit.workspace = true
# Test-only: capturing emitted events is how the privacy contract on
# `SemanticsHost`'s announce/event fallbacks is checked (moved here from the
# retired `flui-semantics::SemanticsService`) — an accessibility
# announcement is read aloud to the user and must never reach a log field
# verbatim. A *dev* edge only; the shipped crate links no subscriber backend.
tracing-subscriber.workspace = true
# Enable flui-interaction's `testing` feature in test builds so tests can
# construct synthetic pointer events via `events::make_*_event`. Feature
# unification keeps these helpers out of the release `flui-app` binary.
flui-interaction = { path = "../flui-interaction", version = "0.2.0", features = ["testing"] }
# Enable flui-rendering's `testing` feature in test builds so wiring tests can
# seed pending child-build requests via `push_pending_child_request_for_test`.
# Same dev-only feature-unification pattern; helper stays out of release builds.
flui-rendering = { path = "../flui-rendering", version = "0.2.0", features = ["testing"] }
# Enable flui-view's `test-utils` feature in test builds so the
# wiring test can plant a layout-builder registry entry. Same pattern; the
# `register_layout_builder_for_test` hook stays out of release builds.
flui-view = { path = "../flui-view", version = "0.2.0", features = ["test-utils"] }

[lints]
workspace = true
