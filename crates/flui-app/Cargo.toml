[package]
publish = ["crates-io"]
name = "flui-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Application runner for FLUI - bootstraps the platform, renderer and UI realm on desktop, mobile and web"
keywords = ["gui", "ui", "flutter", "application", "runtime"]
categories = ["gui"]
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md"]

[lib]
crate-type = ["rlib"]

[features]
default = ["desktop"]

# Accepted and ignored: `UiCommand::SignalWrite` is always compiled (ADR-0085 §5).
# It stays only because CI's `test-features` job still passes
# `--features flui-app/signals`; it goes with that step.
signals = []

# === Platform Features ===
# Honest note (verified 2026-08-04): these four are no-op selectors today —
# `rg 'feature\s*=\s*"(desktop|android|ios|web)"' crates/flui-app/src` has
# zero hits. Platform dispatch in this crate is `#[cfg(target_os = "...")]`
# on the actual target, not one of these flags; enabling or disabling any of
# them changes nothing observable. They exist as forward-compatible names for
# downstream `Cargo.toml`s to opt into (e.g. `default-features = false,
# features = ["desktop"]`) if/when this crate grows real per-platform gating,
# and `desktop` staying default keeps that future migration additive. Do not
# assume enabling one of these turns on platform-specific code — check the
# actual `#[cfg(target_os = ...)]` gates for that.
desktop = []
android = []
ios = []
web = []

# === Development capabilities ===
# Hot reload is a development capability, not part of an ordinary production
# graph: with this feature off, `flui-hot-reload` is absent from
# `cargo tree -p flui-app` and no target of this crate imports it. Everything
# that would touch it goes through `app::hot_reload`, which has a real and an
# inert implementation; the inert one names no `flui_hot_reload` item at all.
# Desktop and Android install drivers. Web and iOS remain compile-safe when
# feature unification enables this feature, but do not install a driver yet.
hot-reload = ["dep:flui-hot-reload", "flui-runtime/hot-reload"]

# === Native accessibility ===
# Forwards `flui-platform`'s `a11y`: the per-OS AccessKit adapters
# (NSAccessibility, UIA, AT-SPI) that hand the semantics tree to an
# assistive technology. Off by default because the AT-SPI adapter brings a
# D-Bus stack with it; the facade's own `a11y` feature turns it on for a
# consumer. Without it the semantics tree is built for the framework's own
# use (tests, `A11yTree`) but no screen reader can see it.
a11y = ["flui-platform/a11y"]

# === Debug Features ===
# Honest note (verified 2026-08-04): also no-op selectors — zero
# `feature = "debug-overlay"` / `feature = "performance-overlay"` references
# in this crate's src. There is one runtime toggle for this, not two:
# `AppConfig::show_performance_overlay` (`app/config.rs`), which `runner.rs`
# also calls "the debug overlay" in comments — it is the same overlay under
# both names, controlled entirely at runtime, not by either compile-time
# feature. Kept for the same forward-compatible-name reason as the platform
# features above.
debug-overlay = []
performance-overlay = []

[dependencies]
# Core FLUI crates
flui-view = { path = "../flui-view", version = "=0.2.0-dev", features = ["runtime-internals"] }
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev" }
# Concrete render-object catalog (moved out of flui-rendering into flui-objects).
flui-objects = { path = "../flui-objects", version = "=0.2.0-dev" }
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
# Composition-only logging backend. `flui-app` is a composition root, so it is
# one of the three crates allowed a normal edge here — see `allowed-dependents`
# in flui-log's manifest. No framework crate may add this dependency.
flui-log = { workspace = true }
flui-interaction = { path = "../flui-interaction", version = "=0.2.0-dev" }
flui-scheduler = { path = "../flui-scheduler", version = "=0.2.0-dev" }
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
flui-layer = { path = "../flui-layer", version = "=0.2.0-dev" }
flui-semantics = { path = "../flui-semantics", version = "=0.2.0-dev" }
flui-engine = { path = "../flui-engine", version = "=0.2.0-dev" }
flui-platform = { path = "../flui-platform", version = "=0.2.0-dev" }
# The contracts the realm core drives (`PlatformWindow`, the capability
# traits); `flui-platform` itself is for the runner's backend and host side.
flui-platform-api = { workspace = true }
# Development-only; see the `hot-reload` feature above.
flui-hot-reload = { path = "../flui-hot-reload", version = "=0.2.0-dev", features = [
    "app-plugin",
], optional = true }
flui-animation = { path = "../flui-animation", version = "=0.2.0-dev" }
# Widget catalog: provides `VsyncScope`, which `AppBinding::attach_root_widget*`
# auto-wraps the root in so implicit-animation widgets work with zero boilerplate.
# Zero new link-time deps: every crate flui-widgets pulls is already transitively
# present in flui-app's closure (verified via `cargo tree -p flui-app`); this adds
# only a direct Cargo edge + re-exports. FOUNDATIONS.md targets app → widgets.
flui-widgets = { path = "../flui-widgets", version = "=0.2.0-dev" }
# The frame runtime (ADR-0083): the per-presentation lanes the realm drives.
flui-runtime = { path = "../flui-runtime", version = "=0.2.0-dev" }

# Utilities
tracing.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
# UiRealm owner inbox (bounded typed mailbox)
crossbeam-channel.workspace = true
anyhow.workspace = true
raw-window-handle.workspace = true
pollster = { workspace = true }
web-time = { workspace = true }

# `CancellationToken`, which the task/worker/service lifecycle layer
# (ADR-0049) derives from the execution services' cancellation root. Native
# only, like that layer.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-util = { workspace = true }

# Web/WASM platform (runner spawns the frame loop via spawn_local)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

# Android platform (android_main entry point needs AndroidApp type)
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

# Linux desktop: native Wayland/X11 (`LinuxPlatform`) is a stub (roadmap
# Cross.P), so enable flui-platform's winit fallback backend here. Additive
# `features` on a target-scoped re-declaration of an existing dependency —
# Windows/macOS builds stay on their native backends and never pull in
# `winit-backend`'s `arboard` (clipboard) dependency.
#
# Same pattern for flui-engine: `Renderer::select_backend()` picks Vulkan on
# Linux, but wgpu compiles only the GPU API backends named in flui-engine's
# Cargo features — nothing else in flui-app's closure requests `vulkan`, so
# without this the surface never gets a usable adapter (`SurfaceCreation`
# fails at GPU init).
[target.'cfg(target_os = "linux")'.dependencies]
flui-platform = { path = "../flui-platform", version = "=0.2.0-dev", features = ["winit-backend"] }
flui-engine = { path = "../flui-engine", version = "=0.2.0-dev", features = ["vulkan"] }

[dev-dependencies]
# `log_capture::disarm_interest_cache`, which this crate's tracing-capturing
# tests call so a sibling test cannot poison their callsites' cached interest.
# A dev-only edge, and a dev-only CYCLE: flui-testing depends on this crate
# normally, which cargo permits for dev-dependencies precisely so a lower crate
# can use the test support built on it.
flui-testing = { workspace = true }
static_assertions.workspace = true
# Test-only: constructing `accesskit::ActionRequest`s to drive the platform
# accessibility wire exactly the way a real adapter would. The shipped crate
# never names accesskit types — they cross it fully type-inferred, through
# flui-semantics's deliberate named re-exports.
accesskit.workspace = true
# Test-only: capturing emitted events is how the frame-failure detail and
# segment-gate tests check what a frame reports to the log. A *dev* edge only;
# the shipped crate links no subscriber backend.
tracing-subscriber.workspace = true
# `HeldPointerQueue::append`/`len`, `SemanticsHost::ensure_semantics` and
# `ExecutionServices::with_limits`/`default_pools_started`, which this crate's
# tests use and which exist only under `test-support`.
flui-runtime = { path = "../flui-runtime", version = "=0.2.0-dev", features = ["test-support"] }
# Enable flui-interaction's `testing` feature in test builds so tests can
# construct synthetic pointer events via `events::make_*_event`. Feature
# unification keeps these helpers out of the release `flui-app` binary.
flui-interaction = { path = "../flui-interaction", version = "=0.2.0-dev", features = ["testing"] }
# Enable flui-rendering's `testing` feature in test builds so wiring tests can
# seed pending child-build requests via `push_pending_child_request_for_test`.
# Same dev-only feature-unification pattern; helper stays out of release builds.
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", features = ["testing"] }
# Enable flui-view's `test-utils` feature in test builds so the
# wiring test can plant a layout-builder registry entry. Same pattern; the
# `register_layout_builder_for_test` hook stays out of release builds.
flui-view = { path = "../flui-view", version = "=0.2.0-dev", features = ["test-utils"] }

[lints]
workspace = true

[[test]]
name = "app_it"
path = "tests/main.rs"

[package.metadata.flui]
layer = 9
tier = "H"
tier-kind = "internal"
order = 2
edge-exceptions = [
    { to = "flui-hot-reload", exit = "ADR-0094", reason = "the optional `hot-reload` reload driver" },
]
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "app::runner::host::APP_RUNTIME", grant = "ADR-0097", class = "trampoline", reason = "the host of every realm, which OS event callbacks reach without a user-data pointer" },
    { item = "app::runner::secondary_window::PENDING_SECONDARY_WINDOW_COMPLETIONS", exit = "ADR-0083", reason = "secondary-window completions queued beside the host cell; they fold into the runtime" },
    { item = "app::runner::secondary_window::PENDING_SECONDARY_WINDOW_OPENS", exit = "ADR-0083", reason = "secondary-window open requests queued beside the host cell; they fold into the runtime" },
    { item = "app::runner::secondary_window::POLLING_PENDING_WINDOWS", exit = "ADR-0083", reason = "reentrancy flag of the secondary-window queue; it folds into the runtime" },
]
