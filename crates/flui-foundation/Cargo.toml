[package]
name = "flui-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundation types and utilities for FLUI framework"
documentation = "https://docs.rs/flui-foundation"
readme = "README.md"
keywords = ["ui", "gui", "foundation", "flui"]
categories = ["gui", "data-structures"]

[lints]
workspace = true

[dependencies]
parking_lot = { workspace = true }
# `MonotonicClock`'s Instant: std::time on native, performance.now() on
# wasm32 — std::time::Instant::now() panics on wasm32-unknown-unknown,
# and this clock is the default the gesture arena runs on (see clock.rs).
web-time = { workspace = true }
# `SmallVec` for stack-allocated listener-callback snapshots in
# `ChangeNotifier::notify_listeners` (audit I-4). Inline capacity 4
# covers the common case of one or two listeners per notifier;
# overflow spills to heap.
smallvec = { workspace = true }
# Event *emission* only. Foundation defines the shared field vocabulary in
# `diagnostics` and instruments its own code; it never constructs or installs a
# subscriber. The subscriber backends (`tracing-subscriber`, `tracing-forest`,
# `android_log-sys`, `tracing-oslog`, `tracing-wasm`) live in `flui-log`, so an
# embedded host can link foundation without linking any of them.
tracing = { workspace = true }

# Optional dependencies
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
flui-types = { path = "../flui-types", version = "0.2.0" }
serde_json = { workspace = true }
# Test-only: capturing emitted events is how `diagnostics`' field names are
# checked against what `tracing` actually records. A *dev* edge only — the
# shipped crate links no subscriber backend.
tracing-subscriber = { workspace = true }

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
