[package]
name = "flui-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundation types and utilities for FLUI framework"
documentation = "https://docs.rs/flui-foundation"
keywords = ["ui", "gui", "foundation", "flui"]
categories = ["gui", "data-structures"]

[lints]
workspace = true

[dependencies]
parking_lot = { workspace = true }
# `MonotonicClock`'s Instant: std::time on native, performance.now() on
# wasm32 — std::time::Instant::now() panics on wasm32-unknown-unknown,
# and this clock is the default the gesture arena runs on (see clock.rs).
web-time = { workspace = true }
# `SmallVec` for stack-allocated listener-callback snapshots in
# `ChangeNotifier::notify_listeners`. Inline capacity 4
# covers the common case of one or two listeners per notifier;
# overflow spills to heap.
smallvec = { workspace = true }
# Event *emission* only. Foundation defines the shared field vocabulary in
# `diagnostics` and instruments its own code; it never constructs or installs a
# subscriber. The subscriber backends (`tracing-subscriber`, `tracing-forest`,
# `android_log-sys`, `tracing-oslog`, `tracing-wasm`) live in `flui-log`, so an
# embedded host can link foundation without linking any of them.
tracing = { workspace = true }

# Optional dependencies
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
flui-types = { path = "../flui-types", version = "0.2.0" }
serde_json = { workspace = true }
# Test-only: capturing emitted events is how `diagnostics`' field names are
# checked against what `tracing` actually records. A *dev* edge only — the
# shipped crate links no subscriber backend.
tracing-subscriber = { workspace = true }

# Executing wasm32 tests. Until this landed the workspace only ever COMPILED for
# wasm32 (`just wasm-check` is `cargo check` + `cargo clippy`), so every "works on
# the web" claim rested on the linker succeeding -- see issue #985.
#
# Pinned exactly, not `"0.3"`. 0.3.78 requires wasm-bindgen 0.2.128, so an
# unpinned range would bump the workspace lockfile as a side effect of adding a
# dev-dependency; 0.3.77 is the release that pairs with the locked 0.2.127. The
# third version in the chain, `wasm-bindgen-cli`, must match the locked
# wasm-bindgen EXACTLY or the runner refuses to start -- `just wasm-test` and the
# CI step both read it out of Cargo.lock rather than hardcoding it, so a
# dependabot bump moves all three together instead of breaking the runner with a
# message that reads like a toolchain fault.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
