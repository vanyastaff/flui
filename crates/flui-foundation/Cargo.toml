[package]
autotests = false
publish = ["crates-io"]
name = "flui-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundation types and utilities for FLUI framework"
documentation = "https://docs.rs/flui-foundation"
keywords = ["ui", "gui", "foundation", "flui"]
categories = ["gui", "data-structures"]
# The train guard (ADR-0088 §5): Cargo admits one package per `links` value in
# a graph, and every train depends on this crate, so an application and a
# package on different trains fail in the resolver instead of with E0308.
# `links` needs a build script; `build.rs` does nothing else. This crate alone
# declares the key (ADR-0088 §5).
links = "flui_train"

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md", "/docs/"]

[lints]
workspace = true

[dependencies]
# `MonotonicClock`'s Instant: std::time on native, performance.now() on
# wasm32 — std::time::Instant::now() panics on wasm32-unknown-unknown,
# and this clock is the default the gesture arena runs on (see clock.rs).
web-time = { workspace = true }
# `SmallVec` for stack-allocated listener-callback snapshots in
# `ChangeNotifier::notify_listeners`. Inline capacity 4
# covers the common case of one or two listeners per notifier;
# overflow spills to heap.
smallvec = { workspace = true }
# Event *emission* only. Foundation defines the shared field vocabulary in
# `diagnostics` and instruments its own code; it never constructs or installs a
# subscriber. The subscriber backends (`tracing-subscriber`, `tracing-forest`,
# `android_log-sys`, `tracing-oslog`, `tracing-wasm`) live in `flui-log`, so an
# embedded host can link foundation without linking any of them.
tracing = { workspace = true }
# Geometry values (`geometry`): `Matrix4` is glam's `DMat4` inside; `GeometryError` derives
# its `Display` through thiserror.
glam = { workspace = true }
thiserror = { workspace = true }
# `#[derive(Inspect)]`, re-exported beside the trait in `inspect` (ADR-0242 §4). The derive
# crate is tier V like this one, one `order` lower; it uses this crate only as a dev-dependency.
flui-macros = { workspace = true }

# Optional dependencies
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
flui-foundation = { path = ".", features = ["testing"] }

# Executing wasm32 tests: compiling and linking for wasm32 shows nothing about
# what the code does when it runs there, so every "works on the web" claim
# needs a test that executes in a wasm VM (issue #985).
#
# Pinned exactly, not `"0.3"`. 0.3.78 requires wasm-bindgen 0.2.128, so an
# unpinned range would bump the workspace lockfile as a side effect of adding a
# dev-dependency; 0.3.77 is the release that pairs with the locked 0.2.127. The
# third version in the chain, `wasm-bindgen-cli`, must match the locked
# wasm-bindgen EXACTLY or the runner refuses to start -- CI's `wasm-check` job
# installs the CLI at the version the lock pins, so a dependabot bump moves all
# three together there; a local CLI the bump left behind shows up as a runner
# error that reads like a toolchain fault.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

# Property tests run natively only; the wasm32 runner executes `tests/wasm32.rs`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "foundation_it"
path = "tests/main.rs"

[[test]]
name = "wasm32"
path = "tests/wasm32.rs"

# Own target: installs a counting `#[global_allocator]`, which is process-wide.
[[test]]
name = "inspect_allocation"
path = "tests/inspect_allocation.rs"

[[bench]]
name = "geometry_bench"
harness = false

[features]
default = []
## Keep creation sites (`CreationSite`) in release builds; debug builds always keep them.
creation-site = []
serde = ["dep:serde"]
## Test support (ADR-0243): `testing::CountingWaker` and `testing::panicking_waker`.
testing = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.flui]
tier = "V"
tier-kind = "internal"
order = 4
# The contract reaches this crate and forbids `tracing` for its own code
# (ADR-0151 §7); this crate's emission is the path excused.
reach-exceptions = [
    { to = "tracing", grant = "ADR-0151", reason = "foundation instruments its own code; the contract above it does not log, the caller of a contract function does" },
]
