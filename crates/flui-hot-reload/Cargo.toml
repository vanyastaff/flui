[package]
publish = ["crates-io"]
name = "flui-hot-reload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hot-reload support for FLUI scene plugins via dynamic library loading"
keywords = ["hot-reload", "gui", "flutter", "flui", "dylib"]
categories = ["development-tools", "gui"]
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md"]

[features]
default = []
app-plugin = [
    "dep:flui-foundation",
    "dep:flui-view",
    "flui-view/runtime-internals",
    "dep:flui-rendering",
    "dep:parking_lot",
]

[dependencies]
flui-layer = { path = "../flui-layer", version = "=0.2.0-dev" }
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev", optional = true }
flui-view = { path = "../flui-view", version = "=0.2.0-dev", optional = true }
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
flui-testing = { workspace = true }
flui-view = { path = "../flui-view", version = "=0.2.0-dev", features = ["test-utils"] }

[lints]
workspace = true

[[test]]
name = "hot_reload_it"
path = "tests/main.rs"

[package.metadata.flui]
layer = 6
tier = "pkg"
tier-kind = "official"
order = 4
# ADR-0088 §2: an official package's normal dependencies are the SDK and the
# contract crates. The dlopen reload path these serve is removed by ADR-0094.
edge-exceptions = [
    { to = "flui-foundation", exit = "ADR-0094", reason = "the dlopen reload path's internal-crate edges" },
    { to = "flui-layer", exit = "ADR-0094", reason = "the dlopen reload path's internal-crate edges" },
    { to = "flui-rendering", exit = "ADR-0094", reason = "the dlopen reload path's internal-crate edges" },
    { to = "flui-view", exit = "ADR-0094", reason = "the dlopen reload path's internal-crate edges" },
]
reach-exceptions = [
    { to = "windows", exit = "ADR-0094", reason = "the dlopen loader's Win32 LibraryLoader calls" },
    { to = "android_log-sys", exit = "ADR-0094", reason = "the loader's Android logging" },
]
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "dispatch::REQUEST_REBUILD", exit = "ADR-0094", reason = "the rebuild hook slot of the dlopen reload path" },
    { item = "plugin::app_plugin!::__FLUI_APP_NEXT_THREAD_TOKEN", exit = "ADR-0094", reason = "per-image lane token source that `app_plugin!` emits into the plugin crate" },
    { item = "plugin::app_plugin!::__FLUI_APP_PINNED_THREAD", exit = "ADR-0094", reason = "the lane pinned by the first build call, emitted into the plugin crate" },
    { item = "plugin::app_plugin!::__FLUI_APP_STATE", exit = "ADR-0094", reason = "the plugin image's pipeline slot, emitted into the plugin crate" },
    { item = "worker::REGISTRATION_SESSION", exit = "ADR-0094", reason = "worker build registrations collected during `flui_worker_init`" },
    { item = "worker::WORKER_BUILDS", exit = "ADR-0094", reason = "the registered worker build functions of the dlopen reload path" },
]
