[package]
publish = ["crates-io"]
name = "flui-hot-reload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hot-reload support for FLUI scene plugins via dynamic library loading"
keywords = ["hot-reload", "gui", "flutter", "flui", "dylib"]
categories = ["development-tools", "gui"]

[features]
default = []
app-plugin = [
    "dep:flui-foundation",
    "dep:flui-view",
    "flui-view/runtime-internals",
    "dep:flui-rendering",
    "dep:parking_lot",
]

[dependencies]
flui-layer = { path = "../flui-layer", version = "=0.2.0-dev" }
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev", optional = true }
flui-view = { path = "../flui-view", version = "=0.2.0-dev", optional = true }
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
flui-testing = { workspace = true }
flui-view = { path = "../flui-view", version = "=0.2.0-dev", features = ["test-utils"] }

[lints]
workspace = true
