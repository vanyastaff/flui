[package]
publish = ["crates-io"]
name = "flui-hot-reload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hot-reload support for FLUI scene plugins via dynamic library loading"
keywords = ["hot-reload", "gui", "flutter", "flui", "dylib"]
categories = ["development-tools", "gui"]
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md"]

[features]
default = []
app-plugin = ["dep:flui-foundation", "dep:flui-view", "dep:flui-rendering", "dep:parking_lot"]
# `WorkerReloadHook` and `ScenePluginHook`, the `DevReloadHook`s a `flui-app`
# host installs (ADR-0311 §1, §3). Off by default: the hook traits come through
# `flui-sdk`, which brings the widget catalog, and a scene plugin or worker
# cdylib that only loads code must not build it.
host-hook = ["dep:flui-sdk"]

[dependencies]
# `view::dev_reload`, the hook trait the `host-hook` feature implements. The
# SDK is an official package's own edge (ADR-0088 §2), so it needs no
# exception.
flui-sdk = { workspace = true, optional = true }
flui-layer = { path = "../flui-layer", version = "=0.2.0-dev" }
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev", optional = true }
flui-view = { path = "../flui-view", version = "=0.2.0-dev", optional = true }
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
# The hook's unit tests run without `host-hook` (`src/lib.rs` compiles `hook`
# under `cfg(test)` too), so a plain `cargo test -p flui-hot-reload` covers it.
flui-sdk = { workspace = true }
flui-view = { path = "../flui-view", version = "=0.2.0-dev", features = ["testing"] }
# `tests/plugin_pipeline_text.rs` reads which text context a plugin's layout
# was lent (`flui_painting::testing::text_context_lends`, through
# `TextContextHandle::with`).
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev", features = ["testing"] }
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", features = ["testing"] }

[lints]
workspace = true

[[test]]
name = "hot_reload_it"
path = "tests/main.rs"

[package.metadata.flui]
tier = "pkg"
tier-kind = "official"
order = 4
# ADR-0088 §2: an official package's normal dependencies are the SDK and the
# contract crates. These edges go when the package builds on `flui-sdk` alone
# from `packages/` (ADR-0311 §6). The supported dlopen loader's platform reach
# is standing under ADR-0316; per-image and process-global state is classified
# under ADR-0097, with per-loop routing debt tracked by ADR-0316.
edge-exceptions = [
    { to = "flui-foundation", exit = "ADR-0311", reason = "the dlopen reload path's internal-crate edges" },
    { to = "flui-layer", exit = "ADR-0311", reason = "the dlopen reload path's internal-crate edges" },
    { to = "flui-rendering", exit = "ADR-0311", reason = "the dlopen reload path's internal-crate edges" },
    { to = "flui-view", exit = "ADR-0311", reason = "the dlopen reload path's internal-crate edges" },
]
reach-exceptions = [
    { to = "windows", grant = "ADR-0316", reason = "the supported dlopen loader's Win32 LibraryLoader calls" },
    { to = "android_log-sys", grant = "ADR-0316", reason = "the supported loader's Android logging" },
]
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "dispatch::NEXT_HOOK_GENERATION", grant = "ADR-0097", class = "counter", reason = "Rebuild hook generations, advanced by try_update with permanent exhaustion refusal" },
    { item = "dispatch::REQUEST_REBUILD", exit = "ADR-0316", reason = "the process-global rebuild slot until each event loop owns its routing" },
    { item = "plugin::app_plugin!::__FLUI_APP_NEXT_THREAD_TOKEN", grant = "ADR-0097", class = "counter", reason = "per-image lane identities, advanced by try_update with permanent exhaustion refusal" },
    { item = "plugin::app_plugin!::__FLUI_APP_PINNED_THREAD", grant = "ADR-0097", class = "immutable", reason = "the write-once owner-lane identity of one plugin image" },
    { item = "plugin::app_plugin!::__FLUI_APP_STATE", grant = "ADR-0097", class = "image", reason = "the owner-thread pipeline instantiated with one plugin image, deliberately drop-free for image lifetime" },
    { item = "worker::REGISTRATION_SESSION", exit = "ADR-0316", reason = "the process-global registration session until each event loop owns worker registration" },
    { item = "worker::WORKER_BUILDS", exit = "ADR-0316", reason = "the process-global worker registry until each event loop owns its build table" },
]
