[package]
name = "flui-hot-reload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Hot-reload support for FLUI scene plugins via dynamic library loading"

[features]
default = []
app-plugin = [
    "dep:flui-foundation",
    "dep:flui-view",
    "flui-view/runtime-internals",
    "dep:flui-rendering",
    "dep:flui-types",
    "dep:parking_lot",
]
# Layer 1: debounced source watching for `flui-cli` / `flui-devtools`
source-watch = ["dep:notify-debouncer-mini"]

[dependencies]
flui-layer = { path = "../flui-layer", version = "0.2.0" }
flui-foundation = { path = "../flui-foundation", version = "0.2.0", optional = true }
notify-debouncer-mini = { version = "0.5", optional = true }
flui-view = { path = "../flui-view", version = "0.2.0", optional = true }
flui-rendering = { path = "../flui-rendering", version = "0.2.0", optional = true }
flui-types = { path = "../flui-types", version = "0.2.0", optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
flui-view = { path = "../flui-view", version = "0.2.0", features = ["test-utils"] }
# Dev-only: built for its `cdylib` side artifact, which
# `tests/reload_lifecycle.rs` locates via `std::env::current_exe()`'s
# directory (cargo always places a dependency's `cdylib` output there) and
# `dlopen`s directly — never linked into this crate's own Rust code. This is
# how that ONE integration test gets a real, built `app_plugin!` plugin
# without a nested `cargo build` invocation: it's an ordinary dev-dependency
# edge, so cargo's own build graph builds it before any test runs.
flui-hot-reload-lifecycle-fixture = { path = "../../examples/hot_reload_lifecycle_fixture", version = "0.2.0" }

[lints]
workspace = true
