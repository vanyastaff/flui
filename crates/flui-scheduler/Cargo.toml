[package]
name = "flui-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Frame scheduling, task prioritization, and animation coordination for FLUI"
keywords = ["scheduler", "vsync", "animation", "frame", "ticker"]
categories = ["gui", "game-development", "rendering"]

[dependencies]
# Flui foundation (for the generic Id<T: Marker> system: FrameId, TaskId, TickerId;
# and MonotonicClock/ManualClock/SystemClock, which FrameClock's ClockSource reuses)
flui-foundation = { path = "../flui-foundation", version = "0.2.0" }

# Cross-platform time (web-time is the maintained replacement for instant)
web-time = { workspace = true }

# FrameClock's DemandMask bitset
bitflags = { workspace = true }

# Thread-safe synchronization
parking_lot.workspace = true

# Lock-free concurrent collections
dashmap.workspace = true

# Error derive
thiserror.workspace = true

# Event notification for async completion callbacks
event-listener = "5.3"

# Logging
tracing.workspace = true

# Serialization (optional)
serde = { workspace = true, optional = true }

[dev-dependencies]
static_assertions.workspace = true
criterion = { workspace = true }
# `log_capture::capture`, which this crate's tracing-capturing tests call so a
# sibling test cannot poison their callsites' cached interest. A dev-only
# edge, and a dev-only CYCLE: flui-testing depends on this crate normally,
# which cargo permits for dev-dependencies precisely so a lower crate can use
# the test support built on it.
flui-testing = { workspace = true }

[lib]
name = "flui_scheduler"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]

# testing: test-only probes for consumer crates' lock-discipline tests
# (e.g. `AsyncDriver::is_unlocked`); never enabled in production. Off by
# default; auto-enabled in this crate's own test builds via
# `cfg(any(test, feature = "testing"))`, and opted into by a downstream
# crate's dev-dependency edge (see `crates/flui-view/Cargo.toml`).
testing = []

[[bench]]
name = "frame_clock_gate"
harness = false

[[bench]]
name = "async_driver_pump"
harness = false

[lints]
workspace = true
