org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The application floor: `flui build` writes it from flui.toml (`[platforms.android] min`),
# never below FLUI's own. Change it there, not here.
flui.minSdk=23
# The `targetSdk` and the lowest `compileSdk` FLUI packages with (`platform-support.toml`):
# `flui build` writes it. FLUI meets this level's behaviour changes; change it with FLUI.
flui.targetSdk=36
# The application's package: `flui build` writes it from flui.toml (`[app] id`).
# Change it there, not here.
flui.applicationId={{package_name}}
# The Java sources of the crates the app links (`FluiActivity` among them), which the
# build compiles: `flui build` writes their directories. Change the crates, not this.
flui.javaSources=
