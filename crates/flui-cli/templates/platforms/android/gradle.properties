org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The application floor: `flui build` writes it from flui.toml (`[platforms.android] min`),
# never below FLUI's own. Change it there, not here.
flui.minSdk=23
# The `targetSdk` and the lowest `compileSdk` FLUI packages with (`platform-support.toml`):
# `flui build` writes it. FLUI meets this level's behaviour changes; change it with FLUI.
flui.targetSdk=36
# The application's package: `flui build` writes it from flui.toml (`[app] id`).
# Change it there, not here.
flui.applicationId={{package_name}}
# The Java sources of the crates the app links (`FluiActivity` among them), which the
# build compiles: `flui build` writes their directories. Change the crates, not this.
flui.javaSources=
# The R8 rules of the crates the app links, which a minified release applies: `flui build`
# writes their paths. Change the crates, not this; the app's own rules go in app/proguard-rules.pro.
flui.proguardFiles=
# The version: `flui build` writes both from flui.toml (`[app] version`), the code as
# major * 10000 + minor * 100 + patch. Change the version there, not here.
flui.versionCode=100
flui.versionName=0.1.0
# The NDK `cargo ndk` linked the libraries with: `flui build` writes the one it resolved
# (ANDROID_NDK_HOME, or the newest under the SDK's ndk/).
flui.ndkPath=
# The release key: `flui build` writes it from flui.toml (`[signing.android]`) for a release
# build, empty otherwise; its passwords come from FLUI_ANDROID_KEYSTORE_PASSWORD and
# FLUI_ANDROID_KEY_PASSWORD, never from this file.
flui.signing.storeFile=
flui.signing.keyAlias=
