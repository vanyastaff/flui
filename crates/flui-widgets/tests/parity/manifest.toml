# Executable Flutter-parity inventory for the flui-widgets parity suite.
# Validated by `cargo test -p flui-widgets --test parity_inventory` (runs under
# `just ci`). Structure and every checked invariant are documented in that
# test's module doc. Claimed-case counting is citation-based: a case is
# inventoried as ported only when a Rust test's doc comment cites the oracle
# case name in backtick-quoted form and the citation resolves against the
# pinned reference. Uncited tests keep their oracle cases classified as
# pending, so these counts under-claim rather than over-claim (issue #546
# converts pending cases family by family). Cases held by an #[ignore]d
# divergence pin are counted in a separate `diverged` bucket, never in
# `claimed` — a divergence must not read as parity.

schema = 1

# Rust files in tests/parity/ that are harness plumbing, not parity targets.
infrastructure = ["main.rs", "harness.rs", "harness_self_test.rs"]

[source]
repo = "https://github.com/flutter/flutter"
# The pinned reference tag. Refreshing it is deliberate: bump the tag, re-run
# the inventory test with a .flutter checkout at the new tag, and re-classify
# whatever it rejects.
tag = "3.44.0"
test_root = "packages/flutter/test"
# The directory (under test_root) this inventory classifies exhaustively.
universe = "widgets"

# Upstream case names that appear more than once inside one oracle file
# (Flutter names are unique per group, not per file). A (oracle, case) pair
# may be claimed by at most one target unless listed here with its upstream
# occurrence count; the reference-gated check verifies that count.
[[shared_cases]]
oracle = "widgets/slivers_test.dart"
case = "SliverList.list can build children"
occurrences = 2

