[package]
publish = ["crates-io"]
name = "flui-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "User-facing Flutter-style widget catalog for FLUI (configuration objects over the flui-objects render catalog)"
repository.workspace = true
keywords = ["ui", "widget", "flutter", "flui", "gui"]
categories = ["gui"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md", "/perf/"]
# Root tests/*.rs are consolidated into the single `widgets_it` binary below
# (one link of the wgpu stack instead of 49) — disable per-file auto-discovery.
autotests = false

[dependencies]
# Authoring spine: View/Element traits, BuildContext, ViewSeq, keys, derives
# (also transitively re-exports flui-foundation's ElementId/RenderId).
flui-view = { path = "../flui-view", version = "=0.2.0-dev" }
# Re-exported as `flui_widgets::Stream` so a `StreamBuilder` consumer can name the
# trait without depending on futures-core directly. Trait-only: no
# executor, no combinators, no proc macros.
futures-core = { workspace = true }
# Concrete RenderBox catalog every render-object widget wraps (also re-exports
# the flex/stack config enums it owns).
flui-objects = { path = "../flui-objects", version = "=0.2.0-dev" }
# Protocol + RenderObject traits + BoxConstraints referenced by `RenderView`.
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev" }
# Animation primitives (`Animation<T>`) for transition widgets (`FadeTransition`).
flui-animation = { path = "../flui-animation", version = "=0.2.0-dev" }
# `NavigatorState::init_state` stores a `PostFrameHandle` so a
# `HeroController` can schedule its measurement. No cycle: flui-view already
# depends on flui-scheduler.
flui-scheduler = { path = "../flui-scheduler", version = "=0.2.0-dev" }
# `Listenable` — the subscription `AnimatedView`/`FadeTransition` returns.
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
# `WidgetStates` — the interactive-state bitset `WidgetStateProperty`/
# `WidgetStatesController` are built on. Already a workspace dependency
# (flui-rendering's dirty-flag storage); same house style for a small,
# closed set of boolean flags.
bitflags = { workspace = true }
# `RoutePath` percent-encodes each segment it joins and decodes each segment it
# yields, with the URL path-segment set.
percent-encoding = { workspace = true }
# `#[derive(Routable)]`, re-exported beside the trait it implements.
flui-macros = { workspace = true }
# Gesture recognizers + arena that `GestureDetector` drives.
flui-interaction = { path = "../flui-interaction", version = "=0.2.0-dev" }
# Styling + typography + layout value types (Alignment, Color, BoxDecoration,
# TextStyle, …), and the ICU4X grapheme and word boundaries
# (`text_boundaries`) `TextEditingController` moves and deletes by, which the
# obscuring mask counts too.
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
# Geometry primitives (EdgeInsets, Matrix4, Pixels, px).
# `Overlay`'s entry list and its published `RebuildHandle` live behind private
# `Mutex`es: the list is mutated from outside the tree, and
# `ViewState::build` takes `&self`.
parking_lot = { workspace = true }
# Typed error variants for `ImageProviderError` via `#[derive(Error)]`.
thiserror = { workspace = true }
# Structured diagnostics for image-provider failures — `tracing::warn!` on
# provider errors so silent empty-box failures are visible in traces.
tracing = { workspace = true }
# Image decoding (PNG, JPEG, GIF, …). Optional: gate behind the `images`
# feature to avoid pulling in the decode library for apps that only use
# `Image::from_image` (pre-decoded `PixelImage`).
image = { workspace = true, optional = true }
# Byte-loading/decode + a background tokio runtime for `AssetImage`/
# `NetworkImage`'s async resolution (`ImageProvider::resolve_async`).
# Optional: only the `asset-images`/`network-images` features pull it in.
flui-assets = { path = "../flui-assets", version = "=0.2.0-dev", optional = true }
# In-flight image-load coalescing (`image::decode_cache`): `Shared` lets two
# `Image` widgets mounted with the same provider key await ONE load. `alloc`
# only — no executor, no I/O, no proc-macros (see the workspace-level comment
# on why this is the one place the `futures-core`-only policy isn't enough).
futures-util = { workspace = true, optional = true }
# Count-bounded LRU backing the same decode cache — no time-based eviction,
# unlike `flui-assets`' own moka byte-loader cache. See
# `crate::image::decode_cache`'s module doc.
lru = { workspace = true, optional = true }
# `EditableText` is a text store an input method pulls from: it implements
# the `TextStore` contract and converts offsets with its `utf16` helper
# (ADR-0090). The contract crate, so this links no OS backend (ADR-0082).
flui-platform-api = { workspace = true }

[dev-dependencies]
# ADR-0074 §8 go/no-go benchmarks (`benches/signals_rebuilds.rs`).
criterion = { workspace = true }
# Integration tests drive the real layout pipeline through the render harness.
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", features = ["testing"] }
# `test-utils` reaches the fixpoint's lazy-band pass budget so a widget test can
# drive the deferral path with ordinary content.
flui-view = { path = "../flui-view", version = "=0.2.0-dev", features = ["test-utils"] }
flui-objects = { path = "../flui-objects", version = "=0.2.0-dev", features = ["testing"] }
# A paint oracle: a widget test walks the composited layer tree's display
# lists to assert what a frame did and did not draw.
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
# Drives a real `AnimationController` in the `FadeTransition` integration test.
flui-scheduler = { path = "../flui-scheduler", version = "=0.2.0-dev" }
# Constructs `PointerEvent`s (make_down_event, behind the `testing` feature) for
# the `Listener` dispatch test.
flui-interaction = { path = "../flui-interaction", version = "=0.2.0-dev", features = ["testing"] }
# The headless harness the integration tests drive (`tests/common/mod.rs`
# re-exports `flui_testing::widgets`), and `pump_frame` to poll deadline-driven
# gestures. `flui-testing` depends on this crate, so this is a dev-only cycle
# (ADR-0083 §4): the integration tests link one copy of the library; the
# unit-test build compiles a second, and only `log_capture` crosses into it,
# so no type of this crate meets its twin.
flui-testing = { workspace = true }
# Shared Arc<RwLock<PipelineOwner>> in the headless layout harness.
parking_lot = { workspace = true }
# `#[tokio::test]` for the `image::decode_cache` coalescing unit tests
# (`asset-images` feature) and the async `Image` widget integration tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `#[derive(Routable)]`: the pass and compile-fail suite (`tests/routable_ui.rs`)
# and the round-trip property test (`tests/routable_derive.rs`).
trybuild = { workspace = true }
proptest = { workspace = true }
# All root tests/*.rs files, consolidated into one binary via `#[path]` module
# declarations in tests/main.rs (autotests = false above disables the per-file
# auto-discovered binaries that each linked the whole wgpu stack).
[[test]]
name = "widgets_it"
path = "tests/main.rs"
harness = true

# Keep the historical image test target names alive for CI feature-gated runs.
[[test]]
name = "image"
path = "tests/image_target.rs"
harness = true

[[test]]
name = "image_async"
path = "tests/image_async.rs"
harness = true

[[test]]
name = "image_network"
path = "tests/image_network.rs"
harness = true

# The `#[derive(Routable)]` trybuild suite: its own binary, because it runs a
# nested cargo build (the `trybuild` test group in `.config/nextest.toml`).
[[test]]
name = "routable_ui"
path = "tests/routable_ui.rs"
harness = true

# The counted perf scenarios `cargo xtask perf` runs. A target of its own, not
# a module of `widgets_it`: it pins the process-global font system and reads
# `FLUI_PERF_OUT` from the environment.
[[test]]
name = "perf"
path = "tests/perf.rs"
harness = true

[features]
default = []
# Accepted and ignored: the signals tests and bench always build (ADR-0085 §5).
# It stays only because CI's `test-features` job still passes
# `--features flui-widgets/signals`; it goes with that step.
signals = []
# Activates the `image` crate for decoding PNG/JPEG/GIF/… from bytes or files.
# Required by `MemoryImage` and `FileImage`; `DirectImageProvider` compiles
# without it.
images = ["dep:image"]
# Async, `flui-assets`-backed asset-file image loading: `AssetImage` resolves
# through an injected `Arc<flui_assets::AssetRegistry>` on a background tokio
# runtime, decoded via the same `image` crate `images` activates. Pulls in
# `flui-assets` (with its own `images` feature), plus `futures-util`/`lru` for
# the decode cache and load-coalescing engine (`image::decode_cache`).
asset-images = ["dep:flui-assets", "flui-assets/images", "images", "dep:futures-util", "dep:lru"]
# Async network image loading: rewires `NetworkImage::resolve_async` through
# `flui-assets`' `NetworkLoader` (reqwest). Implies `asset-images` — both
# share the same decode cache, coalescing engine, and background runtime.
network-images = ["asset-images", "flui-assets/network"]
# Serialization of the value types the widgets take, in each crate that owns some.
serde = [
    "flui-painting/serde",
    "flui-objects/serde",
    "flui-rendering/serde",
    "flui-interaction/serde",
    "flui-animation/serde",
]

[lints]
workspace = true

# ADR-0074 §8: setState (A) vs signals (B) on the same widget tree — rebuild counts
# from `BuildOwner::last_frame_build_report`, relayout roots from
# `PipelineOwner::layout_roots_total`, and pump wall time:
# `cargo bench -p flui-widgets --bench signals_rebuilds -- --noplot`.
[[bench]]
name = "signals_rebuilds"
harness = false

# cargo-shear reports the trybuild inputs as unlinked: `tests/routable_ui.rs`
# hands them to rustc, never `mod`s them.
[package.metadata.cargo-shear]
ignored-paths = ["tests/routable_ui/**/*.rs"]

[package.metadata.flui]
layer = 6
tier = "K"
tier-kind = "internal"
order = 3
# The headless test driver sits above this crate and wraps it (ADR-0083 §4):
# it reaches this crate only through dev edges, never the other way round.
reach-forbid = ["flui-testing"]
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "navigator::route::RouteId::next::COUNTER", grant = "ADR-0097", class = "counter", reason = "Route identities, advanced by try_update with permanent exhaustion refusal" },
    { item = "navigator::navigator::NEXT_NAVIGATOR_COMMAND_TARGET_ID", grant = "ADR-0097", class = "counter", reason = "Navigator command identities, advanced by try_update with permanent exhaustion refusal" },
    { item = "overlay::entry::OverlayEntryId::next::COUNTER", grant = "ADR-0097", class = "counter", reason = "Overlay entry identities, advanced by try_update with a permanent exhaustion sentinel" },
    { item = "animated::animated_switcher::DEFAULT_LAYOUT_BUILDER", grant = "ADR-0097", class = "immutable", reason = "the shared default layout builder, so an unchanged default compares equal across rebuilds" },
    { item = "animated::animated_switcher::DEFAULT_TRANSITION_BUILDER", grant = "ADR-0097", class = "immutable", reason = "the shared default transition builder, so an unchanged default compares equal across rebuilds" },
    { item = "animated::implicitly_animated::default_curve::DEFAULT", grant = "ADR-0097", class = "immutable", reason = "the shared default curve, built once" },
    { item = "image::decode_cache::CACHE", exit = "ADR-0097", reason = "the process-wide decoded-image cache; it becomes realm-owned" },
    { item = "navigator::navigator::NAVIGATOR_COMMAND_TARGETS", exit = "ADR-0093", reason = "the owner thread's navigator command routing table" },
]

[package.metadata.flui.modules]
# The top-level modules of src/lib.rs, bottom to top (`cargo xtask module-dag`). Production code
# names a module only in a lower layer; modules in one layer name none of each other. "*" alone in
# a layer stands for every top-level module not named elsewhere, unchecked among themselves.
# `#[cfg(test)]` code is exempt, as dev-dependencies are between crates.
layers = [
    [
        "support",
        "localization",
        "widget_state",
        "anchored_box",
    ],
    [
        "layout",
        "paint",
        "clip",
        "semantics",
        "stack",
        "wrap",
        "physical_model",
        "image",
        "container",
        "value_listenable_builder",
        "async_builders",
    ],
    [
        "flex",
        "transitions",
        "overlay",
    ],
    [
        "animated",
    ],
    [
        "interaction",
    ],
    [
        "text",
        "controls",
        "scroll",
        "navigator",
    ],
    [
        "router",
    ],
    [
        "icon",
        "app",
        "form",
    ],
    [
        "__test_access",
    ],
]
# Modules of `use` items only: a path through them counts as a path to what they re-export.
transparent = ["prelude", "__private"]
# A refused edge, legal until the change in the ADR named by `exit` removes it:
# { from = "<module>", to = "<module>", exit = "ADR-NNNN", since = "YYYY-MM-DD", reason = "..." }
exceptions = []
