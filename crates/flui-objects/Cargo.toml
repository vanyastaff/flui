[package]
publish = ["crates-io"]
name = "flui-objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Concrete RenderBox/RenderSliver catalog for FLUI (the object catalog atop flui-rendering)"
keywords = ["gui", "layout", "rendering", "flutter", "flui"]
categories = ["gui", "rendering"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md"]
repository.workspace = true
# Single-binary integration-test consolidation. The binary keeps the name
# `render_object_harness` — docs and muscle memory reference
# `cargo test -p flui-objects --test render_object_harness` — and
# `harness_snapshot.rs` is mounted into it via `#[path] mod` (its insta
# snapshots were renamed for the new module path). Ambient-state note: no
# root test writes process-global state, so no isolated targets.
autotests = false

[dependencies]
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev" }
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
flui-tree = { path = "../flui-tree", version = "=0.2.0-dev" }
flui-animation = { path = "../flui-animation", version = "=0.2.0-dev" }
tracing = { workspace = true }
parking_lot = { workspace = true }

[features]
default = []
# Forward `testing` feature so flui-objects' test crate can drive the
# real pipeline harness (RenderTester/Probe) without re-exporting it.
testing = ["flui-rendering/testing"]
serde = ["flui-types/serde"]

[dev-dependencies]
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", features = ["testing"] }
# Checkout-only test edge: versionless, so Cargo drops it from the published manifest.
flui-objects = { path = ".", features = ["testing"] }
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }
insta = { workspace = true }
flui-interaction = { path = "../flui-interaction", version = "=0.2.0-dev", features = ["testing"] }

[[test]]
name = "render_object_harness"
path = "tests/render_object_harness.rs"

[lints]
workspace = true

[package.metadata.flui]
layer = 4
tier = "R"
tier-kind = "internal"
order = 3
