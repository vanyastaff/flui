[package]
publish = ["crates-io"]
name = "flui-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance asset management with smart caching, type safety, and async I/O"
repository.workspace = true
keywords = ["assets", "cache", "async", "game", "ui"]
categories = ["asynchronous", "caching", "game-development", "gui"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/docs/"]
documentation = "https://docs.rs/flui-assets"
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

[dependencies]
# Internal dependencies
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
# The `Executor` a decoded-image load runs on: the caller's background lanes
# (ADR-0047), so the registry starts no runtime or thread of its own.
flui-platform = { path = "../flui-platform", version = "=0.2.0-dev" }

# Async runtime. "sync" backs the decoded-image load channels and slots
# (`registry::images`); "rt" lets a network load find the tokio reactor its
# IO lane runs it in, and backs the typed cache's `tokio::fs` loaders.
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt"] }

# High-performance cache
moka = { workspace = true }

# Sync primitives
parking_lot = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Image loading
image = { workspace = true, optional = true }
# The registry's byte-budgeted decoded-image LRU (`registry::images`).
lru = { workspace = true, optional = true }

# Optional: Network loading
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# "macros" backs `#[tokio::test]`; "time" backs `tokio::time::timeout` — the
# hermetic network-loader test's hang guard (a wedged exchange must fail the
# test, not wedge CI); "rt-multi-thread" builds the runtime the tests' lanes
# (`tests/lanes.rs`) drive network loads on, as a native host's default IO
# lane does.
tokio = { workspace = true, features = ["macros", "time", "rt-multi-thread"] }

[features]
default = []

## Core Features
##
## Enable specific asset types and loading capabilities:

# Enable image loading (PNG, JPEG, GIF, WebP, etc.)
images = ["dep:image", "dep:lru"]

# Enable network-based asset loading via HTTP/HTTPS
network = ["dep:reqwest"]

## Future Features (Coming Soon)
##
## Performance optimizations and development tools:

# File watching for hot-reload during development
# hot-reload = ["notify"]

# Memory-mapped font loading for reduced memory usage
# mmap-fonts = ["memmap2"]

# Parallel image/video decoding for faster loading
# parallel-decode = ["rayon"]

## Convenience Feature Sets

# Enable all stable features (recommended for applications)
full = ["images", "network"]

[lints]
workspace = true

[[test]]
name = "assets_it"
path = "tests/main.rs"

# image's decoder registrations are process-global and cannot be removed.
[[test]]
name = "image_hook_reentry"
path = "tests/image_hook_reentry.rs"
required-features = ["images"]

# Decoder hooks are process-global, so the decode-scheduling contracts that
# observe decodes through them run in their own process too.
[[test]]
name = "image_decode_scheduling"
path = "tests/image_decode_scheduling.rs"
required-features = ["images"]

[package.metadata.flui]
layer = 2
tier = "S"
tier-kind = "internal"
order = 7
# tokio's networking stack (mio) has no wasm32-unknown-unknown support.
wasm = false
