[package]
publish = ["crates-io"]
name = "flui-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The decoded-image cache of FLUI: byte-budgeted, shared loads on the caller's background lanes"
repository.workspace = true
keywords = ["ui", "image", "cache", "flui"]
categories = ["caching", "gui"]
# The crate's design notes are for its contributors, not its users.
exclude = ["/docs/"]
documentation = "https://docs.rs/flui-assets"
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

[dependencies]
flui-foundation = { workspace = true }
# `Image::decode`, the one image decoder, whose limit bounds every decoded image.
flui-painting = { workspace = true, features = ["decode"] }
# The `Executor` a load runs on: the caller's background lanes (ADR-0279), so
# the cache starts no runtime or thread of its own, and the HTTP client a
# network image is fetched with (ADR-0280).
flui-platform = { workspace = true }
# The one-shot channels between a load and its subscribers.
tokio = { workspace = true, features = ["sync"] }
parking_lot = { workspace = true }
thiserror = { workspace = true }
# The byte-budgeted recency order of the decoded images kept.
lru = { workspace = true }

[dev-dependencies]
# "rt-multi-thread" builds the runtime the tests' lanes (`tests/lanes.rs`) run
# IO on, as a native host's default IO lane does; "time" backs
# `tokio::time::timeout`, the decode-scheduling tests' hang guard.
tokio = { workspace = true, features = ["macros", "time", "rt-multi-thread"] }
# `ScriptedHttp`, the scripted HTTP client network-image tests fetch with.
# Checkout-only test edge: versionless, so Cargo drops it from the published manifest.
flui-platform = { path = "../flui-platform", features = ["testing"] }
# `CountingWaker`, the waker whose wakes a network-image test counts.
flui-foundation = { path = "../flui-foundation", features = ["testing"] }
# The decoder hooks `image_decode_scheduling` observes decodes through: the
# same `image` crate `flui-painting/decode` decodes with.
image = { workspace = true }

[lints]
workspace = true

[[test]]
name = "assets_it"
path = "tests/main.rs"


# Decoder hooks are process-global, so the decode-scheduling contracts that
# observe decodes through them run in their own process too.
[[test]]
name = "image_decode_scheduling"
path = "tests/image_decode_scheduling.rs"

[package.metadata.flui]
tier = "S"
tier-kind = "internal"
order = 7

# What the asset loader needs from the application's manifests (ADR-0307):
# it `fstat`s each file it reads (`image_cache::loads`), an Apple
# required-reason API (C617.1, files inside the app's container).
[package.metadata.flui.declares]
schema = 1

[[package.metadata.flui.declares.apple.privacy.accessed-apis]]
category = "NSPrivacyAccessedAPICategoryFileTimestamp"
reasons = ["C617.1"]
