[package]
publish = ["crates-io"]
name = "flui-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Application-owned decoded-image loading, sharing and byte-budgeted retention"
repository.workspace = true
keywords = ["assets", "images", "async", "game", "ui"]
categories = ["asynchronous", "caching", "game-development", "gui"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/docs/"]
documentation = "https://docs.rs/flui-assets"
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

[dependencies]
# Internal dependencies
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
# The `Executor` a decoded-image load runs on: the caller's background lanes
# (ADR-0047), so the registry starts no runtime or thread of its own, and the
# HTTP client a network image is fetched with (ADR-0280).
flui-platform = { path = "../flui-platform", version = "=0.2.0-dev" }

# "sync" backs decoded-image load channels and slots (`registry::images`);
# "rt" and "io-util" back the lane and timeout primitives. Files use `std::fs`
# in bounded chunks, never tokio's filesystem runtime.
tokio = { workspace = true, features = ["io-util", "sync", "rt"] }

# Sync primitives
parking_lot = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Bounded image decoding
image = { workspace = true, optional = true }
# The registry's byte-budgeted decoded-image LRU (`registry::images`).
lru = { workspace = true, optional = true }

[dev-dependencies]
# "macros" backs `#[tokio::test]`; "time" backs `tokio::time::timeout`, the
# decode-scheduling tests' hang guard; "rt-multi-thread" builds the runtime the
# tests' lanes (`tests/lanes.rs`) run IO on, as a native host's default IO
# lane does.
tokio = { workspace = true, features = ["macros", "time", "rt-multi-thread"] }
# `ScriptedHttp`, the scripted HTTP client network-image tests fetch with.
# Checkout-only test edge: versionless, so Cargo drops it from the published manifest.
flui-platform = { path = "../flui-platform", features = ["testing"] }

[features]
default = []

# Enable decoded file and network images (PNG, JPEG, GIF, etc.). Network
# fetching uses the HTTP capability supplied through `LoadServices`.
images = ["dep:image", "dep:lru"]

# Enable all stable features.
full = ["images"]

[lints]
workspace = true

[[test]]
name = "assets_it"
path = "tests/main.rs"

# Decoder hooks are process-global, so the decode-scheduling contracts that
# observe decodes through them run in their own process.
[[test]]
name = "image_decode_scheduling"
path = "tests/image_decode_scheduling.rs"
required-features = ["images"]

[package.metadata.flui]
tier = "S"
tier-kind = "internal"
order = 7
# tokio's networking stack (mio) has no wasm32-unknown-unknown support.
wasm = false

# What the asset loader needs from the application's manifests (ADR-0307):
# it `fstat`s each file it reads (`registry::images`), an Apple
# required-reason API (C617.1, files inside the app's container).
[package.metadata.flui.declares]
schema = 1

[[package.metadata.flui.declares.apple.privacy.accessed-apis]]
category = "NSPrivacyAccessedAPICategoryFileTimestamp"
reasons = ["C617.1"]
