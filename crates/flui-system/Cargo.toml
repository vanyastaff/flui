[package]
publish = ["crates-io"]
name = "flui-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "FLUI's OS shell services: launching, file dialogs and message boxes, sharing, autostart, global shortcuts, the launcher entry, the jump list, the user's folders and the system's version"
repository.workspace = true
keywords = ["ui", "flui", "dialog", "launcher", "taskbar"]
categories = ["gui"]
autotests = false

# A capability crate (ADR-0154 §1): the contract crate and external crates
# only, and its own OS code. Nothing but the facade names it.
[dependencies]
flui-platform = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }

# The Linux providers: the XDG desktop portal over the session bus, on zbus's
# own runtime (no Tokio, ADR-0154 §1).
[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { workspace = true }
libc = { workspace = true }
raw-window-handle = { workspace = true }
serde = { workspace = true }
zbus = { workspace = true }
zruntime = { version = "0.2", default-features = false, features = ["runtime", "event", "unblock"] }

# The Windows providers: the shell's COM objects and Win32 calls, each run on
# the thread and apartment its documentation names (ADR-0154 §1, §5).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    # The share sheet: `DataTransferManager` and its `DataPackage`, with the
    # shared files as `StorageFile`s.
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    # `RtlGetVersion`: the real OS build, which the manifest does not shim.
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    # The jump list's task titles (`PKEY_Title`).
    "Win32_Storage_EnhancedStorage",
    # Opening a file to judge what it is (`CreateFileW`,
    # `GetFinalPathNameByHandleW`).
    "Win32_Storage_FileSystem",
    # Whether the process runs packaged, which owns its start-up task.
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    # A small icon's size at the window's scale, for the taskbar badge.
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# The panic a Windows OS entry contains, and a shell thread abandoned past
# its deadline, are logged.
tracing = { workspace = true }
# The shared files, as the `IIterable` the share sheet takes.
windows-collections = { workspace = true }
raw-window-handle = { workspace = true }

# The macOS providers: AppKit's panels, alert, share picker and Dock tile on
# the main thread, Foundation's file manager, Launch Services through
# `NSWorkspace`, the login item through ServiceManagement, and the hot keys
# through Carbon's event manager (ADR-0154 §1). Work that touches the file
# system or waits on a daemon runs on a Grand Central Dispatch queue.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = [
    "std",
    "block2",
    "NSArray",
    # A pick's bookmark, the grant that outlasts the process.
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSObject",
    "NSPathUtilities",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { workspace = true, features = [
    "std",
    "block2",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSDockTile",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSOpenPanel",
    "NSPanel",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSSharingService",
    "NSSharingServicePickerTouchBarItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
# No `UTType` binding crate: it links UniformTypeIdentifiers, which macOS
# 10.13 to 10.15 do not have, so a binary linking it would not start there.
# The class is looked up at run time, behind its gate
# (`apple::content_types`).
objc2-service-management = { workspace = true, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
    "SMErrors",
] }
block2 = { workspace = true }
dispatch2 = { workspace = true }
libc = { workspace = true }
raw-window-handle = { workspace = true }
# A panic an AppKit callback or a dispatched block contains is logged.
tracing = { workspace = true }

# The iOS providers: UIKit's document picker, alert and share sheet and
# `UIApplication`'s `openURL:` on the main thread, a picked document read
# through Foundation's file coordinator under its security-scoped access, and
# the application's folders through the file manager (ADR-0154 §1). Work that
# touches the file system runs on a Grand Central Dispatch queue.
[target.'cfg(target_os = "ios")'.dependencies]
# `exception`: UIKit reports a controller it cannot make or present by
# raising, which the providers catch and answer as a typed failure.
objc2 = { workspace = true, features = ["exception"] }
# A popover's anchor: the `CGRect` UIKit takes.
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes"] }
objc2-foundation = { workspace = true, features = [
    "std",
    "block2",
    "NSArray",
    # A pick's bookmark, the grant that outlasts the process.
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileCoordinator",
    "NSFileManager",
    "NSObject",
    "NSPathUtilities",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    # A picked document's declared size, an `NSNumber`.
    "NSValue",
] }
# No `UTType` binding crate: it links UniformTypeIdentifiers, which iOS 13
# does not have, so a binary linking it would not start there. The class is
# looked up at run time, behind its gate (`apple::content_types`).
objc2-ui-kit = { workspace = true, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "UIActivity",
    "UIActivityViewController",
    "UIAlertController",
    "UIApplication",
    "UIDevice",
    "UIDocumentPickerViewController",
    "UIPopoverPresentationController",
    "UIPopoverSupport",
    "UIPresentationController",
    "UIResponder",
    "UIView",
    "UIViewController",
    # A dismissal under way, whose end a request waits for.
    "UIViewControllerTransitionCoordinator",
    "UIWindow",
] }
block2 = { workspace = true }
dispatch2 = { workspace = true }
libc = { workspace = true }
raw-window-handle = { workspace = true }
# A panic a UIKit callback or a dispatched block contains is logged.
tracing = { workspace = true }

# The Android providers: the crate's Java classes (`android/java`) through
# JNI, over the Activity and the raw JNI pointers the host lends per call
# (ADR-0154 §9); the system properties through bionic.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
libc = { workspace = true }
# A failed JNI call of a native method, and Java classes that were not
# reached, are logged.
tracing = { workspace = true }

# The web providers: the browser's pickers, `<dialog>`, `window.open`, the
# Web Share API and the Badging API, reached through the canvas of the
# acquiring widget's window. Newer APIs (the File System Access pickers,
# `navigator.share`, the Badging API,
# `navigator.userActivation`) are read through `Reflect`, which also detects
# a browser without them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
raw-window-handle = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = { workspace = true }
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "CssStyleDeclaration",
    "HtmlCanvasElement",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "Node",
    "Url",
    "Window",
] }

[dev-dependencies]
flui-platform = { workspace = true, features = ["testing"] }
flui-sdk = { workspace = true }
flui-testing = { workspace = true }
# Reads the crate's own `[package.metadata.flui.capability]` in a test.
toml = { workspace = true }
# The windows a provider's rules are tested in, and the panic boundary and
# the native-call adapter, whose tests run on every host.
raw-window-handle = { workspace = true }
tracing = { workspace = true }

# A save's file, written where a test's folder is.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = { workspace = true }

# The web providers' tests, in a browser (`web::tests`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
# What a test sets an input's files with, dispatches events by, and gives
# its page a content security policy with.
web-sys = { version = "0.3", features = [
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "DomImplementation",
    "EventInit",
    "HtmlHeadElement",
    "NodeList",
] }

# The stand-in desktop portal the Linux providers' tests serve on a private
# bus.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = { workspace = true }
zbus = { workspace = true, features = ["service"] }
zruntime = { version = "0.2", default-features = false, features = ["runtime", "helper"] }

[features]
default = []
# The scripted providers a scenario registers instead of the OS's (ADR-0154
# §10, ADR-0243).
testing = ["flui-platform/testing"]

[lints]
workspace = true

[[test]]
name = "system_it"
path = "tests/main.rs"
harness = true
required-features = ["testing"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.flui]
tier = "pkg"
tier-kind = "capability"
order = 5

# What the Android providers need from the application's APK (ADR-0307).
[package.metadata.flui.declares]
schema = 4

# The crate's Java classes (`FluiCallback`, `FluiDocuments`),
# compiled from `java` into the checked-in dex (`cargo xtask android-dex`):
# `flui build` packs the dex into the APK and hands Gradle the sources.
[package.metadata.flui.declares.android]
dex = "android/classes.dex"
java = "android/java"
# What R8 must keep of them in a minified Gradle release: the library
# reaches them by name through JNI, and Android the provider by the name the
# manifest states.
proguard = "android/proguard-rules.pro"

# The content provider a view or a share hands a file through: not exported,
# granting per URI, under `<application id>.flui.documents`
# (the authority Android attaches `FluiDocuments` with, which it serves under).
[[package.metadata.flui.declares.android.providers]]
class = "dev.flui.system.FluiDocuments"
authority = "flui.documents"

# How an application registers the crate (ADR-0307 §5): `flui add system`
# prints `.plugin(flui::services::system::SystemPlugin::default())`. The path
# is checked by `the_declared_plugin_is_the_crates_default_plugin`.
[package.metadata.flui.capability]
plugin = "SystemPlugin"
