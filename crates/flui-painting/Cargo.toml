[package]
publish = ["crates-io"]
name = "flui-painting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Canvas-based painting abstraction for FLUI - records drawing commands into DisplayList"
keywords = ["gui", "canvas", "painting", "2d-graphics", "rendering"]
categories = ["graphics", "gui", "rendering"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md", "/benches/"]
# Single-binary integration-test consolidation: every root test file is a
# module of `tests/main.rs` (one link of the full dep stack instead of 12
# separate binaries). See the `[[test]] name = "painting_it"` target below.
# No root test writes process-global state, so there are no isolated targets.
autotests = false

[dependencies]
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }

# `Path` geometry: arcs and ovals as curves, exact winding, tight bounds (ADR-0098 §7).
kurbo = { workspace = true }
thiserror = { workspace = true }
# Serialization of the style values (optional). `rc` covers `InlineSpan::Text(Arc<TextSpan>)`;
# deserialization does not preserve `Arc` sharing, which no snapshot relies on.
serde = { workspace = true, optional = true, features = ["rc"] }
tracing = { workspace = true }

# Host font discovery (`HostFonts::scan`) and the host locale that picks the
# Han fallback list.
fontdb = { workspace = true }
sys-locale = { workspace = true }
# A character's script, for the `testing` harness's fallback-coverage query.
icu_properties = { workspace = true, optional = true }
# Grapheme snapping for hit-testing and word segmentation for
# `TextPainter::get_word_boundary` (double-tap word selection), over ICU4X:
# the segmenters Parley marks its clusters with.
icu_segmenter = { workspace = true }
# The Parley path (`parley_text`, `TextContext`): Parley shapes and measures
# over fontique's shared collection, swash rasterizes.
swash = { workspace = true }
parley = { workspace = true }

[dev-dependencies]
# Colour property tests and the compile-fail suite.
proptest = { workspace = true }
trybuild = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
# Self dev-dependency that turns the off-by-default `testing` feature on for
# this crate's own integration tests, so `tests/*.rs` can reach the harness.
# Checkout-only test edge: versionless, so Cargo drops it from the published manifest.
flui-painting = { path = ".", features = ["testing"] }

[features]
default = ["bundled-fonts"]
# Serialize the style values (colours, borders, decorations, text styles) and the geometry
# they hold. The display list carries no serde (ADR-0066).
serde = ["dep:serde", "flui-foundation/serde"]

# bundled-fonts: embed Roboto Regular, Material Icons, and Cupertino Icons.
# Every `FontCollection` holds them and binds its generic families to Roboto,
# and a host feed neither adds a host face of those families nor rebinds a
# generic, so text naming no family measures alike on every host. Off, a
# collection holds only the faces registered on it (and a host feed's), so
# text measures and paints with no face until one is.
bundled-fonts = []

# testing: opt-in painting test harness (`crate::testing`) — a `record`
# builder for `DisplayList`s plus diagnostics helpers. Off by default;
# enabled for this crate's dev targets via the self dev-dependency above.
testing = ["dep:icu_properties"]

[[test]]
name = "painting_it"
path = "tests/main.rs"

# cargo-shear reports the trybuild compile-fail inputs as unlinked: the
# `compile_fail` test hands them to rustc by glob, no module declares them.
[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]

[lints]
workspace = true

# Records a mixed display list — the recording cost of one `DrawCommand`
# per op, with the transform stamped per command. Run with
# `cargo bench -p flui-painting --bench display_list_record`.
[[bench]]
name = "display_list_record"
harness = false

[[bench]]
name = "color_bench"
harness = false

# What text costs before the first frame and while it is held: collection
# build, host scan and feed timings, and the heap a collection and a laid-out
# painter keep (ADR-0092 gate 6). Run with
# `cargo bench -p flui-painting --bench text_startup`.
[[bench]]
name = "text_startup"
harness = false

[package.metadata.flui]
layer = 2
tier = "S"
tier-kind = "internal"
order = 3
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "decoration::WARN_CIRCLE_BORDER_RADIUS", grant = "ADR-0097", class = "diagnostic", reason = "warn-once gate for a circle with a border radius; no behavior reads it" },
    { item = "decoration::WARN_CIRCLE_NON_UNIFORM_BORDER", grant = "ADR-0097", class = "diagnostic", reason = "warn-once gate for a circle with a non-uniform border; no behavior reads it" },
]
