# flui-painting's clippy configuration. clippy reads only the nearest
# `clippy.toml`, so the workspace settings are repeated here; keep them in step
# with the root file.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true

# No FLUI lock on the text path (ADR-0092 §3): each UI runtime shapes through its own
# `TextContext` behind `&mut`.
disallowed-types = [
    { path = "parking_lot::Mutex", reason = "the text path takes no FLUI lock (ADR-0092 §3)" },
    { path = "parking_lot::RwLock", reason = "the text path takes no FLUI lock (ADR-0092 §3)" },
    { path = "std::sync::Mutex", reason = "the text path takes no FLUI lock (ADR-0092 §3)" },
    { path = "std::sync::RwLock", reason = "the text path takes no FLUI lock (ADR-0092 §3)" },
    # The root's entries, repeated: hash ids with FxHash.
    { path = "std::collections::HashMap", reason = "hash ids with rustc_hash::FxHashMap; per-frame sets over tree ids are flui_foundation::SlotSet" },
    { path = "std::collections::HashSet", reason = "hash ids with rustc_hash::FxHashSet; per-frame sets over tree ids are flui_foundation::SlotSet" },
]

# The root's entries, repeated (ADR-0244, ADR-0303 §6).
disallowed-methods = [
    { path = "android_activity::AndroidApp::sdk_version", reason = "ADR-0244: ask the platform's `AndroidApi` for a `Gate` in flui-native's version::gate" },
    { path = "std::panic::catch_unwind", reason = "ADR-0287: run user code through flui_foundation::panic (commit, FirstPanic), an OS entry through owner::panic_boundary::os_entry (ADR-0151 §16)" },
]
