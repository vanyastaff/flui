[package]
publish = ["crates-io"]
name = "flui-animation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Animation system for FLUI framework - persistent animation objects"
keywords = ["ui", "animation", "flutter", "rust"]
categories = ["gui"]
# The integration suites compile as modules of ONE test binary (tests/main.rs);
# per-file auto-discovered targets would each link the whole dependency stack.
# Targets that write process-global state stay separate.
autotests = false

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
# `/docs/GUIDE.md` and `/docs/PERFORMANCE.md` stay IN the archive — src/lib.rs
# pulls them in via `#[doc = include_str!(...)]` under `cfg(doctest)`, so
# excluding the whole directory broke `cargo test --doc` on the packaged
# crate. Only the two docs/ files nothing in src/ references are excluded.
exclude = ["/benches/", "/docs/ARCHITECTURE.md", "/docs/PATTERNS.md"]

[lints]
workspace = true

[dependencies]
# Core FLUI types
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
flui-scheduler = { path = "../flui-scheduler", version = "=0.2.0-dev" }
# `#[derive(TwoWayConverter)]` — re-exported for user-defined animatable types.
flui-macros = { path = "../flui-macros", version = "=0.2.0-dev" }

# Concurrency
parking_lot.workspace = true

# Utility
thiserror.workspace = true
smallvec.workspace = true
tracing.workspace = true

# Serialization (optional)
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest.workspace = true
serde_json = { workspace = true }

[features]
default = []
## Enable serde serialization/deserialization support for animation types.
serde = ["dep:serde", "smallvec/serde", "flui-painting/serde"]

[[test]]
name = "animation_it"
path = "tests/main.rs"

# Own target: installs a counting `#[global_allocator]`, which is process-wide.
[[test]]
name = "tick_allocation"
path = "tests/tick_allocation.rs"

[[bench]]
name = "animation_bench"
harness = false

[[bench]]
name = "vsync_registry"
harness = false

[package.metadata.flui]
layer = 3
tier = "S"
tier-kind = "internal"
order = 6
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "constant::ALWAYS_COMPLETE", grant = "ADR-0097", class = "immutable", reason = "a constant animation that is always complete" },
    { item = "constant::ALWAYS_DISMISSED", grant = "ADR-0097", class = "immutable", reason = "a constant animation that is always dismissed" },
]
