[package]
publish = ["crates-io"]
name = "flui-animation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Animation primitives for FLUI: controllers, curves, tweens, springs, keyframes and the vsync registry"
keywords = ["ui", "animation", "flutter", "rust"]
categories = ["gui"]
# The integration suites compile as modules of ONE test binary (tests/main.rs);
# per-file auto-discovered targets would each link the whole dependency stack.
# Targets that write process-global state stay separate.
autotests = false

# `src/lib.rs` includes `docs/GUIDE.md` and `docs/PERFORMANCE.md` for doctests, so they
# stay in the package; the rest of `docs/` and `benches/` are excluded.
exclude = ["/benches/", "/docs/ARCHITECTURE.md"]

[lints]
workspace = true

[dependencies]
# Core FLUI types
flui-painting = { workspace = true }
flui-foundation = { workspace = true }
flui-platform.workspace = true
# `#[derive(MotionValue)]`, re-exported beside the trait it implements.
flui-macros = { workspace = true }

# Utility
thiserror.workspace = true
smallvec.workspace = true
slab.workspace = true
tracing.workspace = true

# Serialization (optional)
serde = { workspace = true, optional = true }

[dev-dependencies]
flui-testing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
criterion = { workspace = true }
proptest.workspace = true
static_assertions.workspace = true
serde_json = { workspace = true }
# `CountingWaker` and `panicking_waker` for wake-counting tests.
flui-foundation = { workspace = true, features = ["testing"] }

[features]
default = []
## Structured lifecycle events and animation CPU spans; off in ordinary graphs.
diagnostics = ["flui-foundation/creation-site"]
## Enable serde serialization/deserialization support for animation types.
serde = ["dep:serde", "smallvec/serde", "flui-painting/serde"]

[[test]]
name = "animation_it"
path = "tests/main.rs"

# Own target: installs a counting `#[global_allocator]`, which is process-wide.
[[test]]
name = "tick_allocation"
path = "tests/tick_allocation.rs"

[[bench]]
name = "animation_bench"
harness = false

[[bench]]
name = "vsync_registry"
harness = false

[package.metadata.flui]
tier = "S"
tier-kind = "internal"
order = 6
