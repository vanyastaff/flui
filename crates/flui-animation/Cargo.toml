[package]
publish = ["crates-io"]
name = "flui-animation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Animation system for FLUI framework - persistent animation objects"
keywords = ["ui", "animation", "flutter", "rust"]
categories = ["gui"]
# The integration suites compile as modules of ONE test binary (tests/main.rs);
# per-file auto-discovered targets would each link the whole dependency stack.
# Targets that write process-global state stay separate.
autotests = false

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
# `/docs/GUIDE.md` and `/docs/PERFORMANCE.md` stay IN the archive — src/lib.rs
# pulls them in via `#[doc = include_str!(...)]` under `cfg(doctest)`, so
# excluding the whole directory broke `cargo test --doc` on the packaged
# crate. Only the two docs/ files nothing in src/ references are excluded.
exclude = ["/benches/", "/docs/ARCHITECTURE.md", "/docs/PATTERNS.md"]

[lints]
workspace = true

[dependencies]
# Core FLUI types
flui-painting = { workspace = true }
flui-foundation = { workspace = true }
flui-platform.workspace = true
# `#[derive(TwoWayConverter)]` — re-exported for user-defined animatable types.
flui-macros = { workspace = true }

# Utility
thiserror.workspace = true
smallvec.workspace = true
slab.workspace = true
tracing.workspace = true

# Serialization (optional)
serde = { workspace = true, optional = true }

[dev-dependencies]
flui-testing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
criterion = { workspace = true }
proptest.workspace = true
static_assertions.workspace = true
serde_json = { workspace = true }

[features]
default = []
## Structured lifecycle events and animation CPU spans; off in ordinary graphs.
diagnostics = ["flui-foundation/creation-site"]
## Enable serde serialization/deserialization support for animation types.
serde = ["dep:serde", "smallvec/serde", "flui-painting/serde"]

[[test]]
name = "animation_it"
path = "tests/main.rs"

# Own target: installs a counting `#[global_allocator]`, which is process-wide.
[[test]]
name = "tick_allocation"
path = "tests/tick_allocation.rs"

[[bench]]
name = "animation_bench"
harness = false

[[bench]]
name = "vsync_registry"
harness = false

[package.metadata.flui]
tier = "S"
tier-kind = "internal"
order = 6
