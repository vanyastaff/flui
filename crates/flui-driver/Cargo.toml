[package]
autotests = false
publish = ["crates-io"]
name = "flui-driver"
# Evolving: versioned `0.N` apart from the train (ADR-0238 §8), as `flui-sdk` is.
version = "0.1.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Drives a running FLUI app for tests, people and agents: locate by semantics, act through the app's own input path or the OS, wait on its frames, report a verdict"
keywords = ["ui", "testing", "automation", "accessibility", "flui"]
categories = ["gui", "development-tools::testing"]

# Dev-only files kept out of the published archive:
exclude = ["/ARCHITECTURE.md"]

[features]
default = []
# The headless target: the app's view hosted in process by `flui-testing`'s headless host on a
# virtual clock, its agent served without a socket (ADR-0238 §8).
headless = ["dep:flui-testing", "dep:flui-view", "dep:web-time"]
# Test support: a scripted OS lane and its activity guard, and a scripted agent served over a
# local socket, for tests of the driver itself and of front ends built on it (ADR-0243).
testing = []
# The Wayland lane on Linux: libei through the RemoteDesktop portal, for a nested or headless
# compositor of its own (ADR-0238 §5); off by default, since no Wayland session runs OS input
# without one.
wayland = ["dep:reis"]

[dependencies]
# The wire: the method table, its parameters and outputs, the envelope and the launch contract.
flui-protocol = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Input a lane could not release when no caller was left to tell.
tracing = { workspace = true }
# The launch token handed to a launched app.
getrandom = { workspace = true }
flui-testing = { workspace = true, optional = true }
flui-view = { workspace = true, optional = true }
# The containment of a panic out of the headless host, which ends the app, and out of a lane's
# code on its worker (ADR-0287).
flui-foundation = { workspace = true }
# The instants the in-process agent's conversation is polled at (std's on native targets).
web-time = { workspace = true, optional = true }

# Local sockets: a named pipe on Windows, a Unix domain socket elsewhere.
[target.'cfg(any(unix, windows))'.dependencies]
interprocess = { workspace = true }

# The private directory a launched app's Unix socket lives in.
[target.'cfg(unix)'.dependencies]
tempfile = { workspace = true }
# The user id that names the private directory of the OS-input lock; on Linux, the process group
# and parent-death signal a launched app starts with.
rustix = { workspace = true, features = ["process"] }

# The Linux lanes. X11: the X server's own protocol in pure Rust (no libxcb), with XTEST for input,
# XInput 2 for the guard's raw events, X-Resource for the process a window's client runs in, and
# the core requests for the keymap, focus and `GetImage`.
# Both lanes read the app through AT-SPI, on the zbus 5 the `atspi` proxies speak (the version
# `accesskit_unix`, which serves the app's tree, speaks), polled with `async-io`'s timers and
# `futures-lite`'s `block_on` on the lane's thread; the Wayland lane's portal goes over the same
# connection type.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, features = ["xtest", "xinput", "res"] }
atspi = { version = "0.29", default-features = false, features = ["proxies", "zbus"] }
async-io = "2.6"
futures-lite = "2.6"
# libei, the Wayland lane's input (`wayland` feature): a pure-Rust client of the EI protocol, whose
# socket the RemoteDesktop portal hands over.
reis = { version = "0.7", optional = true }

# The Windows lane: `SendInput` and synthetic pointer injection, the low-level hooks and raw input
# its guard watches, UI Automation, Windows Graphics Capture over Direct3D 11, and the job object a
# launched app runs in.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
flui-driver = { path = ".", features = ["headless", "testing", "wayland"] }
flui-foundation = { workspace = true }
flui-view = { workspace = true }
flui-widgets = { workspace = true }
tempfile = { workspace = true }

# The scenario apps in a window (`examples/scenario_app.rs`) and the Windows tests' own foreign
# input: the Windows lane's runs only. A dev-dependency, never linked into the library, which
# reaches no host (`reach-forbid`).
[target.'cfg(windows)'.dev-dependencies]
flui-app = { workspace = true }
windows = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse"] }

# The scenario apps in a window for the X11 lane's runs, which start an X server of their own
# (`flui-native`'s Xvfb launcher, which picks a free display); the X11 tests' own foreign input
# is a second XTEST client. The Wayland lane's tests play the compositor's EIS server with
# `reis`'s server half.
[target.'cfg(target_os = "linux")'.dev-dependencies]
flui-app = { workspace = true }
flui-native = { workspace = true, features = ["testing"] }
x11rb = { workspace = true, features = ["xtest"] }
reis = "0.7"
enumflags2 = "0.7"
rustix = { workspace = true, features = ["event"] }

[[test]]
name = "driver_it"
path = "tests/main.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.flui]
tier = "H"
tier-kind = "evolving"
# Above `flui-app`, below `flui-cli`, its first front end (ADR-0238 §8).
order = 3
# A client of the app, never linked into one: the CLI is its front end, and applications, tools
# and dev-dependencies are not restricted.
allowed-dependents = ["flui-cli"]
# It never links the app's host (ADR-0238 §8): its OS code is a client's.
reach-forbid = ["flui-native", "flui-app"]
# A host tool: it starts processes and connects to local sockets.
wasm = false
