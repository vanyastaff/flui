[package]
publish = ["crates-io"]
name = "flui-sdk"
# Its own `0.N`, bumped on every train and published in the same run, not the
# workspace version: the SDK is Evolving and breaks without a `flui` major
# (ADR-0081 §3, ADR-0088 §4). `cargo xtask workspace` refuses an evolving
# crate that inherits the version or leaves major 0.
version = "0.1.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The package-author surface of FLUI: what an official or third-party package builds on, without the host, engine or GPU stack (evolving)"
documentation = "https://docs.rs/flui-sdk"
keywords = ["gui", "ui", "sdk", "flui"]
categories = ["gui"]

# Dev-only files kept out of the published archive. The surface test needs the
# facade, a path-only dev-dependency the archive drops, so it cannot build there.
exclude = ["/ARCHITECTURE.md", "/tests/"]

[lints]
workspace = true

# Each internal crate is pinned to the train exactly (ADR-0088 §4). The list is
# what `flui-material`, `flui-cupertino` and `flui-devtools` import outside
# their tests; see ARCHITECTURE.md for how it was measured.
[dependencies]
flui-platform = { workspace = true }
flui-animation = { workspace = true }
flui-foundation = { workspace = true }
flui-view = { workspace = true }
flui-widgets = { workspace = true }
flui-interaction = { workspace = true }
flui-rendering = { workspace = true }
flui-painting = { workspace = true }
flui-objects = { workspace = true }
# `hooks::FrameSnapshot`, which `flui-devtools`' timeline records. Already in
# this crate's closure through `flui-view`, so reach does not change.
flui-scheduler = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }
# `tests/surface.rs` checks that each re-export is the facade's own type.
# Path-only, so `cargo package` drops it: the published SDK never names the
# facade.
flui = { path = "../..", default-features = false }
# The headless widget harness that mounts the custom recognizer in
# `tests/surface/custom_recognizer.rs`; a dev edge only, like the packages'.
flui-testing = { workspace = true }

[features]
animation-diagnostics = ["flui-animation/diagnostics"]
# Additive. Re-exports the handle-less input capabilities
# (`platform::input_capabilities`) and the second haptic tier with its requests
# and outcomes (`platform::haptics`) until every backend passes its conformance
# rows (ADR-0213 §5, ADR-0210 §9); flui-platform builds them regardless.
unstable-input = []

# Tier K, order 5: above every spine crate it re-exports and below the hosts,
# the highest tier the facade's `flui::sdk` surface covers. Evolving
# (ADR-0081 §3): its own `0.N` version, and a surface that may break on any
# train.
[package.metadata.flui]
tier = "K"
tier-kind = "evolving"
order = 5
