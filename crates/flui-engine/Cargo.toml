[package]
publish = ["crates-io"]
name = "flui-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU-accelerated rendering engine for FLUI using wgpu"
documentation = "https://docs.rs/flui-engine"
readme = "README.md"
keywords = ["rendering", "gpu", "wgpu", "ui", "graphics"]
categories = ["rendering::engine", "graphics", "gui"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md", "/CONTRIBUTING.md", "/benches/"]

[features]
default = []

# === wgpu GPU API Selection ===
# Additive pass-throughs to wgpu's own API features; the right one for the
# target OS is already enabled by the per-target dependency entries below.
vulkan = ["wgpu/vulkan", "wgpu/wgsl"]
metal = ["wgpu/metal", "wgpu/wgsl"]
dx12 = ["wgpu/dx12", "wgpu/wgsl"]
webgpu = ["wgpu/webgpu", "wgpu/wgsl"]
gles = ["wgpu/gles", "wgpu/wgsl"]

# GPU profiling via wgpu-profiler 0.28. OFF by default and excluded from wasm32
# — not because the crate cannot build there any more (0.28 type-checks clean
# for wasm32; see the `compile_error!` in src/lib.rs for the measurement) but
# because nothing exercises the combination. Requires TIMESTAMP_QUERY adapter
# support at runtime; the engine gracefully no-ops when the adapter lacks it.
gpu-profiler = ["dep:wgpu-profiler"]

# testing: the GPU readback/oracle suites (`cargo nextest run -p flui-engine
# --features testing`, CI's gpu-test job) and the bench scaffolding they share
# (`OffscreenRenderer`, `TexturePool`, `PathCache`). Off by default and not
# part of the public API; the same name and meaning as in flui-layer and
# flui-rendering.
testing = []

[dependencies]
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
flui-layer = { path = "../flui-layer", version = "=0.2.0-dev" }

# === GPU Rendering (wgpu backend) ===
wgpu = { workspace = true, default-features = false }
# Shader composition: resolves #import directives at pipeline-init time.
naga_oil = { workspace = true }
# `std` is required so `raw_window_handle::HandleError` impls `std::error::Error`
# (the impl is `#[cfg(feature = "std")]` in raw-window-handle 0.6.2); that lets us
# box a `HandleError` directly into `EngineError::SurfaceCreation` via the typed
# `#[source] Box<dyn Error + Send + Sync + 'static>` ctor instead of stringifying.
raw-window-handle = { version = "0.6", features = ["std"] }
# Glyph atlas packer (`crate::glyph_atlas`): the bucketed shelf allocator
# glyphon used, now driven directly — the engine rasterises through
# `flui_painting::SharedFontSystem::rasterize` and owns the atlas (ADR-0067).
etagere = "0.3"
# Glyph-key hashing in the atlas: a `GlyphKey` is five small integers, where
# SipHash costs more than the lookup it guards (measured: ~20% of a
# text-heavy frame).
rustc-hash = { workspace = true }
bytemuck = { workspace = true }

# Vector graphics tessellation (`crate::wgpu::tessellator`).
lyon = { version = "1.0.16" }

# Math for GPU rendering — workspace base has bytemuck; add serde here for GPU struct serialization
glam = { workspace = true, features = ["serde"] }

# === Utilities ===
parking_lot = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Portable Instant for GPU-path diagnostic spans (issue #1045). Same pin the
# foundation clock and the app runner already use — std::time::Instant panics
# on wasm32-unknown-unknown before surface acquire/present can complete.
web-time = { workspace = true }
# Raster mailbox + dedicated ack channel — bounded, typed
# backpressure, following the render invalidation channel's precedent.
crossbeam-channel = { workspace = true }
# Compile-time Send/Sync pins (ADR-0045 decision 1's `Renderer: Send`
# derivation and `!Sync` posture) — same convention as flui-app/flui-view/
# flui-rendering etc.
static_assertions = { workspace = true }

# GPU profiling (optional, feature-gated, excluded from wasm32 via feature design)
wgpu-profiler = { workspace = true, optional = true }


# === Per-platform default GPU backends ===
# wgpu compiles only the backends named in its Cargo features. These
# target-scoped entries are feature-unified with the base `wgpu` dependency
# above, so every consumer of flui-engine gets the native backend for the
# compile target without opting in. The mapping mirrors
# `Renderer::select_backend()`; the named features above (`vulkan`, `metal`,
# `dx12`, `webgpu`, `gles`) remain available to enable additional backends.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["dx12"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["metal"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# fragile-send-sync-non-atomic-wasm: wgpu types are Rc/RefCell-based on the
# WebGPU backend and therefore !Send; this feature marks them Send+Sync, which
# is sound only while the wasm build has no threads (no atomics target
# features). Required by flui-app's Send-bounded frame callbacks.
wgpu = { workspace = true, default-features = false, features = [
    "webgpu",
    "gles",
    "fragile-send-sync-non-atomic-wasm",
] }

[build-dependencies]
# Generates Rust bindings from gamma.wgsl in build.rs (P1 pilot).
# Not compiled into the crate binary.
wgsl_bindgen = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
criterion = { workspace = true }
# PNG encoding for GPU readback frame dumps (`wgpu::readback_dump` test
# support) — the only remaining `image` consumer, and it is a dev/test one.
image = { workspace = true }
# Compile-fail fixtures pinning ADR-0045 decision 1: an unwrapped raw
# platform handle breaks `Renderer`'s derived `Send`, and a `!Send` backend
# cannot implement `RasterBackend` now that `Send` is a supertrait. Same
# crate/version flui-types already uses for its unit-mixing compile-fail
# suite (`crates/flui-types/tests/unit_mixing_compile_fail.rs`).
trybuild = { workspace = true }

# Executing wasm32 tests for the frame-timing helper (issue #1045). Pinned
# exactly like flui-foundation / flui-app: 0.3.77 pairs with the locked
# wasm-bindgen 0.2.127; an unpinned `"0.3"` would bump the workspace lock.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[[bench]]
name = "render_throughput"
harness = false
# Measures a warm `PathCache::get` hit, reachable only under the test feature.
required-features = ["testing"]

# Text-heavy frames end to end (record → encode → submit); the gate for the
# engine-owned glyph rasteriser (ADR-0067).
[[bench]]
name = "text_throughput"
harness = false

[[bench]]
name = "offscreen_resource_cache"
harness = false
required-features = ["testing"]

[[bench]]
name = "raster_backpressure"
harness = false
# The raster mailbox / accounting seam is backend-generic (a `NoOpBackend`
# stands in below) — no GPU, no wgpu feature required.

[lints]
workspace = true

[package.metadata.docs.rs]
# NOT `all-features`: that would enable `testing`, whose
# `OffscreenRenderer`/`PooledTexture`/`TexturePool` re-exports are bench
# scaffolding the crate documents as "NOT part of the public API". The
# per-target wgpu entries in this manifest apply on docs.rs's linux host.
features = []
rustdoc-args = ["--cfg", "docsrs"]

# cargo-shear reports the trybuild compile-fail inputs as unlinked: the
# `compile_fail` test hands them to rustc by glob, no module declares them.
[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]

[package.metadata.flui]
layer = 4
tier = "R"
tier-kind = "internal"
order = 4
