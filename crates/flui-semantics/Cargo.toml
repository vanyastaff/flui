[package]
publish = ["crates-io"]
name = "flui-semantics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Semantics tree for FLUI accessibility - part of 5-tree architecture"
keywords = ["ui", "accessibility", "semantics", "a11y", "screen-reader"]
categories = ["gui", "accessibility"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md", "/benches/"]

[features]
default = []
# Exposes test-only constructors (e.g. `SemanticsOwner::new_without_callback`)
# to integration tests in downstream crates without leaking them into
# production builds.
testing = []

[dependencies]
# Foundation - canonical ID types (SemanticsId)
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }

# Tree abstractions - TreeRead, TreeNav, etc.
flui-tree = { path = "../flui-tree", version = "=0.2.0-dev" }

# Types - geometry, semantics types
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }

# The semantics vocabulary (`SemanticsRole`, `SemanticsAction`), shared with
# tests, devtools and agents; re-exported from `role` and `action`.
flui-protocol = { workspace = true }

# Accessibility tree model: this crate owns the translation from its own
# semantics tree into the shape platform adapters and UI-testing harnesses
# both consume.
accesskit = { workspace = true }

# Slab storage for O(1) access
slab = "0.4"

# Thread-safe primitives
parking_lot = "0.12"

# Tracing for diagnostics
tracing = "0.1"

# Small-string optimization - O(1) clone for label/hint/value
smol_str = "0.3"

# Stack-allocated vectors for small collections (children, actions)
smallvec = "1.15"

# Fast hashing for SemanticsId HashMap keys
rustc-hash = "2.1"

# Typed public errors
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
accesskit_consumer = { workspace = true }
criterion = { workspace = true }

# Cost of a semantics-enabled frame as a function of tree size — the number the
# pipeline's scalability work has to beat.
[[bench]]
name = "publish_cost"
harness = false

[package.metadata.flui]
layer = 3
tier = "S"
tier-kind = "internal"
order = 5
