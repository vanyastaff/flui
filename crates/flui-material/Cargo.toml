[package]
publish = ["crates-io"]
name = "flui-material"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Material Design theming foundation for FLUI — ColorScheme, Typography/TextTheme, ThemeData, and the Theme inherited widget"
repository.workspace = true
keywords = ["ui", "material", "theme", "flutter", "flui"]
categories = ["gui"]
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md"]

[dependencies]
# `Theme` is an `InheritedView` that implements `flui-widgets`' `InheritedTheme`
# trait and wraps `BoxedView`/`IntoView` — the widget-authoring spine.
flui-widgets = { path = "../flui-widgets", version = "=0.2.0-dev" }
# `InheritedView`, `impl_inherited_view!`, `BuildContext`, `View` — the
# element-tree primitives `Theme` is built on.
flui-view = { path = "../flui-view", version = "=0.2.0-dev" }
# `Color`, `Brightness`, `TextStyle` and friends — the value types
# `ColorScheme`/`TextTheme`/`ThemeData` are built from.
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }
# `Material` wraps `RenderPhysicalShape` (`RenderPhysicalModelBase<PathClip>`)
# — the clip+shadow+fill render object it configures.
flui-objects = { path = "../flui-objects", version = "=0.2.0-dev" }
# `BoxProtocol` — `Material`'s `RenderView::Protocol`.
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev" }
# `Listenable` — `InkWell` subscribes to its `WidgetStatesController`
# (`WidgetState`/`WidgetStateProperty`/`WidgetStatesController` themselves
# live in `flui-widgets`, per Flutter's own `MaterialState` → `WidgetState`
# split — already a dependency).
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
# `AnimationController`/`Vsync` — `InkWell`'s ~100ms press-deactivation
# timer (see `ink_well.rs`'s module doc, "Press-state timing").
flui-animation = { path = "../flui-animation", version = "=0.2.0-dev" }
# `FocusNode` — `InkWell::focus_node`'s external-node pass-through.
flui-interaction = { path = "../flui-interaction", version = "=0.2.0-dev" }
# `PostFrameHandle` — `ScaffoldMessenger` defers a tick-driven `SnackBar`
# `on_closed` callback out of the build phase through it.
flui-scheduler = { path = "../flui-scheduler", version = "=0.2.0-dev" }
tracing = { workspace = true }

[dev-dependencies]
# `tests/common/mod.rs` is a thin re-export of the canonical headless harness
# in `flui_widgets::testing` — the dev-dependency flips the feature that
# compiles it (the normal dependency above stays featureless, so no
# production graph links the test driver).
flui-widgets = { path = "../flui-widgets", version = "=0.2.0-dev", features = ["testing"] }
# Integration tests mount a real widget tree (`Theme` + a `SizedBox` leaf)
# through the render pipeline to prove `Theme::of`/`maybe_of` and rebuild
# scoping end-to-end.
flui-rendering = { path = "../flui-rendering", version = "=0.2.0-dev", features = ["testing"] }
flui-objects = { path = "../flui-objects", version = "=0.2.0-dev", features = ["testing"] }
flui-testing = { workspace = true }
# `DrawCommand` — the selection-controls' painter unit tests
# (`checkbox`/`switch`/`radio`) record a real paint pass and pattern-match
# its recorded circle commands; `flui_rendering::pipeline` re-exports
# `Canvas`/`DisplayList` from this crate but not the `DrawCommand` enum
# itself.
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }
# `FocusNode` handles and gesture-arena types a few tests construct directly
# (`ink_well.rs`, `text_field.rs`, `material.rs`). Pointer-event construction
# moved into the shared harness (`flui_widgets::testing`), which enables this
# same `testing` feature itself.
flui-interaction = { path = "../flui-interaction", version = "=0.2.0-dev", features = ["testing"] }

[lints]
workspace = true

[[test]]
name = "material_it"
path = "tests/main.rs"

[package.metadata.flui]
layer = 7
# ADR-0028: no other crate depends on a design system in any form, and the
# two design systems do not depend on each other.
allowed-dependents = ["flui-localizations", "flui-app", "flui"]
allowed-dev-dependents = ["flui-localizations", "flui-app", "flui"]
