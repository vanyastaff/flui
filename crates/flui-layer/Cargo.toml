[package]
publish = ["crates-io"]
name = "flui-layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Compositor layer tree for FLUI — the fourth of its five trees"
keywords = ["ui", "gpu", "compositor", "layer", "rendering"]
categories = ["gui", "graphics", "rendering"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md"]

[features]
default = []

# testing: the `crate::testing::inspect` walkers (structure, clip/transform
# collectors, a Diagnosticable-backed dump). Off by default; this crate's unit
# tests see the module through `cfg(test)`, and downstream crates that want it
# forward the feature.
testing = []

[dependencies]
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }
# Layers carry recorded painting (`DisplayList`, `Canvas`).
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }

# `PerformanceOverlayOption` flag set.
bitflags = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Compile-time pins of the raster-boundary auto traits (`Send + Sync` on
# `Layer`, `LayerTree`, `Scene`, `SceneSnapshot`).
static_assertions.workspace = true

[lints]
workspace = true

[package.metadata.flui]
layer = 3
tier = "R"
tier-kind = "internal"
order = 1
