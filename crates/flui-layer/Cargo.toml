[package]
publish = ["crates-io"]
name = "flui-layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Compositor layer tree for FLUI — the fourth of its five trees"
keywords = ["ui", "gpu", "compositor", "layer", "rendering"]
categories = ["gui", "graphics", "rendering"]
# One integration-test binary (`tests/main.rs`, target `layer_it`) instead of
# one link of the full dependency stack per test file. No root test writes
# process-global state (`LayerLink::new`'s counter is a benign monotonic
# atomic), so nothing needs an isolated target.
autotests = false

[features]
default = []

# testing: the `crate::testing::inspect` walkers (structure, clip/transform
# collectors, a Diagnosticable-backed dump). Off by default; enabled for this
# crate's own dev targets via the self dev-dependency below, and forwarded by
# downstream crates that want it.
testing = []

[dependencies]
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
flui-tree = { path = "../flui-tree", version = "=0.2.0-dev" }
flui-types = { path = "../flui-types", version = "=0.2.0-dev" }
# Layers carry recorded painting (`DisplayList`, `Canvas`).
flui-painting = { path = "../flui-painting", version = "=0.2.0-dev" }

# `PerformanceOverlayOption` flag set.
bitflags = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Turns the off-by-default `testing` feature on for this crate's own
# integration tests.
# Checkout-only test edge; see docs/workspace-layers.toml release policy.
flui-layer = { path = ".", features = ["testing"] }
# Compile-time pins of the raster-boundary auto traits (`Send + Sync` on
# `Layer`, `LayerTree`, `Scene`, `SceneSnapshot`).
static_assertions.workspace = true

[[test]]
name = "layer_it"
path = "tests/main.rs"

[lints]
workspace = true
