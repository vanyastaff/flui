[package]
publish = ["crates-io"]
name = "flui-layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Compositor layer tree for FLUI — the fourth of its five trees"
keywords = ["ui", "gpu", "compositor", "layer", "rendering"]
categories = ["gui", "graphics", "rendering"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md", "/benches/", "/tests/"]
# Integration tests are modules of one binary, declared below.
autotests = false

[features]
default = []

# testing: `SceneVersion::flatten`, the oracle a retained version is compared
# against, and the `crate::testing::inspect` walkers (structure, clip/transform
# collectors). Off by default; this crate's unit
# tests see the module through `cfg(test)`, and downstream crates that want it
# forward the feature.
testing = []

[dependencies]
flui-foundation = { workspace = true }
# Layers carry recorded painting (`DisplayList`, `Canvas`).
flui-painting = { workspace = true }

# `PerformanceOverlayOption` flag set.
bitflags = { workspace = true }
# The external-texture registry is fed from producer threads.
parking_lot = { workspace = true }
# A chunk names the one texture it usually draws inline (ADR-0304 §2).
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The `damage_diff` bench.
criterion = { workspace = true }
# Checkout-only test edge: versionless, so Cargo drops it from the published
# manifest. `tests/` reach `SceneVersion::flatten` and the owner's table cost.
flui-layer = { path = ".", features = ["testing"] }
# The persistent table's model test against `BTreeMap`.
proptest = { workspace = true }

# The damage producer's per-frame cost over 1,000 boundaries.
[[test]]
name = "layer_it"
path = "tests/main.rs"

[[bench]]
name = "damage_diff"
harness = false

[lints]
workspace = true

[package.metadata.flui]
tier = "R"
tier-kind = "internal"
order = 1
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "scene::id::NEXT_LINEAGE", grant = "ADR-0097", class = "counter", reason = "Scene lineages, minted from every UI thread by AtomicIdMint with permanent typed exhaustion refusal" },
]
