[package]
publish = ["crates-io"]
name = "flui-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Procedural macros for the FLUI framework (View derives, builder helpers)"
repository.workspace = true
keywords = ["flui", "proc-macro", "view", "derive"]
categories = ["gui"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md"]

[lib]
proc-macro = true

[dependencies]
# The derive-macro stack shares the workspace's proc-macro2 and syn versions.
proc-macro-crate = "3.5"
proc-macro2 = { workspace = true }
quote = "1"
syn = { workspace = true, features = ["full", "visit"] }

[features]
default = []

# `flui-foundation` is a dev-dependency only: the `Diagnosticable` derive
# resolves runtime paths in the *consuming* crate, so
# the proc-macro crate itself never needs `flui-foundation` at build time.
# The integration tests in `tests/` are a separate compilation unit that DOES
# use the runtime trait, hence the dev-dep. This introduces no dependency
# production dependency cycle: `flui-foundation` uses `flui-macros` only
# as a dev-dependency to test derives inside the runtime owner.
[dev-dependencies]
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }

[lints]
workspace = true

[package.metadata.flui]
layer = 1
tier = "V"
tier-kind = "internal"
order = 3
