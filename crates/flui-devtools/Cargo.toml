[package]
publish = ["crates-io"]
name = "flui-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Runtime developer tooling for FLUI - frame profiler, timeline and tree-observation counters"

# The crate exists only to provide these modules, so the docs must show them.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# Timing and performance (web-time is the maintained replacement for instant)
web-time = { workspace = true }

# Data structures
parking_lot = { workspace = true }

# `timeline` only: `TimelineEvent` serialises for the Chrome-trace and JSON
# exporters, so the feature owns both edges.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# `inspector` only: the ADR-0040 `TreeObserver` seam.
flui-foundation = { path = "../flui-foundation", version = "=0.3.0-beta.1", optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# `timeline` only. FrameSnapshot/InputEpoch: the frame-telemetry types
# `Timeline::record_frame_snapshots` turns into Chrome-trace events, reusing
# this module's existing exporter rather than inventing a second trace
# format. A normal downward edge (flui-devtools sits above flui-scheduler in
# the workspace DAG) — see docs/workspace-layers.toml.
flui-scheduler = { path = "../flui-scheduler", version = "=0.3.0-beta.1", optional = true }

[features]
# Everything on: a crate that exists only to provide these three modules
# gives its user nothing with an empty default. Release builds stay at zero
# devtools cost by not depending on this crate at all, not by a feature here.
default = ["profiling", "timeline", "inspector"]

# Frame profiler. `tracing-subscriber` is what lets it be *fed*: layer 9
# cannot be called by the framework, so `FrameTimingLayer` subscribes to the
# frame spans the framework already emits.
profiling = ["dep:tracing", "dep:tracing-subscriber"]

# Event timeline with Chrome-trace export and the FrameSnapshot bridge.
timeline = ["dep:flui-scheduler", "dep:serde", "dep:serde_json"]

# Counting/logging tree observer over the ADR-0040 observation seam.
# Depends ONLY on flui-foundation (dependency inversion) — still zero
# access to the trees themselves.
inspector = ["dep:flui-foundation", "dep:tracing"]

# The complete inventory, kept as an explicit name for `cargo hack` runs.
full = ["profiling", "timeline", "inspector"]

[dev-dependencies]
# `log_capture::disarm_interest_cache`, which this crate's tracing-capturing
# tests call so a sibling test cannot poison their callsites' cached interest,
# and `HeadlessBinding`, which the end-to-end profiler test drives a real
# frame through. A dev-only edge, and a dev-only CYCLE: flui-testing depends
# on this crate through its own dev graph. Cargo permits these checkout dev
# cycles so a lower crate can use the test support built on it.
# Checkout-only test edge; see docs/workspace-layers.toml release policy.
flui-testing = { path = "../flui-testing" }
# The end-to-end test's one-leaf tree: a `RenderView` over `RenderSizedBox`.
flui-view = { path = "../flui-view", version = "=0.3.0-beta.1" }
flui-objects = { path = "../flui-objects", version = "=0.3.0-beta.1" }
flui-rendering = { path = "../flui-rendering", version = "=0.3.0-beta.1" }
# The composition an app ships: FLUI's log subscriber plus the profiler layer.
flui-log = { path = "../flui-log", version = "=0.3.0-beta.1" }

# The profiler demo exercises the `profiling`-gated `profiler` module.
[[example]]
name = "profiler_demo"
required-features = ["profiling"]

[lints]
workspace = true
