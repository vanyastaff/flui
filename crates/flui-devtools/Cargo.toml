[package]
name = "flui-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Developer tools for FLUI - profiling, debugging, hot reload, and inspection"

[dependencies]

# Timing and performance (web-time is the maintained replacement for instant)
web-time = { workspace = true }

# Serialization (for devtools protocol). `serde_json` is only reached by the
# Chrome-trace exporter in `timeline`, so the feature owns the edge.
serde = { workspace = true }
serde_json = { workspace = true, optional = true }

# Hot reload support (shared watcher in flui-hot-reload)
flui-hot-reload = { path = "../flui-hot-reload", version = "0.2.0", optional = true, features = [
    "source-watch",
] }
flui-foundation = { path = "../flui-foundation", version = "0.2.0", optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# FrameSnapshot/InputEpoch: the frame-telemetry types `timeline`'s
# `Timeline::record_frame_snapshots` turns into Chrome-trace events, reusing
# this module's existing exporter rather than inventing a second trace
# format. A normal downward edge (flui-devtools sits above flui-scheduler in
# the workspace DAG) — see docs/workspace-layers.toml.
flui-scheduler = { path = "../flui-scheduler", version = "0.2.0", optional = true }

# Data structures
parking_lot = { workspace = true }

# Platform-specific (Windows memory info)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
default = []

# === Core Features ===
# Performance profiling support. `tracing-subscriber` is what lets the
# profiler be *fed*: layer 9 cannot be called by the framework, so it
# subscribes to the frame spans the framework already emits.
profiling = ["dep:tracing", "dep:tracing-subscriber"]

# Timeline/frame history tracking
timeline = ["dep:flui-scheduler", "dep:serde_json"]

# === Advanced Features ===
# Hot code reload for development
hot-reload = ["dep:flui-hot-reload"]

# Counting/logging tree inspector over the ADR-0040 observation seam.
# Depends ONLY on flui-foundation (dependency inversion) — still zero
# access to the trees themselves.
inspector = ["dep:flui-foundation", "dep:tracing"]

# === Convenience Features ===
# Enable all features. This list is the crate's honest capability inventory —
# a subsystem that does not exist (inspector, network monitor, memory
# profiler, remote debug) has no feature here, commented or otherwise.
full = ["profiling", "timeline", "hot-reload", "inspector"]

[dev-dependencies]
# `log_capture::disarm_interest_cache`, which this crate's tracing-capturing
# tests call so a sibling test cannot poison their callsites' cached interest.
# A dev-only edge, and a dev-only CYCLE: flui-testing depends on this crate
# normally, which cargo permits for dev-dependencies precisely so a lower crate
# can use the test support built on it.
flui-testing = { workspace = true }

# The profiler demo exercises the `profiling`-gated `profiler` module, so it
# only builds when that feature is enabled (it is off in the default build).
[[example]]
name = "profiler_demo"
required-features = ["profiling"]

# [[bench]]
# name = "profiler_bench"
# harness = false

[lints]
workspace = true
