[package]
publish = ["crates-io"]
name = "flui-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "View traits and abstractions for FLUI framework"
repository.workspace = true
keywords = ["ui", "view", "widget", "flui", "framework"]
categories = ["gui"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md", "/benches/"]
# Single-binary integration-test consolidation: every root test file is a
# module of `tests/main.rs` (one link of the full dep stack instead of 24
# separate binaries). See the `[[test]] name = "view_it"` target below.
autotests = false

[dependencies]
flui-foundation = { workspace = true }
flui-macros = { workspace = true }
flui-painting = { workspace = true }
flui-rendering = { workspace = true }
# Owner-routed interaction targets/dispatch handles (ADR-0027).
flui-interaction = { workspace = true }
# Concrete render-object catalog (moved out of flui-rendering into flui-objects).
# Two reasons, one of which T09 removes: the snap/expand controller
# plumb-through for the floating persistent headers (the WIDGET catalog owns
# the controller lifecycle; this crate only carries the already-built
# controller into the render object), and `environment::VsyncScope` — the
# inherited frame registry implicitly-animated widgets acquire.
flui-animation = { workspace = true }
flui-objects = { workspace = true }
# The frame-driven async task driver. A `ViewState` reaches its
# binding's driver through `BuildContext::async_driver()`; the type lives here.
# No cycle: flui-rendering already depends on flui-scheduler.
flui-scheduler = { workspace = true }
# The `Stream` trait `StreamBuilder` polls. Trait-only.
futures-core = { workspace = true }
# The byte-storage capability `LifecycleContext::storage` hands out and the
# `persist` documents write through. Contracts only, no backend (ADR-0082).
flui-platform = { workspace = true }

# The agent-protocol schema the development-agent seam speaks
# (`dev_agent`, ADR-0095 §3).
flui-protocol = { workspace = true }

# Core dependencies
parking_lot.workspace = true
# Deterministic hashing of per-frame owner tables.
rustc-hash.workspace = true
slab.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `Revision` serializes as its number, for a document that records another's
# revision.
serde = { workspace = true, optional = true }

# Trait utilities
downcast-rs = { workspace = true }
dyn-clone = { workspace = true }

# `ReconcileEventCollector` (gated to `testing` feature
# or `cfg(test)`) needs `tracing_subscriber::Layer` and the `registry`
# extension trait. Optional + gated so production builds don't pull
# it in.
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
# Self-reference so integration tests reach the `testing` module (the owned,
# detached `ElementBuildContext`). Checkout-only.
flui-view = { path = ".", features = ["testing"] }
# `log_capture::disarm_interest_cache`, which this crate's tracing-capturing
# tests call so a sibling test cannot poison their callsites' cached interest.
# A dev-only edge, and a dev-only CYCLE: flui-testing depends on this crate
# normally, which cargo permits for dev-dependencies precisely so a lower crate
# can use the test support built on it.
# Checkout-only test edge: versionless, so Cargo drops it from the published manifest.
flui-testing = { path = "../flui-testing" }
criterion = { workspace = true }
# The `serde` round trip of `Revision`.
serde_json = { workspace = true }
# Enable flui-rendering's `testing` feature for unit tests so the
# layout-builder tests can read committed geometry back off the pipeline
# (`testing::box_geometry`). Dev-only; stays out of release builds.
flui-rendering = { workspace = true, features = ["testing"] }
# Enable flui-scheduler's `testing` feature so `future_builder.rs`'s
# `nested_token_disposal_cancels_child_and_parent` unit test can reach
# `AsyncDriver::is_unlocked`. Dev-only; stays out of release builds.
flui-scheduler = { workspace = true, features = ["testing"] }
# Same crate; dev-deps must redeclare so unit tests + integration
# tests under `#[cfg(test)]` (without the `testing` feature flag
# enabled at the integration boundary) still see it. Cargo merges
# both declarations; no duplication in the lockfile.
tracing-subscriber = { workspace = true }
static_assertions = { workspace = true }
# Serialize legacy fixtures that install the
# thread-local fallback GlobalKey registry via `test_only_set_global_key_registry`.
# The adapter is isolated from the production UI runtime-activation stack, but the
# fixture tests still share assumptions about explicit install/clear pairing.
serial_test = "4"
# trybuild drives the `tests/ui/` compile-fail corpus: the column! 17-children
# case and the `#[diagnostic::on_unimplemented]` messages on the view traits.
trybuild = { workspace = true }

[[test]]
name = "view_it"
path = "tests/main.rs"
# The suite mints signals through `BuildOwner::signal_graph` and other
# `testing` accessors; without the feature it does not compile, so a
# build without it (feature-matrix runs each feature alone) leaves it out, as
# flui-system does with `system_it`.
required-features = ["testing"]

# Deliberately its own process: these tests install a counting error-view
# builder into flui-view's process-global cell; isolation (not opt-in locks)
# is what keeps the rest of the suite's induced panics from polluting it.
[[test]]
name = "error_view_recovery"
path = "tests/error_view_recovery.rs"

[features]
default = []
# Enable test utilities like MockBuildContext + the
# `ReconcileEventCollector` Layer fixture. Downstream
# test crates flip this to install the collector. Pulls in the
# optional `tracing-subscriber` dep at build time.
testing = ["dep:tracing-subscriber"]
# Accepted and ignored: UI runtime-scoped signals are always compiled (ADR-0085 §5).
# It stays only because CI's `test-features` job still passes
# `--features flui-view/signals`; it goes with that step.
signals = []
# Serialization of `persist::Revision`.
serde = ["dep:serde"]

# The `legacy-downcast` feature flag was retired
# (FR-021): the pre-FR-021 inline `downcast_ref::<V>()` body inside
# `ElementCore::update_view` is gone — `dispatch_view_update`
# (TypeId-keyed `Box::downcast::<V>`) is the only path now.

# Files cargo-shear reports as unlinked although the build uses them:
# - `tests/ui/*.rs`: trybuild compile-fail inputs driven by `trybuild_ui.rs`,
#   never `mod`-ed.
# - the element-tree test modules: rustc resolves a `#[path]` inside the inline
#   `mod tests` of `src/tree/element_tree.rs` under `src/tree/element_tree/tests/`
#   (the rule for a non-mod.rs file); shear resolves it elsewhere.
# - `tests/support/build_owner_lifecycle_recovery.rs`: `include!`d by a test
#   module of `src/owner/build_owner.rs`, which shear does not follow.
[package.metadata.cargo-shear]
ignored-paths = [
    "tests/ui/*.rs",
    "src/tree/element_tree/tests/activation_recovery_tests.rs",
    "tests/support/build_owner_lifecycle_recovery.rs",
]

[[bench]]
name = "key_storage_shape"
harness = false

[[bench]]
name = "static_path_algorithm"
harness = false

[[bench]]
name = "global_key_reparent_latency"
harness = false

[[bench]]
name = "dense_update_reconcile"
harness = false

[[bench]]
name = "scoped_build_drain"
harness = false
required-features = ["testing"]

[lints]
workspace = true

[package.metadata.flui]
tier = "K"
tier-kind = "internal"
order = 1
# Process-global state, checked by `cargo xtask globals` (ADR-0097).
globals = [
    { item = "key::global_key::GlobalKey::new::COUNTER", grant = "ADR-0097", class = "counter", reason = "GlobalKey identities, advanced by try_update with a sticky exhaustion sentinel" },
    { item = "owner::global_key_scope::OwnerTag::fresh::NEXT", grant = "ADR-0097", class = "counter", reason = "Owner claim identities, advanced by try_update with a permanent exhaustion sentinel" },
    { item = "reactive::NEXT_GRAPH_ID", grant = "ADR-0097", class = "counter", reason = "Reactive graph identities, advanced by try_update with permanent exhaustion" },
    { item = "key::registry::REGISTRY_STACK", exit = "ADR-0311", reason = "the owner thread's GlobalKey registry stack, `ManuallyDrop` for a hot-reload cdylib" },
    { item = "key::registry::TEST_REGISTRY", exit = "ADR-0311", reason = "the fixture registry lane beside the stack, `ManuallyDrop` for a hot-reload cdylib" },
]
