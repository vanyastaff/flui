[package]
publish = ["crates-io"]
name = "flui-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types for FLUI - geometry, layout, styling"
keywords = ["gui", "geometry", "layout", "flutter", "flui"]
categories = ["gui", "data-structures"]

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/benches/"]
repository.workspace = true
# Single-binary integration-test consolidation: every root test file is a
# module of `tests/main.rs` (one link of the full dep stack instead of 16
# separate binaries). See the `[[test]] name = "types_it"` target below.
autotests = false

[dependencies]
# Geometry values live in `flui_foundation::geometry`; re-exported as `flui_types::geometry`.
flui-foundation = { path = "../flui-foundation", version = "=0.2.0-dev" }
thiserror = { workspace = true }

# Serialization support (optional).
# `rc` enables `Serialize`/`Deserialize` for `Arc<T>` — needed by
# `InlineSpan::Text(Arc<TextSpan>)`. Deserialization does not preserve Arc
# sharing (each is rebuilt independently), which is fine: display-list
# snapshots carry no cross-span aliasing to preserve.
serde = { workspace = true, optional = true, features = ["rc"] }

[dev-dependencies]
criterion = { workspace = true }
# Property-based tests: tests/color_property_tests.rs and the in-source
# color, locale and path tests
proptest = "1.5"
# #[case] tables in tests/color_blend_tests.rs and color_operations_tests.rs
rstest = { workspace = true }
trybuild = { workspace = true }
# `serde` feature round-trip tests (platform::locale's canonicalizing
# `Deserialize` impl) — a real JSON round-trip, not a hand-built `Value`.
serde_json = { workspace = true }

[features]
default = []

# === Serialization ===
# Serde support for all types (Color, Size, Rect, etc.)
# Forwards to flui-foundation/serde so the re-exported geometry values serialize too.
serde = ["dep:serde", "flui-foundation/serde"]

# === Performance ===
# SIMD acceleration for flui-types' own color.rs SSE/NEON code paths.
simd = []

# === Convenience ===
# Enable all features
full = ["serde", "simd"]

# NOTE: Image and font loading moved to flui-assets crate.
# flui_types only provides type definitions!

# Consolidated integration-test binary (see `autotests = false` above).
# Includes the trybuild compile-fail suite (`unit_mixing_compile_fail.rs`
# driving `tests/compile_fail/*.rs`) — trybuild resolves fixtures via
# CARGO_MANIFEST_DIR, so it is safe inside the consolidated target. No
# test file writes process-global state, so no isolated [[test]] targets
# are needed.
[[test]]
name = "types_it"
path = "tests/main.rs"

[[bench]]
name = "geometry_bench"
harness = false

[[bench]]
name = "color_bench"
harness = false


[lints]
workspace = true

# cargo-shear reports the trybuild compile-fail inputs as unlinked: the
# `unit_mixing_compile_fail` test hands them to rustc by glob, no module
# declares them.
[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]

[package.metadata.flui]
layer = 1
tier = "V"
tier-kind = "internal"
order = 5
