# Workspace clippy configuration.
#
# Panic policy support (docs/PANIC-POLICY.md): a panic in test code IS the
# failure report, so `#[test]` fns and `#[cfg(test)]` modules are exempt from
# the `unwrap_used` gate that guards production paths.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# `print_stdout`/`print_stderr` (on in the foundation crates) do not apply to
# tests, where printing is how a failure explains itself.
allow-print-in-tests = true

# Async work runs at IO/scheduling edges. Flag nested future frames above
# 8 KiB so their stack footprint is reviewed before growing further.
future-size-threshold = 8192

# The MSRV comes from `rust-version` in Cargo.toml; clippy reads it there.

# An OS version check is a typed gate in `flui-native`'s `version::gate` (ADR-0244): a
# marker above the floor and a `Since` proof the call takes, never an inline comparison.
disallowed-macros = [
    { path = "objc2::available", reason = "ADR-0244: gate the call on a `Gate` marker in flui-native's version::gate" },
]
disallowed-methods = [
    { path = "android_activity::AndroidApp::sdk_version", reason = "ADR-0244: ask the platform's `AndroidApi` for a `Gate` in flui-native's version::gate" },
    # ADR-0303 §6: a site that still catches by hand carries
    # `#[expect(clippy::disallowed_methods, reason = "ADR-0287: <why>")]` on its statement or
    # function, never on a file or module; test code is exempt at the crate root (ADR-0303 §5).
    { path = "std::panic::catch_unwind", reason = "ADR-0287: run user code through flui_foundation::panic (commit, FirstPanic), an OS entry through owner::panic_boundary::os_entry (ADR-0151 §16)" },
    # A widget reads the platform whose conventions it follows from `PlatformConvention::of`;
    # only the app runner, which installs that value at the root, takes the compile target.
    { path = "flui_platform::TargetPlatform::current", reason = "ADR-0028: read the platform from flui_view::environment::PlatformConvention::of; the runner is the one root default" },
]

# A hash table on an owner or frame path hashes with `rustc_hash` (FxHashMap/FxHashSet); a
# per-frame set over tree ids is a `SlotSet`/`SlotIndex`. std's SipHash with a random seed
# costs time on every lookup and buys protection from keys an attacker picks, which ids and
# fingerprints are not. The crates that hold this rule opt in with
# `#![warn(clippy::disallowed_types)]` at their root; the workspace default is `allow`
# (docs/gaps.md lists the crates still on SipHash). A table whose keys come from outside the
# process keeps SipHash under `#[expect(clippy::disallowed_types, reason = "…")]`.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "hash ids with rustc_hash::FxHashMap; per-frame sets over tree ids are flui_foundation::SlotSet" },
    { path = "std::collections::HashSet", reason = "hash ids with rustc_hash::FxHashSet; per-frame sets over tree ids are flui_foundation::SlotSet" },
]
