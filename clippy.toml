# Workspace clippy configuration.
#
# Panic policy support (docs/PANIC-POLICY.md): a panic in test code IS the
# failure report, so `#[test]` fns and `#[cfg(test)]` modules are exempt from
# the `unwrap_used` gate that guards production paths.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# `print_stdout`/`print_stderr` (on in the foundation crates) do not apply to
# tests, where printing is how a failure explains itself.
allow-print-in-tests = true

# Async work runs at IO/scheduling edges. Flag nested future frames above
# 8 KiB so their stack footprint is reviewed before growing further.
future-size-threshold = 8192

# The MSRV comes from `rust-version` in Cargo.toml; clippy reads it there.
