# Process markers outside the archival roots, written by `cargo xtask markers --seed`.
# Counts are exact and only go down: a file whose count of a class grows past its
# entry, or falls below it, is a finding. `reason` and `exit` apply to every entry.
reason = "written before the markers gate; each is to be restated as the invariant it stands for"
exit = "ADR-0078"

[[allow]]
path = "CHANGELOG.md"
class = "slice"
count = 4

