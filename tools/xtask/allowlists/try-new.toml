# Every `new` in the workspace that returns `Result` or `Option`, written by
# `cargo xtask try-new --seed`. Such a constructor is named `try_new` (AGENTS.md); the
# list only shrinks: the scan fails on a fallible `new` it does not name and on an
# entry whose `new` no longer fails.
reason = "written before the rule had a gate; each entry is renamed to `try_new`"

