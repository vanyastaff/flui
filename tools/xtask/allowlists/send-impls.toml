# Every `unsafe impl Send`/`Sync` in the workspace (ADR-0136), written by
# `cargo xtask send-impls --seed`. The list only shrinks: the scan fails on an impl it
# does not name and on an entry the code no longer has.
reason = "an OS handle or a plugin library the platform lets another thread hold; each impl carries its SAFETY comment"

[[allow]]
crate = "flui-desktop-mcp"
type = "KillOnExitJob"
traits = ["Send", "Sync"]

