# Hand-written `catch_unwind` in production code (ADR-0287), written by
# `cargo xtask catch-unwind --seed`. Counts are exact and only go down: the scan fails when a
# file gains a site, loses one (lower its count), or loses its last (remove the entry).
# `reason` and `exit` apply to every entry.
reason = "written before the commit-then-call primitives: each owner moves its ordering to `flui_foundation::panic::commit` and its fan-out to `FirstPanic`, one seam per change"
exit = "ADR-0287"

