# Every `with_` builder method of a description type (a view, `Application`, a
# `…Config/Options/Settings/Request/Builder/Params/Spec`), written by
# `cargo xtask builder-names --seed`. Such a method has the bare name (ADR-0325);
# the list only shrinks: the scan fails on a builder it does not name and on an
# entry that is no longer one.

[[allow]]
crate = "flui-engine"
type = "SlotConfig"
method = "with_color"
reason = "written before the rule had a gate; its crate's rename removes it"

[[allow]]
crate = "flui-engine"
