[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repository automation for FLUI: CI gates, change scoping and benchmark collection (`cargo xtask`)"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
# `cargo xtask file-length`: line spans of test-only items; `cargo xtask globals`
# parses the workspace's Rust source with syn, and `cargo xtask module-dag` the
# imports between a crate's top-level modules (`span-locations` gives a finding its line).
proc-macro2 = { workspace = true, features = ["span-locations"] }
# `cargo xtask markers`: Markdown read as events, not lines.
pulldown-cmark = { workspace = true }
regex = { workspace = true }
# `cargo xtask icon-import`: SVG path data (`kurbo`) and SVG/AVD XML (`roxmltree`).
kurbo = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "visit"] }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
wasmparser = { workspace = true }

[dev-dependencies]
# Authoritative source for the generated owned key vocabulary.
keyboard-types.workspace = true

[lints]
workspace = true

# The key-vocabulary generator reads keyboard-types source files through Cargo
# metadata instead of importing its Rust types. It remains a pinned input.
[package.metadata.cargo-shear]
ignored = ["keyboard-types"]

[package.metadata.flui]
tier-kind = "tool"
# Repository automation, a host tool.
wasm = false
