[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repository automation for FLUI: CI gates, change scoping, device checks and benchmark collection (`cargo xtask`)"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
# `cargo xtask file-length`: line spans of test-only items; `cargo xtask globals`
# parses the workspace's Rust source with syn.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# `cargo xtask markers`: Markdown read as events, not lines.
pulldown-cmark = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
toml = { workspace = true }
walkdir = { workspace = true }

# `cargo xtask device windows-a11y` and `windows-input`: a UI Automation
# client, and real input through `SendInput`.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[package.metadata.flui]
tier-kind = "tool"
# Repository automation, a host tool.
wasm = false
