[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repository automation for FLUI: generators and the changelog check (`cargo xtask`)"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
# `cargo xtask changelog`: Markdown read as events, not lines.
pulldown-cmark = { workspace = true }
regex = { workspace = true }
# `cargo xtask icon-import`: SVG path data (`kurbo`) and SVG/AVD XML (`roxmltree`).
kurbo = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "visit"] }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
# Authoritative source for the generated owned key vocabulary.
keyboard-types.workspace = true

[lints]
workspace = true

[package.metadata.flui]
tier-kind = "tool"
# Repository automation, a host tool.
wasm = false
