[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repository automation for FLUI: CI gates, change scoping and benchmark collection (`cargo xtask`)"
# `cargo xtask` runs the task runner; `test-desktop` is the program nextest
# starts each Windows test through (src/bin/test-desktop.rs).
default-run = "xtask"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
# `cargo xtask cross-typecheck` reads each crate's module tree with syn to find the files a
# target gates (`span-locations` gives a test-only item its lines).
proc-macro2 = { workspace = true, features = ["span-locations"] }
# `cargo xtask changelog`: Markdown read as events, not lines.
pulldown-cmark = { workspace = true }
regex = { workspace = true }
# `cargo xtask icon-import`: SVG path data (`kurbo`) and SVG/AVD XML (`roxmltree`).
kurbo = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "visit"] }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
wasmparser = { workspace = true }

# `test-desktop`: the desktop a Windows test runs on, and the process started there.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Authoritative source for the generated owned key vocabulary.
keyboard-types.workspace = true

# tests/test_desktop.rs shows a window from a process `test-desktop` started
# and lists the windows of each desktop.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

[package.metadata.flui]
tier-kind = "tool"
# Repository automation, a host tool.
wasm = false
