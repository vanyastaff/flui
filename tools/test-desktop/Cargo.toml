[package]
name = "test-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Starts each Windows test process on a desktop of its own, for nextest's wrapper script (ADR-0355)"

[package.metadata.flui]
tier-kind = "tool"
# A host tool: nextest's wrapper on Windows.
wasm = false

# The desktop a Windows test runs on, and the process started there.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }

# tests/test_desktop.rs shows a window from a process `test-desktop` started
# and lists the windows of each desktop.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
