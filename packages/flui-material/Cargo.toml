[package]
publish = ["crates-io"]
name = "flui-material"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Material Design theming foundation for FLUI — ColorScheme, Typography/TextTheme, ThemeData, and the Theme inherited widget"
repository.workspace = true
keywords = ["ui", "material", "theme", "flui"]
categories = ["gui"]
# All root tests/*.rs files are compiled as modules of ONE integration-test
# binary (tests/main.rs); the per-file auto-discovered targets each linked the
# whole dependency stack. Targets that write process-global state stay separate.
autotests = false

# Dev-only files a `cargo package --list` sweep found leaking into the
# published archive (internal architecture docs, criterion benches, etc.):
exclude = ["/ARCHITECTURE.md", "/assets"]

[dependencies]
# The package-author surface (ADR-0088 §4): the widget spine, the value types,
# `Material`'s render object through `pipeline`, and the derives' runtime
# paths. Material names no internal crate in a normal dependency.
flui-sdk = { workspace = true }
tracing = { workspace = true }

# The SDK's optional test kit is the only test framework dependency. The normal
# library build keeps the same SDK without `testing` and never links the driver.
[dev-dependencies]
flui-sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[[test]]
name = "material_it"
path = "tests/main.rs"

[package.metadata.flui]
tier = "pkg"
tier-kind = "official"
order = 1
# The kind rule (ADR-0081 §3, ADR-0088 §2) replaces a dependents list: only
# applications and official packages name this crate, and a core crate that
# does lists the edge in its own `edge-exceptions` (the facade does).
