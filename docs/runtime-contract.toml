[[contract]]
key = "scheduling-splits-by-level"
statement = """
Logical update scheduling (realm `UpdateScheduler`), physical pacing \
(presentation `FrameClock`), and raster backpressure are separate owners. \
`Scheduler` was hard-renamed to `UpdateScheduler` and reshaped (#556): \
its constructor no longer defaults to a fixed 60fps target (`FrameDuration::\
FPS_60` is deleted), `drive_frame` takes an explicit `deadline: IdleDeadline` that \
bounds `Priority::Idle` task execution ONLY (`Priority::Animation`/`Build` \
always run, regardless of the deadline), `budget()`'s `MutexGuard` accessor \
is replaced by the owned-value `budget_snapshot()`, and the fixed-rate \
`VsyncScheduler` simulator family is deleted outright. This narrowed what \
`UpdateScheduler` does; the second owner now exists: `FrameClock` (issue #556) \
is a pure, platform-free per-presentation state machine -- a `DemandMask` \
(`Dirty`/`Animation`/`Host`) plus three produce gates (hidden, first-frame \
deferral, in-flight/throttle capacity) -- now the sole one-per-presentation \
field on `PresentationState`, replacing `UiRealm`'s former realm-wide `vsync_slot` \
(the `Vsync` controller registry moved to per-presentation storage in the same \
slice) and gating `UiRealm::draw_frame_entered`'s per-presentation segment: \
the realm feeds `take_redraw_pending() || has_pending_work()` in as `Dirty` \
demand and lets `clock.poll` decide via `PollDecision::should_run_segment()`, \
provably equivalent to the direct predicate it replaces for EVERY reachable \
combination of demand and first-frame-deferral state (deferral is orthogonal \
to whether the segment runs -- see the next sentence -- so the equivalence \
holds unconditionally, not only in a not-deferred subspace) -- THIS \
equivalence claim is scoped to the `Dirty` demand source specifically \
(the union this sentence names); the driver-loop hybrid paragraph below \
adds a SEPARATE, `Animation`-only demand source that deliberately widens \
the overall segment-gate behavior beyond this scoped predicate, and says \
so explicitly rather than leaving the two paragraphs looking contradictory. \
Six \
pre-existing pinned deferral/vsync tests pass unedited bar one panic-message \
string, plus a strengthened assertion on one of them and several new tests \
proving the segment genuinely still runs while deferred. First-frame \
deferral folds into the same clock, but withholds ONLY the submit, never \
the segment -- Flutter's own contract \
(`.flutter/packages/flutter/lib/src/rendering/binding.dart:582-599`, \
`RendererBinding.deferFirstFrame`'s doc: "the framework will still do all \
the work to produce frames, but those frames are never sent to the \
engine") -- so `poll` returns `PollDecision::ProduceWithheld` (segment runs, \
mask clears, submit must be withheld) rather than a `Skip`, and \
`UiRealm::render_frame_entered` re-checks `FrameClock::is_deferred()` at its \
own, separate submit point (mirroring the old two-gate shape: a segment \
gate and an independent submit gate, not one gate doing both jobs). \
Because FLUI has no retained-scene layer to fall back on the way Flutter's \
`scheduleWarmUpFrame` re-composites the retained layer tree, \
`UiRealm::allow_first_frame` re-dirties the root whenever it actually lifts \
an active deferral, mirroring the pre-#556 `RenderingFlutterBinding`-based \
design's own `redirty_root_for_represent` call. "First frame confirmed \
sent" latches only on a segment-confirmed, unwithheld, unerrored `Produce` \
-- not on an idle no-demand pump and not on a withheld produce -- a \
deliberate timing decision (an idle pump latching would let a \
`defer_first_frame` issued only after it become permanently inert), pinned \
by its own test. This replaces `RenderingFlutterBinding`'s former counter \
at the `UiRealm`-forwarded call sites (`defer_first_frame`/`allow_first_frame`/ \
`send_frames_to_engine`); `RenderingFlutterBinding`'s own independent \
standalone defer/allow API (used only by its own `draw_frame()` convenience \
method, with no `UiRealm` involvement) is untouched. The third owner -- \
raster backpressure as its own owner reporting into `FrameClock`'s \
in-flight/throttle knobs -- is still unbuilt (named gap, tracked on the \
same issue). Hidden-surface gating IS now wired to a real visibility \
signal (#556): `UiRealm::set_presentation_hidden` calls \
`FrameClock::set_hidden`, addressed to exactly the presentation \
`PlatformToUi::WindowVisibility` was stamped for — see the \
`hidden-surface-gating` contract below for the full statement, including \
its compositor-conditional honesty scope. `flui-testing` gained an additive, independent \
multi-presentation clock registry (`HeadlessBinding::install_presentation_clock`/ \
`pump_presentation`/`pump_all`/`set_presentation_min_produce_interval`) \
alongside the untouched single-view `pump_frame`. \
\
**Driver-loop hybrid (#556):** production now DOES mark `Animation` \
demand from a running controller -- `draw_frame_entered`'s vsync-\
continuation loop samples `Vsync::has_running()` BEFORE each tick (so the \
tick that completes a controller still marks demand and flushes that \
completion, matching `.flutter/packages/flutter/lib/src/scheduler/\
ticker.dart:272-285`'s unconditional `_onTick` call before `\
shouldScheduleTick` is even consulted) and marks `DemandKind::Animation` \
whenever it was; this closes the divergence the previous paragraph used to \
describe against `flui-testing`'s own `pump_presentation`, which already \
did this, and is exactly the scoped WIDENING the equivalence sentence \
above now names explicitly -- the segment gate is no longer equivalent to \
the bare `Dirty`-only predicate on a presentation with a running, \
otherwise-silent controller, by design, matching Flutter's own \
`Ticker`-driven `scheduleFrame`. The platform-facing actuator itself is \
now edge-triggered: `FrameClock::try_arm_redraw_request` is a test-and-set \
latch (armed by the first demand mark after an empty mask, consumed by \
the next granted `poll` produce, and also disarmed by `clear_demand` when \
it empties the mask outside a produce) that `UiRealm::render_frame_entered` \
consults before calling `UiRealm::wake_frame()`, so N ticks that land \
before a produce clears the mask (GPU backpressure, a throttle window) \
collapse into exactly one platform-facing wake instead of one per tick. \
\
**Continuation-wake placement (a real, probe-confirmed production stall, \
not a hypothetical):** the continuation check runs in \
`render_frame_entered`, AFTER `mark_rendered()`/the retry check, NOT \
inside `draw_frame_entered`'s vsync loop where an earlier version of this \
same driver-loop work placed it. `mark_rendered()` unconditionally clears \
`needs_redraw` to `false`; a `wake_frame()` call made earlier in the SAME \
callback (inside `draw_frame_entered`) gets silently clobbered by that \
clear before the callback returns. On the real desktop path, where the \
NEXT platform callback's own dirty gate (`wake_action`, `runner/frame_pacing.rs`) reads \
`needs_redraw()`/`has_pending_work()` fresh -- neither of which a bare \
running controller with no other tree-visible effect keeps true -- that \
clobber silently stalled the controller after its anchor frame: reproduced \
with a production-sequence probe driving the exact `record_compositor_tick` \
-> `wake_action` -> `render_frame_entered` sequence `bootstrap_desktop`'s \
closure uses (`crates/flui-app/src/app/runner/realm_dispatch.rs`'s \
`a_running_controller_with_no_other_dirty_state_keeps_producing_across_the_real_wake_action_gate`, \
which showed 1 render then 39 consecutive skips out of 40 simulated \
callbacks, final animation value stuck at 0, before the fix; every \
pre-existing pinned test called `draw_frame_entered` directly and so never \
exercised `wake_action` at all, which is why none of them caught this). \
Fixed by moving the continuation check to run after `mark_rendered()`, \
marking a fresh `Animation` demand there specifically so \
`try_arm_redraw_request` has something nonempty to arm (this pump's own \
mask was already cleared by the produce that just ran) -- a genuinely \
different concern from the before-tick mark in `draw_frame_entered`, which \
still feeds only THIS pump's own segment. One observable consequence of \
the move, pinned rather than left implicit: the SAME callback that frees \
backpressure capacity and produces now also re-arms and wakes again in \
that same callback (the check runs after `poll()` already reset the \
latch), where it previously waited for a separate, later callback. \
`FrameClock::record_compositor_tick` is the \
companion pacing-feedback method: `flui-app`'s desktop frame-request \
callback (`bootstrap_desktop`'s `window.on_request_frame` closure, fired \
by every backend's routed `RedrawRequested` -- compositor-paced on \
Wayland, delivered immediately on X11/Windows/macOS) records the tick \
unconditionally, before the existing dirty/`wake_action` gate decides \
whether anything runs this pump, and marks NO demand: an earlier version \
marked `DemandKind::Host` unconditionally, which -- because this method \
fires on every production pump on desktop -- made `poll` permanently \
unable to return `Skip(NoDemand)` there, i.e. made the demand-mask gate \
inert on every platform that calls it; caught with a direct probe (an \
idle `UiRealm` that calls `record_compositor_tick` then \
`draw_frame_entered` produced every pump under the mutant, zero pumps \
after the fix), pinned by \
`an_idle_presentation_stays_idle_through_the_production_call_sequence_with_compositor_ticks` \
(`crates/flui-app/src/app/ui_realm.rs`) -- deliberately a DIFFERENT test \
from the pre-existing `an_idle_presentation_produces_and_flushes_exactly_zero_over_many_pumps`, \
which never calls `record_compositor_tick` and could not have caught \
this. Neither the `Animation` mark nor `record_compositor_tick` is a \
second, parallel produce path: the former marks the same `DemandMask` \
the existing `clock.poll` call already decides from (widening which \
inputs feed it, not adding a second decision mechanism); the latter marks \
nothing at all -- the per-platform table (which platform mechanism plays \
which of "compositor-paced actuator" vs. "wake-channel fallback") is \
`docs/adr/ADR-0044-driver-loop-hybrid.md`'s own deliverable, not \
duplicated here.\
"""
