[[forbidden_pattern]]
pattern = "Arc<RwLock<PipelineOwner"
why = """
the owner-local pipeline contract: `PipelineOwner` belongs to exactly one \
presentation on exactly one thread, so the historical `Arc<RwLock<PipelineOwner>>` \
shape never had a genuine cross-thread reader/writer to serialize -- it only \
ever guarded a checkout slot (`BuildOwner::run_frame_with_layout_builders`'s \
`mem::take`-transform-restore dance) and turned every reentrant checkout \
into a silent deadlock instead of a loud panic. `PipelineCell` (a `!Send + \
!Sync` `Rc<RefCell<PipelineOwner>>` newtype, `with`/`with_mut` closure-scoped \
access, `RefCell::try_borrow_mut` reentrancy detection) replaces it \
everywhere in production and test code; `RenderTree::owner`/`RenderView::owner` \
(the two back-pointers a hypothetical caller could have used to rebuild the \
old shape) are deleted, not merely retyped. The two allow-listed hits are \
contrast documentation citing the retired shape by name, not a reintroduction: \
`pipeline/owner/cell.rs`'s module doc explains what `PipelineCell` replaces, \
and `pipeline/owner/mod.rs`'s "Multi-window" doc describes a DIFFERENT, \
already-removed hierarchical-pipelines API (`adopt_child`/`drop_child`) that \
predates this change and used the same anti-pattern for tree nodes.\
"""
allow_files = [
    "crates/flui-rendering/src/pipeline/owner/cell.rs",
    "crates/flui-rendering/src/pipeline/owner/mod.rs",
]

[[forbidden_pattern]]
pattern = "unsafe impl Send for NodePtr"
why = """
the NodePtr aliasing contract: `NodePtr` (`pipeline/owner/subtree_arena.rs`) \
used to carry a manual `unsafe impl Send`/`unsafe impl Sync` because \
`LayoutChildCallback` (and siblings) inherited a `Send + Sync` bound from \
`BoxLayoutCtxErased`, which in turn existed only to satisfy the old \
`Arc<RwLock<PipelineOwner>>` storage's own `Send + Sync` requirement. Once \
`PipelineCell` replaced that storage and `BoxLayoutCtxErased` dropped its \
`Send + Sync` supertrait (same change as the `Arc<RwLock<PipelineOwner>>` \
retirement above), nothing requires `NodePtr: Send + Sync` any more, so it \
reverts to the language default for a bare raw pointer -- `!Send + !Sync` \
-- and `SubtreeArena::check_thread`'s per-access runtime assert retires \
alongside it: confinement to the constructing thread is now structural \
(`SubtreeArena: !Send + !Sync`, pinned by `static_assertions::assert_not_impl_any!` \
in `pipeline/owner/subtree_arena.rs`'s own tests), not a runtime check a \
caller could bypass. Reintroducing either manual impl would silently \
reopen the cross-thread aliasing hazard `PipelineCell`/the dropped bounds \
exist to close.\
"""
allow_files = []

[[forbidden_pattern]]
pattern = "unsafe impl Sync for NodePtr"
why = """
the other half of the `unsafe impl Send for NodePtr` entry above: the two \
manual impls were always deleted and reasoned about together (the SAFETY \
comments that used to justify them cited the same `LayoutChildCallback` / \
`BoxLayoutCtxErased` bound for both), so the same forbidden-pattern \
protection covers `Sync` as its own literal substring rather than relying \
on the `Send` entry alone to catch a `Sync`-only reintroduction. See the \
`Send` entry's `why` for the full rationale.\
"""
allow_files = []

[[forbidden_path]]
path = "crates/flui-presentation"
why = "the presentation composition contract: no flui-presentation crate; flui-app privately composes the three owners"
