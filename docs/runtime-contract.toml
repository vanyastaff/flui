[[forbidden_pattern]]
pattern = "Arc<RwLock<PipelineOwner"
why = """
the owner-local pipeline contract: `PipelineOwner` belongs to exactly one \
presentation on exactly one thread, so the historical `Arc<RwLock<PipelineOwner>>` \
shape never had a genuine cross-thread reader/writer to serialize -- it only \
ever guarded a checkout slot (`BuildOwner::run_frame_with_layout_builders`'s \
`mem::take`-transform-restore dance) and turned every reentrant checkout \
into a silent deadlock instead of a loud panic. `PipelineCell` (a `!Send + \
!Sync` `Rc<RefCell<PipelineOwner>>` newtype, `with`/`with_mut` closure-scoped \
access, `RefCell::try_borrow_mut` reentrancy detection) replaces it \
everywhere in production and test code; `RenderTree::owner`/`RenderView::owner` \
(the two back-pointers a hypothetical caller could have used to rebuild the \
old shape) are deleted, not merely retyped. The two allow-listed hits are \
contrast documentation citing the retired shape by name, not a reintroduction: \
`pipeline/owner/cell.rs`'s module doc explains what `PipelineCell` replaces, \
and `pipeline/owner/mod.rs`'s "Multi-window" doc describes a DIFFERENT, \
already-removed hierarchical-pipelines API (`adopt_child`/`drop_child`) that \
predates this change and used the same anti-pattern for tree nodes.\
"""
