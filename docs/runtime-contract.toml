notes = "ADR-0027 §2a's retirement condition for the weak-TLS post-frame ticket registry (`LOCAL_LANES`/`ACTIVE_LANES`, crates/flui-scheduler/src/post_frame.rs) has TWO clauses, not one: the Scheduler becomes realm-owned AND the handle can point directly at realm-local storage. This PR (#553 PR-5) lands clause 1 only -- `Scheduler` is now a `UiRealm`-owned field, not a process-global singleton (that type is `UpdateScheduler` as of #556's hard rename; the clause-1 history above predates and is unaffected by the rename). Clause 2 is NOT satisfied: `PostFrameHandle` stays `Clone + Send + Sync` (flipped internally to hold a `WeakUpdateScheduler` rather than a strong `UpdateScheduler` clone, so it fails closed after its realm drops, but its shape is unchanged), so `schedule_local` still cannot hold the lane's `Rc<LocalLaneInner>` directly on that Send handle -- that is the entire reason `LOCAL_LANES`/`ACTIVE_LANES` exist as a thread-local resolution registry in the first place, and realm-owning the scheduler alone does not remove the need for it. The residual is named, not silently dropped: retiring clause 2 requires splitting `schedule_local` off the Send `PostFrameHandle` onto a new, owner-affine, `!Send` `LocalPostFrameHandle { lane: Weak<LocalLaneInner> }` type, with drain-by-parameter into the frame drive instead of a TLS lookup. That split ripples past this slice into the `BuildContext` capability surface (a new capability type alongside `rebuild_handle()`/`post_frame_handle()`), the trigger-#22 frame-capability-scope scanner's token list (a second token alongside `post_frame_handle`), and flui-material's `scaffold_messenger.rs` (today's only production `schedule_local` consumer, which would move onto the new type) -- each a cross-crate change too large to fold into the scheduler-ownership move itself. `LOCAL_LANES` and `ACTIVE_LANES` therefore both remain exactly as they were pre-PR-5; the scanner token `post_frame_handle` is unaffected either way."

