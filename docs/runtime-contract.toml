workspace-wide (no `scope`), unlike a port-check.sh `check()`, which closes \
a same-crate-different-file reintroduction a file-scoped grep would miss. \
Not closed by this entry: an arbitrary `type` alias to `Renderer` under a \
different name (e.g. `type X = Renderer; unsafe impl Send for X {}`) — no \
name-based textual scan, substring or regex, can close that, since the \
alias name carries no trace of "Renderer" for any pattern to match against. \
The two sibling entries directly below catch the two path-prefixed \
spellings named during review (`self::` and the fully-qualified \
`crate::wgpu::` form); this is a best-effort enumeration against the \
realistic reintroduction shapes, not a claim of completeness.\
"""
