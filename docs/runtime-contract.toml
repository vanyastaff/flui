note = "shared_font_system()/FONT_SYSTEM: SharedEngineServices::resolve() (invoked from AppRuntime::ensure_services() at realm install) is the CONSTRUCTING owner -- it calls PaintingBinding::font_system() explicitly, eagerly installing the process-wide FontSystem instead of leaving it to whichever text-measurement call happens to run first. The READ path stays ambient on layout hot paths -- cross-realm register_font staleness mid-layout is a named, bounded hazard (Mutex<FontSystem> makes it staleness not a data race), not closed until fonts get their own owner-local-access/sharding follow-up (ADR-0027 follow-up 6). This migration additionally re-scoped ICON_FONTS_LOADED (flui-engine/src/wgpu/text.rs) from a process-global flag to a per-font, per-FontSystem-instance family-presence check (each embedded icon font probed and loaded independently, so one already-present family never gates the other), and gave TextRenderer::new an injected SharedFontSystem parameter instead of an ambient PaintingBinding::instance() reach -- neither changes this entry's hazard, which is specifically about concurrent register_font mutation, not construction-time ownership. A second CONSTRUCTING path exists for tests only: flui_painting::text_layout::init_font_system_with_faces (reached through flui_testing::fonts::pin_font_faces) installs a FontSystem built from caller-supplied faces instead of the host's, so a test that commits layout is not pinned to its author's font installation. It is one-shot and returns false rather than mutating when the font system already exists -- it cannot race the owner above, only lose to it. This is a construction path, not a new mutation path: it does not widen the register_font hazard."

