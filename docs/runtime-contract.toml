today**, so on a Wayland session this presentation's clock is never hidden \
and behavior is unchanged from before this slice; on X11 it requires FULL \
obscuration, which a compositing window manager does not produce. The \
gating machinery is therefore exercised by injected signals here, not by a \
live desktop: `flui-platform`'s own CI runs under \
`FLUI_HEADLESS=1`/`xvfb-run` (X11), and a live minimize/restore pass is not \
claimed as automated proof.\
