# =============================================================================
# Ambient singleton allowlist
# =============================================================================
#
# The checker scans the runtime crates for `impl_binding_singleton!(` and
# `fn instance() -> &'static`; every hit must be listed here. A new ambient
# singleton therefore cannot land without an owning issue. (The macro's
# defining file, crates/flui-foundation/src/binding.rs, is exempt: it holds
# the definition, doc examples, and cfg(test) invocations.)

# =============================================================================
# Ambient-reach ratchet
# =============================================================================
#
# Two grammars, each judged on code (comments and test-oracle mod blocks
# stripped first — see `scripts/check-runtime-conformance.sh`):
#
#   instance-call  — a production `::instance()` call site. This class is a
#                    RATCHET: it must shrink to empty as later changes retire
#                    each remaining singleton (painting, semantics/rendering,
#                    `AppBinding`, the scheduler), and the checker fails a
#                    registered entry whose file no longer matches (a stale
#                    entry left behind after cleanup), the same as it fails
#                    an unregistered file that newly matches.
#   ambient-static — a named residual: a global()/OnceLock/LazyLock-backed
#                    accessor this migration deliberately does not close.
#                    Carries the hazard in its `note`, not silence.
#
# The `instance-call` arm is now EMPTY: the scheduler was the last singleton
# this ratchet tracked (painting, semantics/rendering, and `AppBinding` all
# retired in earlier slices). Each `UiRealm` now owns a fresh `UpdateScheduler`
# (renamed from `Scheduler` in #556) value built by
# `RealmServices::construct()` (`runtime.rs`); `SchedulerRef` — the typed
# resolution seam earlier slices funneled every same-thread reach through —
# is deleted, not flipped, since a realm-owned field needs no resolution step
# at all. `flui-scheduler` no longer implements `BindingBase`/`HasInstance`
# (its `impl_binding_singleton!(Scheduler)` invocation -- as it was named
# pre-rename -- and the `pub use flui_foundation::{BindingBase, HasInstance};`
# re-export are both deleted), so the singleton-macro scan above and this
# ratchet both stay honest about zero remaining ambient singletons.
#
# `ambient-static`'s grammar stays a curated marker list
# (`AMBIENT_STATIC_MARKERS` in the checker), not a generic "any
# `OnceLock`/`LazyLock`-backed zero-arg accessor" detector, by deliberate
# choice, recorded here rather than left implicit: this crate's own
# `Notifier`/`ListenerRegistry`/config-default machinery and other
# workspace crates use `OnceLock`/`LazyLock` for ordinary lazy-initialized
# constants and caches that are never reached AMBIENTLY (they're fields,
# not zero-arg free functions callable from anywhere) — a signature-blind
# scan for the primitive alone would flag those as false positives faster
# than it would catch a new ambient accessor, and the two residuals this
# migration actually needs tracked (`AssetRegistry::global`,
# `shared_font_system`) are already fully enumerated by name. A generic
# detector is worth building once a third
# ambient accessor shape appears that the curated list doesn't already
# name; until then the curated list is the honest, low-false-positive
# choice, not an oversight. The marker for the retired
# `global_timer_service()` signature deliberately remains in the checker:
# reintroducing that ambient API must fail until it gains a new explicit
# registry entry and owner.

