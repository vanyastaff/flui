occurred BEFORE this presentation went hidden (a poke the loop already \
delivered and wasted, since `poll` returned `Skip(Hidden)` for it); \
consulting the latch here would incorrectly stay silent in that sequence \
and strand the presentation gated forever. An idle (never-dirtied) \
presentation's unhide correctly does NOT wake (no demand to retain). \
