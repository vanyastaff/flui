stamped with at enqueue time — never the coarser, pre-existing loop-scoped \
`AppLifecycleState` derivation, which this slice does not touch. While \
hidden, `FrameClock::poll` returns `Skip(Hidden)` (mask retained, segment \
skipped, zero submits); becoming visible with a nonzero retained mask \
produces exactly once on the very next pump. \
