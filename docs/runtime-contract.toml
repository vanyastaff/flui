[[contract]]
key = "task-worker-service-lifecycles"
statement = """
Background work above the execution lanes is classified by lifetime, and \
every unit has a named owner and an explicit end (issue #558, ADR-0049). \
One-shot **tasks** and recurring **workers** are owned by `#[must_use]` \
handles with an explicit cancel-on-drop contract (no detach; work that \
must outlive its owner is a named service, never an orphan); join evidence \
(`TaskOutcome`: Completed | Cancelled | Panicked, panics contained at the \
lifecycle boundary) travels on a DEDICATED capacity-one channel per unit \
-- never a shared inbox -- and every join is deadline-bounded \
(`join_within` returns the still-owning handle on timeout). Workers \
coalesce (capacity-one latest-wins input and result slots, strictly \
increasing `WorkerGeneration` stamps, submit never blocks, stale results \
drop structurally, results are pull-only). **Services** are owned by \
`AppRuntime`'s loop-scoped `ServiceRegistry` (declared via \
`AppConfig::with_service`, started by the bootstrap after the realm \
install resolves execution services, start failure fails the bootstrap) \
and declare a `ServiceLifetime`: a running `KeepsAppAlive` service vetoes \
`should_exit` after the last window closes (messenger-like), \
`StopsWithLastWindow` never does (editor-like). The veto is NOT permanent: \
a keep-alive service's exit (on whatever worker thread it ran on) fires \
the registry's exit notifier, which requests the platform's coalesced, \
owner-thread re-consultation of the exit-policy hook \
(`Platform::request_exit_policy_reevaluation`; winit re-checks in its \
control-lane drain when its window map is empty, headless parks the \
request for `HeadlessExitReevaluation::drive`) — without this chain a \
zero-window loop whose vetoing service later completed would linger \
forever, since window close is otherwise the hook's only consult site. \
The service FACTORY gets the same panic containment as service bodies: a \
panic while constructing the future becomes \
`ServiceStartError::FactoryPanicked` (bootstrap failure), never an \
unwind. Config-declared services are started by the desktop AND Android \
bootstraps (Android runs them without exit-policy wiring — its platform \
installs no exit hook; stated on `AppConfig::services`, not silently \
ignored). Loop-exit teardown is \
STAGED in a load-bearing order: cancel every service first, join each \
against ONE shared deadline with per-service evidence, and only then shut \
the pools down -- the pools' root-token cancellation hard-drops any \
still-running future, so the cooperative flush window exists only because \
services are joined first (pinned by the teardown ordering test; a \
deadline-ignoring service costs at most the shared deadline and is \
reported, never waited on unboundedly). Service events \
(`service_events`) are typed, bounded, latest-relevant and PULL-ONLY: \
publish never blocks (oldest drop) and a publish after the receiver died \
is `PublishError::OwnerGone` -- a late service result after teardown is \
structurally inert, with no path that could wake or revive a closed \
realm. `TaskSpawner` holds the services weakly (a spawner outliving its \
loop refuses with `ShuttingDown`) and reaches application code through \
`ServiceContext` only -- never ambient. \
\
**Named gaps, stated not silently assumed:** (1) ProcessWorker is not \
implemented -- FLUI has no process-spawning plumbing to build it on. \
(2) Close-request veto/defer for unsaved work and (3) journaled \
recoverable state are #558's remaining criteria, deliberately separate \
slices (the close path needs a CloseRequested interception seam in \
flui-platform first). (4) The widget-tier spawning capability (a \
BuildContext-acquired handle per the ADR-0018/0021 discipline plus its \
frame-capability-scope token) is deferred to its own slice. (5) wasm32 \
has no lifecycle layer; the narrowed `expect(dead_code)` ratchet in \
`app/execution.rs` errors the moment a wasm consumer lands.\
"""
