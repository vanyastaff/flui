notes = "ADR-0027 §2a's retirement condition for the weak-TLS post-frame ticket registry (`LOCAL_LANES`/`ACTIVE_LANES`, crates/flui-scheduler/src/post_frame.rs) had two clauses: the Scheduler becomes realm-owned (satisfied earlier, #553 PR-5) AND the handle can point directly at realm-local storage. This slice lands clause 2: `schedule_local` moved off the Send `PostFrameHandle` onto a new, owner-affine, `!Send` `LocalPostFrameHandle { scheduler: WeakUpdateScheduler, lane: Weak<LocalLaneInner> }` — a direct `Weak` pointer at its lane's queue, addressed once at mint time, never re-resolved through any registry. `LOCAL_LANES`, `ACTIVE_LANES`, `LaneTicket`, and `LocalLaneActivation` are deleted outright from `flui-scheduler` (a `rg` sweep for those four identifiers across `crates/` returns nothing outside flui-interaction's separate, untouched `routing/interaction_lane.rs`, which independently implements the identical thread-local-ticket pattern for interaction routing and is out of scope here); `LocalPostFrameLane::enter()` is likewise deleted (nothing left needs an active scope to check). `LocalPostFrameScheduleError` shrank from four variants (`NoLocalLane`/`WrongThread`/`InactiveLane`/`LaneClosed`) to one (`LaneClosed`) because direct `Weak` addressing makes the other three structurally unreachable — `WrongThread` is a compile error now (the handle is `!Send`), and there is no second lane a caller could be confused with (no `InactiveLane`/`NoLocalLane` concept survives). The frame drive drains a lane by receiving it as an explicit parameter (`UpdateScheduler::{end_frame_with_lane, execute_frame_with_lane, drive_frame_with_lane}`), never an ambient lookup; the bare `end_frame`/`execute_frame`/`drive_frame` trio is unchanged and drains the shared queue only, so the ~150 scheduler-only tests with no lane in play needed no edits. `UiRealm::enter`/`enter_for_close` no longer activate any local-post-frame scope (only the sibling, untouched `interaction_lane` activation remains) since scheduling no longer depends on one. `BuildContext` gained a second capability, `local_post_frame_handle()`, alongside `post_frame_handle()` (`BuildOwner`/`ElementOwner`/`BuildCapabilities` all carry both fields); trigger #22's scanner gained the `local_post_frame_handle` token in the same commit (`scripts/check-frame-capability-scope.sh`, fixtures updated, 9→10 self-test violations), verified to actually reject a temporarily-injected violation before being reverted. Consumer migration corrected a stale claim in this entry's prior revision: `scaffold_messenger.rs` was NOT the sole production `schedule_local` consumer — `flui-widgets`'s `back_gesture.rs`, `hero_controller.rs`, `hero_flight.rs`, and `editable_text.rs`'s `CursorAreaLoop` all called it too, verified by `rg` before migrating (all five now hold `LocalPostFrameHandle`, not `PostFrameHandle`). Migrating away the old ticket-based active-lane gate is a genuine behavior change, not just a rename: two `flui-widgets` navigator tests depended on that gate's failure to reach their expected states (`hero_controller_tests.rs`'s renamed `dead_local_lane_never_strands_the_destination_offstage`, now triggering failure by dropping the binding instead of calling outside a lane scope; `hero_gesture_tests.rs`'s `a_to_route_that_does_not_maintain_state_falls_back_to_the_deferred_path_without_panicking`, `#[ignore]`d with its own doc explaining the pre-existing `maintain_state(false)` route-disposal gap the old gate was masking, filed as a Navigator/HeroController follow-up rather than fixed in this slice)."

