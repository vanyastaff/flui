[[member]]
name = "flui-geometry"
layer = 0
disposition = "keep"
note = "Unit-safe coordinate primitives; separate from the broader value catalog."

[[member]]
name = "flui-types"
layer = 0
disposition = "keep"
note = "Value/unit catalog. Depends on flui-geometry inside L0 (see same_layer_edge)."

[[member]]
name = "flui-foundation"
layer = 1
disposition = "keep"
note = """
Emits `tracing` events and owns the shared diagnostic value types, including \
the structured field vocabulary in `flui_foundation::diagnostics`. Process-global \
subscriber installation and the platform logging backends moved to the restored, \
composition-only `flui-log`, so an embedded host can link foundation without \
linking `tracing-subscriber` at all. Manifest is leaf-like: `flui-types` is a \
dev-dependency only.\
"""

[[member]]
name = "flui-macros"
layer = 1
disposition = "keep"
note = "Proc-macro crate for framework derives."

[[member]]
name = "flui-log"
layer = 2
disposition = "keep"
allowed_dependents = ["flui-app", "flui-cli", "flui", "flui-android-demo"]
why = """
Composition-only. It assembles a subscriber — native sink selection, filter \
policy, application identity, and the process-global install — which is an \
application decision, not a library primitive. The crate that preceded it was \
deleted for becoming the way every library reached the logging macros; \
framework crates depend on `tracing` and nothing else, so replacing or removing \
the default backend never touches an instrumentation call site. It has no \
in-workspace dependencies at all, which is why it sits this low; the layer rule \
alone would therefore let the entire workspace above it depend on it, and this \
restriction is what stops that. `flui-android-demo` is on the list as a \
[[standalone_root]]: it owns `android_main`, does not go through `flui-app` or \
the facade, and therefore installs the logcat backend itself.\
"""
note = """
Desktop `fmt` (optionally hierarchical via `tracing-forest`), Android logcat, \
Apple unified logging, and the browser console/performance timeline, behind an \
explicit ownership policy: Inherit installs nothing, Auto preserves an existing \
subscriber, Install returns a typed error rather than panicking.\
"""

[[member]]
name = "flui-tree"
layer = 2
disposition = "keep"
note = "Tree protocol and arity vocabulary."

[[member]]
name = "flui-platform"
layer = 2
disposition = "narrow"
note = """
Retains the event loop, native windows, input, display timing, and OS \
capabilities. Loses `BackgroundExecutor`/`PlatformExecutor` when host-injected \
runtime execution lands; web task spawning becomes an implementation of the \
runtime's default executor, not a per-Platform responsibility.\
"""

[[member]]
