[[member]]
name = "flui-testing"
layer = 6
disposition = "keep"
note = """
Test-support crate: the deterministic headless frame driver \
(`HeadlessBinding::pump_frame`), the canonical mount bootstrap \
(`bootstrap::mount_root`), virtual-clock gesture replay (`replay`, which \
superseded flui-interaction's wall-clock recorder/player), and accessibility \
queries (`a11y`) -- plus the future home for fake platform capabilities and \
golden helpers. The \
package was renamed during the Runtime.1 preflight: the old name collided \
conceptually with the transitional `AppBinding` graph Runtime.1 removes, and the \
package name becomes a public testing contract once conformance tests import it. \
Runtime and \
framework crates take *development* edges into it only — a normal edge from a \
shipped library would link the test driver into production. One sanctioned \
exception: `flui-widgets` declares an *optional* edge, activated solely by its \
`testing` feature, so the canonical `flui_widgets::testing` harness (shared \
by the flui-material/flui-cupertino test suites) can be built on \
`HeadlessBinding` without per-crate copies; no default or production feature \
set activates it (see same_layer_edge).\
"""

