# FLUI workspace topology contract.
#
# This file is the *authoritative* layer policy for the workspace. It is not
# documentation about the graph — it is the graph, and
# `scripts/check-workspace-inventory.sh` (`just inventory-check`, part of
# `just ci` and the CI `checks` job) validates every **normal** Cargo edge
# against it. Development and build edges are deliberately out of scope: a
# dev-dependency is a testing convenience, not an architectural claim, and
# Cargo tolerates dev-dependency cycles that a normal edge could never form.
#
# Decision record: docs/adr/ADR-0041-workspace-topology-contract.md
# Target graph and rationale: docs/FOUNDATIONS.md (Part IV)
# Human-readable inventory: docs/crates.md
# Motivating review: docs/research/2026-08-01-workspace-boundary-and-logging-review.md
#
# The rules this file feeds:
#
#   1. Every active `crates/*` member and the root `flui` facade must appear
#      exactly once in `[[member]]`. A new crate cannot be built into the
#      workspace without being classified here first.
#   2. Every in-workspace normal edge must point at a *strictly lower* layer,
#      or be listed in `[[same_layer_edge]]` as an ordered pair. Same-layer
#      entries are directional: allowing `a -> b` never allows `b -> a`.
#   3. `[[forbidden_edge]]` pairs fail even when the layer rule would permit
#      them, so the error message names the contract that was broken.
#   4. The normal-edge graph, *plus* every `[[projected_edge]]`, must stay
#      acyclic. This is how the future localization graph is checked before
#      the edges that would close the cycle actually exist.
#   5. Nothing under `crates/` may depend on a member outside `crates/`
#      (examples and tools are terminal consumers).
#   6. A `[[planned]]` crate with `status = "gated"` may not be created until
#      its `gate` is satisfied and this file is updated.
#
# `disposition` classifies each active member for the Runtime.1 milestone:
#
#   keep                 — boundary is correct; do not churn it during the sprint
#   rename               — responsibility is right, the package name is wrong
#   narrow               — crate keeps existing but loses a responsibility
#   optionalize          — capability must become removable via a feature
#   deferred-extraction  — a responsibility leaves this crate later, under a gate

