layer = 2
disposition = "narrow"
note = """
Reduced to logical update phases, tickers, callback ordering, and owner-local \
post-frame behavior. Presentation clocks and raster backpressure move to \
presentation/runtime ownership; workers and durable services move to runtime \
execution.\
"""

