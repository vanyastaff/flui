# Cargo configuration for FLUI workspace
# https://doc.rust-lang.org/cargo/reference/config.html

# ═══════════════════════════════════════════════════════════════════════════════
# Build settings
# ═══════════════════════════════════════════════════════════════════════════════
[build]
# Use all available CPU cores
jobs = 8

# ═══════════════════════════════════════════════════════════════════════════════
# Linker configuration - faster linking
# ═══════════════════════════════════════════════════════════════════════════════

# Windows - use native MSVC linker (faster than GNU ld)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEBUG:NONE"] # Faster release builds

# Linux — `rust-lld` has been the default linker for x86_64-unknown-linux-gnu
# since Rust 1.90 (the target spec reports linker flavor `gnu-lld-cc`,
# self-contained), so an lld opt-in buys nothing any more. The one remaining
# upgrade is mold; opt in locally by uncommenting the block. Kept commented in
# the committed config: not every environment (or GitHub runner image) ships
# it, and a missing linker fails builds with a cryptic error.
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS - use lld linker
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# ═══════════════════════════════════════════════════════════════════════════════
# Android NDK targets
# ═══════════════════════════════════════════════════════════════════════════════
[target.aarch64-linux-android]
# linker = "path/to/ndk/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android21-clang"

[target.armv7-linux-androideabi]
# linker = "path/to/ndk/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi21-clang"

[target.x86_64-linux-android]
# linker = "path/to/ndk/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android21-clang"

# ═══════════════════════════════════════════════════════════════════════════════
# WASM target
# ═══════════════════════════════════════════════════════════════════════════════
# Atomics/bulk-memory only needed for multi-threaded WASM (SharedArrayBuffer).
# Uncomment when enabling Web Workers with shared memory.
# [target.wasm32-unknown-unknown]
# rustflags = ["-C", "target-feature=+atomics,+bulk-memory,+mutable-globals"]

# ═══════════════════════════════════════════════════════════════════════════════
# Profile-specific rustflags
# ═══════════════════════════════════════════════════════════════════════════════
[profile.dev]
# Split debug info for faster incremental builds (Linux/macOS)
# split-debuginfo = "unpacked"

[profile.release]
# LTO for release builds (better optimization, slower compile)
# lto = "thin"

# ═══════════════════════════════════════════════════════════════════════════════
# Registry settings
# ═══════════════════════════════════════════════════════════════════════════════
[registries.crates-io]
protocol = "sparse" # Faster index updates

# ═══════════════════════════════════════════════════════════════════════════════
# Network settings
# ═══════════════════════════════════════════════════════════════════════════════
[net]
retry = 3
git-fetch-with-cli = false

# ═══════════════════════════════════════════════════════════════════════════════
# Environment variables for build scripts
# ═══════════════════════════════════════════════════════════════════════════════
[env]
# Hands `sccache` the value it checks before it will serve a request. This does NOT
# by itself disable incremental compilation: `[env]` sets variables for the processes
# Cargo executes, not for Cargo's own profile resolution, so with `[profile.dev]
# incremental = true` a verbose build still emitted `-C incremental=...`. The actual
# switch is `incremental = false` in the root `Cargo.toml` — keep the two in step.
#
# Why off at all: `sccache` (the usual `rustc-wrapper` here) caches whole crate-unit
# outputs and cannot cache per-CGU incremental artifacts. On Windows the `sccache` +
# incremental combination additionally crashes `rustc` with STATUS_ACCESS_VIOLATION
# (0xc0000005) on the heavier test binaries (e.g. `flui-interaction --test`), blocking
# the local test gate. CI already builds with it off, so this also matches CI.
#
# Not `force`d — `CARGO_INCREMENTAL=1` in the real environment still wins, which is
# the opt-in for a contributor building without `sccache`.
CARGO_INCREMENTAL = "0"

# Faster shader compilation for wgpu
# WGPU_BACKEND = "vulkan"  # or "dx12" on Windows
