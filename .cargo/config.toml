# Cargo configuration for the FLUI workspace.
# https://doc.rust-lang.org/cargo/reference/config.html
#
# Only settings that differ from Cargo's defaults live here. Profiles live in
# the root `Cargo.toml`.

# No `[build] jobs` pin: Cargo defaults to the logical CPU count, and a
# checked-in number is wrong for every other machine. Cap per machine or per
# run with `CARGO_BUILD_JOBS=<n>` or `cargo ... -j <n>`.

# Linkers: the platform defaults are right. Linux has used the self-contained
# `rust-lld` since Rust 1.90; macOS uses the Apple linker. mold is a local
# opt-in on Linux (not every runner image ships it, and a missing linker fails
# with a cryptic error):
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
#
# Windows keeps MSVC's default PDB output. `-C link-arg=/DEBUG:NONE` would drop
# it for every profile, and a debug-build panic backtrace then has no frames at
# all; release builds strip debuginfo through their profile instead.
# `rust-lld` was measured as a Windows linker: a one-line edit in flui-widgets
# rebuilt its tests in 6.7-7.1 s against link.exe's 7.3-7.5 s, too small a win
# to take on a second linker's edge cases.

[target.wasm32-unknown-unknown]
# Lets `cargo test --target wasm32-unknown-unknown` actually RUN the tests
# instead of building a .wasm nobody executes (issue #985). The runner hosts
# them on node -- no browser and no wasm-pack involved.
#
# `wasm-bindgen-test-runner` must be on PATH and its version must match the
# LOCKED `wasm-bindgen` exactly, or it refuses with "must exactly match".
# `just wasm-test` installs the right one by reading Cargo.lock; this line only
# says which runner to use, so a plain `cargo build --target wasm32-...` is
# unaffected.
runner = "wasm-bindgen-test-runner"

# Android builds go through `cargo ndk`, which sets the NDK linkers itself
# (docs/getting-started.md).

# Incremental compilation is governed by `[profile.dev] incremental` in the root
# `Cargo.toml` (on for local development) and by `CARGO_INCREMENTAL=0` in CI. An
# `[env]` entry here would not reach it: `[env]` feeds the processes Cargo runs,
# not Cargo's own profile resolution.
