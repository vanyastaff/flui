# nextest configuration. Read from the workspace root by every `cargo nextest`
# invocation — the `just test*` recipes and CI alike — so one file governs both.
#
# Why it exists: a test that hangs (a GPU adapter that never answers, an Xvfb
# connection that never comes up) used to run until the CI job's own
# `timeout-minutes` killed the whole job, discarding every other result with
# it. nextest runs each test in its own process, so it can time out and
# terminate ONE test and keep reporting the rest.
[profile.default]
# Report a test as SLOW after 60 s and kill it after ten periods (10 min): a
# bound for a genuinely hung test, well under the CI job's `timeout-minutes`,
# with headroom over the slowest legitimate tests on a 4-core runner. A test
# that needs more gets its own override below — never a higher global.
slow-timeout = { period = "60s", terminate-after = 10 }
# A test that has exited but left a child process holding stdout/stderr open
# is reported as a leak after this grace period instead of hanging the run.
leak-timeout = "1s"

# Nested-cargo tests: each runs a real `cargo` of its own on a project it
# generates. The trybuild suites push every compile_fail case through rustc;
# the flui-cli template tests (`cli_create::generated_*`) build or test a
# generated project; `flui::facade_consumer` checks external consumer
# crates against the facade. They own the run's wall-clock: in a cold
# `just ci` 21 of them took 83-305 s each (2026-09-22, e9a5456d, jobs=6),
# and no other test in the workspace reached 20 s.
#
# The filter below appears THREE times -- this override and the two
# profiles after it. Keep them identical: a test missing from the override
# loses its budget, one missing from a profile silently leaves `just ci`.
#
# They run in parallel, deliberately without a `max-threads = 1` test group:
# serializing them was measured slower both cold (713.6 s vs 563.1 s for the
# 24) and warm (25.9 s vs 13.7 s), 2026-09-22, M1/8 GB, jobs=6.
#
# Budget: 300 s slow, killed after 20 min. Measured on CI's 4-core runner:
# 64-265 s for a trybuild suite and ~180 s for each template build, varying
# run to run with cache state -- a 4-minute global killed both template tests
# once.
[[profile.default.overrides]]
filter = 'binary_id(flui-engine::compile_fail) | binary_id(flui-rendering::compile_fail) | test(=unit_mixing_compile_fail::ui) | test(=trybuild_ui::ui_tests) | (binary_id(flui-cli::cli_it) & test(/^cli_create::generated_/)) | binary_id(flui::facade_consumer)'
slow-timeout = { period = "300s", terminate-after = 4 }

# `just test-ci` runs the suite in two stages: everything else first, then
# the nested-cargo tests (`just test-nested-cargo`). The split is a partition
# -- the two profiles' default filters are exact complements -- so the union
# is the whole suite and no test runs twice or not at all.
[profile.no-nested-cargo]
default-filter = 'not (binary_id(flui-engine::compile_fail) | binary_id(flui-rendering::compile_fail) | test(=unit_mixing_compile_fail::ui) | test(=trybuild_ui::ui_tests) | (binary_id(flui-cli::cli_it) & test(/^cli_create::generated_/)) | binary_id(flui::facade_consumer))'

[profile.nested-cargo]
default-filter = 'binary_id(flui-engine::compile_fail) | binary_id(flui-rendering::compile_fail) | test(=unit_mixing_compile_fail::ui) | test(=trybuild_ui::ui_tests) | (binary_id(flui-cli::cli_it) & test(/^cli_create::generated_/)) | binary_id(flui::facade_consumer)'

# GPU readback tests share one software rasterizer (lavapipe locally, WARP on
# the CI GPU job), and each builds its own `wgpu::Device`. Submitting from
# several processes at once can saturate that single driver and make an
# oracle mismatch out of contention rather than out of a real pixel
# difference — three `coverage_blend_readback_tests` cases failed exactly that
# way locally once the facade gained a readback test of its own, and all nine
# passed immediately when re-run serially.
#
# CI's dedicated `gpu-test` job already passes `--test-threads 1` for this
# reason. That flag does not help the `test` job, where these same tests run
# (they are gated on `cfg(test)` alone, not on `testing`) alongside
# thousands of others that SHOULD stay parallel. A test group is the targeted
# form of the same rule: these run one at a time, everything else is untouched.
[test-groups]
gpu-readback = { max-threads = 1 }
system-clipboard = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(flui::composited_layer_update_readback) | (binary_id(flui-engine) & (test(/_readback_tests::/) | test(=renderer::tests::sdr_surface_selection_painter_readback_preserves_swatches_and_blending)))'
test-group = 'gpu-readback'

# flui-platform's clipboard tests write the one system clipboard and read it
# back (on Windows and macOS, and under Xvfb on Linux; the headless mocks match
# the filter too and are cheap to serialize). nextest runs each test in its own
# process, so the in-process lock those tests take (`round_trip_serial` in
# `shared/clipboard_lock.rs`, which covers plain `cargo test`) cannot keep two
# of them apart here: one test's write would land between another's write and
# read. The group runs them one at a time; everything else stays parallel.
[[profile.default.overrides]]
filter = 'package(flui-platform) & test(/clipboard/)'
test-group = 'system-clipboard'
