# nextest configuration. Read from the workspace root by every `cargo nextest`
# invocation — the `just test*` recipes and CI alike — so one file governs both.
#
# Why it exists: a test that hangs (a GPU adapter that never answers, an Xvfb
# connection that never comes up) used to run until the CI job's own
# `timeout-minutes` killed the whole job, discarding every other result with
# it. nextest runs each test in its own process, so it can time out and
# terminate ONE test and keep reporting the rest.
[profile.default]
# Report a test as SLOW after 60 s and kill it after four periods (4 min).
# A test that legitimately needs longer gets its own override below — never
# a higher global.
slow-timeout = { period = "60s", terminate-after = 4 }
# A test that has exited but left a child process holding stdout/stderr open
# is reported as a leak after this grace period instead of hanging the run.
leak-timeout = "1s"

# The three trybuild suites compile every compile_fail case with a real
# rustc. Measured on a 32-core machine: 56 s, 67 s, and 78 s; a 4-core CI
# runner needs several times that, so they get their own budget instead of a
# higher global.
[[profile.default.overrides]]
filter = 'binary_id(flui-engine::compile_fail) | test(=unit_mixing_compile_fail::ui) | test(=trybuild_ui::ui_tests)'
slow-timeout = { period = "180s", terminate-after = 4 }
