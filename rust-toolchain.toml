# Pinned Rust toolchain for the FLUI workspace — the DEVELOPMENT toolchain, and
# the single source of truth the `checks` job in `ci.yml` reads.
#
# This channel is not automatically the MSRV — the MSRV is
# `[workspace.package].rust-version` in `Cargo.toml` (clippy reads it from
# there). But under the pre-1.0 policy below they move together: the channel
# is bumped to each new stable, and the MSRV is bumped to match within a
# week, so in practice `channel`'s minor equals the declared MSRV, and every
# CI job builds on it. The `checks` job in `ci.yml`
# enforces that `Cargo.toml`, all five `flui-cli` templates, the README badge,
# and `llms.txt` agree with `channel` here.
#
# `rustup` will install this exact toolchain automatically on first `cargo`
# invocation if it is not already available locally.
#
# MSRV policy:
#   - Pre-1.0: the MSRV tracks the latest stable release, bumped within a
#     week of each new stable (Rust ships every 6 weeks). Don't bump ahead of
#     an actual release.
#   - Post-1.0: the MSRV follows N-2 (tolerates the two most recent stable
#     releases behind current).
#
# Bump procedure:
#   1. Bump `channel` here to the new stable patch release.
#   2. Bump `[workspace.package].rust-version` in `Cargo.toml` and the
#      `rust-version` line in all five
#      `crates/flui-cli/src/templates/{basic,counter,empty,hot_reload,widget}.rs`
#      — the `checks` job verifies these plus the README badge and
#      `llms.txt` against `channel` here directly; nothing else in this list
#      is machine-checked.
#   3. Update the prose that states the number: README.md (outside the badge),
#      crates/flui-cli/README.md, docs/getting-started.md and
#      book/src/getting-started/installation.md.
#   4. Run `cargo heli xtask checks`; the `checks` job in `ci.yml` also runs the MSRV step.

[toolchain]
channel = "1.100.0"
profile = "default"                # includes rustc, cargo, rustfmt, clippy, rust-docs
components = ["rustfmt", "clippy"]
