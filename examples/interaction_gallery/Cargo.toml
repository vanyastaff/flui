[package]
name = "flui-interaction-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "One screen per interaction widget, on desktop, Android and the web from one widget tree"

# The rlib feeds the desktop binary; the cdylib is what Android's
# `NativeActivity` loads (`android_main`) and what `wasm-bindgen` binds for the
# browser (`start`). Both entry points live in src/lib.rs.
[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "interaction_gallery"
path = "src/main.rs"

[features]
# The platform accessibility adapter (UI Automation, VoiceOver, TalkBack's
# bridge). The Windows end-to-end check reads the gallery through it.
a11y = ["flui/a11y"]

[dependencies]
flui = { path = "../..", version = "=0.2.0-dev" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[lints]
workspace = true

[package.metadata.flui]
tier-kind = "tool"
