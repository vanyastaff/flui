<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FLUI Interaction Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #f4f5f8; overflow: hidden; }
        #flui-canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <!-- Build with `cargo build -p flui-interaction-gallery --release --lib
         --target wasm32-unknown-unknown`, bind with `wasm-bindgen --target web
         --out-dir examples/interaction_gallery/pkg` on the built
         flui_interaction_gallery.wasm, then serve this directory over HTTP. -->
    <canvas id="flui-canvas"></canvas>
    <script type="module">
        import init from './pkg/flui_interaction_gallery.js';
        init().catch((error) => {
            document.body.insertAdjacentHTML('beforeend', `<pre id="flui-error">${error}</pre>`);
            throw error;
        });
    </script>
</body>
</html>
