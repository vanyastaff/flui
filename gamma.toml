# cargo-gamma configuration: mutation testing, the measure a test suite is
# judged by here (see docs/testing.md, "Mutation Testing"). Mutation
# score, not test count or line coverage, is what shows a rewritten or pruned
# suite still catches what the old one did.
#
# cargo-gamma compiles every selected mutant into one instrumented build and
# switches them on at run time, so a run pays one build instead of one per
# mutant. Scope a run with `-p <crate>` and `--file <path>`; the report lands
# in `target/cargo-gamma/` (JSON, HTML, SARIF).
#
# Every key is optional and unknown keys are an error; the reference is
# cargo-gamma's CONFIG.md. List keys here are extended by the command line,
# scalar keys are overridden by it, and `--no-config` ignores this file.

# The dev host is shared, so a loaded machine can push a fast test binary
# past a timeout derived from its baseline for reasons unrelated to the
# mutant.
minimum-test-timeout = 60.0

# The nested tests (the `trybuild` and `nested-cargo` groups in .config/nextest.toml)
# run rustc or cargo themselves: trybuild's compile-fail fixtures, and the
# projects flui-cli generates and the facade consumer builds. Inside the
# instrumented tree they fail the baseline or cost a full compile per mutant,
# and none of them can see a mutated library body. They are skipped by test
# name, which works whichever crates a run selects; `exclude-tests` would
# reject a run whose crates lack the named target.
cargo-test-args = [
    "--skip",
    "trybuild_ui",            # flui-engine, flui-rendering, flui-painting, flui-view
    "--skip",
    "routable_derive_ui",     # flui-widgets' routable_ui trybuild suite
    "--skip",
    "cli_create::generated_",
    # the facade_consumer target, every test of which builds a project
    "--skip",
    "ordinary_facade_graph_excludes_test_support",
    "--skip",
    "external_consumers_extend_and_test_through_the_facade",
    "--skip",
    "plugin_factory_requires_the_canonical_scene",
    "--skip",
    "plugin_teardown_requires_unsafe",
]
