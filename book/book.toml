[book]
title = "FLUI"
description = "Build declarative Rust applications with FLUI: installation, tutorials, concepts, and runnable recipes."
authors = ["FLUI Contributors"]
language = "en"
src = "src"

[build]
# Refuse a SUMMARY entry whose chapter is missing instead of creating a stub.
# Building the book does not compile Rust fences; ignored snippets must be
# checked against their linked source. See .github/workflows/docs.yml.
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/vanyastaff/flui"
edit-url-template = "https://github.com/vanyastaff/flui/edit/main/book/{path}"

[output.html.fold]
enable = true
level = 1

# No [output.linkcheck] table: link checking runs as a separate `lychee`
# pass over the built HTML in .github/workflows/docs.yml, not as an
# mdbook-linkcheck renderer backend — that keeps a plain `mdbook build`
# working for anyone who has only `mdbook` installed, with no second
# binary required for local iteration.
